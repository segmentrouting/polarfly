hostname sw039
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.39
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1027::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65039
 bgp router-id 1.1.0.39
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:32:: remote-as 65007
 neighbor 2001:db8:1:32:: capability extended-nexthop
 neighbor 2001:db8:1:4d:: remote-as 65012
 neighbor 2001:db8:1:4d:: capability extended-nexthop
 neighbor 2001:db8:1:6d:: remote-as 65017
 neighbor 2001:db8:1:6d:: capability extended-nexthop
 neighbor 2001:db8:1:a9:: remote-as 65029
 neighbor 2001:db8:1:a9:: capability extended-nexthop
 neighbor 2001:db8:1:b7:: remote-as 65034
 neighbor 2001:db8:1:b7:: capability extended-nexthop
 neighbor 2001:db8:1:ca::1 remote-as 65044
 neighbor 2001:db8:1:ca::1 capability extended-nexthop
 neighbor 2001:db8:1:cb::1 remote-as 65056
 neighbor 2001:db8:1:cb::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1027::/48
  network fc00:0:1027::1/128
  neighbor 2001:db8:1:32:: activate
  neighbor 2001:db8:1:32:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:4d:: activate
  neighbor 2001:db8:1:4d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:6d:: activate
  neighbor 2001:db8:1:6d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:a9:: activate
  neighbor 2001:db8:1:a9:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:b7:: activate
  neighbor 2001:db8:1:b7:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:ca::1 activate
  neighbor 2001:db8:1:ca::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:cb::1 activate
  neighbor 2001:db8:1:cb::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1027::/48 locator MAIN behavior uN
   sid fc00:0:1027:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:32::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:4d::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:6d::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:a9::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:b7::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:ca::1
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:cb::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1027::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1027::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
