  links:
    # ---- fabric links (polarity adjacencies) ----
    # NOTE: link endpoints use eth<N> containerlab naming. Inside the
    # container, start_sonic.sh's create_if_mapping() numbers EthernetN
    # purely by VPP_DPDK_PORTS list position (no gaps): eth1->Ethernet0,
    # eth2->Ethernet1, ..., with the host port last (Ethernet{radix}).
    - endpoints: ["sw001:eth1", "sw002:eth1"]
    - endpoints: ["sw001:eth2", "sw009:eth1"]
    - endpoints: ["sw001:eth3", "sw016:eth1"]
    - endpoints: ["sw001:eth4", "sw023:eth1"]
    - endpoints: ["sw001:eth5", "sw030:eth1"]
    - endpoints: ["sw001:eth6", "sw037:eth1"]
    - endpoints: ["sw001:eth7", "sw044:eth1"]
