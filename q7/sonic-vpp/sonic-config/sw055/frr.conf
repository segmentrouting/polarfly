hostname sw055
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.55
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1037::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65055
 bgp router-id 1.1.0.55
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:1e:: remote-as 65004
 neighbor 2001:db8:1:1e:: capability extended-nexthop
 neighbor 2001:db8:1:5c:: remote-as 65014
 neighbor 2001:db8:1:5c:: capability extended-nexthop
 neighbor 2001:db8:1:67:: remote-as 65016
 neighbor 2001:db8:1:67:: capability extended-nexthop
 neighbor 2001:db8:1:9a:: remote-as 65025
 neighbor 2001:db8:1:9a:: capability extended-nexthop
 neighbor 2001:db8:1:b9:: remote-as 65034
 neighbor 2001:db8:1:b9:: capability extended-nexthop
 neighbor 2001:db8:1:d4:: remote-as 65043
 neighbor 2001:db8:1:d4:: capability extended-nexthop
 neighbor 2001:db8:1:d6:: remote-as 65045
 neighbor 2001:db8:1:d6:: capability extended-nexthop
 neighbor 2001:db8:1:df:: remote-as 65054
 neighbor 2001:db8:1:df:: capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1037::/48
  network fc00:0:1037::1/128
  neighbor 2001:db8:1:1e:: activate
  neighbor 2001:db8:1:1e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:5c:: activate
  neighbor 2001:db8:1:5c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:67:: activate
  neighbor 2001:db8:1:67:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:9a:: activate
  neighbor 2001:db8:1:9a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:b9:: activate
  neighbor 2001:db8:1:b9:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d4:: activate
  neighbor 2001:db8:1:d4:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d6:: activate
  neighbor 2001:db8:1:d6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:df:: activate
  neighbor 2001:db8:1:df:: route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1037::/48 locator MAIN behavior uN
   sid fc00:0:1037:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:1e::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:5c::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:67::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:9a::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:b9::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:d4::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:d6::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet7 nexthop 2001:db8:1:df::
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1037::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1037::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
