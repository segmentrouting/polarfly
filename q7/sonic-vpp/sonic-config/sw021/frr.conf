hostname sw021
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.21
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1015::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65021
 bgp router-id 1.1.0.21
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:28:: remote-as 65006
 neighbor 2001:db8:1:28:: capability extended-nexthop
 neighbor 2001:db8:1:51:: remote-as 65013
 neighbor 2001:db8:1:51:: capability extended-nexthop
 neighbor 2001:db8:1:6a:: remote-as 65017
 neighbor 2001:db8:1:6a:: capability extended-nexthop
 neighbor 2001:db8:1:81::1 remote-as 65028
 neighbor 2001:db8:1:81::1 capability extended-nexthop
 neighbor 2001:db8:1:82::1 remote-as 65032
 neighbor 2001:db8:1:82::1 capability extended-nexthop
 neighbor 2001:db8:1:83::1 remote-as 65043
 neighbor 2001:db8:1:83::1 capability extended-nexthop
 neighbor 2001:db8:1:84::1 remote-as 65047
 neighbor 2001:db8:1:84::1 capability extended-nexthop
 neighbor 2001:db8:1:85::1 remote-as 65051
 neighbor 2001:db8:1:85::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1015::/48
  network fc00:0:1015::1/128
  neighbor 2001:db8:1:28:: activate
  neighbor 2001:db8:1:28:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:51:: activate
  neighbor 2001:db8:1:51:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:6a:: activate
  neighbor 2001:db8:1:6a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:81::1 activate
  neighbor 2001:db8:1:81::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:82::1 activate
  neighbor 2001:db8:1:82::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:83::1 activate
  neighbor 2001:db8:1:83::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:84::1 activate
  neighbor 2001:db8:1:84::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:85::1 activate
  neighbor 2001:db8:1:85::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1015::/48 locator MAIN behavior uN
   sid fc00:0:1015:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:28::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:51::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:6a::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:81::1
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:82::1
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:83::1
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:84::1
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet7 nexthop 2001:db8:1:85::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1015::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1015::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
