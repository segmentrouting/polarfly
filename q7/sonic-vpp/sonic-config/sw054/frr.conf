hostname sw054
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.54
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1036::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65054
 bgp router-id 1.1.0.54
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:34:: remote-as 65007
 neighbor 2001:db8:1:34:: capability extended-nexthop
 neighbor 2001:db8:1:49:: remote-as 65011
 neighbor 2001:db8:1:49:: capability extended-nexthop
 neighbor 2001:db8:1:66:: remote-as 65016
 neighbor 2001:db8:1:66:: capability extended-nexthop
 neighbor 2001:db8:1:a7:: remote-as 65028
 neighbor 2001:db8:1:a7:: capability extended-nexthop
 neighbor 2001:db8:1:b6:: remote-as 65033
 neighbor 2001:db8:1:b6:: capability extended-nexthop
 neighbor 2001:db8:1:c9:: remote-as 65038
 neighbor 2001:db8:1:c9:: capability extended-nexthop
 neighbor 2001:db8:1:dc:: remote-as 65050
 neighbor 2001:db8:1:dc:: capability extended-nexthop
 neighbor 2001:db8:1:df::1 remote-as 65055
 neighbor 2001:db8:1:df::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1036::/48
  network fc00:0:1036::1/128
  neighbor 2001:db8:1:34:: activate
  neighbor 2001:db8:1:34:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:49:: activate
  neighbor 2001:db8:1:49:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:66:: activate
  neighbor 2001:db8:1:66:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:a7:: activate
  neighbor 2001:db8:1:a7:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:b6:: activate
  neighbor 2001:db8:1:b6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c9:: activate
  neighbor 2001:db8:1:c9:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:dc:: activate
  neighbor 2001:db8:1:dc:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:df::1 activate
  neighbor 2001:db8:1:df::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1036::/48 locator MAIN behavior uN
   sid fc00:0:1036:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:34::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:49::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:66::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:a7::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:b6::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:c9::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:dc::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet7 nexthop 2001:db8:1:df::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1036::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1036::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
