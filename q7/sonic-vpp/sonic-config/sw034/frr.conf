hostname sw034
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.34
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1022::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65034
 bgp router-id 1.1.0.34
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:13:: remote-as 65003
 neighbor 2001:db8:1:13:: capability extended-nexthop
 neighbor 2001:db8:1:59:: remote-as 65014
 neighbor 2001:db8:1:59:: capability extended-nexthop
 neighbor 2001:db8:1:87:: remote-as 65022
 neighbor 2001:db8:1:87:: capability extended-nexthop
 neighbor 2001:db8:1:8f:: remote-as 65023
 neighbor 2001:db8:1:8f:: capability extended-nexthop
 neighbor 2001:db8:1:ac:: remote-as 65031
 neighbor 2001:db8:1:ac:: capability extended-nexthop
 neighbor 2001:db8:1:b7::1 remote-as 65039
 neighbor 2001:db8:1:b7::1 capability extended-nexthop
 neighbor 2001:db8:1:b8::1 remote-as 65047
 neighbor 2001:db8:1:b8::1 capability extended-nexthop
 neighbor 2001:db8:1:b9::1 remote-as 65055
 neighbor 2001:db8:1:b9::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1022::/48
  network fc00:0:1022::1/128
  neighbor 2001:db8:1:13:: activate
  neighbor 2001:db8:1:13:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:59:: activate
  neighbor 2001:db8:1:59:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:87:: activate
  neighbor 2001:db8:1:87:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:8f:: activate
  neighbor 2001:db8:1:8f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:ac:: activate
  neighbor 2001:db8:1:ac:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:b7::1 activate
  neighbor 2001:db8:1:b7::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:b8::1 activate
  neighbor 2001:db8:1:b8::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:b9::1 activate
  neighbor 2001:db8:1:b9::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1022::/48 locator MAIN behavior uN
   sid fc00:0:1022:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:13::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:59::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:87::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:8f::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:ac::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:b7::1
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:b8::1
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet7 nexthop 2001:db8:1:b9::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1022::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1022::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
