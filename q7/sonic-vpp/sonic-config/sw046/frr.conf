hostname sw046
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.46
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:102e::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65046
 bgp router-id 1.1.0.46
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:15:: remote-as 65003
 neighbor 2001:db8:1:15:: capability extended-nexthop
 neighbor 2001:db8:1:4e:: remote-as 65012
 neighbor 2001:db8:1:4e:: capability extended-nexthop
 neighbor 2001:db8:1:7f:: remote-as 65020
 neighbor 2001:db8:1:7f:: capability extended-nexthop
 neighbor 2001:db8:1:a6:: remote-as 65028
 neighbor 2001:db8:1:a6:: capability extended-nexthop
 neighbor 2001:db8:1:be:: remote-as 65036
 neighbor 2001:db8:1:be:: capability extended-nexthop
 neighbor 2001:db8:1:c2:: remote-as 65037
 neighbor 2001:db8:1:c2:: capability extended-nexthop
 neighbor 2001:db8:1:d5:: remote-as 65045
 neighbor 2001:db8:1:d5:: capability extended-nexthop
 neighbor 2001:db8:1:d7::1 remote-as 65053
 neighbor 2001:db8:1:d7::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:102e::/48
  network fc00:0:102e::1/128
  neighbor 2001:db8:1:15:: activate
  neighbor 2001:db8:1:15:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:4e:: activate
  neighbor 2001:db8:1:4e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:7f:: activate
  neighbor 2001:db8:1:7f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:a6:: activate
  neighbor 2001:db8:1:a6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:be:: activate
  neighbor 2001:db8:1:be:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c2:: activate
  neighbor 2001:db8:1:c2:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d5:: activate
  neighbor 2001:db8:1:d5:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d7::1 activate
  neighbor 2001:db8:1:d7::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:102e::/48 locator MAIN behavior uN
   sid fc00:0:102e:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:15::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:4e::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:7f::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:a6::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:be::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:c2::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:d5::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet7 nexthop 2001:db8:1:d7::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:102e::1
  exit
  locators
   locator MAIN
    prefix fc00:0:102e::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
