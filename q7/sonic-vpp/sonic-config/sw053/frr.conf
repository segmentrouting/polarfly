hostname sw053
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.53
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1035::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65053
 bgp router-id 1.1.0.53
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:2d:: remote-as 65006
 neighbor 2001:db8:1:2d:: capability extended-nexthop
 neighbor 2001:db8:1:4f:: remote-as 65012
 neighbor 2001:db8:1:4f:: capability extended-nexthop
 neighbor 2001:db8:1:65:: remote-as 65016
 neighbor 2001:db8:1:65:: capability extended-nexthop
 neighbor 2001:db8:1:a2:: remote-as 65027
 neighbor 2001:db8:1:a2:: capability extended-nexthop
 neighbor 2001:db8:1:af:: remote-as 65031
 neighbor 2001:db8:1:af:: capability extended-nexthop
 neighbor 2001:db8:1:d2:: remote-as 65042
 neighbor 2001:db8:1:d2:: capability extended-nexthop
 neighbor 2001:db8:1:d7:: remote-as 65046
 neighbor 2001:db8:1:d7:: capability extended-nexthop
 neighbor 2001:db8:1:de::1 remote-as 65057
 neighbor 2001:db8:1:de::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1035::/48
  network fc00:0:1035::1/128
  neighbor 2001:db8:1:2d:: activate
  neighbor 2001:db8:1:2d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:4f:: activate
  neighbor 2001:db8:1:4f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:65:: activate
  neighbor 2001:db8:1:65:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:a2:: activate
  neighbor 2001:db8:1:a2:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:af:: activate
  neighbor 2001:db8:1:af:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d2:: activate
  neighbor 2001:db8:1:d2:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d7:: activate
  neighbor 2001:db8:1:d7:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:de::1 activate
  neighbor 2001:db8:1:de::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1035::/48 locator MAIN behavior uN
   sid fc00:0:1035:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:2d::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:4f::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:65::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:a2::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:af::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:d2::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:d7::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet7 nexthop 2001:db8:1:de::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1035::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1035::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
