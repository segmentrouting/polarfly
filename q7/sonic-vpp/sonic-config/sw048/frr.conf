hostname sw048
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.48
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1030::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65048
 bgp router-id 1.1.0.48
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:2c:: remote-as 65006
 neighbor 2001:db8:1:2c:: capability extended-nexthop
 neighbor 2001:db8:1:5b:: remote-as 65014
 neighbor 2001:db8:1:5b:: capability extended-nexthop
 neighbor 2001:db8:1:74:: remote-as 65018
 neighbor 2001:db8:1:74:: capability extended-nexthop
 neighbor 2001:db8:1:aa:: remote-as 65029
 neighbor 2001:db8:1:aa:: capability extended-nexthop
 neighbor 2001:db8:1:b5:: remote-as 65033
 neighbor 2001:db8:1:b5:: capability extended-nexthop
 neighbor 2001:db8:1:c4:: remote-as 65037
 neighbor 2001:db8:1:c4:: capability extended-nexthop
 neighbor 2001:db8:1:d9::1 remote-as 65052
 neighbor 2001:db8:1:d9::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1030::/48
  network fc00:0:1030::1/128
  neighbor 2001:db8:1:2c:: activate
  neighbor 2001:db8:1:2c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:5b:: activate
  neighbor 2001:db8:1:5b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:74:: activate
  neighbor 2001:db8:1:74:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:aa:: activate
  neighbor 2001:db8:1:aa:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:b5:: activate
  neighbor 2001:db8:1:b5:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c4:: activate
  neighbor 2001:db8:1:c4:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d9::1 activate
  neighbor 2001:db8:1:d9::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1030::/48 locator MAIN behavior uN
   sid fc00:0:1030:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:2c::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet1 nexthop 2001:db8:1:5b::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet2 nexthop 2001:db8:1:74::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet3 nexthop 2001:db8:1:aa::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:b5::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet5 nexthop 2001:db8:1:c4::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet6 nexthop 2001:db8:1:d9::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1030::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1030::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
