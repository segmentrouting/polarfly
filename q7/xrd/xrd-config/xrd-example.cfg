!
interface GigabitEthernet0/0/0/0
 ipv6 address // follow same pattern as sonic nodes
 no shutdown
!
interface GigabitEthernet0/0/0/1
 ipv6 address // follow same pattern as sonic nodes
 no shutdown
!
