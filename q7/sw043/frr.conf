hostname sw043
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.43
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:102b::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65043
 bgp router-id 1.1.0.43
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:2b:: remote-as 65006
 neighbor 2001:db8:1:2b:: capability extended-nexthop
 neighbor 2001:db8:1:40:: remote-as 65010
 neighbor 2001:db8:1:40:: capability extended-nexthop
 neighbor 2001:db8:1:83:: remote-as 65021
 neighbor 2001:db8:1:83:: capability extended-nexthop
 neighbor 2001:db8:1:98:: remote-as 65025
 neighbor 2001:db8:1:98:: capability extended-nexthop
 neighbor 2001:db8:1:bd:: remote-as 65036
 neighbor 2001:db8:1:bd:: capability extended-nexthop
 neighbor 2001:db8:1:cc:: remote-as 65040
 neighbor 2001:db8:1:cc:: capability extended-nexthop
 neighbor 2001:db8:1:d3::1 remote-as 65044
 neighbor 2001:db8:1:d3::1 capability extended-nexthop
 neighbor 2001:db8:1:d4::1 remote-as 65055
 neighbor 2001:db8:1:d4::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:102b::/48
  network fc00:0:102b::1/128
  neighbor 2001:db8:1:2b:: activate
  neighbor 2001:db8:1:2b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:40:: activate
  neighbor 2001:db8:1:40:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:83:: activate
  neighbor 2001:db8:1:83:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:98:: activate
  neighbor 2001:db8:1:98:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:bd:: activate
  neighbor 2001:db8:1:bd:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:cc:: activate
  neighbor 2001:db8:1:cc:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d3::1 activate
  neighbor 2001:db8:1:d3::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d4::1 activate
  neighbor 2001:db8:1:d4::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:102b::/48 locator MAIN behavior uN
   sid fc00:0:102b:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:2b::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:40::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:83::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:98::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:bd::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:cc::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:d3::1
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:d4::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:102b::1
  exit
  locators
   locator MAIN
    prefix fc00:0:102b::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
