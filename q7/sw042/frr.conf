hostname sw042
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.42
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:102a::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65042
 bgp router-id 1.1.0.42
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:1c:: remote-as 65004
 neighbor 2001:db8:1:1c:: capability extended-nexthop
 neighbor 2001:db8:1:54:: remote-as 65013
 neighbor 2001:db8:1:54:: capability extended-nexthop
 neighbor 2001:db8:1:88:: remote-as 65022
 neighbor 2001:db8:1:88:: capability extended-nexthop
 neighbor 2001:db8:1:94:: remote-as 65024
 neighbor 2001:db8:1:94:: capability extended-nexthop
 neighbor 2001:db8:1:b4:: remote-as 65033
 neighbor 2001:db8:1:b4:: capability extended-nexthop
 neighbor 2001:db8:1:d1::1 remote-as 65044
 neighbor 2001:db8:1:d1::1 capability extended-nexthop
 neighbor 2001:db8:1:d2::1 remote-as 65053
 neighbor 2001:db8:1:d2::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:102a::/48
  network fc00:0:102a::1/128
  neighbor 2001:db8:1:1c:: activate
  neighbor 2001:db8:1:1c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:54:: activate
  neighbor 2001:db8:1:54:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:88:: activate
  neighbor 2001:db8:1:88:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:94:: activate
  neighbor 2001:db8:1:94:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:b4:: activate
  neighbor 2001:db8:1:b4:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d1::1 activate
  neighbor 2001:db8:1:d1::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d2::1 activate
  neighbor 2001:db8:1:d2::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:102a::/48 locator MAIN behavior uN
   sid fc00:0:102a:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:1c::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:54::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:88::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:94::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:b4::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:d1::1
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:d2::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:102a::1
  exit
  locators
   locator MAIN
    prefix fc00:0:102a::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
