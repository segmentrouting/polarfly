hostname sw057
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.57
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1039::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65057
 bgp router-id 1.1.0.57
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:3b:: remote-as 65008
 neighbor 2001:db8:1:3b:: capability extended-nexthop
 neighbor 2001:db8:1:42:: remote-as 65010
 neighbor 2001:db8:1:42:: capability extended-nexthop
 neighbor 2001:db8:1:69:: remote-as 65016
 neighbor 2001:db8:1:69:: capability extended-nexthop
 neighbor 2001:db8:1:ab:: remote-as 65029
 neighbor 2001:db8:1:ab:: capability extended-nexthop
 neighbor 2001:db8:1:bc:: remote-as 65035
 neighbor 2001:db8:1:bc:: capability extended-nexthop
 neighbor 2001:db8:1:d0:: remote-as 65041
 neighbor 2001:db8:1:d0:: capability extended-nexthop
 neighbor 2001:db8:1:d8:: remote-as 65047
 neighbor 2001:db8:1:d8:: capability extended-nexthop
 neighbor 2001:db8:1:de:: remote-as 65053
 neighbor 2001:db8:1:de:: capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1039::/48
  network fc00:0:1039::1/128
  neighbor 2001:db8:1:3b:: activate
  neighbor 2001:db8:1:3b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:42:: activate
  neighbor 2001:db8:1:42:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:69:: activate
  neighbor 2001:db8:1:69:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:ab:: activate
  neighbor 2001:db8:1:ab:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:bc:: activate
  neighbor 2001:db8:1:bc:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d0:: activate
  neighbor 2001:db8:1:d0:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d8:: activate
  neighbor 2001:db8:1:d8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:de:: activate
  neighbor 2001:db8:1:de:: route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:1039::/48 locator MAIN behavior uN
   sid fc00:0:1039:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:e000::/48 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:3b::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:42::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:69::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:ab::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:bc::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:d0::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:d8::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:de::
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1039::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1039::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
