hostname sw044
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.44
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:102c::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65044
 bgp router-id 1.1.0.44
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:6:: remote-as 65001
 neighbor 2001:db8:1:6:: capability extended-nexthop
 neighbor 2001:db8:1:c0:: remote-as 65037
 neighbor 2001:db8:1:c0:: capability extended-nexthop
 neighbor 2001:db8:1:c8:: remote-as 65038
 neighbor 2001:db8:1:c8:: capability extended-nexthop
 neighbor 2001:db8:1:ca:: remote-as 65039
 neighbor 2001:db8:1:ca:: capability extended-nexthop
 neighbor 2001:db8:1:cd:: remote-as 65040
 neighbor 2001:db8:1:cd:: capability extended-nexthop
 neighbor 2001:db8:1:cf:: remote-as 65041
 neighbor 2001:db8:1:cf:: capability extended-nexthop
 neighbor 2001:db8:1:d1:: remote-as 65042
 neighbor 2001:db8:1:d1:: capability extended-nexthop
 neighbor 2001:db8:1:d3:: remote-as 65043
 neighbor 2001:db8:1:d3:: capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:102c::/48
  network fc00:0:102c::1/128
  neighbor 2001:db8:1:6:: activate
  neighbor 2001:db8:1:6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c0:: activate
  neighbor 2001:db8:1:c0:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c8:: activate
  neighbor 2001:db8:1:c8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:ca:: activate
  neighbor 2001:db8:1:ca:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:cd:: activate
  neighbor 2001:db8:1:cd:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:cf:: activate
  neighbor 2001:db8:1:cf:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d1:: activate
  neighbor 2001:db8:1:d1:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d3:: activate
  neighbor 2001:db8:1:d3:: route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:102c::/48 locator MAIN behavior uN
   sid fc00:0:102c:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:6::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:c0::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:c8::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:ca::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:cd::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:cf::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:d1::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:d3::
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:102c::1
  exit
  locators
   locator MAIN
    prefix fc00:0:102c::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
