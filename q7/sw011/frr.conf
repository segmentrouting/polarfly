hostname sw011
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.11
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:100b::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65011
 bgp router-id 1.1.0.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:a:: remote-as 65002
 neighbor 2001:db8:1:a:: capability extended-nexthop
 neighbor 2001:db8:1:43::1 remote-as 65012
 neighbor 2001:db8:1:43::1 capability extended-nexthop
 neighbor 2001:db8:1:44::1 remote-as 65019
 neighbor 2001:db8:1:44::1 capability extended-nexthop
 neighbor 2001:db8:1:45::1 remote-as 65026
 neighbor 2001:db8:1:45::1 capability extended-nexthop
 neighbor 2001:db8:1:46::1 remote-as 65033
 neighbor 2001:db8:1:46::1 capability extended-nexthop
 neighbor 2001:db8:1:47::1 remote-as 65040
 neighbor 2001:db8:1:47::1 capability extended-nexthop
 neighbor 2001:db8:1:48::1 remote-as 65047
 neighbor 2001:db8:1:48::1 capability extended-nexthop
 neighbor 2001:db8:1:49::1 remote-as 65054
 neighbor 2001:db8:1:49::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:100b::/48
  network fc00:0:100b::1/128
  neighbor 2001:db8:1:a:: activate
  neighbor 2001:db8:1:a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:43::1 activate
  neighbor 2001:db8:1:43::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:44::1 activate
  neighbor 2001:db8:1:44::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:45::1 activate
  neighbor 2001:db8:1:45::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:46::1 activate
  neighbor 2001:db8:1:46::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:47::1 activate
  neighbor 2001:db8:1:47::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:48::1 activate
  neighbor 2001:db8:1:48::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:49::1 activate
  neighbor 2001:db8:1:49::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:100b::/48 locator MAIN behavior uN
   sid fc00:0:100b:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:a::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:43::1
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:44::1
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:45::1
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:46::1
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:47::1
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:48::1
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:49::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:100b::1
  exit
  locators
   locator MAIN
    prefix fc00:0:100b::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
