      ipv6_subnet: fc00:0:f800:2::/64
    - ip: 10.10.3.2
      default_gw: 10.10.3.1
      ip6: fc00:0:f800:3::2
      default_gw6: fc00:0:f800:3::1
      ipv6_autocfg: true
      src_ipv6_enabled: true
      ipv6_nd_enabled: true
      ipv6_subnet: fc00:0:f800:3::/64 