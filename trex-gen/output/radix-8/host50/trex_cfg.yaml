      src_ipv6_enabled: true
      ipv6_nd_enabled: true
      ipv6_subnet: fc00:0:f800:100::/64
    - ip: 10.10.101.2
      default_gw: 10.10.101.1
      ip6: fc00:0:f800:101::2
      default_gw6: fc00:0:f800:101::1
      ipv6_autocfg: true
      src_ipv6_enabled: true
      ipv6_nd_enabled: true
      ipv6_subnet: fc00:0:f800:101::/64 