  port_info     :  # set eh mac addr

                 - ip         : 10.11.0.2
                   default_gw : 10.11.0.1

                 - ip         : 10.11.4.2
                   default_gw : 10.11.4.1

                 - ip         : 10.11.8.2
                   default_gw : 10.11.8.1

                 - ip         : 10.11.12.2
                   default_gw : 10.11.12.1
    
