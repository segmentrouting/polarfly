  encapsulation
   source-address fc00:0:1001::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1001::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
