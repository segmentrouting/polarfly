hostname sw001
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.1
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1001::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65001
 bgp router-id 1.1.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:0::1 remote-as 65002
 neighbor 2001:db8:1:0::1 capability extended-nexthop
 neighbor 2001:db8:1:1::1 remote-as 65019
 neighbor 2001:db8:1:1::1 capability extended-nexthop
 neighbor 2001:db8:1:2::1 remote-as 65036
 neighbor 2001:db8:1:2::1 capability extended-nexthop
