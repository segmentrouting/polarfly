  network fc00:0:1001::/48
  network fc00:0:1001::1/128
  neighbor 2001:db8:1:0::1 activate
  neighbor 2001:db8:1:0::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:1::1 activate
  neighbor 2001:db8:1:1::1 route-map BGP-IPV6 in
