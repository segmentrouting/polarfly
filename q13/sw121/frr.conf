 neighbor 2001:db8:1:90:: capability extended-nexthop
 neighbor 2001:db8:1:102:: remote-as 65021
 neighbor 2001:db8:1:102:: capability extended-nexthop
 neighbor 2001:db8:1:171:: remote-as 65030
