hostname sw064
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.64
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1040::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65064
 bgp router-id 1.1.0.64
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:1f:: remote-as 65003
 neighbor 2001:db8:1:1f:: capability extended-nexthop
 neighbor 2001:db8:1:123:: remote-as 65024
 neighbor 2001:db8:1:123:: capability extended-nexthop
 neighbor 2001:db8:1:1c8:: remote-as 65038
