  network fc00:0:1040::/48
  network fc00:0:1040::1/128
  neighbor 2001:db8:1:1f:: activate
  neighbor 2001:db8:1:1f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:123:: activate
  neighbor 2001:db8:1:123:: route-map BGP-IPV6 in
