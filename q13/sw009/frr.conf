 neighbor 2001:db8:1:75::1 remote-as 65129
 neighbor 2001:db8:1:75::1 capability extended-nexthop
 neighbor 2001:db8:1:76::1 remote-as 65140
 neighbor 2001:db8:1:76::1 capability extended-nexthop
 neighbor 2001:db8:1:77::1 remote-as 65151
