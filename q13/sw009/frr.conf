hostname sw009
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.9
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1009::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65009
 bgp router-id 1.1.0.9
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:6c::1 remote-as 65013
 neighbor 2001:db8:1:6c::1 capability extended-nexthop
 neighbor 2001:db8:1:6d::1 remote-as 65015
 neighbor 2001:db8:1:6d::1 capability extended-nexthop
 neighbor 2001:db8:1:6e::1 remote-as 65039
 neighbor 2001:db8:1:6e::1 capability extended-nexthop
 neighbor 2001:db8:1:6f::1 remote-as 65050
 neighbor 2001:db8:1:6f::1 capability extended-nexthop
 neighbor 2001:db8:1:70::1 remote-as 65061
 neighbor 2001:db8:1:70::1 capability extended-nexthop
 neighbor 2001:db8:1:71::1 remote-as 65072
 neighbor 2001:db8:1:71::1 capability extended-nexthop
 neighbor 2001:db8:1:72::1 remote-as 65083
 neighbor 2001:db8:1:72::1 capability extended-nexthop
 neighbor 2001:db8:1:73::1 remote-as 65094
 neighbor 2001:db8:1:73::1 capability extended-nexthop
 neighbor 2001:db8:1:74::1 remote-as 65118
