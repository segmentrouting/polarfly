  network fc00:0:1042::/48
  network fc00:0:1042::1/128
  neighbor 2001:db8:1:3b:: activate
  neighbor 2001:db8:1:3b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:bf:: activate
