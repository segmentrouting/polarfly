hostname sw066
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.66
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1042::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65066
 bgp router-id 1.1.0.66
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:3b:: remote-as 65005
 neighbor 2001:db8:1:3b:: capability extended-nexthop
 neighbor 2001:db8:1:bf:: remote-as 65016
 neighbor 2001:db8:1:bf:: capability extended-nexthop
 neighbor 2001:db8:1:184:: remote-as 65032
