hostname sw070
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.70
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1046::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65070
 bgp router-id 1.1.0.70
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:3c:: remote-as 65005
 neighbor 2001:db8:1:3c:: capability extended-nexthop
 neighbor 2001:db8:1:e6:: remote-as 65019
 neighbor 2001:db8:1:e6:: capability extended-nexthop
 neighbor 2001:db8:1:1a8:: remote-as 65035
 neighbor 2001:db8:1:1a8:: capability extended-nexthop
 neighbor 2001:db8:1:256:: remote-as 65051
 neighbor 2001:db8:1:256:: capability extended-nexthop
 neighbor 2001:db8:1:276:: remote-as 65054
 neighbor 2001:db8:1:276:: capability extended-nexthop
 neighbor 2001:db8:1:303::1 remote-as 65086
 neighbor 2001:db8:1:303::1 capability extended-nexthop
 neighbor 2001:db8:1:304::1 remote-as 65102
 neighbor 2001:db8:1:304::1 capability extended-nexthop
 neighbor 2001:db8:1:305::1 remote-as 65118
 neighbor 2001:db8:1:305::1 capability extended-nexthop
 neighbor 2001:db8:1:306::1 remote-as 65121
 neighbor 2001:db8:1:306::1 capability extended-nexthop
 neighbor 2001:db8:1:307::1 remote-as 65137
 neighbor 2001:db8:1:307::1 capability extended-nexthop
 neighbor 2001:db8:1:308::1 remote-as 65153
 neighbor 2001:db8:1:308::1 capability extended-nexthop
 neighbor 2001:db8:1:309::1 remote-as 65169
 neighbor 2001:db8:1:309::1 capability extended-nexthop
 neighbor 2001:db8:1:30a::1 remote-as 65172
 neighbor 2001:db8:1:30a::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1046::/48
  network fc00:0:1046::1/128
  neighbor 2001:db8:1:3c:: activate
  neighbor 2001:db8:1:3c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:e6:: activate
  neighbor 2001:db8:1:e6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1a8:: activate
  neighbor 2001:db8:1:1a8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:256:: activate
  neighbor 2001:db8:1:256:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:276:: activate
  neighbor 2001:db8:1:276:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:303::1 activate
  neighbor 2001:db8:1:303::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:304::1 activate
  neighbor 2001:db8:1:304::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:305::1 activate
  neighbor 2001:db8:1:305::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:306::1 activate
  neighbor 2001:db8:1:306::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:307::1 activate
  neighbor 2001:db8:1:307::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:308::1 activate
  neighbor 2001:db8:1:308::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:309::1 activate
  neighbor 2001:db8:1:309::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:30a::1 activate
