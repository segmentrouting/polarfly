hostname sw019
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.19
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1013::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65019
 bgp router-id 1.1.0.19
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:12:: remote-as 65002
 neighbor 2001:db8:1:12:: capability extended-nexthop
 neighbor 2001:db8:1:d6:: remote-as 65018
 neighbor 2001:db8:1:d6:: capability extended-nexthop
 neighbor 2001:db8:1:e3::1 remote-as 65031
 neighbor 2001:db8:1:e3::1 capability extended-nexthop
 neighbor 2001:db8:1:e4::1 remote-as 65044
 neighbor 2001:db8:1:e4::1 capability extended-nexthop
 neighbor 2001:db8:1:e5::1 remote-as 65057
 neighbor 2001:db8:1:e5::1 capability extended-nexthop
 neighbor 2001:db8:1:e6::1 remote-as 65070
 neighbor 2001:db8:1:e6::1 capability extended-nexthop
 neighbor 2001:db8:1:e7::1 remote-as 65083
 neighbor 2001:db8:1:e7::1 capability extended-nexthop
 neighbor 2001:db8:1:e8::1 remote-as 65096
 neighbor 2001:db8:1:e8::1 capability extended-nexthop
 neighbor 2001:db8:1:e9::1 remote-as 65109
