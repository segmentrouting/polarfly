 neighbor 2001:db8:1:ec::1 capability extended-nexthop
 neighbor 2001:db8:1:ed::1 remote-as 65161
 neighbor 2001:db8:1:ed::1 capability extended-nexthop
 neighbor 2001:db8:1:ee::1 remote-as 65174
 neighbor 2001:db8:1:ee::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1013::/48
  network fc00:0:1013::1/128
  neighbor 2001:db8:1:12:: activate
  neighbor 2001:db8:1:12:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d6:: activate
  neighbor 2001:db8:1:d6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:e3::1 activate
  neighbor 2001:db8:1:e3::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:e4::1 activate
  neighbor 2001:db8:1:e4::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:e5::1 activate
  neighbor 2001:db8:1:e5::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:e6::1 activate
  neighbor 2001:db8:1:e6::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:e7::1 activate
  neighbor 2001:db8:1:e7::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:e8::1 activate
  neighbor 2001:db8:1:e8::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:e9::1 activate
  neighbor 2001:db8:1:e9::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:ea::1 activate
