  network fc00:0:1051::/48
  network fc00:0:1051::1/128
  neighbor 2001:db8:1:7f:: activate
  neighbor 2001:db8:1:7f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:149:: activate
