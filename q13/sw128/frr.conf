hostname sw128
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.128
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1080::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65128
 bgp router-id 1.1.0.128
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:32:: remote-as 65004
 neighbor 2001:db8:1:32:: capability extended-nexthop
 neighbor 2001:db8:1:134:: remote-as 65025
 neighbor 2001:db8:1:134:: capability extended-nexthop
 neighbor 2001:db8:1:1e3:: remote-as 65040
 neighbor 2001:db8:1:1e3:: capability extended-nexthop
 neighbor 2001:db8:1:1fb:: remote-as 65042
 neighbor 2001:db8:1:1fb:: capability extended-nexthop
 neighbor 2001:db8:1:298:: remote-as 65057
 neighbor 2001:db8:1:298:: capability extended-nexthop
 neighbor 2001:db8:1:318:: remote-as 65072
 neighbor 2001:db8:1:318:: capability extended-nexthop
 neighbor 2001:db8:1:38e:: remote-as 65087
 neighbor 2001:db8:1:38e:: capability extended-nexthop
 neighbor 2001:db8:1:3ec:: remote-as 65102
 neighbor 2001:db8:1:3ec:: capability extended-nexthop
 neighbor 2001:db8:1:449:: remote-as 65117
 neighbor 2001:db8:1:449:: capability extended-nexthop
 neighbor 2001:db8:1:45b:: remote-as 65119
 neighbor 2001:db8:1:45b:: capability extended-nexthop
 neighbor 2001:db8:1:47f::1 remote-as 65134
 neighbor 2001:db8:1:47f::1 capability extended-nexthop
 neighbor 2001:db8:1:480::1 remote-as 65149
 neighbor 2001:db8:1:480::1 capability extended-nexthop
 neighbor 2001:db8:1:481::1 remote-as 65164
 neighbor 2001:db8:1:481::1 capability extended-nexthop
 neighbor 2001:db8:1:482::1 remote-as 65179
 neighbor 2001:db8:1:482::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1080::/48
  network fc00:0:1080::1/128
  neighbor 2001:db8:1:32:: activate
  neighbor 2001:db8:1:32:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:134:: activate
  neighbor 2001:db8:1:134:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1e3:: activate
  neighbor 2001:db8:1:1e3:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1fb:: activate
  neighbor 2001:db8:1:1fb:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:298:: activate
  neighbor 2001:db8:1:298:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:318:: activate
  neighbor 2001:db8:1:318:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:38e:: activate
  neighbor 2001:db8:1:38e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3ec:: activate
  neighbor 2001:db8:1:3ec:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:449:: activate
  neighbor 2001:db8:1:449:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:45b:: activate
  neighbor 2001:db8:1:45b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:47f::1 activate
  neighbor 2001:db8:1:47f::1 route-map BGP-IPV6 in
