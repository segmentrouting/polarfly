   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:3ec::
   sid fc00:0:f008::/48 locator MAIN behavior uA interface Ethernet32 nexthop 2001:db8:1:449::
   sid fc00:0:f009::/48 locator MAIN behavior uA interface Ethernet36 nexthop 2001:db8:1:45b::
   sid fc00:0:f00a::/48 locator MAIN behavior uA interface Ethernet40 nexthop 2001:db8:1:47f::1
   sid fc00:0:f00b::/48 locator MAIN behavior uA interface Ethernet44 nexthop 2001:db8:1:480::1
   sid fc00:0:f00c::/48 locator MAIN behavior uA interface Ethernet48 nexthop 2001:db8:1:481::1
   sid fc00:0:f00d::/48 locator MAIN behavior uA interface Ethernet52 nexthop 2001:db8:1:482::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1080::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1080::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
