hostname sw018
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.18
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1012::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65018
 bgp router-id 1.1.0.18
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:11:: remote-as 65002
 neighbor 2001:db8:1:11:: capability extended-nexthop
 neighbor 2001:db8:1:d6::1 remote-as 65019
 neighbor 2001:db8:1:d6::1 capability extended-nexthop
 neighbor 2001:db8:1:d7::1 remote-as 65032
 neighbor 2001:db8:1:d7::1 capability extended-nexthop
 neighbor 2001:db8:1:d8::1 remote-as 65045
 neighbor 2001:db8:1:d8::1 capability extended-nexthop
 neighbor 2001:db8:1:d9::1 remote-as 65058
 neighbor 2001:db8:1:d9::1 capability extended-nexthop
 neighbor 2001:db8:1:da::1 remote-as 65071
 neighbor 2001:db8:1:da::1 capability extended-nexthop
 neighbor 2001:db8:1:db::1 remote-as 65084
 neighbor 2001:db8:1:db::1 capability extended-nexthop
 neighbor 2001:db8:1:dc::1 remote-as 65097
 neighbor 2001:db8:1:dc::1 capability extended-nexthop
 neighbor 2001:db8:1:dd::1 remote-as 65110
 neighbor 2001:db8:1:dd::1 capability extended-nexthop
 neighbor 2001:db8:1:de::1 remote-as 65123
 neighbor 2001:db8:1:de::1 capability extended-nexthop
 neighbor 2001:db8:1:df::1 remote-as 65136
 neighbor 2001:db8:1:df::1 capability extended-nexthop
 neighbor 2001:db8:1:e0::1 remote-as 65149
 neighbor 2001:db8:1:e0::1 capability extended-nexthop
 neighbor 2001:db8:1:e1::1 remote-as 65162
 neighbor 2001:db8:1:e1::1 capability extended-nexthop
 neighbor 2001:db8:1:e2::1 remote-as 65175
 neighbor 2001:db8:1:e2::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1012::/48
  network fc00:0:1012::1/128
  neighbor 2001:db8:1:11:: activate
  neighbor 2001:db8:1:11:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:d6::1 activate
  neighbor 2001:db8:1:d6::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d7::1 activate
  neighbor 2001:db8:1:d7::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d8::1 activate
  neighbor 2001:db8:1:d8::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d9::1 activate
  neighbor 2001:db8:1:d9::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:da::1 activate
  neighbor 2001:db8:1:da::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:db::1 activate
  neighbor 2001:db8:1:db::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:dc::1 activate
  neighbor 2001:db8:1:dc::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:dd::1 activate
  neighbor 2001:db8:1:dd::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:de::1 activate
  neighbor 2001:db8:1:de::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:df::1 activate
