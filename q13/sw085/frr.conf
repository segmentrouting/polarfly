   sid fc00:0:f00d::/48 locator MAIN behavior uA interface Ethernet52 nexthop 2001:db8:1:384::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1055::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1055::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
