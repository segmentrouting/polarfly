hostname sw085
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.85
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1055::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65085
 bgp router-id 1.1.0.85
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:b4:: remote-as 65014
 neighbor 2001:db8:1:b4:: capability extended-nexthop
 neighbor 2001:db8:1:f3:: remote-as 65020
 neighbor 2001:db8:1:f3:: capability extended-nexthop
 neighbor 2001:db8:1:186:: remote-as 65032
 neighbor 2001:db8:1:186:: capability extended-nexthop
 neighbor 2001:db8:1:20e:: remote-as 65044
 neighbor 2001:db8:1:20e:: capability extended-nexthop
 neighbor 2001:db8:1:28c:: remote-as 65056
 neighbor 2001:db8:1:28c:: capability extended-nexthop
 neighbor 2001:db8:1:2f2:: remote-as 65068
 neighbor 2001:db8:1:2f2:: capability extended-nexthop
 neighbor 2001:db8:1:35a:: remote-as 65080
 neighbor 2001:db8:1:35a:: capability extended-nexthop
 neighbor 2001:db8:1:37e::1 remote-as 65105
 neighbor 2001:db8:1:37e::1 capability extended-nexthop
 neighbor 2001:db8:1:37f::1 remote-as 65117
 neighbor 2001:db8:1:37f::1 capability extended-nexthop
