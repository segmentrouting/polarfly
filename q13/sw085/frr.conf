  network fc00:0:1055::/48
  network fc00:0:1055::1/128
  neighbor 2001:db8:1:b4:: activate
  neighbor 2001:db8:1:b4:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:f3:: activate
  neighbor 2001:db8:1:f3:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:186:: activate
  neighbor 2001:db8:1:186:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:20e:: activate
  neighbor 2001:db8:1:20e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:28c:: activate
  neighbor 2001:db8:1:28c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2f2:: activate
  neighbor 2001:db8:1:2f2:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:35a:: activate
  neighbor 2001:db8:1:35a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:37e::1 activate
  neighbor 2001:db8:1:37e::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:37f::1 activate
  neighbor 2001:db8:1:37f::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:380::1 activate
  neighbor 2001:db8:1:380::1 route-map BGP-IPV6 in
