 neighbor 2001:db8:1:347:: capability extended-nexthop
 neighbor 2001:db8:1:3a1:: remote-as 65090
 neighbor 2001:db8:1:3a1:: capability extended-nexthop
 neighbor 2001:db8:1:3d7::1 remote-as 65102
 neighbor 2001:db8:1:3d7::1 capability extended-nexthop
