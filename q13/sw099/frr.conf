hostname sw099
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.99
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1063::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65099
 bgp router-id 1.1.0.99
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:b5:: remote-as 65014
 neighbor 2001:db8:1:b5:: capability extended-nexthop
 neighbor 2001:db8:1:cf:: remote-as 65017
 neighbor 2001:db8:1:cf:: capability extended-nexthop
 neighbor 2001:db8:1:163:: remote-as 65029
