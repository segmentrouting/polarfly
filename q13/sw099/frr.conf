  network fc00:0:1063::/48
  network fc00:0:1063::1/128
  neighbor 2001:db8:1:b5:: activate
  neighbor 2001:db8:1:b5:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:cf:: activate
  neighbor 2001:db8:1:cf:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:163:: activate
