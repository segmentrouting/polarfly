  links:
    # ---- fabric links (polarity adjacencies) ----
    # NOTE: link endpoints use eth<N> containerlab naming, where N = SONiC
    # 'index' field + 1 (eth1=Ethernet0, eth2=Ethernet4, ..., eth(q+2)=host port).
    # SONiC's syncd virtual-SAI creates the Ethernet<N> hostif itself and binds
    # it to the corresponding ethN veth via port_config.ini's index field.
    # Attaching as Ethernet<N> directly causes SAI_HOSTIF create failures.
