hostname sw017
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.17
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1011::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65017
 bgp router-id 1.1.0.17
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:10:: remote-as 65002
 neighbor 2001:db8:1:10:: capability extended-nexthop
 neighbor 2001:db8:1:c9::1 remote-as 65021
 neighbor 2001:db8:1:c9::1 capability extended-nexthop
 neighbor 2001:db8:1:ca::1 remote-as 65034
 neighbor 2001:db8:1:ca::1 capability extended-nexthop
 neighbor 2001:db8:1:cb::1 remote-as 65047
 neighbor 2001:db8:1:cb::1 capability extended-nexthop
 neighbor 2001:db8:1:cc::1 remote-as 65060
 neighbor 2001:db8:1:cc::1 capability extended-nexthop
 neighbor 2001:db8:1:cd::1 remote-as 65073
 neighbor 2001:db8:1:cd::1 capability extended-nexthop
 neighbor 2001:db8:1:ce::1 remote-as 65086
 neighbor 2001:db8:1:ce::1 capability extended-nexthop
 neighbor 2001:db8:1:cf::1 remote-as 65099
 neighbor 2001:db8:1:cf::1 capability extended-nexthop
 neighbor 2001:db8:1:d0::1 remote-as 65112
 neighbor 2001:db8:1:d0::1 capability extended-nexthop
 neighbor 2001:db8:1:d1::1 remote-as 65125
 neighbor 2001:db8:1:d1::1 capability extended-nexthop
 neighbor 2001:db8:1:d2::1 remote-as 65138
 neighbor 2001:db8:1:d2::1 capability extended-nexthop
 neighbor 2001:db8:1:d3::1 remote-as 65151
 neighbor 2001:db8:1:d3::1 capability extended-nexthop
 neighbor 2001:db8:1:d4::1 remote-as 65164
 neighbor 2001:db8:1:d4::1 capability extended-nexthop
 neighbor 2001:db8:1:d5::1 remote-as 65177
 neighbor 2001:db8:1:d5::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1011::/48
  network fc00:0:1011::1/128
  neighbor 2001:db8:1:10:: activate
  neighbor 2001:db8:1:10:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c9::1 activate
  neighbor 2001:db8:1:c9::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:ca::1 activate
  neighbor 2001:db8:1:ca::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:cb::1 activate
  neighbor 2001:db8:1:cb::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:cc::1 activate
  neighbor 2001:db8:1:cc::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:cd::1 activate
  neighbor 2001:db8:1:cd::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:ce::1 activate
  neighbor 2001:db8:1:ce::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:cf::1 activate
  neighbor 2001:db8:1:cf::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d0::1 activate
  neighbor 2001:db8:1:d0::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d1::1 activate
  neighbor 2001:db8:1:d1::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:d2::1 activate
  neighbor 2001:db8:1:d2::1 route-map BGP-IPV6 in
