  network fc00:0:10ac::/48
  network fc00:0:10ac::1/128
  neighbor 2001:db8:1:28:: activate
  neighbor 2001:db8:1:28:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:150:: activate
