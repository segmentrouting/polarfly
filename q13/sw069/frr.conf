hostname sw069
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.69
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1045::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65069
 bgp router-id 1.1.0.69
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:a6:: remote-as 65013
 neighbor 2001:db8:1:a6:: capability extended-nexthop
 neighbor 2001:db8:1:fe:: remote-as 65021
 neighbor 2001:db8:1:fe:: capability extended-nexthop
 neighbor 2001:db8:1:185:: remote-as 65032
 neighbor 2001:db8:1:185:: capability extended-nexthop
 neighbor 2001:db8:1:202:: remote-as 65043
 neighbor 2001:db8:1:202:: capability extended-nexthop
 neighbor 2001:db8:1:275:: remote-as 65054
 neighbor 2001:db8:1:275:: capability extended-nexthop
 neighbor 2001:db8:1:2fa::1 remote-as 65078
 neighbor 2001:db8:1:2fa::1 capability extended-nexthop
 neighbor 2001:db8:1:2fb::1 remote-as 65089
 neighbor 2001:db8:1:2fb::1 capability extended-nexthop
 neighbor 2001:db8:1:2fc::1 remote-as 65100
 neighbor 2001:db8:1:2fc::1 capability extended-nexthop
 neighbor 2001:db8:1:2fd::1 remote-as 65111
