 neighbor 2001:db8:1:301::1 remote-as 65168
 neighbor 2001:db8:1:301::1 capability extended-nexthop
 neighbor 2001:db8:1:302::1 remote-as 65179
 neighbor 2001:db8:1:302::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1045::/48
  network fc00:0:1045::1/128
  neighbor 2001:db8:1:a6:: activate
  neighbor 2001:db8:1:a6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:fe:: activate
  neighbor 2001:db8:1:fe:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:185:: activate
  neighbor 2001:db8:1:185:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:202:: activate
  neighbor 2001:db8:1:202:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:275:: activate
  neighbor 2001:db8:1:275:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2fa::1 activate
  neighbor 2001:db8:1:2fa::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2fb::1 activate
  neighbor 2001:db8:1:2fb::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2fc::1 activate
  neighbor 2001:db8:1:2fc::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2fd::1 activate
  neighbor 2001:db8:1:2fd::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2fe::1 activate
  neighbor 2001:db8:1:2fe::1 route-map BGP-IPV6 in
