hostname sw021
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.21
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1015::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65021
 bgp router-id 1.1.0.21
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:14:: remote-as 65002
 neighbor 2001:db8:1:14:: capability extended-nexthop
 neighbor 2001:db8:1:c9:: remote-as 65017
 neighbor 2001:db8:1:c9:: capability extended-nexthop
 neighbor 2001:db8:1:fb::1 remote-as 65030
 neighbor 2001:db8:1:fb::1 capability extended-nexthop
 neighbor 2001:db8:1:fc::1 remote-as 65043
 neighbor 2001:db8:1:fc::1 capability extended-nexthop
 neighbor 2001:db8:1:fd::1 remote-as 65056
 neighbor 2001:db8:1:fd::1 capability extended-nexthop
 neighbor 2001:db8:1:fe::1 remote-as 65069
 neighbor 2001:db8:1:fe::1 capability extended-nexthop
 neighbor 2001:db8:1:ff::1 remote-as 65082
 neighbor 2001:db8:1:ff::1 capability extended-nexthop
 neighbor 2001:db8:1:100::1 remote-as 65095
 neighbor 2001:db8:1:100::1 capability extended-nexthop
 neighbor 2001:db8:1:101::1 remote-as 65108
 neighbor 2001:db8:1:101::1 capability extended-nexthop
 neighbor 2001:db8:1:102::1 remote-as 65121
 neighbor 2001:db8:1:102::1 capability extended-nexthop
 neighbor 2001:db8:1:103::1 remote-as 65134
 neighbor 2001:db8:1:103::1 capability extended-nexthop
 neighbor 2001:db8:1:104::1 remote-as 65147
 neighbor 2001:db8:1:104::1 capability extended-nexthop
 neighbor 2001:db8:1:105::1 remote-as 65160
 neighbor 2001:db8:1:105::1 capability extended-nexthop
 neighbor 2001:db8:1:106::1 remote-as 65173
 neighbor 2001:db8:1:106::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1015::/48
  network fc00:0:1015::1/128
  neighbor 2001:db8:1:14:: activate
  neighbor 2001:db8:1:14:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c9:: activate
  neighbor 2001:db8:1:c9:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:fb::1 activate
  neighbor 2001:db8:1:fb::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:fc::1 activate
  neighbor 2001:db8:1:fc::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:fd::1 activate
  neighbor 2001:db8:1:fd::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:fe::1 activate
  neighbor 2001:db8:1:fe::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:ff::1 activate
  neighbor 2001:db8:1:ff::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:100::1 activate
  neighbor 2001:db8:1:100::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:101::1 activate
  neighbor 2001:db8:1:101::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:102::1 activate
  neighbor 2001:db8:1:102::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:103::1 activate
  neighbor 2001:db8:1:103::1 route-map BGP-IPV6 in
