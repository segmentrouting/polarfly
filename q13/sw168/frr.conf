hostname sw168
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.168
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:10a8::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65168
 bgp router-id 1.1.0.168
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:85:: remote-as 65010
 neighbor 2001:db8:1:85:: capability extended-nexthop
 neighbor 2001:db8:1:12b:: remote-as 65024
 neighbor 2001:db8:1:12b:: capability extended-nexthop
 neighbor 2001:db8:1:18c:: remote-as 65032
 neighbor 2001:db8:1:18c:: capability extended-nexthop
 neighbor 2001:db8:1:271:: remote-as 65053
 neighbor 2001:db8:1:271:: capability extended-nexthop
 neighbor 2001:db8:1:2c1:: remote-as 65061
 neighbor 2001:db8:1:2c1:: capability extended-nexthop
 neighbor 2001:db8:1:301:: remote-as 65069
 neighbor 2001:db8:1:301:: capability extended-nexthop
 neighbor 2001:db8:1:3a6:: remote-as 65090
 neighbor 2001:db8:1:3a6:: capability extended-nexthop
 neighbor 2001:db8:1:3d5:: remote-as 65098
 neighbor 2001:db8:1:3d5:: capability extended-nexthop
 neighbor 2001:db8:1:40e:: remote-as 65106
 neighbor 2001:db8:1:40e:: capability extended-nexthop
