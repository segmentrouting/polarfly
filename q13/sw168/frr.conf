 neighbor 2001:db8:1:47d:: capability extended-nexthop
 neighbor 2001:db8:1:4a5:: remote-as 65135
 neighbor 2001:db8:1:4a5:: capability extended-nexthop
 neighbor 2001:db8:1:4de:: remote-as 65156
 neighbor 2001:db8:1:4de:: capability extended-nexthop
 neighbor 2001:db8:1:4eb:: remote-as 65164
 neighbor 2001:db8:1:4eb:: capability extended-nexthop
 neighbor 2001:db8:1:4f1::1 remote-as 65172
 neighbor 2001:db8:1:4f1::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:10a8::/48
  network fc00:0:10a8::1/128
  neighbor 2001:db8:1:85:: activate
  neighbor 2001:db8:1:85:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:12b:: activate
  neighbor 2001:db8:1:12b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:18c:: activate
  neighbor 2001:db8:1:18c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:271:: activate
  neighbor 2001:db8:1:271:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2c1:: activate
  neighbor 2001:db8:1:2c1:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:301:: activate
  neighbor 2001:db8:1:301:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3a6:: activate
  neighbor 2001:db8:1:3a6:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3d5:: activate
  neighbor 2001:db8:1:3d5:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:40e:: activate
  neighbor 2001:db8:1:40e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:47d:: activate
  neighbor 2001:db8:1:47d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:4a5:: activate
  neighbor 2001:db8:1:4a5:: route-map BGP-IPV6 in
