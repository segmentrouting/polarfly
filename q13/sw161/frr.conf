 neighbor 2001:db8:1:4e6::1 capability extended-nexthop
 neighbor 2001:db8:1:4e7::1 remote-as 65183
 neighbor 2001:db8:1:4e7::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:10a1::/48
  network fc00:0:10a1::1/128
  neighbor 2001:db8:1:5d:: activate
  neighbor 2001:db8:1:5d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:ed:: activate
  neighbor 2001:db8:1:ed:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1c5:: activate
  neighbor 2001:db8:1:1c5:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1fe:: activate
