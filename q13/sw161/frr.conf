hostname sw161
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.161
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:10a1::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65161
 bgp router-id 1.1.0.161
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:5d:: remote-as 65007
 neighbor 2001:db8:1:5d:: capability extended-nexthop
 neighbor 2001:db8:1:ed:: remote-as 65019
 neighbor 2001:db8:1:ed:: capability extended-nexthop
 neighbor 2001:db8:1:1c5:: remote-as 65037
 neighbor 2001:db8:1:1c5:: capability extended-nexthop
 neighbor 2001:db8:1:1fe:: remote-as 65042
 neighbor 2001:db8:1:1fe:: capability extended-nexthop
 neighbor 2001:db8:1:2b8:: remote-as 65060
 neighbor 2001:db8:1:2b8:: capability extended-nexthop
 neighbor 2001:db8:1:34c:: remote-as 65078
 neighbor 2001:db8:1:34c:: capability extended-nexthop
 neighbor 2001:db8:1:375:: remote-as 65083
 neighbor 2001:db8:1:375:: capability extended-nexthop
 neighbor 2001:db8:1:3e9:: remote-as 65101
 neighbor 2001:db8:1:3e9:: capability extended-nexthop
