 srv6
  encapsulation
   source-address fc00:0:10a1::1
  exit
  locators
   locator MAIN
    prefix fc00:0:10a1::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
