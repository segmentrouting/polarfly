  neighbor 2001:db8:1:2b8:: activate
  neighbor 2001:db8:1:2b8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:34c:: activate
  neighbor 2001:db8:1:34c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:375:: activate
  neighbor 2001:db8:1:375:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3e9:: activate
  neighbor 2001:db8:1:3e9:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:407:: activate
