hostname sw150
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.150
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1096::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65150
 bgp router-id 1.1.0.150
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:ac:: remote-as 65013
 neighbor 2001:db8:1:ac:: capability extended-nexthop
 neighbor 2001:db8:1:f8:: remote-as 65020
 neighbor 2001:db8:1:f8:: capability extended-nexthop
 neighbor 2001:db8:1:17f:: remote-as 65031
 neighbor 2001:db8:1:17f:: capability extended-nexthop
 neighbor 2001:db8:1:1fd:: remote-as 65042
 neighbor 2001:db8:1:1fd:: capability extended-nexthop
 neighbor 2001:db8:1:2ee:: remote-as 65066
 neighbor 2001:db8:1:2ee:: capability extended-nexthop
 neighbor 2001:db8:1:343:: remote-as 65077
 neighbor 2001:db8:1:343:: capability extended-nexthop
 neighbor 2001:db8:1:397:: remote-as 65088
 neighbor 2001:db8:1:397:: capability extended-nexthop
