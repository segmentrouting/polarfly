  network fc00:0:1096::/48
  network fc00:0:1096::1/128
  neighbor 2001:db8:1:ac:: activate
  neighbor 2001:db8:1:ac:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:f8:: activate
  neighbor 2001:db8:1:f8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:17f:: activate
  neighbor 2001:db8:1:17f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1fd:: activate
