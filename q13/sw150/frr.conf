  neighbor 2001:db8:1:343:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:397:: activate
  neighbor 2001:db8:1:397:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3db:: activate
  neighbor 2001:db8:1:3db:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:425:: activate
