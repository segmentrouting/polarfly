hostname sw011
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.11
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:100b::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65011
 bgp router-id 1.1.0.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:87::1 remote-as 65012
 neighbor 2001:db8:1:87::1 capability extended-nexthop
 neighbor 2001:db8:1:88::1 remote-as 65015
 neighbor 2001:db8:1:88::1 capability extended-nexthop
 neighbor 2001:db8:1:89::1 remote-as 65038
 neighbor 2001:db8:1:89::1 capability extended-nexthop
 neighbor 2001:db8:1:8a::1 remote-as 65048
 neighbor 2001:db8:1:8a::1 capability extended-nexthop
 neighbor 2001:db8:1:8b::1 remote-as 65058
 neighbor 2001:db8:1:8b::1 capability extended-nexthop
 neighbor 2001:db8:1:8c::1 remote-as 65068
 neighbor 2001:db8:1:8c::1 capability extended-nexthop
 neighbor 2001:db8:1:8d::1 remote-as 65091
 neighbor 2001:db8:1:8d::1 capability extended-nexthop
 neighbor 2001:db8:1:8e::1 remote-as 65101
 neighbor 2001:db8:1:8e::1 capability extended-nexthop
 neighbor 2001:db8:1:8f::1 remote-as 65111
 neighbor 2001:db8:1:8f::1 capability extended-nexthop
 neighbor 2001:db8:1:90::1 remote-as 65121
 neighbor 2001:db8:1:90::1 capability extended-nexthop
 neighbor 2001:db8:1:91::1 remote-as 65144
 neighbor 2001:db8:1:91::1 capability extended-nexthop
 neighbor 2001:db8:1:92::1 remote-as 65154
 neighbor 2001:db8:1:92::1 capability extended-nexthop
 neighbor 2001:db8:1:93::1 remote-as 65164
 neighbor 2001:db8:1:93::1 capability extended-nexthop
 neighbor 2001:db8:1:94::1 remote-as 65174
 neighbor 2001:db8:1:94::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:100b::/48
  network fc00:0:100b::1/128
  neighbor 2001:db8:1:87::1 activate
  neighbor 2001:db8:1:87::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:88::1 activate
  neighbor 2001:db8:1:88::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:89::1 activate
  neighbor 2001:db8:1:89::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:8a::1 activate
  neighbor 2001:db8:1:8a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:8b::1 activate
  neighbor 2001:db8:1:8b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:8c::1 activate
  neighbor 2001:db8:1:8c::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:8d::1 activate
  neighbor 2001:db8:1:8d::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:8e::1 activate
  neighbor 2001:db8:1:8e::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:8f::1 activate
  neighbor 2001:db8:1:8f::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:90::1 activate
  neighbor 2001:db8:1:90::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:91::1 activate
  neighbor 2001:db8:1:91::1 route-map BGP-IPV6 in
