hostname sw004
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.4
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1004::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65004
 bgp router-id 1.1.0.4
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:29::1 remote-as 65008
 neighbor 2001:db8:1:29::1 capability extended-nexthop
 neighbor 2001:db8:1:2a::1 remote-as 65015
 neighbor 2001:db8:1:2a::1 capability extended-nexthop
 neighbor 2001:db8:1:2b::1 remote-as 65034
 neighbor 2001:db8:1:2b::1 capability extended-nexthop
 neighbor 2001:db8:1:2c::1 remote-as 65053
 neighbor 2001:db8:1:2c::1 capability extended-nexthop
 neighbor 2001:db8:1:2d::1 remote-as 65059
 neighbor 2001:db8:1:2d::1 capability extended-nexthop
 neighbor 2001:db8:1:2e::1 remote-as 65078
 neighbor 2001:db8:1:2e::1 capability extended-nexthop
 neighbor 2001:db8:1:2f::1 remote-as 65084
 neighbor 2001:db8:1:2f::1 capability extended-nexthop
 neighbor 2001:db8:1:30::1 remote-as 65103
 neighbor 2001:db8:1:30::1 capability extended-nexthop
 neighbor 2001:db8:1:31::1 remote-as 65109
 neighbor 2001:db8:1:31::1 capability extended-nexthop
 neighbor 2001:db8:1:32::1 remote-as 65128
 neighbor 2001:db8:1:32::1 capability extended-nexthop
 neighbor 2001:db8:1:33::1 remote-as 65134
 neighbor 2001:db8:1:33::1 capability extended-nexthop
 neighbor 2001:db8:1:34::1 remote-as 65153
 neighbor 2001:db8:1:34::1 capability extended-nexthop
 neighbor 2001:db8:1:35::1 remote-as 65159
 neighbor 2001:db8:1:35::1 capability extended-nexthop
 neighbor 2001:db8:1:36::1 remote-as 65178
 neighbor 2001:db8:1:36::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1004::/48
  network fc00:0:1004::1/128
  neighbor 2001:db8:1:29::1 activate
  neighbor 2001:db8:1:29::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2a::1 activate
  neighbor 2001:db8:1:2a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2b::1 activate
  neighbor 2001:db8:1:2b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2c::1 activate
  neighbor 2001:db8:1:2c::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2d::1 activate
  neighbor 2001:db8:1:2d::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2e::1 activate
  neighbor 2001:db8:1:2e::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:2f::1 activate
  neighbor 2001:db8:1:2f::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:30::1 activate
  neighbor 2001:db8:1:30::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:31::1 activate
  neighbor 2001:db8:1:31::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:32::1 activate
  neighbor 2001:db8:1:32::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:33::1 activate
  neighbor 2001:db8:1:33::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:34::1 activate
