  network fc00:0:10a0::/48
  network fc00:0:10a0::1/128
  neighbor 2001:db8:1:27:: activate
  neighbor 2001:db8:1:27:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:105:: activate
  neighbor 2001:db8:1:105:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1af:: activate
