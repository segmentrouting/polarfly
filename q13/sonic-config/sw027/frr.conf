  network fc00:0:101b::/48
  network fc00:0:101b::1/128
  neighbor 2001:db8:1:1a:: activate
  neighbor 2001:db8:1:1a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:bc:: activate
  neighbor 2001:db8:1:bc:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:145::1 activate
