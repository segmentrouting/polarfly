 neighbor 2001:db8:1:37c::1 remote-as 65170
 neighbor 2001:db8:1:37c::1 capability extended-nexthop
 neighbor 2001:db8:1:37d::1 remote-as 65172
 neighbor 2001:db8:1:37d::1 capability extended-nexthop
 !
