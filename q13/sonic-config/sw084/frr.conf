  network fc00:0:1054::/48
  network fc00:0:1054::1/128
  neighbor 2001:db8:1:2f:: activate
  neighbor 2001:db8:1:2f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:db:: activate
  neighbor 2001:db8:1:db:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:192:: activate
  neighbor 2001:db8:1:192:: route-map BGP-IPV6 in
