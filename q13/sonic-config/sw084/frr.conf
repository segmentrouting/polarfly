  neighbor 2001:db8:1:238:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2cd:: activate
  neighbor 2001:db8:1:2cd:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:346:: activate
  neighbor 2001:db8:1:346:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:359:: activate
  neighbor 2001:db8:1:359:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:377::1 activate
  neighbor 2001:db8:1:377::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:378::1 activate
  neighbor 2001:db8:1:378::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:379::1 activate
  neighbor 2001:db8:1:379::1 route-map BGP-IPV6 in
