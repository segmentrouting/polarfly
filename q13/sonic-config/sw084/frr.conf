hostname sw084
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.84
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1054::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65084
 bgp router-id 1.1.0.84
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:2f:: remote-as 65004
 neighbor 2001:db8:1:2f:: capability extended-nexthop
 neighbor 2001:db8:1:db:: remote-as 65018
 neighbor 2001:db8:1:db:: capability extended-nexthop
 neighbor 2001:db8:1:192:: remote-as 65033
 neighbor 2001:db8:1:192:: capability extended-nexthop
 neighbor 2001:db8:1:238:: remote-as 65048
 neighbor 2001:db8:1:238:: capability extended-nexthop
 neighbor 2001:db8:1:2cd:: remote-as 65063
 neighbor 2001:db8:1:2cd:: capability extended-nexthop
 neighbor 2001:db8:1:346:: remote-as 65078
 neighbor 2001:db8:1:346:: capability extended-nexthop
 neighbor 2001:db8:1:359:: remote-as 65080
 neighbor 2001:db8:1:359:: capability extended-nexthop
 neighbor 2001:db8:1:377::1 remote-as 65095
 neighbor 2001:db8:1:377::1 capability extended-nexthop
