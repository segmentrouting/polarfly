hostname sw120
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.120
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1078::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65120
 bgp router-id 1.1.0.120
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:5a:: remote-as 65007
 neighbor 2001:db8:1:5a:: capability extended-nexthop
 neighbor 2001:db8:1:14c:: remote-as 65027
 neighbor 2001:db8:1:14c:: capability extended-nexthop
 neighbor 2001:db8:1:189:: remote-as 65032
 neighbor 2001:db8:1:189:: capability extended-nexthop
 neighbor 2001:db8:1:250:: remote-as 65050
 neighbor 2001:db8:1:250:: capability extended-nexthop
 neighbor 2001:db8:1:285:: remote-as 65055
 neighbor 2001:db8:1:285:: capability extended-nexthop
 neighbor 2001:db8:1:321:: remote-as 65073
 neighbor 2001:db8:1:321:: capability extended-nexthop
 neighbor 2001:db8:1:3aa:: remote-as 65091
 neighbor 2001:db8:1:3aa:: capability extended-nexthop
 neighbor 2001:db8:1:3c5:: remote-as 65096
 neighbor 2001:db8:1:3c5:: capability extended-nexthop
 neighbor 2001:db8:1:439:: remote-as 65114
 neighbor 2001:db8:1:439:: capability extended-nexthop
