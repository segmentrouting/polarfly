 neighbor 2001:db8:1:453:: capability extended-nexthop
 neighbor 2001:db8:1:45f::1 remote-as 65137
 neighbor 2001:db8:1:45f::1 capability extended-nexthop
 neighbor 2001:db8:1:460::1 remote-as 65155
 neighbor 2001:db8:1:460::1 capability extended-nexthop
 neighbor 2001:db8:1:461::1 remote-as 65160
 neighbor 2001:db8:1:461::1 capability extended-nexthop
 neighbor 2001:db8:1:462::1 remote-as 65178
 neighbor 2001:db8:1:462::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1078::/48
  network fc00:0:1078::1/128
  neighbor 2001:db8:1:5a:: activate
  neighbor 2001:db8:1:5a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:14c:: activate
  neighbor 2001:db8:1:14c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:189:: activate
  neighbor 2001:db8:1:189:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:250:: activate
  neighbor 2001:db8:1:250:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:285:: activate
  neighbor 2001:db8:1:285:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:321:: activate
  neighbor 2001:db8:1:321:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3aa:: activate
  neighbor 2001:db8:1:3aa:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3c5:: activate
  neighbor 2001:db8:1:3c5:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:439:: activate
  neighbor 2001:db8:1:439:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:453:: activate
  neighbor 2001:db8:1:453:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:45f::1 activate
  neighbor 2001:db8:1:45f::1 route-map BGP-IPV6 in
