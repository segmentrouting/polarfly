  static-sids
   sid fc00:0:1035::/48 locator MAIN behavior uN
   sid fc00:0:1035:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:2c::
