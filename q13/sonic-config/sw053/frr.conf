hostname sw053
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.53
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1035::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65053
 bgp router-id 1.1.0.53
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:2c:: remote-as 65004
 neighbor 2001:db8:1:2c:: capability extended-nexthop
 neighbor 2001:db8:1:be:: remote-as 65016
 neighbor 2001:db8:1:be:: capability extended-nexthop
 neighbor 2001:db8:1:177:: remote-as 65031
 neighbor 2001:db8:1:177:: capability extended-nexthop
 neighbor 2001:db8:1:220:: remote-as 65046
 neighbor 2001:db8:1:220:: capability extended-nexthop
 neighbor 2001:db8:1:269::1 remote-as 65061
 neighbor 2001:db8:1:269::1 capability extended-nexthop
 neighbor 2001:db8:1:26a::1 remote-as 65076
 neighbor 2001:db8:1:26a::1 capability extended-nexthop
 neighbor 2001:db8:1:26b::1 remote-as 65091
 neighbor 2001:db8:1:26b::1 capability extended-nexthop
 neighbor 2001:db8:1:26c::1 remote-as 65093
 neighbor 2001:db8:1:26c::1 capability extended-nexthop
 neighbor 2001:db8:1:26d::1 remote-as 65108
