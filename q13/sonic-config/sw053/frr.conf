 neighbor 2001:db8:1:26e::1 capability extended-nexthop
 neighbor 2001:db8:1:26f::1 remote-as 65138
 neighbor 2001:db8:1:26f::1 capability extended-nexthop
 neighbor 2001:db8:1:270::1 remote-as 65153
 neighbor 2001:db8:1:270::1 capability extended-nexthop
 neighbor 2001:db8:1:271::1 remote-as 65168
 neighbor 2001:db8:1:271::1 capability extended-nexthop
 neighbor 2001:db8:1:272::1 remote-as 65183
 neighbor 2001:db8:1:272::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1035::/48
  network fc00:0:1035::1/128
  neighbor 2001:db8:1:2c:: activate
  neighbor 2001:db8:1:2c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:be:: activate
  neighbor 2001:db8:1:be:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:177:: activate
  neighbor 2001:db8:1:177:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:220:: activate
  neighbor 2001:db8:1:220:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:269::1 activate
  neighbor 2001:db8:1:269::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:26a::1 activate
  neighbor 2001:db8:1:26a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:26b::1 activate
  neighbor 2001:db8:1:26b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:26c::1 activate
  neighbor 2001:db8:1:26c::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:26d::1 activate
  neighbor 2001:db8:1:26d::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:26e::1 activate
  neighbor 2001:db8:1:26e::1 route-map BGP-IPV6 in
