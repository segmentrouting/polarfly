hostname sw170
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.170
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:10aa::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65170
 bgp router-id 1.1.0.170
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:ad:: remote-as 65013
 neighbor 2001:db8:1:ad:: capability extended-nexthop
 neighbor 2001:db8:1:c7:: remote-as 65016
 neighbor 2001:db8:1:c7:: capability extended-nexthop
 neighbor 2001:db8:1:1e6:: remote-as 65040
 neighbor 2001:db8:1:1e6:: capability extended-nexthop
