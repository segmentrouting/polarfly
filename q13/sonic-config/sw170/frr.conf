  network fc00:0:10aa::/48
  network fc00:0:10aa::1/128
  neighbor 2001:db8:1:ad:: activate
  neighbor 2001:db8:1:ad:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c7:: activate
  neighbor 2001:db8:1:c7:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1e6:: activate
