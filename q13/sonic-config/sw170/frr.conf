 neighbor 2001:db8:1:25d:: capability extended-nexthop
 neighbor 2001:db8:1:2ca:: remote-as 65062
 neighbor 2001:db8:1:2ca:: capability extended-nexthop
 neighbor 2001:db8:1:324:: remote-as 65073
 neighbor 2001:db8:1:324:: capability extended-nexthop
 neighbor 2001:db8:1:37c:: remote-as 65084
 neighbor 2001:db8:1:37c:: capability extended-nexthop
