hostname sw119
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.119
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1077::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65119
 bgp router-id 1.1.0.119
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:9:: remote-as 65001
 neighbor 2001:db8:1:9:: capability extended-nexthop
 neighbor 2001:db8:1:453::1 remote-as 65120
 neighbor 2001:db8:1:453::1 capability extended-nexthop
 neighbor 2001:db8:1:454::1 remote-as 65121
 neighbor 2001:db8:1:454::1 capability extended-nexthop
 neighbor 2001:db8:1:455::1 remote-as 65122
 neighbor 2001:db8:1:455::1 capability extended-nexthop
 neighbor 2001:db8:1:456::1 remote-as 65123
 neighbor 2001:db8:1:456::1 capability extended-nexthop
 neighbor 2001:db8:1:457::1 remote-as 65124
 neighbor 2001:db8:1:457::1 capability extended-nexthop
