 neighbor 2001:db8:1:45b::1 remote-as 65128
 neighbor 2001:db8:1:45b::1 capability extended-nexthop
 neighbor 2001:db8:1:45c::1 remote-as 65129
 neighbor 2001:db8:1:45c::1 capability extended-nexthop
 neighbor 2001:db8:1:45d::1 remote-as 65130
 neighbor 2001:db8:1:45d::1 capability extended-nexthop
 neighbor 2001:db8:1:45e::1 remote-as 65131
 neighbor 2001:db8:1:45e::1 capability extended-nexthop
