  network fc00:0:1077::/48
  network fc00:0:1077::1/128
  neighbor 2001:db8:1:9:: activate
  neighbor 2001:db8:1:9:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:453::1 activate
  neighbor 2001:db8:1:453::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:454::1 activate
  neighbor 2001:db8:1:454::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:455::1 activate
  neighbor 2001:db8:1:455::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:456::1 activate
  neighbor 2001:db8:1:456::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:457::1 activate
  neighbor 2001:db8:1:457::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:458::1 activate
  neighbor 2001:db8:1:458::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:459::1 activate
  neighbor 2001:db8:1:459::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:45a::1 activate
  neighbor 2001:db8:1:45a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:45b::1 activate
  neighbor 2001:db8:1:45b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:45c::1 activate
