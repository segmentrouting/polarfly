hostname sw082
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.82
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1052::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65082
 bgp router-id 1.1.0.82
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:4a:: remote-as 65006
 neighbor 2001:db8:1:4a:: capability extended-nexthop
 neighbor 2001:db8:1:ff:: remote-as 65021
 neighbor 2001:db8:1:ff:: capability extended-nexthop
 neighbor 2001:db8:1:1ca:: remote-as 65038
 neighbor 2001:db8:1:1ca:: capability extended-nexthop
 neighbor 2001:db8:1:1f8:: remote-as 65042
 neighbor 2001:db8:1:1f8:: capability extended-nexthop
 neighbor 2001:db8:1:2a8:: remote-as 65059
 neighbor 2001:db8:1:2a8:: capability extended-nexthop
 neighbor 2001:db8:1:336:: remote-as 65076
 neighbor 2001:db8:1:336:: capability extended-nexthop
 neighbor 2001:db8:1:357:: remote-as 65080
 neighbor 2001:db8:1:357:: capability extended-nexthop
 neighbor 2001:db8:1:369::1 remote-as 65097
 neighbor 2001:db8:1:369::1 capability extended-nexthop
 neighbor 2001:db8:1:36a::1 remote-as 65114
 neighbor 2001:db8:1:36a::1 capability extended-nexthop
 neighbor 2001:db8:1:36b::1 remote-as 65131
 neighbor 2001:db8:1:36b::1 capability extended-nexthop
 neighbor 2001:db8:1:36c::1 remote-as 65135
 neighbor 2001:db8:1:36c::1 capability extended-nexthop
 neighbor 2001:db8:1:36d::1 remote-as 65152
 neighbor 2001:db8:1:36d::1 capability extended-nexthop
 neighbor 2001:db8:1:36e::1 remote-as 65169
 neighbor 2001:db8:1:36e::1 capability extended-nexthop
 neighbor 2001:db8:1:36f::1 remote-as 65173
 neighbor 2001:db8:1:36f::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1052::/48
  network fc00:0:1052::1/128
  neighbor 2001:db8:1:4a:: activate
  neighbor 2001:db8:1:4a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:ff:: activate
  neighbor 2001:db8:1:ff:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1ca:: activate
  neighbor 2001:db8:1:1ca:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1f8:: activate
  neighbor 2001:db8:1:1f8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2a8:: activate
  neighbor 2001:db8:1:2a8:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:336:: activate
  neighbor 2001:db8:1:336:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:357:: activate
  neighbor 2001:db8:1:357:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:369::1 activate
  neighbor 2001:db8:1:369::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:36a::1 activate
  neighbor 2001:db8:1:36a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:36b::1 activate
  neighbor 2001:db8:1:36b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:36c::1 activate
  neighbor 2001:db8:1:36c::1 route-map BGP-IPV6 in
