   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:357::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:369::1
   sid fc00:0:f008::/48 locator MAIN behavior uA interface Ethernet32 nexthop 2001:db8:1:36a::1
   sid fc00:0:f009::/48 locator MAIN behavior uA interface Ethernet36 nexthop 2001:db8:1:36b::1
   sid fc00:0:f00a::/48 locator MAIN behavior uA interface Ethernet40 nexthop 2001:db8:1:36c::1
   sid fc00:0:f00b::/48 locator MAIN behavior uA interface Ethernet44 nexthop 2001:db8:1:36d::1
   sid fc00:0:f00c::/48 locator MAIN behavior uA interface Ethernet48 nexthop 2001:db8:1:36e::1
   sid fc00:0:f00d::/48 locator MAIN behavior uA interface Ethernet52 nexthop 2001:db8:1:36f::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:1052::1
  exit
  locators
   locator MAIN
    prefix fc00:0:1052::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
