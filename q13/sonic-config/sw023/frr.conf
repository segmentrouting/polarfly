hostname sw023
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.23
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1017::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65023
 bgp router-id 1.1.0.23
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:16:: remote-as 65002
 neighbor 2001:db8:1:16:: capability extended-nexthop
 neighbor 2001:db8:1:114::1 remote-as 65036
 neighbor 2001:db8:1:114::1 capability extended-nexthop
 neighbor 2001:db8:1:115::1 remote-as 65049
 neighbor 2001:db8:1:115::1 capability extended-nexthop
 neighbor 2001:db8:1:116::1 remote-as 65062
 neighbor 2001:db8:1:116::1 capability extended-nexthop
 neighbor 2001:db8:1:117::1 remote-as 65075
 neighbor 2001:db8:1:117::1 capability extended-nexthop
 neighbor 2001:db8:1:118::1 remote-as 65088
 neighbor 2001:db8:1:118::1 capability extended-nexthop
 neighbor 2001:db8:1:119::1 remote-as 65101
 neighbor 2001:db8:1:119::1 capability extended-nexthop
 neighbor 2001:db8:1:11a::1 remote-as 65114
 neighbor 2001:db8:1:11a::1 capability extended-nexthop
 neighbor 2001:db8:1:11b::1 remote-as 65127
 neighbor 2001:db8:1:11b::1 capability extended-nexthop
 neighbor 2001:db8:1:11c::1 remote-as 65140
 neighbor 2001:db8:1:11c::1 capability extended-nexthop
 neighbor 2001:db8:1:11d::1 remote-as 65153
 neighbor 2001:db8:1:11d::1 capability extended-nexthop
 neighbor 2001:db8:1:11e::1 remote-as 65166
 neighbor 2001:db8:1:11e::1 capability extended-nexthop
 neighbor 2001:db8:1:11f::1 remote-as 65179
 neighbor 2001:db8:1:11f::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:1017::/48
  network fc00:0:1017::1/128
  neighbor 2001:db8:1:16:: activate
  neighbor 2001:db8:1:16:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:114::1 activate
  neighbor 2001:db8:1:114::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:115::1 activate
  neighbor 2001:db8:1:115::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:116::1 activate
  neighbor 2001:db8:1:116::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:117::1 activate
  neighbor 2001:db8:1:117::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:118::1 activate
  neighbor 2001:db8:1:118::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:119::1 activate
  neighbor 2001:db8:1:119::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:11a::1 activate
  neighbor 2001:db8:1:11a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:11b::1 activate
  neighbor 2001:db8:1:11b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:11c::1 activate
  neighbor 2001:db8:1:11c::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:11d::1 activate
  neighbor 2001:db8:1:11d::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:11e::1 activate
