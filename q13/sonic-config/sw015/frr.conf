hostname sw015
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.15
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:100f::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65015
 bgp router-id 1.1.0.15
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:1:: remote-as 65001
 neighbor 2001:db8:1:1:: capability extended-nexthop
 neighbor 2001:db8:1:e:: remote-as 65002
 neighbor 2001:db8:1:e:: capability extended-nexthop
 neighbor 2001:db8:1:1c:: remote-as 65003
 neighbor 2001:db8:1:1c:: capability extended-nexthop
 neighbor 2001:db8:1:2a:: remote-as 65004
 neighbor 2001:db8:1:2a:: capability extended-nexthop
 neighbor 2001:db8:1:38:: remote-as 65005
 neighbor 2001:db8:1:38:: capability extended-nexthop
 neighbor 2001:db8:1:45:: remote-as 65006
 neighbor 2001:db8:1:45:: capability extended-nexthop
 neighbor 2001:db8:1:52:: remote-as 65007
 neighbor 2001:db8:1:52:: capability extended-nexthop
 neighbor 2001:db8:1:5f:: remote-as 65008
 neighbor 2001:db8:1:5f:: capability extended-nexthop
 neighbor 2001:db8:1:6d:: remote-as 65009
 neighbor 2001:db8:1:6d:: capability extended-nexthop
 neighbor 2001:db8:1:7a:: remote-as 65010
 neighbor 2001:db8:1:7a:: capability extended-nexthop
 neighbor 2001:db8:1:88:: remote-as 65011
 neighbor 2001:db8:1:88:: capability extended-nexthop
 neighbor 2001:db8:1:95:: remote-as 65012
 neighbor 2001:db8:1:95:: capability extended-nexthop
 neighbor 2001:db8:1:a2:: remote-as 65013
 neighbor 2001:db8:1:a2:: capability extended-nexthop
 neighbor 2001:db8:1:af:: remote-as 65014
 neighbor 2001:db8:1:af:: capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:100f::/48
  network fc00:0:100f::1/128
  neighbor 2001:db8:1:1:: activate
  neighbor 2001:db8:1:1:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:e:: activate
  neighbor 2001:db8:1:e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1c:: activate
  neighbor 2001:db8:1:1c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2a:: activate
  neighbor 2001:db8:1:2a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:38:: activate
  neighbor 2001:db8:1:38:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:45:: activate
  neighbor 2001:db8:1:45:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:52:: activate
  neighbor 2001:db8:1:52:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:5f:: activate
  neighbor 2001:db8:1:5f:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:6d:: activate
  neighbor 2001:db8:1:6d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:7a:: activate
  neighbor 2001:db8:1:7a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:88:: activate
  neighbor 2001:db8:1:88:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:95:: activate
  neighbor 2001:db8:1:95:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:a2:: activate
  neighbor 2001:db8:1:a2:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:af:: activate
  neighbor 2001:db8:1:af:: route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:100f::/48 locator MAIN behavior uN
   sid fc00:0:100f:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:1::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:e::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:1c::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:2a::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:38::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:45::
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:52::
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:5f::
   sid fc00:0:f008::/48 locator MAIN behavior uA interface Ethernet32 nexthop 2001:db8:1:6d::
   sid fc00:0:f009::/48 locator MAIN behavior uA interface Ethernet36 nexthop 2001:db8:1:7a::
   sid fc00:0:f00a::/48 locator MAIN behavior uA interface Ethernet40 nexthop 2001:db8:1:88::
   sid fc00:0:f00b::/48 locator MAIN behavior uA interface Ethernet44 nexthop 2001:db8:1:95::
   sid fc00:0:f00c::/48 locator MAIN behavior uA interface Ethernet48 nexthop 2001:db8:1:a2::
   sid fc00:0:f00d::/48 locator MAIN behavior uA interface Ethernet52 nexthop 2001:db8:1:af::
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:100f::1
  exit
  locators
   locator MAIN
    prefix fc00:0:100f::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
