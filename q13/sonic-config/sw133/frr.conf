hostname sw133
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.133
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1085::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65133
 bgp router-id 1.1.0.133
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:4e:: remote-as 65006
 neighbor 2001:db8:1:4e:: capability extended-nexthop
 neighbor 2001:db8:1:14d:: remote-as 65027
 neighbor 2001:db8:1:14d:: capability extended-nexthop
 neighbor 2001:db8:1:17e:: remote-as 65031
 neighbor 2001:db8:1:17e:: capability extended-nexthop
 neighbor 2001:db8:1:23c:: remote-as 65048
 neighbor 2001:db8:1:23c:: capability extended-nexthop
 neighbor 2001:db8:1:2e4:: remote-as 65065
 neighbor 2001:db8:1:2e4:: capability extended-nexthop
 neighbor 2001:db8:1:2ff:: remote-as 65069
 neighbor 2001:db8:1:2ff:: capability extended-nexthop
 neighbor 2001:db8:1:388:: remote-as 65086
 neighbor 2001:db8:1:388:: capability extended-nexthop
 neighbor 2001:db8:1:3f3:: remote-as 65103
 neighbor 2001:db8:1:3f3:: capability extended-nexthop
