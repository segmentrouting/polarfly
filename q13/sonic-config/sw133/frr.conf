  network fc00:0:1085::/48
  network fc00:0:1085::1/128
  neighbor 2001:db8:1:4e:: activate
  neighbor 2001:db8:1:4e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:14d:: activate
  neighbor 2001:db8:1:14d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:17e:: activate
