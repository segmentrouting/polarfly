hostname sw135
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.135
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1087::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65135
 bgp router-id 1.1.0.135
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:9e:: remote-as 65012
 neighbor 2001:db8:1:9e:: capability extended-nexthop
 neighbor 2001:db8:1:eb:: remote-as 65019
 neighbor 2001:db8:1:eb:: capability extended-nexthop
 neighbor 2001:db8:1:166:: remote-as 65029
 neighbor 2001:db8:1:166:: capability extended-nexthop
