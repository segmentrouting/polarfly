hostname sw077
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.77
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:104d::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65077
 bgp router-id 1.1.0.77
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:99:: remote-as 65012
 neighbor 2001:db8:1:99:: capability extended-nexthop
 neighbor 2001:db8:1:124:: remote-as 65024
 neighbor 2001:db8:1:124:: capability extended-nexthop
 neighbor 2001:db8:1:19c:: remote-as 65034
 neighbor 2001:db8:1:19c:: capability extended-nexthop
 neighbor 2001:db8:1:20d:: remote-as 65044
 neighbor 2001:db8:1:20d:: capability extended-nexthop
 neighbor 2001:db8:1:27d:: remote-as 65054
 neighbor 2001:db8:1:27d:: capability extended-nexthop
 neighbor 2001:db8:1:33e::1 remote-as 65087
 neighbor 2001:db8:1:33e::1 capability extended-nexthop
 neighbor 2001:db8:1:33f::1 remote-as 65097
 neighbor 2001:db8:1:33f::1 capability extended-nexthop
 neighbor 2001:db8:1:340::1 remote-as 65107
 neighbor 2001:db8:1:340::1 capability extended-nexthop
 neighbor 2001:db8:1:341::1 remote-as 65130
 neighbor 2001:db8:1:341::1 capability extended-nexthop
 neighbor 2001:db8:1:342::1 remote-as 65140
 neighbor 2001:db8:1:342::1 capability extended-nexthop
 neighbor 2001:db8:1:343::1 remote-as 65150
 neighbor 2001:db8:1:343::1 capability extended-nexthop
 neighbor 2001:db8:1:344::1 remote-as 65160
 neighbor 2001:db8:1:344::1 capability extended-nexthop
 neighbor 2001:db8:1:345::1 remote-as 65183
 neighbor 2001:db8:1:345::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:104d::/48
  network fc00:0:104d::1/128
  neighbor 2001:db8:1:99:: activate
  neighbor 2001:db8:1:99:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:124:: activate
  neighbor 2001:db8:1:124:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:19c:: activate
  neighbor 2001:db8:1:19c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:20d:: activate
  neighbor 2001:db8:1:20d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:27d:: activate
  neighbor 2001:db8:1:27d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:33e::1 activate
  neighbor 2001:db8:1:33e::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:33f::1 activate
  neighbor 2001:db8:1:33f::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:340::1 activate
  neighbor 2001:db8:1:340::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:341::1 activate
  neighbor 2001:db8:1:341::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:342::1 activate
  neighbor 2001:db8:1:342::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:343::1 activate
  neighbor 2001:db8:1:343::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:344::1 activate
  neighbor 2001:db8:1:344::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:345::1 activate
  neighbor 2001:db8:1:345::1 route-map BGP-IPV6 in
  maximum-paths 64
 exit-address-family
exit
!
ip protocol bgp route-map RM_SET_SRC
!
ipv6 protocol bgp route-map RM_SET_SRC6
!
ip nht resolve-via-default
!
ipv6 nht resolve-via-default
!
segment-routing
 srv6
  static-sids
   sid fc00:0:104d::/48 locator MAIN behavior uN
   sid fc00:0:104d:e000::/64 locator MAIN behavior uDT6 vrf Vrf-tenant
   sid fc00:0:f000::/48 locator MAIN behavior uA interface Ethernet0 nexthop 2001:db8:1:99::
   sid fc00:0:f001::/48 locator MAIN behavior uA interface Ethernet4 nexthop 2001:db8:1:124::
   sid fc00:0:f002::/48 locator MAIN behavior uA interface Ethernet8 nexthop 2001:db8:1:19c::
   sid fc00:0:f003::/48 locator MAIN behavior uA interface Ethernet12 nexthop 2001:db8:1:20d::
   sid fc00:0:f004::/48 locator MAIN behavior uA interface Ethernet16 nexthop 2001:db8:1:27d::
   sid fc00:0:f005::/48 locator MAIN behavior uA interface Ethernet20 nexthop 2001:db8:1:33e::1
   sid fc00:0:f006::/48 locator MAIN behavior uA interface Ethernet24 nexthop 2001:db8:1:33f::1
   sid fc00:0:f007::/48 locator MAIN behavior uA interface Ethernet28 nexthop 2001:db8:1:340::1
   sid fc00:0:f008::/48 locator MAIN behavior uA interface Ethernet32 nexthop 2001:db8:1:341::1
   sid fc00:0:f009::/48 locator MAIN behavior uA interface Ethernet36 nexthop 2001:db8:1:342::1
   sid fc00:0:f00a::/48 locator MAIN behavior uA interface Ethernet40 nexthop 2001:db8:1:343::1
   sid fc00:0:f00b::/48 locator MAIN behavior uA interface Ethernet44 nexthop 2001:db8:1:344::1
   sid fc00:0:f00c::/48 locator MAIN behavior uA interface Ethernet48 nexthop 2001:db8:1:345::1
  exit
  !
 exit
 !
 srv6
  encapsulation
   source-address fc00:0:104d::1
  exit
  locators
   locator MAIN
    prefix fc00:0:104d::/48 block-len 32 node-len 16
    behavior usid
    format usid-f3216
   exit
   !
  exit
  !
  formats
   format usid-f3216
    local-id-block explicit start 57344 end 65535
   exit
   !
  exit
  !
 exit
 !
exit
!
end
