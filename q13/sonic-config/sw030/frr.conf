hostname sw030
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.30
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:101e::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65030
 bgp router-id 1.1.0.30
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:60:: remote-as 65008
 neighbor 2001:db8:1:60:: capability extended-nexthop
 neighbor 2001:db8:1:fb:: remote-as 65021
 neighbor 2001:db8:1:fb:: capability extended-nexthop
 neighbor 2001:db8:1:16a::1 remote-as 65040
 neighbor 2001:db8:1:16a::1 capability extended-nexthop
 neighbor 2001:db8:1:16b::1 remote-as 65046
 neighbor 2001:db8:1:16b::1 capability extended-nexthop
 neighbor 2001:db8:1:16c::1 remote-as 65065
 neighbor 2001:db8:1:16c::1 capability extended-nexthop
 neighbor 2001:db8:1:16d::1 remote-as 65071
 neighbor 2001:db8:1:16d::1 capability extended-nexthop
 neighbor 2001:db8:1:16e::1 remote-as 65090
 neighbor 2001:db8:1:16e::1 capability extended-nexthop
 neighbor 2001:db8:1:16f::1 remote-as 65096
 neighbor 2001:db8:1:16f::1 capability extended-nexthop
 neighbor 2001:db8:1:170::1 remote-as 65115
 neighbor 2001:db8:1:170::1 capability extended-nexthop
 neighbor 2001:db8:1:171::1 remote-as 65121
 neighbor 2001:db8:1:171::1 capability extended-nexthop
 neighbor 2001:db8:1:172::1 remote-as 65140
 neighbor 2001:db8:1:172::1 capability extended-nexthop
 neighbor 2001:db8:1:173::1 remote-as 65146
 neighbor 2001:db8:1:173::1 capability extended-nexthop
 neighbor 2001:db8:1:174::1 remote-as 65165
 neighbor 2001:db8:1:174::1 capability extended-nexthop
 neighbor 2001:db8:1:175::1 remote-as 65171
 neighbor 2001:db8:1:175::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:101e::/48
  network fc00:0:101e::1/128
  neighbor 2001:db8:1:60:: activate
  neighbor 2001:db8:1:60:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:fb:: activate
  neighbor 2001:db8:1:fb:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:16a::1 activate
  neighbor 2001:db8:1:16a::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:16b::1 activate
  neighbor 2001:db8:1:16b::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:16c::1 activate
  neighbor 2001:db8:1:16c::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:16d::1 activate
  neighbor 2001:db8:1:16d::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:16e::1 activate
  neighbor 2001:db8:1:16e::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:16f::1 activate
  neighbor 2001:db8:1:16f::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:170::1 activate
  neighbor 2001:db8:1:170::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:171::1 activate
  neighbor 2001:db8:1:171::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:172::1 activate
