hostname sw091
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.91
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:105b::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65091
 bgp router-id 1.1.0.91
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:8d:: remote-as 65011
 neighbor 2001:db8:1:8d:: capability extended-nexthop
 neighbor 2001:db8:1:10c:: remote-as 65022
 neighbor 2001:db8:1:10c:: capability extended-nexthop
 neighbor 2001:db8:1:17a:: remote-as 65031
 neighbor 2001:db8:1:17a:: capability extended-nexthop
 neighbor 2001:db8:1:26b:: remote-as 65053
 neighbor 2001:db8:1:26b:: capability extended-nexthop
 neighbor 2001:db8:1:2c4:: remote-as 65062
 neighbor 2001:db8:1:2c4:: capability extended-nexthop
 neighbor 2001:db8:1:30c:: remote-as 65071
 neighbor 2001:db8:1:30c:: capability extended-nexthop
 neighbor 2001:db8:1:360:: remote-as 65080
 neighbor 2001:db8:1:360:: capability extended-nexthop
 neighbor 2001:db8:1:3a8::1 remote-as 65102
 neighbor 2001:db8:1:3a8::1 capability extended-nexthop
 neighbor 2001:db8:1:3a9::1 remote-as 65111
 neighbor 2001:db8:1:3a9::1 capability extended-nexthop
 neighbor 2001:db8:1:3aa::1 remote-as 65120
 neighbor 2001:db8:1:3aa::1 capability extended-nexthop
 neighbor 2001:db8:1:3ab::1 remote-as 65142
 neighbor 2001:db8:1:3ab::1 capability extended-nexthop
 neighbor 2001:db8:1:3ac::1 remote-as 65151
 neighbor 2001:db8:1:3ac::1 capability extended-nexthop
 neighbor 2001:db8:1:3ad::1 remote-as 65160
 neighbor 2001:db8:1:3ad::1 capability extended-nexthop
 neighbor 2001:db8:1:3ae::1 remote-as 65182
 neighbor 2001:db8:1:3ae::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:105b::/48
  network fc00:0:105b::1/128
  neighbor 2001:db8:1:8d:: activate
  neighbor 2001:db8:1:8d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:10c:: activate
  neighbor 2001:db8:1:10c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:17a:: activate
  neighbor 2001:db8:1:17a:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:26b:: activate
  neighbor 2001:db8:1:26b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:2c4:: activate
  neighbor 2001:db8:1:2c4:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:30c:: activate
  neighbor 2001:db8:1:30c:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:360:: activate
  neighbor 2001:db8:1:360:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3a8::1 activate
  neighbor 2001:db8:1:3a8::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:3a9::1 activate
  neighbor 2001:db8:1:3a9::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:3aa::1 activate
  neighbor 2001:db8:1:3aa::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:3ab::1 activate
  neighbor 2001:db8:1:3ab::1 route-map BGP-IPV6 in
