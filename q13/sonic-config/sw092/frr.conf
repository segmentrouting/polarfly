hostname sw092
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.92
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:105c::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65092
 bgp router-id 1.1.0.92
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:57:: remote-as 65007
 neighbor 2001:db8:1:57:: capability extended-nexthop
 neighbor 2001:db8:1:c1:: remote-as 65016
 neighbor 2001:db8:1:c1:: capability extended-nexthop
 neighbor 2001:db8:1:19d:: remote-as 65034
 neighbor 2001:db8:1:19d:: capability extended-nexthop
 neighbor 2001:db8:1:261:: remote-as 65052
 neighbor 2001:db8:1:261:: capability extended-nexthop
 neighbor 2001:db8:1:295:: remote-as 65057
 neighbor 2001:db8:1:295:: capability extended-nexthop
 neighbor 2001:db8:1:32e:: remote-as 65075
 neighbor 2001:db8:1:32e:: capability extended-nexthop
 neighbor 2001:db8:1:361:: remote-as 65080
 neighbor 2001:db8:1:361:: capability extended-nexthop
 neighbor 2001:db8:1:3af::1 remote-as 65098
 neighbor 2001:db8:1:3af::1 capability extended-nexthop
 neighbor 2001:db8:1:3b0::1 remote-as 65116
