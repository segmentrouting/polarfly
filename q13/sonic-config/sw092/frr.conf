 neighbor 2001:db8:1:3b5::1 capability extended-nexthop
 !
 address-family ipv6 unicast
  network fc00:0:105c::/48
  network fc00:0:105c::1/128
  neighbor 2001:db8:1:57:: activate
  neighbor 2001:db8:1:57:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:c1:: activate
  neighbor 2001:db8:1:c1:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:19d:: activate
  neighbor 2001:db8:1:19d:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:261:: activate
  neighbor 2001:db8:1:261:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:295:: activate
  neighbor 2001:db8:1:295:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:32e:: activate
  neighbor 2001:db8:1:32e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:361:: activate
  neighbor 2001:db8:1:361:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:3af::1 activate
  neighbor 2001:db8:1:3af::1 route-map BGP-IPV6 in
  neighbor 2001:db8:1:3b0::1 activate
  neighbor 2001:db8:1:3b0::1 route-map BGP-IPV6 in
