hostname sw036
no service integrated-vtysh-config
!
route-map BGP-IPV6 permit 20
 set ipv6 next-hop prefer-global
exit
!
route-map RM_SET_SRC permit 10
 set src 1.1.0.36
exit
!
route-map RM_SET_SRC6 permit 10
 set src fc00:0:1024::1
exit
!
password zebra
enable password zebra
!
vrf Vrf-tenant
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
vrf vrfdefault
 ip nht resolve-via-default
 ipv6 nht resolve-via-default
exit-vrf
!
router bgp 65036
 bgp router-id 1.1.0.36
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 neighbor 2001:db8:1:7b:: remote-as 65010
 neighbor 2001:db8:1:7b:: capability extended-nexthop
 neighbor 2001:db8:1:114:: remote-as 65023
 neighbor 2001:db8:1:114:: capability extended-nexthop
 neighbor 2001:db8:1:176:: remote-as 65031
 neighbor 2001:db8:1:176:: capability extended-nexthop
