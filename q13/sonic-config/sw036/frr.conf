  network fc00:0:1024::/48
  network fc00:0:1024::1/128
  neighbor 2001:db8:1:7b:: activate
  neighbor 2001:db8:1:7b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:114:: activate
  neighbor 2001:db8:1:114:: route-map BGP-IPV6 in
