  network fc00:0:105f::/48
  network fc00:0:105f::1/128
  neighbor 2001:db8:1:9b:: activate
  neighbor 2001:db8:1:9b:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:100:: activate
  neighbor 2001:db8:1:100:: route-map BGP-IPV6 in
