 neighbor 2001:db8:1:9b:: capability extended-nexthop
 neighbor 2001:db8:1:100:: remote-as 65021
 neighbor 2001:db8:1:100:: capability extended-nexthop
 neighbor 2001:db8:1:17b:: remote-as 65031
