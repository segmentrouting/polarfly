  network fc00:0:105d::/48
  network fc00:0:105d::1/128
  neighbor 2001:db8:1:7:: activate
  neighbor 2001:db8:1:7:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1e8:: activate
