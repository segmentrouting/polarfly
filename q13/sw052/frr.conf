  network fc00:0:1034::/48
  network fc00:0:1034::1/128
  neighbor 2001:db8:1:1e:: activate
  neighbor 2001:db8:1:1e:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:109:: activate
  neighbor 2001:db8:1:109:: route-map BGP-IPV6 in
  neighbor 2001:db8:1:1b1:: activate
