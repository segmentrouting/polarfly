                                    : (isBw ? '#777777' : '#ef4444'),
                              }}>
                              {nb.dot}
                            </td>
                            <td
                              className="px-2 py-1 font-mono"
                              style={{ fontSize: 9 }}>
                              [{nb.cross.join(',')}]
                            </td>
                            <td
                              className="px-2 py-1 font-mono"
                              style={{ fontSize: 9 }}>
                              {nb.normCross
                                ? `[${nb.normCross.join(',')}]`
                                : '--'}
                            </td>
                            {/*
                              Same intra/inter colors as the SVG legend and link
                              strokes.
                            */}
                            <td
                              className="px-2 py-1"
                              style={{
                                color: nb.isIntra
                                  ? C.edgeIntra
                                  : C.edgeInter,
                              }}>
                              {nb.isIntra ? 'intra' : 'inter'}
                            </td>
                            <td className="px-2 py-1 font-mono">
                              C{nb.cluster}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        )}
        </div>
      </div>
    </div>
  );
}

/**
 * RadialExpansionView: visualizes incremental network deployment.
 *
 * Reuses PetalView but progressively reveals the topology rack-by-rack.
 * A slider controls how many racks are "installed" so far; nodes belonging
 * to racks beyond the current step are hidden. This lets you watch the
 * PolarFly graph build up from a single cluster to the full topology.
 *
 * DEPLOYMENT MODEL: in a real data center, you'd install racks one at a time.
 * This view shows what the network looks like at each deployment step,
 * including how connectivity evolves and which racks are needed next.
 *
 * The rack ordering follows the cluster partition: quadric cluster first,
 * then non-quadric fan blades in order. This means early deployment steps
 * install the backbone (W cluster) and then add capacity incrementally.
 */
function RadialExpansionView({
  graph,
  clusterData,
  dk,
  theme,
  palette = 'classic',
  switchesPerRack,
  rackStep,
  nodeSize,
  lineWidth,
  nodeOpacity,
  lineOpacity,
  interClusterWidth,
  zoom,
  quadricYOffset,
  petalStretchV,
  petalStretchR,
  quadricRScale,
  centerRScale,
  finRScale,
  layout = 'stacked',
  gamma = 1,
  autoEdgeComp = true,
  showQuadricNodes = true,
  showCenterNodes = true,
  showV1Nodes = true,
  showV2Nodes = true,
  showQuadricLabels = false,
  showV1Labels = false,
  showV2Labels = false,
  showClusterLabels = true,
  labelClusterFilter = null,
  filterClusters = [],
}) {
  const tm = (d, l, m, bw, c) => t2(theme || (dk ? 'dark' : 'light'), d, l, m, bw, c);
  const C = getPalette(theme || (dk ? 'dark' : 'light'), palette);
  const { clusters } = clusterData;

  // Linear rack timeline: walk clusters in `clusterData` order, split each
  // cluster’s node list into chunks of `switchesPerRack` switches per rack
  // (ceil division). Each entry stores which cluster id/type it belongs to and
  // the exact node ids installed in that cabinet — mirrors the rack builder used
  // elsewhere without pulling full port wiring.
  const rackList = useMemo(() => {
    const spr = switchesPerRack;
    const racks = [];
    clusters.forEach(cl => {
      const nRacks = Math.ceil(cl.nodes.length / spr);
      for (let r = 0; r < nRacks; r++) {
        const startIdx = r * spr;
        const endIdx = Math.min(startIdx + spr, cl.nodes.length);
        racks.push({
          clusterId: cl.id,
          clusterType: cl.type,
          nodeIds: cl.nodes.slice(startIdx, endIdx)
        });
      }
    });
    return racks;
  }, [clusters, switchesPerRack]);

  const totalRacks = rackList.length;
  // `rackStep` comes from the parent slider: treat it as “number of racks
  // deployed so far”, capped so we never read past `rackList` when the UI
  // overshoots.
  const activeRacks = Math.min(rackStep, totalRacks);

  // Filtering rule for PetalView: only graph vertices that live on racks [0 ..
  // activeRacks-1] are drawn. Nodes whose ids are not in this set are omitted
  // by PetalView (edges involving a hidden endpoint are typically suppressed
  // there). Step 0 → empty set → empty canvas; step 1 → first rack’s nodes
  // only; full step → entire topology.
  const visibleNodes = useMemo(() => {
    const s = new Set();
    for (let i = 0; i < activeRacks; i++) {
      rackList[i].nodeIds.forEach(n => s.add(n));
    }
    return s;
  }, [rackList, activeRacks]);
  // `rackList` + `activeRacks`: only these drive the visible set so the
  // deployment slider does not rescan unrelated graph state.

  // The rack whose nodes were added at this step is the last included index
  // (`activeRacks - 1`); used only for the HUD (“latest rack”) and to tint
  // quadric vs non-quadric lines in the label.
  // When `activeRacks === 0`, no rack is “current” yet — the overlay still shows
  // rack counts but omits the “Latest rack” row until the first cabinet
  // appears.
  const currentRack = activeRacks > 0 ? rackList[activeRacks - 1] : null;

  return (
    <div className="relative w-full h-full">
      {/*
        Same PetalView as the main radial view, but with selection/routing
        disabled and `visibleNodes` driving incremental reveal. Inter/intra/
        quadric edges stay enabled so you see real PolarFly wiring as racks
        appear.
      */}
      <PetalView
        graph={graph}
        clusterData={clusterData}
        dk={dk}
        selectedSrc={null}
        selectedDst={null}
        routingMode="minimal"
        onSelectNode={() => {}}
        showInterCluster={true}
        showIntraCluster={true}
        showQuadricEdges={true}
        autoRotate={false}
        visibleNodes={visibleNodes}
        nodeSize={nodeSize}
        lineWidth={lineWidth}
        nodeOpacity={nodeOpacity}
        lineOpacity={lineOpacity}
        interClusterWidth={interClusterWidth}
        zoom={zoom}
        quadricYOffset={quadricYOffset}
        petalStretchV={petalStretchV}
        petalStretchR={petalStretchR}
        quadricRScale={quadricRScale}
        centerRScale={centerRScale}
        finRScale={finRScale}
        layout={layout}
        gamma={gamma}
        autoEdgeComp={autoEdgeComp}
        showQuadricNodes={showQuadricNodes}
        showCenterNodes={showCenterNodes}
        showV1Nodes={showV1Nodes}
        showV2Nodes={showV2Nodes}
        showQuadricLabels={showQuadricLabels}
        showV1Labels={showV1Labels}
        showV2Labels={showV2Labels}
        showClusterLabels={showClusterLabels}
        labelClusterFilter={labelClusterFilter}
        filterClusters={filterClusters}
        theme={theme}
        palette={palette}
      />

      {/*
        HUD: summarizes deployment progress — how many racks are “lit”, total
        node count in the visible subgraph, and metadata for the most recently
        added rack (cluster id, switch count, color keyed to quadric vs fan).
      */}
      <div
        className="absolute bottom-3 left-3 z-10 rounded-lg px-3 py-2"
        style={{
          background: tm(
            'rgba(15,23,42,0.85)',
            'rgba(255,255,255,0.9)',
            'rgba(10,10,14,0.9)',
          ),
          backdropFilter: 'blur(8px)',
          border: `1px solid ${tm(
            'rgba(100,116,139,0.3)',
            'rgba(203,213,225,0.4)',
            'rgba(100,116,139,0.2)',
          )}`,
        }}>
        <div
          className="text-[10px] font-semibold uppercase tracking-wider mb-1"
          style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
          Rack {activeRacks} of {totalRacks}
        </div>
        <div
          className="grid grid-cols-2 gap-x-4 gap-y-0.5 text-xs"
          style={{ color: tm('#cbd5e1', '#475569', '#cbd5e1') }}>
          <span>Nodes visible</span>
          <span className="font-mono text-right">{visibleNodes.size}</span>
          <span>Racks installed</span>
          <span className="font-mono text-right">{activeRacks}</span>
          {currentRack && (
            <Fragment>
              <span>Latest rack</span>
              {/*
                Quadric racks use the dedicated quadric accent; other cluster
                types use the inter-cluster edge color to stand out from the petal
                interior.
              */}
              <span
                className="font-mono text-right"
                style={{
                  color:
                    currentRack.clusterType === 'quadric'
                      ? C.quadric
                      : C.edgeInter,
                }}>
                C{currentRack.clusterId} ({currentRack.nodeIds.length} sw)
              </span>
            </Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

/**
 * ExpansionView: side-by-side comparison of expansion strategies.
 *
 * Shows a stepped timeline of network growth under each replication method:
 *   - QUADRIC: adds (q+1) nodes per step. Total after k steps = N + k*(q+1).
 *     Diameter stays at 2 but degree becomes less uniform.
 *   - NON-QUADRIC: adds ~q nodes per step (one fan blade per step).
 *     Total after k steps = N + k*q. Diameter may grow to 3 but degree
 *     stays more uniform.
 *
 * The stepped cards and summary table show cumulative node count, rack count,
 * an upper bound on maximum degree (“<=” in the timeline), and diameter at
 * each step. (This pedagogical view does not enumerate literal edge counts per
 * step — it focuses on growth rate and routing-relevant degree/diameter.)
 * Bullet summaries highlight the trade-offs between replication strategies.
 *
 * @param {object} graph - ER_q graph (supplies q, N for growth calculations).
 * @param {string} method - 'quadric' or 'nonquadric' expansion strategy.
 * @param {number} numSteps - How many expansion steps to display.
 */
function ExpansionView({ graph, clusterData, dk, theme, method, numSteps }) {
  const tm = (d, l, m, bw, c) => t2(theme || (dk ? 'dark' : 'light'), d, l, m, bw, c);
  const isBw = theme === 'bw';
  // In bw (print/screenshot) mode saturated category accents (cyan, orange,
  // emerald, red, violet) collapse to a small grayscale palette so the
  // comparison cards and tables read as clean black-on-white.
  const accent = (color, bwOverride) => isBw ? (bwOverride || '#000000') : color;
  const { q, N } = graph;
  const { clusters } = clusterData;

  // Cumulative nodes, racks, degree headroom, and diameter for each expansion
  // step under the selected method.
  // Formulas mirror the docstring above: quadric adds one full “replica” of
  // (q+1) nodes per step (one new rack),
  // non-quadric adds q nodes per step (approximately one fan blade / rack).
  // `maxDegree` is incremented each step
  // as a simple model of how switch radix pressure grows; `diameter` is fixed
  // at 2 for quadric and 3 for non-quadric after step 1.
  const steps = useMemo(() => {
    const result = [];
    let totalNodes = N;
    // Start from the base PolarFly deployment: one rack per cluster in
    // `clusterData` (same baseline N as the graph).
    let totalRacks = clusters.length;
    // Base ER_q graph is (q+1)-regular on the finite-field construction used
    // elsewhere in the app.
    let maxDegree = q + 1;
    let diameter = 2;

    for (let i = 1; i <= numSteps; i++) {
      if (method === 'quadric') {
        // Quadric replication: each step introduces (q+1) new nodes (the +1 is
        // the extra vertex in the replicated block).
        totalNodes += q + 1;
        totalRacks += 1;
        // Degree model: bump max degree by 1 each step (the ternary mirrors an
        // earlier “first step” idea but both branches are +1).
        maxDegree += (i === 1 ? 1 : 1);
        diameter = 2;
        result.push({
          step: i,
          totalNodes,
          totalRacks,
          addedNodes: q + 1,
          maxDegree,
          diameter,
          rewiring: 'None',
          type: 'Quadric replica',
          notes: `Adds ${q+1} nodes. V1 degree +2, quadric degree +1. Diameter stays 2.`
        });
      } else {
        // Non-quadric replication: each step adds q nodes (one “fan” worth) and
        // one rack; degree creeps up one per step.
        totalNodes += q;
        totalRacks += 1;
        maxDegree += 1;
        // After expansion begins, the simplified model assumes diameter 3
        // (less aggressive locality than quadric’s D=2).
        diameter = i === 1 ? 3 : 3;
        result.push({
          step: i,
          totalNodes,
          totalRacks,
          addedNodes: q,
          maxDegree,
          diameter,
          rewiring: 'None',
          type: 'Non-quadric replica',
          notes: `Adds ${q} nodes. Near-uniform degree. Diameter increases to 3.`
        });
      }
    }
    return result;
  }, [method, numSteps, q, N, clusters.length]);
  // Strategy, horizon, and base size (q, N, cluster count); `clusters.length`
  // pins rack baseline to the live partition.

  return (
    <div className="p-4 overflow-auto h-full">
      <div className="text-xs font-bold mb-3" style={{color:tm('#cbd5e1','#1e293b','#c4b5fd','#000000')}}>
        Incremental Expansion of PolarFly (q={q})
      </div>

      {/*
        Visual timeline: left card is the unexpanded ER_q base; each orange
        card is one hypothetical expansion step.
        Arrows emphasize ordering only — not edge direction. Values match the
        `steps` memo (cumulative nodes/racks, degree bound, diameter).
      */}
      <div className="flex items-start gap-2 mb-4 overflow-x-auto pb-2">
        <div className="flex-shrink-0 w-28 p-2 rounded-lg border text-xs" style={{
          background:tm('#0f172a','#ffffff','#040406','#ffffff','#0D2240'),
          borderColor:tm('#334155','#e2e8f0','rgba(100,116,139,0.25)','#000000','#1e3a5f'),
          color:tm('#cbd5e1','#475569','#cbd5e1','#000000')
        }}>
          <div className="font-semibold" style={{color:accent('#06b6d4', '#000000')}}>Base PF(q={q})</div>
          <div>Nodes: {N}</div>
          <div>Racks: {clusters.length}</div>
          <div>Degree: {q+1}</div>
          <div>Diameter: 2</div>
        </div>

        {steps.map((step, i) => (
          <Fragment key={i}>
            <div
              className="flex-shrink-0 self-center text-lg"
              style={{ color: tm('#475569', '#94a3b8', '#334155', '#000000') }}>
              {'\u2192'}
            </div>
            <div className="flex-shrink-0 w-28 p-2 rounded-lg border text-xs" style={{
              background:tm('#0f172a','#ffffff','#040406','#ffffff','#0D2240'),
              borderColor:tm('rgba(249,115,22,0.4)','#f97316','rgba(249,115,22,0.3)','#333333'),
              color:tm('#cbd5e1','#475569','#cbd5e1','#000000')
            }}>
              <div className="font-semibold" style={{color:accent('#f97316', '#000000')}}>Step {step.step}</div>
              <div>Nodes: {step.totalNodes}</div>

/**
 * Compact statistics row: q, radix, N, Moore bound, efficiency, edges, and
 * cluster edge counts.
 * @param {object} graph - Built ER graph metrics.
 * @param {object} clusterData - Cluster list and inter/intra edge counts.
 */
function StatsPanel({ graph, clusterData, dk, theme }) {
  // In bw print/screenshot mode, every metric dot collapses to a single dark
  // gray so the panel looks like a printed statistics block rather than a
  // saturated HUD. The metric labels themselves still carry their meaning.
  const isBw = theme === 'bw';
  const stat = (c) => isBw ? '#222222' : c;
  const tm = (d, l, m, bw, c) => t2(theme, d, l, m, bw, c);
  const { N, q, W, V1, V2, edges } = graph;
  const { clusters, interClusterEdges, intraClusterEdges } = clusterData;
  // Moore bound for diameter 2 and maximum degree (q+1): the theoretical
  // maximum node count for that degree/diameter in the undirected case —
  // used here as a sizing reference, not a proof that ER_q hits it.
  const mooreBound = 1 + (q + 1) * q;
  // How close N is to that bound (ratio as percentage) — “efficiency” in
  // the sense of packing vertices under the Moore-style ceiling for this q.
  const efficiency = ((N / mooreBound) * 100).toFixed(1);

  // Compact dashboard: q and radix (k=q+1); global N; Moore + efficiency;
  // total undirected/simple edges from `graph.edges`;
  // partition sizes |W| (quadrics), |V1|, |V2|; cluster count; then inter-
  // vs intra-cluster edge list sizes (not a full degree histogram — that
  // lives in other panels).
  // Field label: "prime" for k=1, "p^k" for proper prime powers (e.g. q=8 → "2^3").
  const qPk = graph.F ? { p: graph.F.p, k: graph.F.k } : (isPrimePower(q) || { p: q, k: 1 });
  const qLabelSuffix = qPk.k > 1 ? ` (${qPk.p}^${qPk.k})` : '';
  const stats = [
    {label: `q${qLabelSuffix}`, value: q, color: stat('#06b6d4')},
    {label: 'Radix (k=q+1)', value: q + 1, color: stat('#06b6d4')},
    {label: 'Nodes (N=q^2+q+1)', value: N, color: stat('#14b8a6')},
    {label: 'Moore Bound', value: mooreBound, color: stat('#f59e0b')},
    {label: 'Efficiency', value: `${efficiency}%`, color: stat('#f59e0b')},
    {label: 'Edges', value: edges.length, color: stat('#22d3ee')},
    {label: 'Quadrics |W|', value: W.length, color: stat('#ef4444')},
    {label: '|V1|', value: V1.length, color: stat('#14b8a6')},
    {label: '|V2|', value: V2.length, color: stat('#8b5cf6')},
    {label: 'Clusters', value: clusters.length, color: stat('#d946ef')},
    {label: 'Inter-cluster', value: interClusterEdges.length, color: stat('#06b6d4')},
    {label: 'Intra-cluster', value: intraClusterEdges.length, color: stat('#8b5cf6')},
  ];

  return (
    // Two-column responsive grid of label/value chips: every statistic is
    // independent so order matches reading left-to-right, top-to-bottom.
    <div className="grid grid-cols-2 gap-1 px-0.5">
      {stats.map(s => (
        <div key={s.label} className="px-1.5 py-0.5 rounded" style={{
          background: tm('rgba(30,41,59,0.5)','#f8fafc','rgba(10,10,14,0.6)','#f0f0f0','rgba(13,34,64,0.6)')
        }}>
          <div className="text-xs truncate" style={{color: tm('#64748b','#94a3b8','#475569','#000000','#8da4bf')}}>{s.label}</div>
          <div className="font-mono text-sm font-semibold" style={{color: s.color}}>{s.value}</div>
        </div>
      ))}
    </div>
  );
}

/* ═════════════════════════════════════════════════════════════════════════════
   SRv6 UI COMPONENTS — shared helpers for the Routing → SRv6 sidebar view.

   All four components are presentational: they read from the encoder memos
   (`srhDesc`, `srhHops`, `srhEcmpFan`) and call back into App via the
   cross-link state setters (`setHighlight`, `setPinned`). None of them own
   state beyond the visual row hover behavior; persistent pins live in App.

   - SRHContainer  : paints the 128-bit IPv6 DA as a labeled slot row.
   - HopsTableSRv6 : hop-by-hop table for unicast / group modes.
   - Tree2Table    : collapsible level-1 / level-2 fan-out table for TREE2.
   - ECMPFanTable  : enumerates q common-neighbor Valiant intermediates.
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * Tailwind-free helper: resolve the fill color for a uSID slot based on its
 * `usidKind`. Keeps the slot palette in one place so the HopsTable and
 * SRHContainer stay consistent.
 */
function srv6SlotColor(kind, tm) {
  // tm() forwards to App's theme-aware helper; the 4th arg carries a muted
  // greyscale fallback that activates in the 'bw' print theme so the SRH
  // container renders as black/gray ink instead of brand colors.
  if (kind === 'node')     return tm('#10b981', '#10b981', '#10b981', '#000000'); // emerald → black
  if (kind === 'behavior') return tm('#d946ef', '#d946ef', '#d946ef', '#333333'); // fuchsia → dark gray
  if (kind === 'group')    return tm('#f59e0b', '#f59e0b', '#f59e0b', '#222222'); // amber → gray
  if (kind === 'eoc')      return tm('#475569', '#94a3b8', '#475569', '#555555');
  return tm('#cbd5e1', '#64748b', '#94a3b8', '#333333');
}

/**
 * SRHContainer: render the 128-bit IPv6 DA as a labeled sequence of slots.
 *
 * Layout (horizontal, wrapping if needed):
 *   [ LB: fcbb:bb01 ]  [ slot0 ]  [ slot1 ]  ...  [ slot5 ]
 * Slot coloring follows the uSID kind (node/behavior/group/EoC). The active
 * slot (top of container = next uSID to pop) is outlined; when a hop is
 * pinned/hovered, the slot that will be consumed at that hop is highlighted
 * instead.
 *
 * Shows the full IPv6 DA string below the slot row for copy/paste.
 */
function SRHContainer({ desc, highlight, tm }) {
  if (!desc) return null;
  const slots = desc.slots;
  // Which slot is "active" right now? For the hopless no-path flows (group)
  // the 0th slot is always active. For unicast/TREE2 we honor the current
  // hover (hop index) so the visualization tracks the table.
  const activeSlot = (() => {
    if (highlight && highlight.kind === 'hop' && typeof highlight.hopIndex === 'number') {
      // Each hop after the encapsulation step shifts one slot out, so the
      // slot currently being consumed at hop i is slot i (bounded).
      return Math.min(Math.max(0, highlight.hopIndex), slots.length - 1);
    }
    return 0;
  })();
  const bgMuted = tm('rgba(15,23,42,0.5)', '#f8fafc', 'rgba(10,10,14,0.6)');
  const border = tm('rgba(51,65,85,0.4)', 'rgba(203,213,225,0.5)', 'rgba(51,65,85,0.3)');
  return (
    <div className="rounded-lg p-2 text-xs space-y-1.5"
      style={{ background: bgMuted, border: `1px solid ${border}` }}>
      <div className="flex flex-wrap gap-1 items-center">
        {/* Locator Block prefix pill — always shown first so readers see the
            full IPv6 DA shape in one glance. */}
        <div className="px-1.5 py-0.5 rounded font-mono"
          style={{
            background: tm('rgba(51,65,85,0.5)', '#e2e8f0', 'rgba(15,15,20,0.6)'),
            color: tm('#94a3b8', '#64748b', '#94a3b8'),
            fontSize: 10,
          }}>
          LB:{SRV6_LB_HEX}
        </div>
        {slots.map((s, i) => {
          const kind = usidKind(s);
          const color = srv6SlotColor(kind, tm);
          const isActive = i === activeSlot && kind !== 'eoc';
          return (
            <div key={i}
              title={`Slot ${i}: ${usidLabel(s)} (0x${formatUSID(s)})`}
              className="px-1.5 py-0.5 rounded font-mono"
              style={{
                fontSize: 10,
                background: isActive
                  ? 'rgba(245,158,11,0.18)'
                  : kind === 'eoc'
                    ? 'transparent'
                    : `${color}22`,
                color,
                border: isActive
                  ? '1px solid #f59e0b'
                  : `1px solid ${kind === 'eoc' ? border : `${color}55`}`,
                opacity: kind === 'eoc' ? 0.55 : 1,
              }}>
              {usidLabel(s)}
            </div>
          );
        })}
      </div>
      {/* Full IPv6 DA literal for copy-paste / teaching. Monospace, muted. */}
      <div className="font-mono text-xs" style={{
        color: tm('#64748b', '#94a3b8', '#475569'),
        wordBreak: 'break-all',
      }}>
        {formatContainer(slots.filter(s => s !== SRV6_EOC))}
      </div>
      {/* Short explanation from the encoder — one-line pedagogy. */}
      {desc.explanation && (
        <div className="text-xs leading-snug" style={{
          color: tm('#94a3b8', '#64748b', '#64748b'),
        }}>
          {desc.explanation}
        </div>
      )}
      {/* "No SRH extension header" badge when the route fits in the single
          128-bit DA (≤ 6 uSID slots). Pedagogical callout from the tutorial. */}
      {desc.srhRequired === false && desc.type !== 'loopback' && desc.type !== 'group' && (
        <div className="inline-block px-1.5 py-0.5 rounded font-semibold text-xs"
          style={{
            // tm() here is the App-level helper closed over `theme`, so the
            // 4-arg form below renders this callout as a muted gray chip in
            // the bw print theme instead of the teal brand accent.
            background: tm('rgba(20,184,166,0.15)', 'rgba(20,184,166,0.15)', 'rgba(20,184,166,0.15)', 'rgba(0,0,0,0.10)'),
            color: tm('#14b8a6', '#14b8a6', '#14b8a6', '#000000'),
            fontSize: 10,
          }}>
          No SRH extension header needed
        </div>
      )}
    </div>
  );
}

/**
 * HopsTableSRv6: hop-by-hop table for unicast and group flows. Each row
 * displays the switch, the active uSID it pops, the outgoing container
 * shape (compact), and the action narration. Hover sets `highlight`
 * (→ PetalView highlights the matching node/edge); click toggles pin.
 */
function HopsTableSRv6({ desc, hops, graph, highlight, pinned, setHighlight, setPinned, tm }) {
  if (!desc || hops.length === 0) {
    return (
      <div className="text-xs rounded px-2 py-1.5" style={{
        color: tm('#94a3b8', '#64748b', '#64748b'),
      }}>
        No hops to display.
      </div>
    );
  }
  const border = tm('rgba(51,65,85,0.3)', 'rgba(203,213,225,0.4)', 'rgba(51,65,85,0.2)');
  const headerColor = tm('#64748b', '#94a3b8', '#475569');
  const typeName = (nid) => graph.isQuadric[nid] ? 'W' : graph.vType[nid] === 1 ? 'V1' : 'V2';
  return (
    <div className="overflow-y-auto rounded-lg" style={{
      maxHeight: 220,
      background: tm('rgba(15,23,42,0.6)', 'rgba(248,250,252,0.8)', 'rgba(5,5,8,0.7)'),
      border: `1px solid ${border}`,
    }}>
      <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ borderBottom: `1px solid ${border}` }}>
            <th className="px-1.5 py-1 text-left" style={{ color: headerColor }}>#</th>
            <th className="px-1.5 py-1 text-left" style={{ color: headerColor }}>Node</th>
            <th className="px-1.5 py-1 text-left" style={{ color: headerColor }}>uSID</th>
            <th className="px-1.5 py-1 text-left" style={{ color: headerColor }}>Action</th>
          </tr>
        </thead>
        <tbody>
          {hops.map((h, i) => {

}

/**
 * Tree2Table: hierarchical TREE2 drill-down. Root row is pinned at top;
 * level-1 rows expand to show the level-2 fan-out (leaves the peer flooded
 * to) with dedup counts. Each row wires into `setHighlight`/`setPinned`
 * so PetalView can draw the matching tree-branch overlay.
 */
function Tree2Table({ desc, graph, expanded, setExpanded, highlight, pinned, setHighlight, setPinned, tm }) {
  if (!desc || desc.type !== 'tree2') return null;
  const border = tm('rgba(51,65,85,0.3)', 'rgba(203,213,225,0.4)', 'rgba(51,65,85,0.2)');
  const headerColor = tm('#64748b', '#94a3b8', '#475569');
  const typeName = (nid) => graph.isQuadric[nid] ? 'W' : graph.vType[nid] === 1 ? 'V1' : 'V2';
  // Map level-1 peer → its level-2 children for fast lookup.
  const childrenOf = new Map();
  for (const peer of desc.level1) childrenOf.set(peer, []);
  for (const leaf of desc.level2) {
    for (const parent of leaf.parents) {
      if (childrenOf.has(parent)) {
        childrenOf.get(parent).push(leaf);
      }
    }
  }
  const toggleExpand = (peer) => {
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(peer)) next.delete(peer);
      else next.add(peer);
      return next;
    });
  };
  const activeNode = (h) => (h?.kind === 'tree2' ? h.node : null);
  const isActive = (level, node) => {
    const act = pinned ?? highlight;
    return act?.kind === 'tree2' && act.level === level && act.node === node;
  };
  return (
    <div className="overflow-y-auto rounded-lg" style={{
      maxHeight: 260,
      background: tm('rgba(15,23,42,0.6)', 'rgba(248,250,252,0.8)', 'rgba(5,5,8,0.7)'),
      border: `1px solid ${border}`,
    }}>
      <div className="px-2 py-1.5 text-xs font-semibold" style={{
        background: tm('rgba(30,41,59,0.5)', '#e2e8f0', 'rgba(10,10,14,0.6)'),
        color: tm('#d946ef', '#d946ef', '#d946ef', '#000000'),
        borderBottom: `1px solid ${border}`,
      }}>
        {/* Summary header: reach %, packet accounting */}
        Level 0 (root): N{desc.root} ({typeName(desc.root)}) —{' '}
        <span style={{ color: tm('#94a3b8','#64748b','#475569') }}>
          reach {desc.unique}/{graph.N} ({desc.reachPct.toFixed(0)}%), sent {desc.totalSent}, dropped {desc.dropped}
        </span>
      </div>
      <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ borderBottom: `1px solid ${border}` }}>
            <th className="px-1.5 py-1 text-left" style={{ color: headerColor }}>Peer</th>
            <th className="px-1.5 py-1 text-right" style={{ color: headerColor }}>Downstream</th>
            <th className="px-1.5 py-1 text-right" style={{ color: headerColor }}>Unique leaves</th>
          </tr>
        </thead>
        <tbody>
          {desc.level1.map(peer => {
            const kids = childrenOf.get(peer) || [];
            const uniqueCount = kids.length;
            const downstream = graph.adj[peer].length - 1; // exclude back-edge to root
            const isOpen = expanded.has(peer);
            const peerActive = isActive(1, peer);
            return (
              <Fragment key={peer}>
                <tr
                  className="cursor-pointer transition-colors"
                  style={{
                    background: peerActive
                      ? tm('rgba(217,70,239,0.18)','rgba(217,70,239,0.18)','rgba(217,70,239,0.18)','rgba(0,0,0,0.14)')
                      : 'transparent',
                    borderBottom: `1px solid ${border}`,
                  }}
                  onMouseEnter={() => setHighlight({ kind: 'tree2', level: 1, node: peer })}
                  onMouseLeave={() => setHighlight(null)}
                  onClick={() => setPinned(prev =>
                    prev?.kind === 'tree2' && prev.level === 1 && prev.node === peer
                      ? null
                      : { kind: 'tree2', level: 1, node: peer })}>
                  <td className="px-1.5 py-1 font-mono">
                    <button
                      type="button"
                      onClick={e => { e.stopPropagation(); toggleExpand(peer); }}
                      className="mr-1 inline-block w-3"
                      style={{ color: tm('#94a3b8','#64748b','#475569') }}>
                      {isOpen ? '▾' : '▸'}
                    </button>
                    <span style={{ color: tm('#cbd5e1','#475569','#cbd5e1') }}>N{peer}</span>
                    <span style={{
                      color: tm('#64748b','#94a3b8','#475569'),
                      fontSize: 9, marginLeft: 2,
                    }}>
                      ({typeName(peer)})
                    </span>
                  </td>
                  <td className="px-1.5 py-1 font-mono text-right"
                    style={{ color: tm('#cbd5e1','#475569','#cbd5e1') }}>
                    {downstream}
                  </td>
                  <td className="px-1.5 py-1 font-mono text-right"
                    style={{ color: tm('#d946ef', '#d946ef', '#d946ef', '#000000') }}>
                    {uniqueCount}
                  </td>
                </tr>
                {isOpen && kids.map(leaf => {
                  const leafActive = isActive(2, leaf.node);
                  return (
                    <tr key={`${peer}-${leaf.node}`}
                      className="cursor-pointer transition-colors"
                      style={{
                        background: leafActive
                          ? tm('rgba(139,92,246,0.18)','rgba(139,92,246,0.18)','rgba(139,92,246,0.18)','rgba(0,0,0,0.14)')
                          : tm(
                              'rgba(15,23,42,0.35)',
                              'rgba(248,250,252,0.6)',
                              'rgba(5,5,8,0.4)',
                            ),
                        borderBottom: `1px solid ${border}`,
                      }}
                      onMouseEnter={() => setHighlight({ kind: 'tree2', level: 2, node: leaf.node })}
                      onMouseLeave={() => setHighlight(null)}
                      onClick={() => setPinned(prev =>
                        prev?.kind === 'tree2' && prev.level === 2 && prev.node === leaf.node
                          ? null
                          : { kind: 'tree2', level: 2, node: leaf.node })}>
                      <td className="px-1.5 py-1 font-mono" style={{ paddingLeft: '1.5rem' }}>
                        <span style={{ color: tm('#cbd5e1','#475569','#cbd5e1') }}>
                          ↳ N{leaf.node}
                        </span>
                        <span style={{
                          color: tm('#64748b','#94a3b8','#475569'),
                          fontSize: 9, marginLeft: 2,
                        }}>
                          ({typeName(leaf.node)})

                      <td className="px-1.5 py-1 text-right font-mono" style={{
                        color: leaf.copies > 1
                          ? tm('#f59e0b', '#f59e0b', '#f59e0b', '#000000')
                          : tm('#94a3b8','#64748b','#475569','#555555'),
                        fontSize: 10,
                      }}>
                        {/* "× n" badge indicates dedup: n copies received, n-1
                            dropped by the leaf's SRv6 dedup filter. */}
                        {leaf.copies > 1 ? `×${leaf.copies}` : '1'}
                      </td>
                      <td className="px-1.5 py-1 text-right font-mono"
                        style={{ color: tm('#8b5cf6', '#8b5cf6', '#8b5cf6', '#333333'), fontSize: 10 }}>
                        deliver
                      </td>
                    </tr>
                  );
                })}
              </Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ============================================================
   ASTR SPANNING-TREE DIAGRAM PANEL
   ============================================================ */
/**
 * ASTRTreePanel: a tidy 2-D drawing of a single spanning tree, rendered
 * as a floating "frame" over the ASTR canvas. Supports two layouts:
 *
 *   • vertical   — root on top, depth growing downward, leaves spread
 *                  horizontally (classic tidy-tree). Best for trees
 *                  that are TALLER than wide, e.g. SPAA Construction-2
 *                  Hamiltonian paths whose depth is (N-1)/2.
 *   • horizontal — root on the left, depth growing rightward, leaves
 *                  stacked vertically (tidy-tree rotated 90° CCW). Best
 *                  for trees that are WIDER than deep, e.g. SPAA
 *                  Construction-1 trees with depth ≤ 3 and many leaves.
 *
 * The `orientation` prop may be 'auto', 'vertical', or 'horizontal'.
 * In 'auto' the panel compares the tree's logical extents (`maxX` =
 * leaf count, `maxY` = max depth) and picks horizontal when the tree
 * is wider than deep.
 *
 * Layout algorithm:
 *   • Pre-order DFS assigns a contiguous leaf-index to every leaf in
 *     order of appearance; internal nodes take the midpoint of their
 *     children's leaf-indices. This is the classic naive "tidy tree"
 *     layout — no node overlaps because leaves own disjoint cells and
 *     parents span their own subtree's range.
 *   • `xPos[v]` is the leaf-index axis and `yPos[v] = depth[v]` in
 *     logical coordinates; the render step maps those to screen
 *     coordinates via `nodeCx/nodeCy` helpers that either keep the
 *     mapping (vertical) or swap+flip it (horizontal = 90° CCW).
 *
 * Sliders multiply the per-step column width (`baseColW`) and row
 * height (`baseRowH`). The SVG is sized to the full content and lives
 * inside a scrollable div, so cranking the stretch beyond the frame's
 * aperture just pans; nothing is clipped visually.
 *
 * Props:
 *   tree          — rooted tree object from rootForestAsTree() (with
 *                   parent[], depth[], children[], stages[], root,
 *                   color, id). May be null → the panel renders an
 *                   "empty" placeholder.
 *   graph         — the underlying polarity graph (for node labels;
 *                   we only need graph.N here).
 *   theme         — theme string ('dark'|'light'|'midnight'|'bw').
 *   palette       — palette name for re-tinting chrome.
 *   xStretch,
 *   yStretch      — multipliers [0.4..2.5] driven by the sidebar
 *                   sliders below the drawing.
 *   navLeft,
 *   navRight      — optional callbacks; when provided and non-null, a
 *                   ◀ / ▶ pair appears beside the tree label to cycle
 *                   through visible trees.
 *   headerTitle   — subtitle under the tree id (e.g. "3 of 4 visible").
 *   treeCountLabel — short count (e.g. "3/4").
 *   onClose       — optional; hides the panel entirely.
 */
function ASTRTreePanel({
  tree, graph,
  theme = 'dark', palette = 'classic',
  xStretch = 1, yStretch = 1,
  setXStretch, setYStretch,
  zoom = 1, setZoom,
  orientation = 'auto', setOrientation = null,
  navLeft = null, navRight = null,
  headerTitle = '',
  treeCountLabel = '',
  onClose = null,
}) {
  const dk = (theme === 'dark' || theme === 'midnight');
  const tm = (d, l, m, bw, c) => t2(theme, d, l, m, bw, c);
  const uiTint = uiAccent(theme, palette);
  const uiInputStyle = { accentColor: uiTint, '--thumb': uiTint };
  // Palette-driven per-vertex outline color: quadrics get C.quadric, V1s get
  // C.v1, V2s get C.v2. Falls back to the tree's accent if vType is missing
  // (e.g. tree came in without a graph reference). This keeps the right-pane
  // diagram visually consistent with the Petal-View coloring so the reader
  // can cross-reference a vertex by its ring/wedge color.
  const C = getPalette(theme, palette);
  const typeColor = (v) => {
    if (!graph || graph.vType == null || graph.vType[v] == null) return null;
    const t = graph.vType[v];
    if (t === 0) return C.quadric;
    if (t === 1) return C.v1;
    return C.v2;
  };

  // Compute tidy-tree layout once per (tree, graph.N) change. If tree is
  // null or degenerate (no stages), we bail to a non-layout payload so
  // the empty-state render can still show axes / placeholder.
  const layout = useMemo(() => {
    if (!tree || !tree.stages || tree.stages.length === 0) {
      return { xPos: null, yPos: null, maxX: 0, maxY: 0, order: [] };
    }
    const N = tree.parent.length;
    const xPos = new Array(N).fill(0);
    const yPos = new Array(N).fill(0);
    const order = [];
    // Iterative post-order DFS (no recursion to keep the stack shallow
    // for big q). `stack` holds [v, phase]: phase 0 = enter, phase 1 =
    // exit (children already assigned). Node ordering for x assignment
    // matches insertion order in children[] (stable BFS order).
    let nextLeafX = 0;
    const stack = [[tree.root, 0]];
    while (stack.length) {
      const frame = stack[stack.length - 1];
      const [v, phase] = frame;
      if (phase === 0) {
        frame[1] = 1;
        yPos[v] = tree.depth[v];
        const kids = tree.children[v];
        if (!kids || kids.length === 0) {
          xPos[v] = nextLeafX++;
          order.push(v);
          stack.pop();
        } else {
          // Push children in reverse so we visit them left-to-right.
          for (let i = kids.length - 1; i >= 0; i--) stack.push([kids[i], 0]);
        }
      } else {
        // All children done — take midpoint of first/last child's xPos.
        const kids = tree.children[v];
        if (kids && kids.length > 0) {
          xPos[v] = (xPos[kids[0]] + xPos[kids[kids.length - 1]]) / 2;
        }
        order.push(v);
        stack.pop();
      }
    }
    const maxX = Math.max(0, nextLeafX - 1);
    const maxY = tree.stages.length - 1;
    return { xPos, yPos, maxX, maxY, order };
  }, [tree, graph && graph.N]);

  // Panel chrome colors. The inner drawing surface is kept transparent
  // so the enclosing <aside> bg shows through cleanly. Previously this
  // was a near-opaque near-black (`rgba(2,6,15,0.88)`), which in dark
  // mode layered on top of the sidebar's `#070d18` shell to produce
  // a jet-black pane that read as much darker than the main canvas.
  // Now the pane inherits the shell color and visually continues from
  // the left sidebar without a stepped darkness shift.
  const bg       = 'transparent';
  const border   = tm('rgba(71,85,105,0.50)', 'rgba(203,213,225,0.70)', 'rgba(71,85,105,0.30)', 'rgba(0,0,0,0.35)');
  const fgTitle  = tm('#e2e8f0', '#1e293b', '#c4b5fd', '#000000');
  const fgSub    = tm('#94a3b8', '#64748b', '#64748b', '#000000');
  const fgLabel  = tm('#cbd5e1', '#334155', '#c4b5fd', '#000000');
  const edgeClr  = tm('rgba(148,163,184,0.55)', 'rgba(100,116,139,0.50)', 'rgba(148,163,184,0.40)', 'rgba(0,0,0,0.60)');
  const nodeFill = tm('#0f172a', '#f8fafc', '#0a0a12', '#ffffff');

  // Per-tree accent (from the spanning-tree color the overlay uses).
  const accent = (tree && tree.color) || uiTint;

  // Layout constants (content space). `zoom` is a uniform multiplier that
  // scales column width, row height, node radius, label size, and padding
  // together — xStretch/yStretch only warp column vs row independently.
  // Effective orientation. 'auto' picks horizontal when the tree has
  // more leaves (maxX) than depth (maxY) — a wider-than-deep shape
  // benefits from lying on its side within the narrow sidebar aperture.
  // Hamiltonian-path trees (maxY ≈ N/2, maxX small) stay vertical; the
  // low-depth packing (maxY ≤ 3, maxX large) flips horizontal.
  const effectiveOrientation = (orientation === 'vertical' || orientation === 'horizontal')
    ? orientation
    : (layout.maxX > layout.maxY ? 'horizontal' : 'vertical');
  const isHoriz = effectiveOrientation === 'horizontal';

  // `colW` is the per-leaf-cell pitch; `rowH` is the per-depth-step
  // pitch. In 'vertical' these are screen x/y respectively; in
  // 'horizontal' they become y/x (axes swap). We deliberately keep the
  // slider semantics keyed to the *logical* tree axes (X = leaves,
  // Y = depth) so the sliders feel the same regardless of orientation.
  const baseColW = 30;
  const baseRowH = 56;
  const colW = Math.max(8, baseColW * xStretch * zoom);
  const rowH = Math.max(18, baseRowH * yStretch * zoom);
  const padX = Math.round(28 * zoom);
  const padY = Math.round(36 * zoom);

  // Screen-space content box and per-node projection. In vertical mode
  // the mapping is the identity (xPos→screenX, yPos→screenY). In
  // horizontal mode we apply a 90° CCW rotation so the root (yPos=0)
  // ends up on the left and the first-traversed leaf (xPos=0) lands at
  // the bottom.
  const contentW = isHoriz
    ? Math.round(layout.maxY * rowH + 2 * padY)
    : Math.round(layout.maxX * colW + 2 * padX);
  const contentH = isHoriz
    ? Math.round(layout.maxX * colW + 2 * padX)
    : Math.round(layout.maxY * rowH + 2 * padY);
  const nodeCx = isHoriz
    ? (v) => padY + layout.yPos[v] * rowH
    : (v) => padX + layout.xPos[v] * colW;
  const nodeCy = isHoriz
    ? (v) => padX + (layout.maxX - layout.xPos[v]) * colW
    : (v) => padY + layout.yPos[v] * rowH;

  const nodeR      = Math.max(4, 10 * zoom);
  const labelSize  = Math.max(8,  10 * zoom);
  const depthSize  = Math.max(6,   8 * zoom);

  return (
    <div style={{
      display: 'flex', flexDirection: 'column',
      width: '100%', height: '100%',
      background: bg,
      border: `1px solid ${border}`,
      borderRadius: 10,
      backdropFilter: 'blur(6px)',
      overflow: 'hidden',
    }}>
      {/* ── Header ──────────────────────────────────────────────── */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        padding: '6px 8px 6px 10px',
        borderBottom: `1px solid ${border}`,
      }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 6,
            color: fgTitle, fontSize: 12, fontWeight: 700, letterSpacing: 0.2,
          }}>
            <span style={{
              display: 'inline-block', width: 10, height: 10, borderRadius: 2,
              background: accent,
              boxShadow: `0 0 0 1px ${accent}88`,
            }}/>
            <span>Spanning Tree</span>
            {tree && (
              <span className="font-mono" style={{ color: accent, fontWeight: 700 }}>
                T{tree.id}
              </span>
            )}
            {treeCountLabel && (
              <span className="font-mono" style={{ color: fgSub, fontSize: 10, marginLeft: 2 }}>
                {treeCountLabel}
              </span>
            )}
          </div>
          {headerTitle && (
            <div style={{ fontSize: 10, color: fgSub, marginTop: 1, lineHeight: 1.3 }}>
              {headerTitle}
            </div>
          )}
        </div>
        {/* Navigation arrows (only when callbacks provided, e.g. all-visible mode). */}
        {(navLeft || navRight) && (
          <div style={{ display: 'flex', gap: 4 }}>
            <button
              onClick={navLeft || undefined}
              disabled={!navLeft}
              title="Previous visible tree"
              style={{
                width: 22, height: 22, borderRadius: 4,
                border: `1px solid ${border}`, background: 'transparent',
                color: navLeft ? fgLabel : fgSub,
                cursor: navLeft ? 'pointer' : 'default',
                fontSize: 12, lineHeight: '20px', textAlign: 'center',
                opacity: navLeft ? 1 : 0.4,
              }}>
              {'\u25C0'}
            </button>
            <button
              onClick={navRight || undefined}
              disabled={!navRight}
              title="Next visible tree"
              style={{
                width: 22, height: 22, borderRadius: 4,
                border: `1px solid ${border}`, background: 'transparent',
                color: navRight ? fgLabel : fgSub,
                cursor: navRight ? 'pointer' : 'default',
                fontSize: 12, lineHeight: '20px', textAlign: 'center',
                opacity: navRight ? 1 : 0.4,
              }}>
              {'\u25B6'}
            </button>
          </div>
        )}
        {onClose && (
          <button
            onClick={onClose}
            title="Hide tree panel"
            style={{
              width: 22, height: 22, borderRadius: 4,
              border: `1px solid ${border}`, background: 'transparent',
              color: fgSub, cursor: 'pointer',
              fontSize: 12, lineHeight: '18px', textAlign: 'center',
            }}>
            {'\u00D7'}
          </button>
        )}
      </div>

      {/* ── Drawing ─────────────────────────────────────────────── */}
      <div style={{ flex: 1, minHeight: 0, overflow: 'auto' }}>
        {tree && layout.xPos ? (
          <svg
            width={contentW}
            height={contentH}
            style={{ display: 'block' }}
            viewBox={`0 0 ${contentW} ${contentH}`}>
            {/* Edges first, so node circles paint on top. We iterate the
                tree's authoritative `edges` list (parent→child pairs).
                The elbow routing is axis-aligned: vertical-horizontal-
                vertical when root is at top, horizontal-vertical-
                horizontal when root is at left. */}
            {tree.edges.map((e, i) => {
              const x1 = nodeCx(e.u);
              const y1 = nodeCy(e.u);
              const x2 = nodeCx(e.v);
              const y2 = nodeCy(e.v);
              const d = isHoriz
                ? (() => {
                    const mid = (x1 + x2) / 2;
                    return `M ${x1} ${y1} L ${mid} ${y1} L ${mid} ${y2} L ${x2} ${y2}`;
                  })()
                : (() => {
                    const mid = (y1 + y2) / 2;
                    return `M ${x1} ${y1} L ${x1} ${mid} L ${x2} ${mid} L ${x2} ${y2}`;
                  })();
              return (
                <path key={i} d={d}
                  fill="none"
                  stroke={edgeClr}
                  strokeWidth={1.25}
                  strokeLinecap="round"
                  strokeLinejoin="round"/>
              );
            })}
            {/* Nodes: circle + N<id> label. Outline color is palette-driven
                by vertex type (Q/V1/V2) so the right pane is colour-
                coordinated with the Petal-View wedges. The root carries an
                additional inner halo in the tree's own accent color so the
                "source-of-truth" endpoint is still visually unambiguous.
                Leaves keep a slightly softer stroke to reinforce the tree
                topology at a glance. */}
            {layout.order.map((v) => {
              if (layout.xPos[v] == null) return null;
              const cx = nodeCx(v);
              const cy = nodeCy(v);
              const isRoot = v === tree.root;
              const isLeaf = (tree.children[v] || []).length === 0;
              const strokeW = isRoot ? 2.6 * zoom : 1.5 * zoom;
              const vtColor = typeColor(v) || accent;
              const stroke  = isLeaf ? `${vtColor}cc` : vtColor;
              const fill    = isRoot ? vtColor : nodeFill;
              return (
                <g key={v}>
                  {/* Palette-typed outline (Q/V1/V2). */}
                  <circle cx={cx} cy={cy} r={nodeR}
                    fill={fill}
                    stroke={stroke}
                    strokeWidth={strokeW}/>
                  {/* Root halo in the tree's accent color — draws *over*
                      the palette outline so the root is unambiguous even
                      when vtColor happens to match the accent. */}
                  {isRoot && (
                    <circle cx={cx} cy={cy} r={nodeR + Math.max(2, 2 * zoom)}
                      fill="none"
                      stroke={accent}
                      strokeWidth={Math.max(1, 1.2 * zoom)}
                      strokeDasharray={`${Math.max(2, 2 * zoom)} ${Math.max(2, 2 * zoom)}`}
                      opacity={0.9}/>
                  )}
                  <text x={cx} y={cy - nodeR - Math.max(3, 4 * zoom)}
                    textAnchor="middle"
                    fontSize={labelSize}
                    fontFamily="ui-monospace, SFMono-Regular, Menlo, monospace"
                    fill={fgLabel}>
                    N{v}
                  </text>
                  <text x={cx} y={cy + depthSize * 0.35}
                    textAnchor="middle"
                    fontSize={depthSize}
                    fontFamily="ui-monospace, SFMono-Regular, Menlo, monospace"
                    fill={isRoot ? nodeFill : fgSub}>
                    {tree.depth[v]}
                  </text>
                </g>
              );
            })}
          </svg>
        ) : (
          <div style={{
            height: '100%', display: 'flex',
            alignItems: 'center', justifyContent: 'center',
            color: fgSub, fontSize: 11, padding: 12, textAlign: 'center',
          }}>
            No visible tree — toggle a tree chip or solo one.
          </div>
        )}
      </div>

      {/* ── Zoom + Stretch sliders ──────────────────────────────
          Zoom is uniform (scales everything including label font
          sizes and padding so big-q trees stay legible). X / Y
          stretch warp column width vs row height independently, on
          top of zoom. Triple of knobs means the user can always
          blow up the labels (zoom↑) without first having to yank
          both stretch sliders to 2.5×. */}
      <div style={{
        padding: '6px 10px 8px',
        borderTop: `1px solid ${border}`,
        display: 'flex', flexDirection: 'column', gap: 4,
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 10, color: fgLabel,
        }}>
          <span style={{ width: 28, fontFamily: 'ui-monospace, monospace' }}>Zoom</span>
          <input type="range" min={0.5} max={3.0} step={0.05}
            value={zoom}
            onChange={e => setZoom && setZoom(parseFloat(e.target.value))}
            style={{ flex: 1, ...uiInputStyle }}/>
          <span style={{
            width: 34, textAlign: 'right',
            fontFamily: 'ui-monospace, monospace', color: fgSub,
          }}>
            {zoom.toFixed(2)}×
          </span>
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 10, color: fgLabel,
        }}>
          <span style={{ width: 28, fontFamily: 'ui-monospace, monospace' }}>X</span>
          <input type="range" min={0.4} max={2.5} step={0.05}
            value={xStretch}
            onChange={e => setXStretch && setXStretch(parseFloat(e.target.value))}
            style={{ flex: 1, ...uiInputStyle }}/>
          <span style={{
            width: 34, textAlign: 'right',
            fontFamily: 'ui-monospace, monospace', color: fgSub,
          }}>
            {xStretch.toFixed(2)}×
          </span>
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 10, color: fgLabel,
        }}>
          <span style={{ width: 28, fontFamily: 'ui-monospace, monospace' }}>Y</span>
          <input type="range" min={0.4} max={2.5} step={0.05}
            value={yStretch}
            onChange={e => setYStretch && setYStretch(parseFloat(e.target.value))}
            style={{ flex: 1, ...uiInputStyle }}/>
          <span style={{
            width: 34, textAlign: 'right',
            fontFamily: 'ui-monospace, monospace', color: fgSub,
          }}>
            {yStretch.toFixed(2)}×
          </span>
        </div>
        {/* Orientation picker: 3-way segmented control. Auto picks
            horizontal for shallow wide trees (Low-depth) and vertical
            for tall narrow trees (Hamiltonian). The two manual choices
            override the heuristic. Shown only when the parent wires up
            `setOrientation`. */}
        {setOrientation && (
          <div style={{
            display: 'flex', alignItems: 'center', gap: 6,
            fontSize: 10, color: fgLabel,
          }}>
            <span
              style={{ width: 28, fontFamily: 'ui-monospace, monospace' }}
              title="Tree drawing orientation">
              Rot
            </span>
            <div style={{
              flex: 1, display: 'flex',
              border: `1px solid ${border}`, borderRadius: 4,
              overflow: 'hidden',
            }}>
              {[
                { id: 'auto',       lbl: 'Auto',    hint: 'Pick orientation from tree shape' },
                { id: 'vertical',   lbl: 'Top',     hint: 'Root on top (classic)' },
                { id: 'horizontal', lbl: 'Left',    hint: 'Root on left (90° CCW)' },
              ].map(opt => {
                const active = orientation === opt.id;
                return (
                  <button key={opt.id}
                    onClick={() => setOrientation(opt.id)}
                    title={opt.hint}
                    style={{
                      flex: 1, padding: '3px 4px',
                      fontSize: 9, lineHeight: 1.2,
                      fontFamily: 'ui-monospace, monospace',
                      background: active ? uiTint : 'transparent',
                      color: active ? (dk ? '#0a0f1e' : '#ffffff') : fgLabel,
                      border: 'none',
                      borderLeft: opt.id === 'auto' ? 'none' : `1px solid ${border}`,
                      cursor: 'pointer',
                      fontWeight: active ? 600 : 400,
                    }}>
                    {opt.lbl}
                  </button>
                );
              })}
            </div>
            <span
              style={{
                width: 34, textAlign: 'right',
                fontFamily: 'ui-monospace, monospace', color: fgSub,
                fontSize: 9,
              }}
              title={`effective: ${effectiveOrientation}`}>
              {orientation === 'auto' ? `→${effectiveOrientation === 'horizontal' ? 'L' : 'T'}` : ''}
            </span>
          </div>
        )}
        {tree && (
          <div style={{
            fontSize: 9, color: fgSub, display: 'flex',
            justifyContent: 'space-between',
            fontFamily: 'ui-monospace, monospace',
          }}>
            <span>root=N{tree.root}</span>
            <span>{tree.edges.length} edges</span>
            <span>depth {Math.max(0, (tree.stages || []).length - 1)}</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   MAIN APPLICATION COMPONENT
   ============================================================ */
/**
 * App: root component orchestrating all PolarFly visualization modes.
 *
 * STATE ARCHITECTURE:
 *   - q (finite field order, any prime power p^k): drives graph construction.
 *     Changing q rebuilds everything from scratch (graph, clusters, rack model).
 *   - tab: selects the main visualization (Petal/Routing, Rack View, Radial
 *     Growth, Expansion; stats live in the sidebar).
 *   - routingMode: selects the routing algorithm for path visualization
 *     (minimal, valiant, UGAL, or all-paths enumeration).
 *   - Theme: 3-way (dark/light/midnight) for accessibility.
 *
 * DERIVED DATA FLOW:
 *   q -> graph (buildERGraph) -> clusterData (buildClusters) -> rackModel (buildRackModel)
 *   Each step is memoized so changing q triggers a full rebuild, while changing
 *   visual parameters (zoom, line width, etc.) only redraws the view.
 *
 * ALL-PATHS ANALYSIS:
 *   In "allpaths" mode, the app enumerates candidate simple paths (typically
 *   length 1–2 in this diameter-2 topology) between src and dst, computes their
 *   costs under ECMP (equal per-hop) and unequal-cost models, sorts paths for
 *   the table, and derives ECMP-wide minima for counts/overlays — see `allPathsData`.
 */
function App() {
  // --- Theme ---
  // Persisted palette for the whole shell: drives `tm()` (tri-state colors),
  // `dk` (non-light → dark chrome), and `isMidnight` (violet accent path).
  const [theme, setTheme] = useState('dark');
  const dk = theme !== 'light';
  const isMidnight = theme === 'midnight';
  const isCisco = theme === 'cisco';
  const isBw = theme === 'bw';

  // --- Palette ---
  // Semantic-color profile selected from `PALETTES` (classic / cisco / neon /
  // ocean / sunset / forest). Orthogonal to `theme`: the bw theme always
  // overrides the palette with the greyscale set, but every other theme
  // renders with the hues chosen here. Default 'classic' restores the
  // original paper-style red/teal/blue/violet look.
  const [palette, setPalette] = useState(() => {
    try { return localStorage.getItem('pf-palette') || 'classic'; }
    catch { return 'classic'; }
  });
  // Persist on change so the selection survives reloads without the rest of
  // the tuning preset machinery having to know about it.
  useEffect(() => {
    try { localStorage.setItem('pf-palette', palette); } catch {}
  }, [palette]);
  // tm() accepts an optional 4th arg for the 'bw' print theme; when a caller
  // omits it, t2() falls back to the 'light' value so existing 3-arg sites
  // continue to work.
  const tm = (d, l, m, bw, c) => t2(theme, d, l, m, bw, c);
  // bwTint(color, bwColor='#333333'): collapses a saturated accent to a muted
  // greyscale tone whenever 'bw' theme is active. Used for slider thumbs,
  // active-state pill backgrounds, stat-panel badges, and other chrome where
  // we want the print/screenshot skin to stay in the black/gray family
  // instead of reading as "color" against the paper-white page.
  const bwTint = (color, bwColor = '#333333') => isBw ? bwColor : color;
  // Shared "active pill" accents used throughout the sidebar (Filter, Layout,
  // Presets, Node Labels, Selection, etc.). In the bw print/screenshot theme
  // everything collapses to black-on-white with muted gray halos so active
  // state reads as "ink" rather than "brand color". Otherwise we take the
  // selected palette's `accent` color — changing the palette drop-down now
  // actually retints the sliders, checkboxes, pills, and focus rings.
  //
  // uiTint: the bare hex accent for raw style props (slider thumb CSS var,
  //         `accent-color` on native inputs).
  // activePillBg/BgSoft/Border/Text: four pre-computed alpha variants that
  //         every "chip" in the sidebar consumes for its background /
  //         border / text, so the whole chrome re-tints in one shot.
  const uiTint = uiAccent(theme, palette);
  const activePillBg     = isBw ? 'rgba(0,0,0,0.14)' : hexToRgba(uiTint, 0.20);
  const activePillBgSoft = isBw ? 'rgba(0,0,0,0.10)' : hexToRgba(uiTint, 0.15);
  const activePillBorder = isBw ? 'rgba(0,0,0,0.45)' : hexToRgba(uiTint, 0.40);
  const activePillText   = isBw ? '#000000' : uiTint;
  // Single object reused across every `<input type="checkbox|range|radio">`
  // in the App sidebar. `accentColor` is the standard CSS property that
  // tints the fill of native form controls across Chrome/Safari/Firefox,
  // and `--thumb` is our own CSS variable picked up by the range-input
  // pseudo-elements in the top-of-file <style> block. Declaring both at
  // once lets one spread cover sliders + checkboxes + radios uniformly.
  const uiInputStyle = { accentColor: uiTint, '--thumb': uiTint };

  // --- Core interaction state ---
  // q: finite-field order (prime power). Changing q triggers a full
  // graph + cluster + rack rebuild via the buildERGraph pipeline.
  // tab: which visualization panel is active.
  // selectedSrc/Dst: user-picked endpoints for routing visualization.
  // routingMode: which algorithm generates path overlays (minimal, valiant, UGAL, allpaths).
  const [q, setQ] = useState(7);
  const [tab, setTab] = useState('petal');
  const [selectedSrc, setSelectedSrc] = useState(null);
  const [selectedDst, setSelectedDst] = useState(null);
  const [routingMode, setRoutingMode] = useState('minimal');
  const [pinnedPathIdx, setPinnedPathIdx] = useState(null);   // clicked path row in All Paths table
  const [hoveredPathIdx, setHoveredPathIdx] = useState(null);  // hovered path row (live preview)
  const [showUnequalCost, setShowUnequalCost] = useState(false); // toggle ECMP vs unequal cost model
  const [rerollCtr, setRerollCtr] = useState(0);               // re-randomize Valiant paths

  // --- SRv6 view state ---
  // `routingView` switches the Routing tab between the existing abstract path
  // overlay ('abstract') and the wire-level SRv6 / uSID visualization
  // ('srv6'). When 'srv6', the sidebar below shows SRH containers, hop
  // tables, and TREE2 drill-down instead of the abstract path analysis card.
  const [routingView, setRoutingView] = useState('abstract');
  // `srv6Mode` picks which SRv6 primitive the wire view is describing when
  // routingView === 'srv6'. 'unicast' uses the cross-product 2-hop form
  // (with an encoding sub-option), 'group' wraps a C000-band anycast uSID,
  // and 'tree2' expands the two-level broadcast flood from `selectedSrc`.
  const [srv6Mode, setSrv6Mode] = useState('unicast');
  // Encoding sub-option for unicast mode: 'explicit' (ships CROSS vertex in
  // the container) or 'compact' (ships End.PF.CROSS behavior uSID). The UI
  // exposes both so the tutorial can contrast the wire format.
  const [srv6UnicastEnc, setSrv6UnicastEnc] = useState('explicit');
  // Selected group id (0..15 for v1) when srv6Mode === 'group'. The encoder
  // maps it into the 0xC000 band as groupId & 0x0FFF.
  const [srv6GroupSel, setSrv6GroupSel] = useState(1);
  // Set of level-1 neighbors whose level-2 fan-out rows are currently open in
  // the TREE2 drill-down table. We store as a Set keyed by vertex id so the
  // table row expander stays stateful across re-renders.
  const [srv6Tree2Expanded, setSrv6Tree2Expanded] = useState(() => new Set());
  // Cross-linked highlight between tables and topology. Shape:
  //   { kind: 'hop',    hopIndex: n }          // row-hover on Hops table
  //   { kind: 'tree2',  level: 0|1|2, node }   // TREE2 drill-down row
  //   { kind: 'ecmp',   pivot }                // Valiant/ECMP fan row
  //   null                                     // no highlight
  // PetalView reads this to emphasize specific edges/nodes; the tables read
  // it to re-show their own hover state.
  const [srv6Highlight, setSrv6Highlight] = useState(null);
  // Pin one highlight so it persists past mouse-leave (clicked row).
  const [srv6Pinned, setSrv6Pinned] = useState(null);

  // ─── ASTR (multi-tree All-Reduce) state ──────────────────────────────────
  // `astrVisible` is the set of tree ids currently rendered in the overlay.
  // Default: all k trees visible when the tab is first entered. We store it
  // as an array (stable React diffing) and treat it as a set semantically.
  const [astrVisible, setAstrVisible] = useState([]);
  // Hover-solo: when the user hovers a sidebar row we dim every other tree
  // in the canvas. Click pins the solo so it persists past mouse-leave.
  const [astrSolo, setAstrSolo] = useState(null);
  const [astrSoloPinned, setAstrSoloPinned] = useState(null);
  // ASTR-SRv6 profile selector: controls which DA format + behavior uSID
  // is shown in the header-preview panel. Defaults to C1 — the recommended
  // first-deployment profile (tutorial §8d.5).
  const [astrProfile, setAstrProfile] = useState('C1');
  // Currently-selected tree for the header-preview (independent of the
  // visibility set so the user can keep all trees visible while inspecting
  // one tree's packet format). Resolved lazily to the first visible tree
  // via the astrDescTree memo below.
  const [astrSelectedTreeId, setAstrSelectedTreeId] = useState(0);
  // User-picked root overrides, keyed by tree id. Clicking a node on the
  // ASTR canvas writes `{[astrSelectedTreeId]: nodeId}` here, and the
  // `astrEffective` memo re-roots that tree's forest at the chosen vertex.
  // Cleared per-tree via the "Reset root" button in the legend, or wholesale
  // whenever the graph rebuilds (new q → new trees → stale overrides).
  const [astrRootOverrides, setAstrRootOverrides] = useState({});

  // ASTR tree-construction method:
  //   'paper'      — SPAA'23 depth-bounded greedy scan (default).
  //                  Tries every vertex as a candidate root and only
  //                  accepts trees whose residual BFS spans within
  //                  depth ≤ 3 — matches the paper's depth guarantee.
  //   'matroid'    — Roskind-Tarjan matroid partition. Always hits
  //                  max k but forests can have large diameter; the
  //                  rooted depth is ⌈diam/2⌉ via 1-center choice.
  //   'bfs-scan'   — Paper-style greedy BFS scan with quadric→V1→V2
  //                  root ordering AND NO depth cap. Useful for
  //                  demonstrating how residual thinning inflates
  //                  depth for later trees.
  //   'bfs-random' — Same uncapped scan with a random root permutation.
  // Swapping this triggers a full re-pack via the `astrData` memo; the
  // overrides map is cleared because tree ids and forest adjacencies
  // change completely.
  const [astrTreeMethod, setAstrTreeMethod] = useState('low-depth');

  // ──────────────────────────────────────────────────────────────
  // ASTR pipelined all-reduce animation state.
  //
  // We animate a double-pipeline (Patarasuk-Yuan × SPAA multi-tree):
  //   p = chunks per tree (user-slider, 1..16)
  //   t = integer time step, 0 ≤ t ≤ p + 2·maxDepth - 1
  //
  // At time t, for each edge e at depth d_e in tree T (max-depth D_T):
  //   • REDUCE phase if chunk c_r = t - D_T + d_e ∈ [0, p)
  //   • BROADCAST phase if chunk c_b = t - D_T - d_e ∈ [0, p)
  // The tree edges carrying active chunks glow; everyone else dims.
  //
  // Play/pause cycles t via a `requestAnimationFrame` loop; stride and
  // wrap-around are handled by the dedicated `useEffect` below so
  // nothing spins unnecessarily while the user drags the time slider.
  // ──────────────────────────────────────────────────────────────
  const [pipelinePlaying, setPipelinePlaying] = useState(false);
  const [pipelineT, setPipelineT] = useState(0);
  const [pipelineP, setPipelineP] = useState(4);
  const [pipelineSpeed, setPipelineSpeed] = useState(1.0);

  // ─── ASTR spanning-tree diagram panel (right side of the ASTR canvas) ──
  // This floating panel draws *one* rooted spanning tree as a 2-D elbow
  // diagram (root at top). When a tree is solo'd (hover-solo or pinned),
  // that tree is always drawn. Otherwise the user shuffles through the
  // visible-tree set with the ◀/▶ arrows in the panel header.
  //
  //   astrTreePanelOpen  — master on/off toggle (show/hide the right sidebar).
  //   astrTreePanelWidth — resizable sidebar width, clamped to
  //                        [MIN..MAX] via the drag handle on its left edge.
  //   astrTreeBrowseIdx  — index into the visible-tree array when no solo.
  //                        Clamped whenever the visible set changes.
  //   astrTreeXStretch,
  //   astrTreeYStretch   — multipliers on column width / row height for
  //                        the diagram, 0.4..2.5, 1 = default.
  //   astrTreeZoom       — uniform zoom on the tree diagram, 0.5..3.0. Sits
  //                        above X/Y stretch so the user can *blow up* the
  //                        labels without also stretching the aspect ratio.
  const [astrTreePanelOpen, setAstrTreePanelOpen] = useState(true);
  const [astrTreePanelWidth, setAstrTreePanelWidth] = useState(360);
  const [astrTreeBrowseIdx, setAstrTreeBrowseIdx] = useState(0);
  const [astrTreeXStretch, setAstrTreeXStretch] = useState(1.0);
  const [astrTreeYStretch, setAstrTreeYStretch] = useState(1.0);
  const [astrTreeZoom, setAstrTreeZoom] = useState(1.0);
  // Tree-panel orientation: 'auto' picks vertical (root on top) when the
  // tree is deeper than it is wide (e.g. Hamiltonian paths with depth
  // (N-1)/2) and horizontal (root on left, rotated 90° CCW) when the
  // tree is shallow and wide (e.g. SPAA Construction-1 trees with
  // depth ≤ 3 and many leaves). 'vertical' and 'horizontal' override
  // the heuristic. Persisted so the user's preference survives reloads.
  const [astrTreeOrientation, setAstrTreeOrientation] = useState(() => {
    try {
      const v = localStorage.getItem('pf-astr-tree-orientation');
      return (v === 'auto' || v === 'vertical' || v === 'horizontal') ? v : 'auto';
    } catch { return 'auto'; }
  });
  useEffect(() => {
    try { localStorage.setItem('pf-astr-tree-orientation', astrTreeOrientation); } catch {}
  }, [astrTreeOrientation]);

  // Rack-expansion sandbox (used by rack/expansion UIs): tracks user-added
  // hypothetical racks and a rewiring flag — orthogonal to the `graph`
  // until wired to builders.
  const [expansionState, setExpansionState] = useState({ newRacks: [], rewiring: false });
  // `building` is toggled around `buildERGraph` inside the memo below so
  // loading indicators can reflect heavy q changes (same render tick as the
  // new graph).
  const [building, setBuilding] = useState(false);

  // GRAPH CONSTRUCTION: the ER_q polarity graph, rebuilt whenever q changes.
  // O(q^4) but runs in <200ms for q<=61 in modern browsers.
  const graph = useMemo(() => {
    setBuilding(true);
    const g = buildERGraph(q);
    setBuilding(false);
    return g;
  }, [q]);

  // CLUSTER PARTITION: groups vertices into quadric + non-quadric fan blades.
  const clusterData = useMemo(() => buildClusters(graph), [graph]);
  // Per-node cluster id for pathCost / boundary checks — stable for a given
  // `graph` because clusters are derived deterministically from it.
  const { nodeCluster } = clusterData;

  // ASTR MULTI-TREE PACKING: compute up to k = ⌊(q+1)/2⌋ edge-disjoint
  // spanning trees once per graph (or when the packing method
  // changes); reused by the ASTR tab, PetalView overlay, and the SRv6
  // cost/header card. Heavy step is O(N·(q+1)) per BFS scan iteration,
  // or O(|E|·|V|) for matroid exchange. Both fast for q ≤ 31.
  const astrData = useMemo(
    () => buildASTRTrees(graph, astrTreeMethod, clusterData),
    [graph, astrTreeMethod, clusterData]);

  // `astrEffective`: astrData with any user-picked root overrides applied.
  // Each tree retains its `forestAdj` (the undirected edge set of its
  // spanning forest), so re-rooting is just one BFS per overridden tree.
  // Everything downstream (overlay, sidebar, header preview, role table)
  // consumes astrEffective.trees instead of astrData.trees so the picked
  // root propagates consistently. Stats (achievedK, targetK, saturation)
  // are invariant under re-rooting and pass through unchanged.
  const astrEffective = useMemo(() => {
    const overrides = astrRootOverrides;
    const hasAny = Object.keys(overrides).length > 0;
    if (!hasAny) return astrData;
    const trees = astrData.trees.map((t) => {
      const nextRoot = overrides[t.id];
      if (nextRoot == null || nextRoot === t.root || !t.forestAdj) return t;
      const rerooted = rootForestAsTree(t.forestAdj, nextRoot, graph.N);
      if (!rerooted) return t;
      rerooted.id = t.id;
      rerooted.color = t.color;
      rerooted.forestAdj = t.forestAdj;
      return rerooted;
    });
    return { ...astrData, trees };
  }, [astrData, astrRootOverrides, graph.N]);

  // Per-node role table for the ASTR overlay and tooltips: for every
  // node n and every tree m, stores whether n is the root, an interior
  // node, or a leaf, plus its stage (depth from root). Built alongside
  // `astrEffective` (re-rooted trees) so roles always match what the
  // canvas is drawing.
  const astrRoles = useMemo(() => {
    const roles = Array.from({ length: graph.N }, () => []);
    for (const tree of astrEffective.trees) {
      for (let n = 0; n < graph.N; n++) {
        if (tree.parent[n] === -1) continue;
        const role = (n === tree.root)
          ? 'root'
          : (tree.children[n].length > 0 ? 'interior' : 'leaf');
        roles[n].push({
          treeId: tree.id,
          color: tree.color,
          role,
          stage: tree.depth[n],
        });
      }
    }
    return roles;
  }, [astrEffective, graph.N]);

  // When the graph changes (q change) reset ASTR visibility to "all
  // visible" so the user immediately sees the new tree count. Also
  // clamp the selected tree id into range, and drop any stale root
  // overrides since the tree forests are rebuilt from scratch.
  // Pipeline time is reset too so the animation restarts cleanly on a
  // fresh tree set (and to avoid a nonsense t value that was computed
  // off the old maxDepth).
  useEffect(() => {
    setAstrVisible(astrData.trees.map(t => t.id));
    setAstrSolo(null);
    setAstrSoloPinned(null);
    setAstrSelectedTreeId(id => Math.min(id, Math.max(0, astrData.achievedK - 1)));
    setAstrRootOverrides({});
    setPipelineT(0);
    setPipelinePlaying(false);
  }, [astrData]);

  // ──────────────────────────────────────────────────────────────
  // Pipeline schedule: for the current trees + chunk count + time
  // step, compute which tree/edge/phase is active.
  //
  // Returns:
  //   • maxDepth   — largest depth across visible trees (drives maxT)
  //   • maxT       — total animation length = p + 2·maxDepth - 1
  //   • edgeStateByTree[ti][ei] = {
  //       phase: 'reduce'|'broadcast'|'idle',
  //       chunk: number,  // chunk index for the active phase
  //       D: number,      // tree's max depth (useful for per-tree UI)
  //     }
  //   • activeByTree[ti] = summary string for the HUD
  //
  // `pipelineT` is integer (Math.floor of float state), so the memo
  // only recomputes when the step changes — smooth animation without
  // recomputing for every sub-step.
  // ──────────────────────────────────────────────────────────────
  const pipelineStep = Math.max(0, Math.floor(pipelineT));
  const pipelineData = useMemo(() => {
    const trees = astrEffective.trees;
    if (trees.length === 0) {
      return { maxDepth: 0, maxT: 0, edgeStateByTree: [], activeByTree: [] };
    }
    const perTree = trees.map((tree) => {
      let D = 0;
      for (const d of tree.depth) if (d > D) D = d;
      return D;
    });
    const maxDepth = Math.max(1, ...perTree);
    const maxT = Math.max(1, pipelineP + 2 * maxDepth - 1);
    const t = Math.min(pipelineStep, maxT);
    const edgeStateByTree = trees.map((tree, ti) => {
      const D = perTree[ti];
      return tree.edges.map((e) => {
        const d_e = e.stage; // child depth = edge's depth index
        const c_r = t - (D - d_e);         // REDUCE chunk: leaves→root
        const c_b = t - (D + d_e);         // BROADCAST chunk: root→leaves
        if (c_r >= 0 && c_r < pipelineP) {
          return { phase: 'reduce', chunk: c_r, D };
        }
        if (c_b >= 0 && c_b < pipelineP) {
          return { phase: 'broadcast', chunk: c_b, D };
        }
        return { phase: 'idle', chunk: -1, D };
      });
    });
    const activeByTree = edgeStateByTree.map((states) => {
      const counts = { reduce: 0, broadcast: 0 };
      for (const s of states) {
        if (s.phase === 'reduce') counts.reduce++;
        else if (s.phase === 'broadcast') counts.broadcast++;
      }
      if (counts.reduce === 0 && counts.broadcast === 0) return 'idle';
      if (counts.reduce > 0 && counts.broadcast > 0) {
        return `↑${counts.reduce} reduce · ↓${counts.broadcast} bcast`;
      }
      if (counts.reduce > 0) return `↑ reduce (${counts.reduce} edges)`;
      return `↓ broadcast (${counts.broadcast} edges)`;
    });
    return { maxDepth, maxT, edgeStateByTree, activeByTree };
  }, [astrEffective, pipelineP, pipelineStep]);

  // Pipeline animation loop. Uses requestAnimationFrame so the step
  // advance is synchronized to the browser's paint cadence; a
  // `startRef`/`lastTickRef` pair carries the fractional accumulator
  // across frames so the speed slider maps directly to "steps per
  // second" regardless of the user's monitor refresh rate. Auto-stops
  // at maxT so the animation parks at the final frame instead of
  // wrapping (the user can scrub backward with the slider).
  useEffect(() => {
    if (!pipelinePlaying) return undefined;
    const maxT = pipelineData.maxT;
    if (!(maxT > 0)) return undefined;
    let raf = 0;
    let lastTs = performance.now();
    const loop = (ts) => {
      const dtMs = ts - lastTs;
      lastTs = ts;
      // Speed is in "steps per second". We advance a float and let the
      // memo floor it for display.
      const delta = (dtMs / 1000) * pipelineSpeed * 1.5;
      setPipelineT((prev) => {
        const nxt = prev + delta;
        if (nxt >= maxT) {
          setPipelinePlaying(false);
          return maxT;
        }
        return nxt;
      });
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [pipelinePlaying, pipelineSpeed, pipelineData.maxT]);

  // ALL-PATHS ANALYSIS: enumerate alternative simple paths between src and dst
  // (via `findAlternativePaths`), score them under two link-cost policies,
