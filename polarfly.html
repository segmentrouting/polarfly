          <rect x={68} y={0} width={6} height={4} rx={1} fill={C.edgeIntra}/>
          <text x={77} y={4} fontSize="7" fill={tm('#94a3b8','#475569','#94a3b8','#000000')}>Intra-rack ports</text>
          <rect x={136} y={0} width={6} height={4} rx={1} fill={attachColor}/>
          <text x={145} y={4} fontSize="7" fill={tm('#94a3b8','#475569','#94a3b8','#000000')}>Attach</text>
        </g>

        {/*
          One SVG group per rack: chassis rect, cluster header, stacked switch
          rows, and summary caption.
        */}
        {visibleRacks.map((rack, idx) => {
          const ro = rackOrigin(idx);
          const rx = ro.x, ry = ro.y;
          const isActiveRack = linkFilter === 'rack' && filterRack === idx;
          const isHov = hoveredRack === idx;
          // When focusing a rack or switch, fade racks that are not the focus
          // target (unless `linkFilter === 'all'`, which shows everything).
          const dim = linkFilter !== 'none' && !isActiveRack
            && !(linkFilter === 'switch'
              && rack.switches.some(s => s.nodeId === filterSwitch))
            && !(linkFilter === 'all');

          return (
            <g key={rack.id} className="cursor-pointer"
              onClick={() => handleRackClick(rack, idx)}
              onDoubleClick={(e) => handleRackDblClick(e, rack)}
              onMouseEnter={() => setHoveredRack(idx)}
              onMouseLeave={() => setHoveredRack(null)}>
              {/* Main rack chassis — stroke highlights active (teal) or hover
                  (cyan) rack selection. */}
              <rect x={rx} y={ry} width={rackWidth} height={rackHeight} rx={5}
                fill={tm('#0f172a','#e2e8f0','#060608')}
                stroke={
                  isActiveRack
                    ? (isBw ? '#000000' : '#14b8a6')
                    : isHov
                      ? (isBw ? '#333333' : '#22d3ee')
                      : tm('#334155', '#94a3b8', '#1e293b', '#555555')
                }
                strokeWidth={isActiveRack || isHov ? 2 : 1}
                opacity={dim ? 0.35 : 1}/>

              {/*
                Cluster banner: red tint for quadric racks, green for
                non-quadric; two stacked rects form a simple header band.
              */}
              <rect x={rx} y={ry} width={rackWidth} height={20} rx={5}
                fill={isBw
                  ? (rack.clusterType === 'quadric' ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.08)')
                  : (rack.clusterType === 'quadric'
                      ? 'rgba(239,68,68,0.2)'
                      : 'rgba(34,197,94,0.15)')}
                opacity={dim ? 0.35 : 1}/>
              <rect x={rx} y={ry + 15} width={rackWidth} height={5}
                fill={isBw
                  ? (rack.clusterType === 'quadric' ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.08)')
                  : (rack.clusterType === 'quadric'
                      ? 'rgba(239,68,68,0.2)'
                      : 'rgba(34,197,94,0.15)')}
                opacity={dim ? 0.35 : 1}/>
              <text x={rx + rackWidth/2} y={ry + 13} textAnchor="middle"
                fill={tm('#cbd5e1','#1e293b','#c4b5fd')} fontSize="9" fontWeight="bold"
                opacity={dim ? 0.35 : 1}>
                {rack.clusterType === 'quadric' ? 'C0 Quadrics' : `C${rack.clusterId}`}
              </text>

              {/*
                Switch slots: vertical space is divided evenly across
                `rack.switches.length` (`swSlotH`). Each slot draws a horizontal
                strip (`sh` tall) with a sampled port grid: up to 16 columns
                across 32 logical ports (`ovStride` skips columns).
              */}
              {rack.switches.map((sw, si) => {
                const slotH = swSlotH(rack);
                const sy = ry + 24 + si * slotH;
                const sh = Math.max(7, slotH - 2);
                const typeColor = sw.isQuadric
                  ? C.quadric
                  : sw.vType === 1
                    ? C.v1
                    : C.v2;
                const isActiveSw = linkFilter === 'switch' && filterSwitch === sw.nodeId;
                const isHovSw = hoveredSwitch === sw.nodeId;
                const nRows = sw.numRows || 4;
                const ovPpr = rackModel.portsPerRow || 16;
                const ovSamples = Math.min(16, ovPpr);
                const ovStride = Math.max(1, Math.ceil(ovPpr / ovSamples));
                const rowH = Math.max(2, (sh - 6) / nRows);

                return (
                  <g key={si} onClick={(e) => handleSwitchClick(e, sw.nodeId)}
                    onMouseEnter={() => setHoveredSwitch(sw.nodeId)}
                    onMouseLeave={() => setHoveredSwitch(null)}>
                    <rect x={rx + 4} y={sy} width={rackWidth - 8} height={sh} rx={2}
                      fill={
                        isActiveSw
                          ? (isBw ? 'rgba(0,0,0,0.10)' : 'rgba(20,184,166,0.12)')
                          : isHovSw
                            ? (isBw ? 'rgba(0,0,0,0.06)' : 'rgba(34,211,238,0.08)')
                            : tm(
                              'rgba(255,255,255,0.06)',
                              'rgba(0,0,0,0.04)',
                              'rgba(255,255,255,0.04)',
                              'rgba(0,0,0,0.03)'
                            )
                      }
                      stroke={isActiveSw ? (isBw ? '#000000' : '#14b8a6') : typeColor}
                      strokeWidth={isActiveSw ? 1.2 : 0.6}
                      opacity={dim && !isActiveSw ? 0.35 : 1}/>
                    {/*
                      Port micro-dots: each logical row of the faceplate is
                      drawn as thin rects (`pw` wide). Connected ports use
                      intra purple vs inter emerald; idle ports are empty gray;
                      `external` uses attach color.
                    */}
                    {sh > 5 && sw.portRows && (
                      <>
                        {sw.portRows.map((row, ri) => (
                          <Fragment key={`row-${ri}`}>
                            {Array.from({length: ovSamples}, (_, pi) => {
                              const pw = Math.max(1, (rackWidth - 16) / ovSamples - 0.5);
                              const px = rx + 6 + pi * (pw + 0.5);
                              const port = row[pi * ovStride];
                              const py = sy + 2 + ri * rowH;
                              return (
                                <rect
                                  key={pi}
                                  x={px}
                                  y={py}
                                  width={pw}
                                  height={Math.min(2, rowH - 1)}
                                  fill={
                                    port?.connected
                                      ? (port.type === 'intra'
                                        ? C.edgeIntra
                                        : C.portConnected)
                                      : (port?.type === 'external'
                                        ? attachColor
                                        : C.portEmpty)
                                  }
                                  rx={0.3}
                                  opacity={dim && !isActiveSw ? 0.25 : 1}/>
                              );
                            })}
                          </Fragment>
                        ))}
                      </>
                    )}
                    {sh > 5 && (
                      <text x={rx + rackWidth / 2} y={sy + sh / 2 + 1} textAnchor="middle"
                        fill={typeColor} fontSize="6" fontWeight="bold" dominantBaseline="middle"
                        opacity={dim ? 0.3 : 0.7} pointerEvents="none">
                        N{sw.nodeId}
                      </text>
                    )}
                  </g>
                );
              })}

              {/*
                Rack footer: switch count, port matrix dimensions from
                `rackModel`, and sum of inter-rack links originating here.
              */}
              <text x={rx + rackWidth/2} y={ry + rackHeight - 6} textAnchor="middle"
                fill={tm('#94a3b8','#475569','#94a3b8')} fontSize="8" fontWeight="500" opacity={dim ? 0.35 : 1}>
                {`${rack.switches.length} sw x ${rackModel.portsPerSwitch}p ` +
                  `(${rackModel.numRows}x${rackModel.portsPerRow}) | ` +
                  `${rack.switches.reduce((s, sw) => s + sw.interLinks, 0)} inter`}
              </text>

              {/*
                Extra dashed frame when this rack is the rack-focus target
                (`linkFilter === 'rack'`).
              */}
              {isActiveRack && (
                <rect x={rx - 2} y={ry - 2} width={rackWidth + 4} height={rackHeight + 4} rx={7}
                  fill="none" stroke={isBw ? '#000000' : '#14b8a6'} strokeWidth={1.5} strokeDasharray="4,3" opacity={0.5}/>
              )}
            </g>
          );
        })}

        {/*
          Inter-rack and intra-rack Bézier paths (see `linkPaths` useMemo). Two
          layers per link: a thick invisible stroke for hit-testing (easier
          hover) and a thinner visible stroke colored by edge kind; hover
          thickens and brightens the visible path.
        */}
        {linkPaths.map(lp => (
          <g key={lp.key}
            onMouseEnter={() => setHoveredLink(lp)}
            onMouseLeave={() => setHoveredLink(null)}>
            <path d={lp.d} fill="none" stroke="transparent" strokeWidth={6}
              className="cursor-pointer"/>
            <path d={lp.d} fill="none" stroke={lp.color}
              strokeWidth={hoveredLink?.key === lp.key ? 2.5 : 1}
              opacity={hoveredLink?.key === lp.key ? 0.9 : 0.55}
              shapeRendering="geometricPrecision"/>
          </g>
        ))}

        {/*
          Hover adornment: small amber rings at the two computed anchor points
          (`ep1*`, `ep2*`) so the user sees exactly which ports the curve
          attaches to, matching the HTML tooltip below.
        */}
        {hoveredLink && (() => {
          const ringC = tm('#f59e0b', '#ea580c', '#f9a8d4', '#000000');
          return (
            <g pointerEvents="none">
              <circle cx={hoveredLink.ep1x} cy={hoveredLink.ep1y} r={5}
                fill="none" stroke={ringC} strokeWidth={0.6} opacity={0.85}/>
              <circle cx={hoveredLink.ep1x} cy={hoveredLink.ep1y} r={1}
                fill={ringC} opacity={0.85}/>
              <circle cx={hoveredLink.ep2x} cy={hoveredLink.ep2y} r={5}
                fill="none" stroke={ringC} strokeWidth={0.6} opacity={0.85}/>
              <circle cx={hoveredLink.ep2x} cy={hoveredLink.ep2y} r={1}
                fill={ringC} opacity={0.85}/>
            </g>
          );
        })()}


        {/*
          Placeholder silhouettes for racks proposed by expansion planning
          (orange dashed), not part of live topology yet.
        */}
        {expansionState?.newRacks?.map((newRack, idx) => {
          const totalIdx = racks.length + idx;
          const ro = rackOrigin(totalIdx);
          const rx = ro.x, ry = ro.y;
          return (
            <g key={`exp-${idx}`}>
              <rect x={rx} y={ry} width={rackWidth} height={rackHeight} rx={5}
                fill={tm('rgba(249,115,22,0.06)','rgba(249,115,22,0.06)','rgba(249,115,22,0.04)','rgba(0,0,0,0.05)')}
                stroke={C.expansion} strokeWidth={2} strokeDasharray="5,3"/>
              <text x={rx + rackWidth/2} y={ry + rackHeight/2 - 8} textAnchor="middle"
                fill={C.expansion} fontSize="11" fontWeight="bold">
                + New Rack
              </text>
              <text x={rx + rackWidth/2} y={ry + rackHeight/2 + 8} textAnchor="middle"
                fill={C.expansion} fontSize="9">
                {newRack.type === 'quadric' ? 'Quadric Replica' : 'Non-Quadric Replica'}
              </text>
              <text x={rx + rackWidth/2} y={ry + rackHeight/2 + 22} textAnchor="middle"
                fill={isBw ? '#555555' : '#10b981'} fontSize="8">
                No rewiring needed
              </text>
            </g>
          );
        })}
      </svg>
      </div>

      {/*
        Hovered-link tooltip (fixed, top-center): summarizes the edge’s
        endpoints (node ids and V1/V2/W roles), whether it is intra-rack or
        which two racks it bridges, then lists finite-field vectors and products
        used elsewhere in the app (adjacency check via dot mod q, cross
        product for routing context, normalized cross when present).
      */}
      {hoveredLink && (
        <div
          className="fixed z-50 rounded-xl shadow-2xl pointer-events-none"
          style={{
            left: '50%',
            top: 8,
            transform: 'translateX(-50%)',
            padding: '10px 16px',
            fontSize: 13,
            maxWidth: 480,
            background: tm(
              'rgba(15,23,42,0.97)',
              'rgba(255,255,255,0.97)',
              'rgba(10,10,14,0.97)'
            ),
            backdropFilter: 'blur(12px)',
            border: `1px solid ${tm(
              'rgba(100,116,139,0.4)',
              'rgba(203,213,225,0.6)',
              'rgba(100,116,139,0.25)'
            )}`,
            color: tm('#e2e8f0', '#1e293b', '#e2e8f0'),
          }}>
          {/*
            Headline: both endpoint node ids and their PolarFly roles (V1, V2,
            or W/quadric). Title color matches the edge accent so it visually
            ties to the graph/table row.
          */}
          <div className="font-semibold mb-1" style={{ color: hoveredLink.color }}>
            N{hoveredLink.src} ({hoveredLink.srcType}) {'<->'} N{hoveredLink.dst} ({hoveredLink.dstType})
            {/*
              Scope: single-rack “intra” vs two racks with a bidirectional arrow
              — same physical distinction as linkType in the data model.
            */}
            <span className="ml-2" style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
              {hoveredLink.linkType === 'intra'
                ? `Rack ${hoveredLink.rackA} (intra)`
                : `Rack ${hoveredLink.rackA} \u2194 Rack ${hoveredLink.rackB}`}
            </span>
          </div>
          {/*
            Finite-field view of the edge: 3-vectors for each endpoint, dot mod
            q (0 iff adjacent in the Polar space), raw cross, optional
            normalized cross used as relay direction elsewhere.
          */}
          <table style={{ fontSize: 12, borderCollapse: 'collapse' }}>
            <tbody>
              <tr>
                <td className="pr-2" style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                  src vec
                </td>
                <td className="font-mono">[{hoveredLink.vecS.join(', ')}]</td>
              </tr>
              <tr>
                <td className="pr-2" style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                  dst vec
                </td>
                <td className="font-mono">[{hoveredLink.vecD.join(', ')}]</td>
              </tr>
              {/*
                Dot product in F_q: zero encodes orthogonality /
                adjacency in the construction used for PolarFly links.
              */}
              <tr>
                <td className="pr-2" style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                  dot(s,d) mod {q}
                </td>
                <td className="font-mono">
                  {hoveredLink.dot}{' '}
                  {hoveredLink.dot === 0 ? '(adjacent)' : '(not adj)'}
                </td>
              </tr>
              {/*
                Cross product in F_q^3 — directional data for routing overlays;
                not necessarily unit length.
              */}
              <tr>
                <td className="pr-2" style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                  cross(s,d)
                </td>
                <td className="font-mono">[{hoveredLink.cross.join(', ')}]</td>
              </tr>
              {hoveredLink.normCross && (
                <tr>
                  {/*
                    Optional row: normalized cross — canonical “third” direction
                    on the projective line when `leftNormalize` yields a
                    representative.
                  */}
                  <td className="pr-2" style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                    norm cross
                  </td>
                  <td className="font-mono">[{hoveredLink.normCross.join(', ')}]</td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      )}

      {/*
        Scrollable connection table: one row per rendered path in `linkPaths`
        (same data as hover/CSV). Shown only when `filteredLinks` is non-empty.
        Header row count uses `linkPaths.length` (rendered edges). Controls:
        expand max height, export the same columns to CSV including optional
        bundle column when `bSize > 1`.
      */}
      {filteredLinks.length > 0 && (
        <div className="px-4 pb-4">
          <div className="flex items-center justify-between mb-2">
            {/*
              Count matches rendered `linkPaths` rows (post-filter topology
              edges), not necessarily raw adjacency list length.
            */}
            <div
              className="text-xs font-bold"
              style={{ color: tm('#cbd5e1', '#1e293b', '#c4b5fd') }}>
              Connections ({linkPaths.length})
            </div>
            <div className="flex gap-2 items-center">
              <label
                className="flex items-center gap-1 text-xs cursor-pointer"
                style={{ color: tm('#94a3b8', '#64748b', '#94a3b8') }}>
                <input
                  type="checkbox"
                  checked={showFullTable}
                  onChange={e => setShowFullTable(e.target.checked)}
                  className="rounded"/>
                Full table
              </label>
              {/*
                Builds a CSV mirroring the table columns: topology ids,
                rack/slot/port indices, bundle lane if applicable, then vector
                algebra.
              */}
              <button
                onClick={() => {
                  const bundleCol = bSize > 1 ? ',Bundle' : '';
                  const header =
                    `Link Type,Src Node,Src Type,Src Rack,Src Slot,Src Port,` +
                    `Dst Node,Dst Type,Dst Rack,Dst Slot,Dst Port${bundleCol},` +
                    `Src Vec,Dst Vec,dot,cross,norm_cross\n`;
                  const rows = linkPaths.map(lp => {
                    const bCol = bSize > 1
                      ? `,${(lp.bundleIdx ?? 0) + 1}/${bSize}`
                      : '';
                    const normCsv = lp.normCross
                      ? '[' + lp.normCross.join(',') + ']'
                      : '';
                    return (
                      `${lp.linkType},${lp.src},${lp.srcType},${lp.rackA},` +
                      `${lp.srcSlot},${lp.srcPort},${lp.dst},${lp.dstType},` +
                      `${lp.rackB},${lp.dstSlot},${lp.dstPort}${bCol},` +
                      `"[${lp.vecS.join(',')}]","[${lp.vecD.join(',')}]",` +
                      `${lp.dot},"[${lp.cross.join(',')}]","${normCsv}"`
                    );
                  }).join('\n');
                  const blob = new Blob([header + rows], { type: 'text/csv' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = 'polarfly_connections.csv';
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                }}
                className="px-2 py-0.5 text-xs rounded transition-colors"
                style={{
                  background: tm('#1e293b', '#f1f5f9', '#0f0f14', '#ffffff', '#0D2240'),
                  color: tm('#14b8a6', '#0d9488', '#a78bcc', '#000000'),
                  border: `1px solid ${tm(
                    'rgba(20,184,166,0.3)',
                    'rgba(13,148,136,0.3)',
                    'rgba(139,92,246,0.3)',
                    'rgba(0,0,0,0.35)'
                  )}`,
                }}>Download CSV</button>
            </div>
          </div>
          {/*
            When "Full table" is off, cap height so the overview stays compact;
            sticky thead keeps column titles visible while scrolling.
          */}
          <div
            className="overflow-auto rounded-lg"
            style={{
              maxHeight: showFullTable ? 'none' : 300,
              border: `1px solid ${tm(
                'rgba(100,116,139,0.3)',
                'rgba(203,213,225,0.5)',
                'rgba(100,116,139,0.2)'
              )}`,
            }}>
            <table
              className="w-full text-xs"
              style={{ borderCollapse: 'collapse' }}>
              <thead>
                <tr style={{
                  background: tm('#0f172a', '#f1f5f9', '#060608', undefined, '#0D2240'),
                  color: tm('#94a3b8', '#475569', '#64748b'),
                  position: 'sticky',
                  top: 0,
                  zIndex: 1,
                }}>
                  {/*
                    intra = same rack; inter = spans racks — drives
                    row text color via COLORS.edgeIntra vs
                    COLORS.portConnected (emerald).
                  */}
                  <th className="px-2 py-1.5 text-left font-semibold">Type</th>
                  <th className="px-2 py-1.5 text-left font-semibold">Src</th>
                  {/*
                    Rack:Slot:Port — physical placement in the rack model used
                    by RackDetailView.
                  */}
                  <th className="px-2 py-1.5 text-left font-semibold">Src Port</th>
                  <th className="px-2 py-1.5 text-left font-semibold">Dst</th>
                  <th className="px-2 py-1.5 text-left font-semibold">Dst Port</th>
                  {bSize > 1 && (
                    <th className="px-2 py-1.5 text-left font-semibold">Bundle</th>
                  )}
                  <th className="px-2 py-1.5 text-left font-semibold">Src Vec</th>
                  <th className="px-2 py-1.5 text-left font-semibold">Dst Vec</th>
                  <th className="px-2 py-1.5 text-left font-semibold">dot</th>
                  <th className="px-2 py-1.5 text-left font-semibold">cross</th>
                  <th className="px-2 py-1.5 text-left font-semibold">Racks</th>
                </tr>
              </thead>
              <tbody>
                {/*
                  Row hover updates the same `hoveredLink` object shape as graph
                  hover — keeps tooltip + table highlight in sync.
                */}
                {linkPaths.map(lp => {
                  const isHov = hoveredLink?.key === lp.key;
                  return (
                    <tr
                      key={lp.key}
                      onMouseEnter={() => setHoveredLink(lp)}
                      onMouseLeave={() => setHoveredLink(null)}
                      className="cursor-pointer"
                      style={{
                        background: isHov
                          ? tm(
                            'rgba(20,184,166,0.12)',
                            'rgba(20,184,166,0.08)',
                            'rgba(139,92,246,0.1)',
                            'rgba(0,0,0,0.08)'
                          )
                          : 'transparent',
                        color: tm('#e2e8f0', '#1e293b', '#e2e8f0'),
                        borderBottom: `1px solid ${tm(
                          'rgba(51,65,85,0.3)',
                          'rgba(203,213,225,0.3)',
                          'rgba(51,65,85,0.2)'
                        )}`,
                      }}>
                      {/*
                        Cyan for intra-rack hops; emerald (portConnected) for
                        inter-rack hops — mirrors faceplate colors in
                        RackDetailView.
                      */}
                      <td
                        className="px-2 py-1 font-mono"
                        style={{
                          color: lp.linkType === 'intra'
                            ? C.edgeIntra
                            : C.portConnected,
                          fontSize: 9,
                        }}>
                        {lp.linkType}
                      </td>
                      <td className="px-2 py-1 font-mono">
                        <span style={{ color: lp.color }}>N{lp.src}</span>
                        <span
                          className="ml-1"
                          style={{
                            color: tm('#64748b', '#94a3b8', '#475569'),
                            fontSize: 8,
                          }}>({lp.srcType})</span>
                      </td>
                      <td
                        className="px-2 py-1 font-mono"
                        style={{ color: tm('#64748b', '#94a3b8', '#94a3b8') }}>
                        R{lp.rackA}:S{lp.srcSlot}:P{lp.srcPort}
                      </td>
                      <td className="px-2 py-1 font-mono">
                        <span style={{ color: lp.color }}>N{lp.dst}</span>
                        <span
                          className="ml-1"
                          style={{
                            color: tm('#64748b', '#94a3b8', '#475569'),
                            fontSize: 8,
                          }}>({lp.dstType})</span>
                      </td>
                      <td
                        className="px-2 py-1 font-mono"
                        style={{ color: tm('#64748b', '#94a3b8', '#94a3b8') }}>
                        R{lp.rackB}:S{lp.dstSlot}:P{lp.dstPort}
                      </td>
                      {bSize > 1 && (
                        <td
                          className="px-2 py-1 font-mono"
                          style={{ color: tm('#64748b', '#94a3b8', '#94a3b8') }}>
                          {(lp.bundleIdx ?? 0) + 1}/{bSize}
                        </td>
                      )}
                      <td className="px-2 py-1 font-mono" style={{ fontSize: 9 }}>
                        [{lp.vecS.join(',')}]
                      </td>
                      <td className="px-2 py-1 font-mono" style={{ fontSize: 9 }}>
                        [{lp.vecD.join(',')}]
                      </td>
                      {/*
                        Green/red dot column: zero means endpoints obey
                        the Polar adjacency (orthogonal) relation for this edge.
                      */}
                      <td
                        className="px-2 py-1 font-mono"
                        style={{
                          color: lp.dot === 0
                            ? (isBw ? '#000000' : '#10b981')
                            : (isBw ? '#777777' : '#ef4444'),
                        }}>{lp.dot}</td>
                      <td className="px-2 py-1 font-mono" style={{ fontSize: 9 }}>
                        [{lp.cross.join(',')}]
                      </td>
                      <td
                        className="px-2 py-1 font-mono"
                        style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                        {lp.rackA === lp.rackB
                          ? `R${lp.rackA}`
                          : `${lp.rackA}\u2194${lp.rackB}`}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/**
 * Rack tab: overview vs per-rack detail; expansion buttons append virtual racks
 * to the model state.
 * @param {object} rackModel - Built racks, switches, and port wiring.
 * @param {function} onExpand - Adds a quadric or non-quadric replica rack.
 */
function RackView({
  graph,
  clusterData,
  rackModel,
  dk,
  expansionState,
  theme,
  palette = 'classic',
  selectedRack,
  setSelectedRack,
  viewMode,
  setViewMode,
  rackExpStep,
  bundleSize,
}) {
  const { racks } = rackModel;

  return (
    // `viewMode` toggles fleet-level rack tiles vs a single rack’s port/SVG
    // drill-down; key forces remount when port count or bundle lanes change so
    // layout math stays consistent.
    <div className="relative w-full">
      {viewMode === 'overview' ? (
        <RackOverview key={`${rackModel.portsPerSwitch}-${bundleSize}`}
          racks={racks} rackModel={rackModel} graph={graph} clusterData={clusterData}
          dk={dk} selectedRack={selectedRack} setSelectedRack={setSelectedRack}
          expansionState={expansionState} setViewMode={setViewMode} rackExpStep={rackExpStep}
          bundleSize={bundleSize || 1} theme={theme} palette={palette}/>
      ) : (
        <RackDetailView key={`${rackModel.portsPerSwitch}-${bundleSize}`}
          racks={racks} selectedRack={selectedRack} setSelectedRack={setSelectedRack}
          rackModel={rackModel} graph={graph} clusterData={clusterData} dk={dk}
          bundleSize={bundleSize || 1} theme={theme} palette={palette}/>
      )}
    </div>
  );
}

/**
 * RackDetailView: zoomed-in, port-level visualization of a single rack.
 *
 * LAYOUT: Two-panel view:
 *   LEFT PANEL: detailed port grid for each switch. Ports are arranged in rows
 *     of 32, color-coded by type (inter=emerald, intra=cyan, external=gray).
 *     Hovering a port shows the target node, link type, and algebraic context.
 *
 *   RIGHT PANEL: SVG "spine" diagram showing intra-rack arcs (quadratic Bezier)
 *     between switches and arrow stubs for inter-rack connections pointing
 *     outward to indicate which rack they target.
 *
 * PORT COLORING (base `fill` on each port `<rect>`; cable-hover uses a
 *   separate amber stroke overlay):
 *   - Connected inter-rack ports: emerald (`COLORS.portConnected`) — fabric
 *     links that leave this rack to another rack.
 *   - Connected intra-rack ports: cyan (`COLORS.edgeIntra`) — links that stay
 *     between switches inside this cabinet.
 *   - External / attach ports: theme gray (`attachColor`) — uncommitted or
 *     host/GPU attachment capacity.
 *   - Unused fabric ports: muted empty swatch (`COLORS.portEmpty`).
 *   - Active cable hover: participating endpoints also get an amber outline
 *     ring (distinct fill) so you see which
 *     physical jacks carry the hovered inter- or intra-rack connection.
 *
 * ARC GEOMETRY (paths drawn in the SVG block that follows this component’s
 *   JSX toolbar):
 *   Intra-rack links are quadratic Beziers (`Q`): a single control point sits
 *     to the RIGHT of the faceplate.
 *   Its horizontal offset scales with `arcSpread` and with the vertical
 *     separation between endpoints so longer
 *   hops bow more dramatically; parallel bundles add a small index-based
 *     horizontal stagger.
 *   Inter-rack links are short curved stubs from the port toward the left or
 *     right margin with arrow markers
 *   (`arr-left` / `arr-right`) — they indicate direction of exit, not the full
 *     cable run to the remote rack.
 *
 * @param {object|null} rack - Rack to render; null shows an empty prompt.
 */
function RackDetailView({
  racks,
  selectedRack,
  setSelectedRack,
  rackModel,
  graph,
  clusterData,
  dk,
  bundleSize,
  theme,
  palette = 'classic',
}) {

  // --- Theme and early exit ---
  // 4-arg tm() with bw fallback so the print/screenshot theme picks up black-on-white
  // chrome without every caller having to pass a bw value explicitly.
  const tm = (d, l, m, bw, c) => t2(theme || (dk ? 'dark' : 'light'), d, l, m, bw, c);
  const isMidnight = theme === 'midnight';
  const isBw = theme === 'bw';
  // Palette for edge / port colors: swaps to greyscale under 'bw' via getPalette.
  const C = getPalette(theme || (dk ? 'dark' : 'light'), palette);
  // Tooling accent (slider thumb, form accent-color). Shares the palette's
  // `accent` key so RackDetailView's Arc-spread slider matches every other
  // slider in the app — changing the palette retints them all in lockstep.
  const uiTint = uiAccent(theme || (dk ? 'dark' : 'light'), palette);
  const uiInputStyle = { accentColor: uiTint, '--thumb': uiTint };
  // Attach / “external” ports: neutral gray so they read as uncommitted
  // fabric-facing or host-facing I/O, distinct from wired inter (emerald) and
  // intra (cyan). bw uses a darker gray for readability on white.
  const attachColor = tm('#6b7280', '#9ca3af', '#4b5563', '#555555');
  const rackIdx = selectedRack || 0;
  const rack = racks[rackIdx];
  if (!rack) {
    return (
      <div
        className="p-4 text-xs"
        style={{color:tm('#64748b','#94a3b8','#475569')}}>
        Select a rack to view details
      </div>
    );
  }

  // --- Port grid geometry ---
  // Each switch is rendered as a horizontal row of tiny port rectangles.
  // Port width/height/gap are in SVG pixels. Multiple rows stack vertically
  // within each switch's faceplate area.
  const ppr = rackModel.portsPerRow || 16;  // ports per row (16 standard)
  const nRows = rackModel.numRows || 4;      // rows per switch faceplate
  const { adj, vertices, q, isQuadric, vType } = graph;
  const { nodeCluster, clusters } = clusterData;
  const portW = 7;       // width of each port rectangle (SVG px)
  const portH = 4;       // height of each port rectangle
  const portGap = 0.8;   // horizontal gap between ports
  const swH = nRows * (portH + 2) + 10;  // total height per switch slot
  const labelW = 34;     // space for switch label on the left
  // Reserved horizontal strip inside the SVG viewBox to the left of the
  // faceplate: short inter-rack arrow glyphs draw here without overlapping port
  // columns.
  const arrowM = 20;     // margin for inter-rack arrow stubs
  const portsRowW = ppr * (portW + portGap);  // total width of one port row
  // Faceplate grid begins after label column + arrow strip — matches `<text>`
  // anchor for “N{nodeId}” and inter-arrow x positions.
  const boxLeft = labelW + arrowM;  // X offset where ports start
  const swGap = 4;       // vertical gap between switch rows

  // --- Local state ---
  const [hoveredPort, setHoveredPort] = React.useState(null);
  const [expandedSw, setExpandedSw] = React.useState(null);
  const [focusedSwIdx, setFocusedSwIdx] = React.useState(null);
  const [arcSpread, setArcSpread] = React.useState(0.3);

  const [dtZoom, setDtZoom] = React.useState(1);
  const [dtPan, setDtPan] = React.useState({ x: 0, y: 0 });
  const [dtDragging, setDtDragging] = React.useState(false);
  const [dtDragStart, setDtDragStart] = React.useState({ x: 0, y: 0 });
  const dtSvgRef = React.useRef(null);

  // --- Derived layout dimensions ---
  const displayCount = focusedSwIdx !== null ? 1 : rack.switches.length;
  const svgH = displayCount * (swH + swGap) + 22;
  // Right-hand breathing room: scales with `arcSpread` and switch count so
  // multi-switch racks still have space for outward-bowing intra-rack arcs
  // between stacked faceplates.
  const arcMarginR = Math.max(arrowM + 10, 20 + displayCount * 4 * arcSpread);
  const totalW = boxLeft + portsRowW + 4 + arcMarginR;

  const dtVBW = totalW / dtZoom;
  const dtVBH = svgH / dtZoom;
  const dtViewBox = `${dtPan.x} ${dtPan.y} ${dtVBW} ${dtVBH}`;

  const handleDtWheel = (e) => {
    e.preventDefault();
    const svg = dtSvgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * dtVBW + dtPan.x;
    const my = ((e.clientY - rect.top) / rect.height) * dtVBH + dtPan.y;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const z2 = Math.max(0.5, Math.min(10, dtZoom * factor));
    const newW = totalW / z2, newH = svgH / z2;
    const nx = mx - (mx - dtPan.x) * (newW / dtVBW);
    const ny = my - (my - dtPan.y) * (newH / dtVBH);
    setDtZoom(z2);
    setDtPan({ x: nx, y: ny });
  };
  const handleDtMouseDown = (e) => {
    if (e.button === 1 || e.button === 0) {
      e.preventDefault();
      setDtDragging(true);
      setDtDragStart({ x: e.clientX, y: e.clientY });
    }
  };
  const handleDtMouseMove = (e) => {
    if (!dtDragging) return;
    const svg = dtSvgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const dx = (e.clientX - dtDragStart.x) / rect.width * dtVBW;
    const dy = (e.clientY - dtDragStart.y) / rect.height * dtVBH;
    setDtPan(p => ({ x: p.x - dx, y: p.y - dy }));
    setDtDragStart({ x: e.clientX, y: e.clientY });
  };
  const handleDtMouseUp = () => setDtDragging(false);

  // Projective typing for labels and swatches: quadric “W” vs bipartition
  // sides V1/V2 (non-quadric vertices).
  const typeName = (nid) => isQuadric[nid] ? 'W' : vType[nid] === 1 ? 'V1' : 'V2';
  const typeColor = (nid) => isQuadric[nid] ? C.quadric : vType[nid] === 1 ? C.v1 : C.v2;
  // Cluster center flag — used to annotate whether a neighbor is the
  // designated hub of its local cluster.
  const isCenter = (nid) => clusters.some(c => c.center === nid);

  // --- Per-switch computed detail ---
  // For each switch, precompute its algebraic properties and neighbor info:
  //   - selfDot: 0 = quadric (on the conic), nonzero = off-quadric.
  //   - For each neighbor: dot product (should be 0 since they're adjacent),
  //     cross product, and normalized cross product (the relay node).
  //   - Split neighbors into inter-rack (cables leaving) vs intra-rack (local).
  const switchDetails = useMemo(() => {
    return rack.switches.map(sw => {
      const nid = sw.nodeId;
      const vec = vertices[nid];
      const selfDot = dotProduct(vec, vec, graph.F);
      const neighbors = adj[nid];
      const interNeighbors = neighbors.filter(n => !rack.nodeIds.includes(n));
      const intraNeighbors = neighbors.filter(n => rack.nodeIds.includes(n));

      // One row per graph neighbor: carries finite-field dot (0 expected on
      // edges), cross, relay via left-normalized cross, and whether the cable
      // stays inside this rack (`isIntra`) vs leaves to another rack.
      const neighborDetails = neighbors.map(nbr => {
        const nbrVec = vertices[nbr];
        const dot = dotProduct(vec, nbrVec, graph.F);
        const cross = crossProduct(vec, nbrVec, graph.F);
        const normCross = leftNormalize(cross, graph.F);
        const isIntra = rack.nodeIds.includes(nbr);
        return {
          nid: nbr, vec: nbrVec, dot, cross, normCross,
          type: typeName(nbr), color: typeColor(nbr),
          isIntra, cluster: nodeCluster[nbr],
          isCenter: isCenter(nbr)
        };
      });

      return {
        nid, vec, selfDot,
        type: typeName(nid), color: typeColor(nid),
        isCenterNode: isCenter(nid),
        cluster: nodeCluster[nid],
        degree: neighbors.length,
        interCount: interNeighbors.length,
        intraCount: intraNeighbors.length,
        neighbors: neighborDetails
      };
    });
  }, [rack, vertices, q, adj, nodeCluster, clusters]);

  const focusedSw = focusedSwIdx !== null ? switchDetails[focusedSwIdx] : null;

  // ═══ SVG LINK GEOMETRY: ARCS + ARROWS ═══
  // Two types of visual links in the detail view:
  //   INTRA-RACK: quadratic Bezier arcs connecting ports on two different
  //     switches within this same rack. Arcs bow to the right, with depth
  //     proportional to the slot distance between endpoints.
  //   INTER-RACK: small arrow stubs pointing LEFT from a port, indicating
  //     an outgoing cable to another rack. The arrow label shows the target
  //     rack and switch.
  const linkData = useMemo(() => {
    const intraLinks = [];
    // Inter-rack stubs: screen-space anchors for small arrows that denote cables
    // exiting the rack toward peer switches (not full polylines to remote
    // racks).
    const interArrows = [];
    // Convert a flat port index (0..radix-1) to SVG (x, rowOffset) coordinates.
    const getPortXY = (flatIdx) => {
      const col = Math.floor(flatIdx / nRows);
      const row = flatIdx % nRows;
      const x = boxLeft + 2 + col * (portW + portGap) + portW / 2;
      const rowY = row * (portH + 2);
      return { x, rowOffset: rowY + portH / 2 + 2 };
    };
    // Undirected intra-rack edges: we key switch pairs (min,max) so each
    // unordered pair yields one Bezier arc bundle, not two.
    const drawnPairs = new Set();  // avoid drawing A->B and B->A twice

    rack.switches.forEach((sw, si) => {
      if (focusedSwIdx !== null && si !== focusedSwIdx) return;
      const displayIdx = focusedSwIdx !== null ? 0 : si;
      const sy = 14 + displayIdx * (swH + swGap);

      // Only ports wired to another switch in the same rack — these become the
      // curved arcs on the right side of the faceplate.
      const intraPorts = sw.allPorts
        .map((p, pi) => ({...p, flatIdx: pi}))
        .filter(p => p.connected && p.type === 'intra');

      const targetGroups = {};
      intraPorts.forEach(p => {
        const targetSi = rack.switches.findIndex(s => s.nodeId === p.target);
        if (targetSi === -1 || targetSi === si) return;
        if (focusedSwIdx !== null && targetSi !== focusedSwIdx) return;
        const key = Math.min(si, targetSi) + '-' + Math.max(si, targetSi);
        if (!targetGroups[key]) targetGroups[key] = { targetSi, srcPorts: [] };
        targetGroups[key].srcPorts.push(p.flatIdx);
      });

      Object.entries(targetGroups).forEach(([key, grp]) => {
        if (drawnPairs.has(key)) return;
        drawnPairs.add(key);
        const targetSw = rack.switches[grp.targetSi];
        const targetDisplayIdx = focusedSwIdx !== null ? 0 : grp.targetSi;
        const targetSy = 14 + targetDisplayIdx * (swH + swGap);

        // Reverse-direction intra ports on the peer switch that point back to
        // `sw` — paired in lockstep with `srcPorts` to form one logical cable
        // per index k (bundle lanes).
        const dstFlatIndices = targetSw.allPorts
          .map((p, pi) => ({...p, flatIdx: pi}))
          .filter(p => p.connected && p.type === 'intra' && p.target === sw.nodeId)
          .map(p => p.flatIdx);

        const pairCount = Math.min(grp.srcPorts.length, dstFlatIndices.length);
        for (let k = 0; k < pairCount; k++) {
          const src = getPortXY(grp.srcPorts[k]);
          const dst = getPortXY(dstFlatIndices[k]);
          // Store endpoint centers only; the visible path is built as
          // `M x1 y1 Q bowX midY x2 y2` where `bowX`/`midY` incorporate
          // `arcSpread` in the renderer below.
          intraLinks.push({
            x1: src.x, y1: sy + src.rowOffset,
            x2: dst.x, y2: targetSy + dst.rowOffset,
            srcNid: sw.nodeId, dstNid: targetSw.nodeId,
            srcPort: grp.srcPorts[k], dstPort: dstFlatIndices[k]
          });
        }
      });

      // Pair inter-rack ports with a concrete remote port index for
      // tooltips/labels: when multiple parallel links exist between the same node
      // pair, consume distinct remote faceplate positions in stable order.
      const remoteUsed = {};
      sw.allPorts.forEach((port, pi) => {
        if (!port.connected || port.type !== 'inter') return;
        const pos = getPortXY(pi);
        const px = pos.x;
        const py = sy + pos.rowOffset;
        let remotePort = null;
        const rmKey = `${sw.nodeId}-${port.target}`;
        const usedSet = remoteUsed[rmKey] || new Set();
        for (const r of racks) {
          for (const rsw of r.switches) {
            if (rsw.nodeId === port.target) {
              for (let rpi = 0; rpi < rsw.allPorts.length; rpi++) {
                const rp = rsw.allPorts[rpi];
                if (rp.connected && rp.target === sw.nodeId && !usedSet.has(rpi)) {
                  remotePort = rpi;
                  usedSet.add(rpi);
                  break;
                }
              }
              break;
            }
          }
          if (remotePort !== null) break;
        }
        remoteUsed[rmKey] = usedSet;
        // `isTopHalf` hints label placement (upper vs lower port row) so arrow
        // callouts do not collide when stacked.
        interArrows.push({
          px,
          py,
          si: displayIdx,
          portIdx: pi,
          target: port.target,
          srcNid: sw.nodeId,
          remotePort,
          isTopHalf: pi < ppr,
        });
      });
    });
    return { intraLinks, interArrows };
  }, [rack, racks, focusedSwIdx, boxLeft, portW, portGap, portH, swH, ppr, nRows, bundleSize]);

  // Expanded right-hand “Switch details” text panel (neighbor table, vectors):
  // header click toggles via `setDetailsOpen` later in this component.
  const [detailsOpen, setDetailsOpen] = React.useState(true);
  // Tracks which intra or inter cable segment is under the pointer for the
  // floating cable tooltip (distinct from `hoveredPort`, which is faceplate
  // ports).
  const [hoveredCable, setHoveredCable] = React.useState(null);

  // --- Render ---
  return (
    <div style={{padding:12}}>
      {/* Top bar: rack nav + switch nav + legend */}
      <div style={{marginBottom:4}}>
        <div className="flex items-center gap-2 mb-1.5 flex-wrap">
          {/* Previous rack in list — disabled at index 0. */}
          {/*
            Step to the previous physical rack in the ordered rack list;
            disabled at rack 0 so navigation cannot underflow.
          */}
          <button
            onClick={() => setSelectedRack(Math.max(0, rackIdx - 1))}
            disabled={rackIdx === 0}
            className="px-1.5 py-0.5 text-xs rounded font-semibold transition-colors disabled:opacity-30"
            style={{
              background: tm('#1e293b', '#f1f5f9', '#0f0f14'),
              color: tm('#94a3b8', '#64748b', '#94a3b8'),
            }}>
            {'\u25C0'}
          </button>
          {/*
            Changing rack clears single-switch focus so you always land in a
            sensible “all switches” layout for the newly selected cabinet.
          */}
          <select
            value={rackIdx}
            onChange={e => {
              setSelectedRack(+e.target.value);
              setFocusedSwIdx(null);
            }}
            className="text-xs rounded px-1.5 py-0.5 font-mono"
            style={{
              background: tm('#0f172a', '#f8fafc', '#060608', undefined, '#0D2240'),
              color: tm('#e2e8f0', '#1e293b', '#e2e8f0'),
              border: `1px solid ${tm(
                'rgba(100,116,139,0.3)',
                'rgba(203,213,225,0.4)',
                'rgba(100,116,139,0.2)',
              )}`,
            }}>
            {/*
              One `<option>` per rack: shows rack id, which cluster it belongs
              to, and cluster flavor (e.g. quadric vs fan) for quick orientation.
            */}
            {racks.map((r, i) => (
              <option key={i} value={i}>
                Rack {r.id} -- C{r.clusterId} ({r.clusterType})
              </option>
            ))}
          </select>
          {/* Next rack — disabled on last rack. */}
          <button
            onClick={() =>
              setSelectedRack(Math.min(racks.length - 1, rackIdx + 1))
            }
            disabled={rackIdx >= racks.length - 1}
            className="px-1.5 py-0.5 text-xs rounded font-semibold transition-colors disabled:opacity-30"
            style={{
              background: tm('#1e293b', '#f1f5f9', '#0f0f14'),
              color: tm('#94a3b8', '#64748b', '#94a3b8'),
            }}>
            {'\u25B6'}
          </button>
          {/*
            Faceplate capacity summary: switches in this rack × ports per
            switch, decomposed into row × column geometry used by `getPortXY`.
          */}
          <span className="text-xs font-mono" style={{color:tm('#64748b','#94a3b8','#475569')}}>
            {rack.switches.length} sw x {rackModel.portsPerSwitch} ports ({nRows} rows x {ppr})
          </span>
          <span className="mx-1 text-xs" style={{color:tm('#334155','#cbd5e1','#1e293b')}}>|</span>
          <span className="text-xs font-semibold" style={{color:tm('#94a3b8','#64748b','#94a3b8')}}>Sw:</span>
          {/*
            “All”: show every switch faceplate stacked vertically in one SVG;
            intra-rack arcs and inter-rack stubs consider all switches.
            Single-switch focus collapses to one row for readability and
            restricts arc computation to links involving that switch only (see
            `linkData` useMemo above).
          */}
          <button
            onClick={() => setFocusedSwIdx(null)}
            className="px-1 py-0 text-xs rounded transition-colors"
            style={{
              background:
                focusedSwIdx === null
                  ? tm('#14b8a6', '#14b8a6', '#8b5cf6', '#000000')
                  : tm('#1e293b', '#f1f5f9', '#0f0f14'),
              color:
                focusedSwIdx === null
                  ? '#fff'
                  : tm('#94a3b8', '#64748b', '#94a3b8'),
              fontSize: 10,
            }}>
            All
          </button>
          {rack.switches.map((sw, i) => {
            // Chip color follows vertex class (quadric “W” vs bipartition V1
            // vs V2) — same legend language as the global Petal/graph view so
            // operators can correlate rack chips with topology coloring.
            const c = sw.isQuadric
              ? C.quadric
              : sw.vType === 1
                ? C.v1
                : C.v2;
            return (
              // Toggle: clicking the active chip again clears focus (`null`);
              // otherwise focus that switch index for faceplate + detail panel
              // filtering.
              <button
                key={i}
                onClick={() =>
                  setFocusedSwIdx(focusedSwIdx === i ? null : i)
                }
                className="px-1 py-0 rounded font-mono transition-colors"
                style={{
                  fontSize: 10,
                  background:
                    focusedSwIdx === i ? c : tm('#1e293b', '#f1f5f9', '#0f0f14'),
                  color: focusedSwIdx === i ? '#fff' : c,
                  border: `1px solid ${focusedSwIdx === i ? c : 'transparent'}`,
                }}>
                N{sw.nodeId}
              </button>
            );
          })}
        </div>
        {/*
          Legend: port rectangle colors mirror the `fill` branch in the port
          `<rect>` loop below — Inter = cable to another rack, Intra = same-rack
          link, Attach = external/plane wiring, Unused = no link.
        */}
        <div
          className="flex gap-3 text-xs items-center"
          style={{ color: tm('#94a3b8', '#64748b', '#94a3b8'), fontSize: 10 }}>
          {/*
            Inter-cluster / inter-rack ports use `COLORS.portConnected` when the
            port is connected and not classified as intra (see port fill logic).
          */}
          <span className="flex items-center gap-1">
            <span
              className="w-2.5 h-1.5 inline-block rounded-sm"
              style={{ background: C.portConnected }}
            />
            {' '}
            Inter
          </span>
          {/*
            Intra-rack links share `COLORS.edgeIntra` with the curved arcs
            between faceplates.
          */}
          <span className="flex items-center gap-1">
            <span
              className="w-2.5 h-1.5 inline-block rounded-sm"
              style={{ background: C.edgeIntra }}
            />
            {' '}
            Intra
          </span>
          {/*
            “Attach” marks ports reserved for external attachment
            (`port.type === 'external'`) using the theme-aware `attachColor`
            swatch.
          */}
          <span className="flex items-center gap-1">
            <span
              className="w-2.5 h-1.5 inline-block rounded-sm"
              style={{ background: attachColor }}
            />
            {' '}
            Attach
          </span>
          <span className="flex items-center gap-1">
            <span
              className="w-2.5 h-1.5 inline-block rounded-sm"
              style={{ background: C.portEmpty }}
            />
            {' '}
            Unused
          </span>
          <span
            className="mx-1"
            style={{ color: tm('#334155', '#cbd5e1', '#1e293b') }}>
            |
          </span>
          {/*
            Arc spread scales both `arcMarginR` (layout) and the Bezier
            control-point offsets for intra-rack arcs and inter-rack stub curves
            — slider stores tenths internally (0–40 → 0.0–4.0).
          */}
          <span className="flex items-center gap-1">
            Arc spread
            <input type="range" min={0} max={40} value={arcSpread * 10}
              onChange={e => setArcSpread(+e.target.value / 10)}
              style={{width:60, ...uiInputStyle}}/>
            <span className="font-mono" style={{minWidth:20}}>{arcSpread.toFixed(1)}</span>
          </span>
          <span style={{ color: tm('#475569', '#94a3b8', '#334155'), display: 'inline-flex', alignItems: 'center', gap: 4, marginLeft: 4 }}>
            |
          </span>
          <span className="flex items-center gap-1">
            Zoom
            <input type="range" min={0.5} max={10} step={0.1} value={dtZoom}
              onChange={e => {
                const z2 = parseFloat(e.target.value);
                const cx = dtPan.x + totalW / dtZoom / 2;
                const cy = dtPan.y + svgH / dtZoom / 2;
                setDtZoom(z2);
                setDtPan({ x: cx - totalW / z2 / 2, y: cy - svgH / z2 / 2 });
              }}
              style={{width: 60, ...uiInputStyle}}/>
            <span className="font-mono" style={{minWidth: 28}}>{dtZoom.toFixed(1)}x</span>
            <button onClick={() => { setDtZoom(1); setDtPan({ x: 0, y: 0 }); }}
              style={{ fontSize: 9, padding: '1px 4px', borderRadius: 3,
                background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                color: tm('#94a3b8','#64748b','#94a3b8'),
                border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,
                cursor: 'pointer' }}>
              Reset
            </button>
          </span>
        </div>
      </div>

      {/*
        Floating tooltip for faceplate ports: follows pointer (`clientX`/
        `clientY` captured on mouse enter); `pointer-events-none` so it never
        steals hover from the SVG.
      */}
      {hoveredPort && (
        <div
          className="fixed z-50 rounded-xl shadow-2xl pointer-events-none"
          style={{
            left: hoveredPort.mx + 12,
            top: hoveredPort.my - 10,
            padding: '6px 10px',
            fontSize: 11,
            background: tm(
              'rgba(15,23,42,0.95)',
              'rgba(255,255,255,0.95)',
              'rgba(10,10,14,0.96)',
            ),
            backdropFilter: 'blur(12px)',
            border: `1px solid ${tm(
              'rgba(100,116,139,0.4)',
              'rgba(203,213,225,0.6)',
              'rgba(100,116,139,0.25)',
            )}`,
            color: tm('#e2e8f0', '#1e293b', '#e2e8f0'),
          }}>
          {/*
            Flat index matches `getPortXY` / row-major order; row/col are the
            grid coordinates on the faceplate.
          */}
          <div className="font-mono" style={{fontWeight: 'bold'}}>
            Port {hoveredPort.physPort || (hoveredPort.idx + 1)}{' '}
            <span style={{fontWeight: 'normal', opacity: 0.7}}>
              (col {(hoveredPort.physCol ?? hoveredPort.col) + 1}, row {(hoveredPort.physRow ?? hoveredPort.row) + 1})
            </span>
          </div>
          <div className="font-mono">
            {hoveredPort.connected
              ? `\u2192 N${hoveredPort.target} (${hoveredPort.type})`
              : 'Attach / host port'}
          </div>
          {hoveredPort.connected && hoveredPort.targetVec && (
            <div
              className="font-mono mt-0.5"
              style={{
                fontSize: 10,
                color: tm('#94a3b8', '#64748b', '#94a3b8'),
              }}>
              vec=[{hoveredPort.targetVec.join(',')}] dot={hoveredPort.dot}
            </div>
          )}
        </div>
      )}

      {/*
        Separate tooltip for cable geometry (invisible hit paths on arcs/stubs):
        explains intra-rack Bezier vs inter-rack arrow stub using the same
        indices as `linkData.intraLinks` / `linkData.interArrows`.
      */}
      {hoveredCable && (
        <div
          className="fixed z-50 rounded-xl shadow-2xl pointer-events-none"
          style={{
            left: hoveredCable.mx + 12,
            top: hoveredCable.my - 10,
            padding: '6px 10px',
            fontSize: 12,
            background: tm(
              'rgba(15,23,42,0.95)',
              'rgba(255,255,255,0.95)',
              'rgba(10,10,14,0.96)',
            ),
            backdropFilter: 'blur(12px)',
            border: `1px solid ${tm(
              'rgba(100,116,139,0.4)',
              'rgba(203,213,225,0.6)',
              'rgba(100,116,139,0.25)',
            )}`,
            color: tm('#e2e8f0', '#1e293b', '#e2e8f0'),
          }}>
          {hoveredCable.type === 'intra' ? (
            <Fragment>
              <div
                className="font-semibold"
                style={{ color: C.edgeIntra }}>
                Intra-rack link
              </div>
              <div className="font-mono">
                N{hoveredCable.srcNid} port {hoveredCable.srcPort} {'\u2194'}{' '}
                N{hoveredCable.dstNid} port {hoveredCable.dstPort}
              </div>
            </Fragment>
          ) : (
            <Fragment>
              <div
                className="font-semibold"
                style={{ color: C.edgeInter }}>
                Inter-rack link
              </div>
              <div className="font-mono">
                N{hoveredCable.srcNid} port {hoveredCable.portIdx} {'\u2194'}{' '}
                N{hoveredCable.target} port{' '}
                {hoveredCable.remotePort !== null
                  ? hoveredCable.remotePort
                  : '?'}
              </div>
            </Fragment>
          )}
        </div>
      )}

      {/* Side-by-side: SVG left, Switch Details right */}
      <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
        {/*
          Left: rack SVG – use padding-bottom aspect-ratio trick so the
          responsive box keeps the same width/height ratio as `viewBox`
          (`svgH`/`totalW`) without hard-coded pixel height.
        */}
        <div
          style={{
            width: '55%',
            minWidth: 300,
            minHeight: 200,
            height: Math.max(400, (svgH / totalW) * 500),
            flexShrink: 0,
            position: 'relative',
            resize: 'both',
            overflow: 'hidden',
            border: `1px solid ${tm('rgba(71,85,105,0.3)','rgba(203,213,225,0.4)','rgba(71,85,105,0.2)')}`,
            borderRadius: 6,
          }}>
            <svg
              ref={dtSvgRef}
              viewBox={dtViewBox}
              style={{
                width: '100%',
                height: '100%',
                cursor: dtDragging ? 'grabbing' : 'default',
              }}
              onWheel={handleDtWheel}
              onMouseDown={handleDtMouseDown}
              onMouseMove={handleDtMouseMove}
              onMouseUp={handleDtMouseUp}
              onMouseLeave={handleDtMouseUp}>
            <defs>
              {/*
                Arrowheads for inter-rack stubs: `arr-left` tips point toward
                negative x (stub exits left from even port index); `arr-right`
                tips toward positive x (odd ports). refX aligns the tip to the
                path end.
              */}
              <marker id="arr-left" markerWidth="4" markerHeight="3" refX="0" refY="1.5" orient="auto">
                <path d="M4,0 L0,1.5 L4,3" fill={C.edgeInter} opacity={isBw ? 1 : 0.7}/>
              </marker>
              <marker id="arr-right" markerWidth="4" markerHeight="3" refX="4" refY="1.5" orient="auto">
                <path d="M0,0 L4,1.5 L0,3" fill={C.edgeInter} opacity={isBw ? 1 : 0.7}/>
              </marker>
            </defs>
            <rect width="100%" height="100%" fill={tm('#080e1a','#ffffff','#020204','#ffffff','#07182C')}/>

            {rack.switches.map((sw, si) => {
              // When a single switch is focused, skip rendering other switches’
              // faceplates entirely.
              if (focusedSwIdx !== null && si !== focusedSwIdx) return null;
              // Collapse focused mode to a single vertical slot (`displayIdx`
              // 0) so `sy` matches the lone `linkData` stack.
              const displayIdx = focusedSwIdx !== null ? 0 : si;
              const sy = 14 + displayIdx * (swH + swGap);
              const swColor = sw.isQuadric
                ? C.quadric
                : sw.vType === 1
                  ? C.v1
                  : C.v2;

              return (
                <g key={si}>
                  {/*
                    Switch chassis outline + left accent strip + label —
                    colors follow quadric/V1/V2 classification.
                  */}
                  <rect x={boxLeft} y={sy} width={portsRowW + 4} height={swH} rx={2}
                    fill={tm('#0f172a','#e2e8f0','#040406','#f5f5f5','#0D2240')}
                    stroke={swColor} strokeWidth={1}/>
                  <rect x={boxLeft} y={sy} width={2.5} height={swH} rx={1} fill={swColor}/>
                  <text x={boxLeft - 3} y={sy + swH/2} textAnchor="end"
                    fill={swColor} fontSize="6" fontWeight="bold" dominantBaseline="middle">
                    N{sw.nodeId}
                  </text>

                  {sw.portRows.map((row, ri) => (
                    <Fragment key={`row-${ri}`}>
                      {row.map((port, pi) => {
                        const px = boxLeft + 2 + pi * (portW + portGap);
                        const py = sy + 2 + ri * (portH + 2);
                        // Port fill encodes link kind: wired intra-rack → mint
                        // intra color; wired inter/other → “Inter” swatch;
                        // unwired external placeholder → attach color;
                        // otherwise empty.
                        const fill = port.connected
                          ? (port.type === 'intra'
                            ? C.edgeIntra
                            : C.portConnected)
                          : (port.type === 'external'
                            ? attachColor
                            : C.portEmpty);
                        const flatIdx = pi * nRows + ri;
                        return (
                          <rect
                            key={`p-${ri}-${pi}`}
                            x={px}
                            y={py}
                            width={portW}
                            height={portH}
                            rx={0.5}
                            fill={fill}
                            stroke={tm('#334155', '#94a3b8', '#1e293b')}
                            strokeWidth={0.3}
                            className="cursor-pointer"
                            onMouseEnter={(e) =>
                              setHoveredPort({
                                idx: flatIdx,
                                row: ri,
                                col: pi,
                                physPort: port.physPort,
                                physCol: port.physCol,
                                physRow: port.physRow,
                                connected: port.connected,
                                target: port.target,
                                type: port.type,
                                mx: e.clientX,
                                my: e.clientY,
                              })
                            }
                            onMouseLeave={() => setHoveredPort(null)}
                          />
                        );
                      })}
                      {/*
                        Faint dashed separator between port rows for
                        readability on dense faceplates.
                      */}
                      {ri < nRows - 1 && (
                        <line
                          x1={boxLeft + 2}
                          y1={sy + 2 + (ri + 1) * (portH + 2) - 1}
                          x2={boxLeft + portsRowW + 2}
                          y2={sy + 2 + (ri + 1) * (portH + 2) - 1}
                          stroke={tm('#334155', '#cbd5e1', '#1e293b')}
                          strokeWidth={0.3}
                          strokeDasharray="1.5,1.5"
                        />
                      )}
                    </Fragment>
                  ))}
                </g>
              );
            })}

            {linkData.intraLinks.map((lk, i) => {
              // Intra-rack link: quadratic Bezier `M x1 y1 Q cx cy x2 y2`.
              // Endpoints `(x1,y1)`/`(x2,y2)` are port centers from `linkData`.
              // Control point: x = `bowX` sits just right of the faceplate
              // stack; vertical control y is the midpoint of the two endpoints
              // so the arc is symmetric in y.
              // `dist` separates stacked arcs: larger vertical gap between
              // endpoints → slightly larger default bow; `i` offsets bundles so
              // multiple links between the same switch pair do not sit on
              // identical paths.
              const dist = Math.abs(lk.y2 - lk.y1);
              const bowX =
                (boxLeft + portsRowW + 4)
                + 3
                + (dist * 0.08 + i * 0.8) * arcSpread;
              const d = `M ${lk.x1} ${lk.y1} Q ${bowX} ${(lk.y1 + lk.y2) / 2}, ${lk.x2} ${lk.y2}`;
              const hi =
                hoveredCable
                && hoveredCable.type === 'intra'
                && hoveredCable.idx === i;
              return (
                <g key={`intra-${i}`}>
                  {/*
                    Wide transparent stroke captures hover for the visible thin
                    arc below.
                  */}
                  <path
                    d={d}
                    fill="none"
                    stroke="transparent"
                    strokeWidth={4}
                    className="cursor-pointer"
                    onMouseEnter={e =>
                      setHoveredCable({
                        type: 'intra',
                        idx: i,
                        srcNid: lk.srcNid,
                        dstNid: lk.dstNid,
                        srcPort: lk.srcPort,
                        dstPort: lk.dstPort,
                        mx: e.clientX,
                        my: e.clientY,
                      })
                    }
                    onMouseMove={e =>
                      setHoveredCable(c =>
                        c ? { ...c, mx: e.clientX, my: e.clientY } : c,
                      )
                    }
                    onMouseLeave={() => setHoveredCable(null)}
                  />
                  <path
                    d={d}
                    fill="none"
                    stroke={C.edgeIntra}
                    strokeWidth={hi ? 1.5 : (isBw ? 0.9 : 0.6)}
                    opacity={hi ? 0.95 : (isBw ? 0.85 : 0.4)}
                    pointerEvents="none"
                  />
                </g>
              );
            })}

            {linkData.interArrows.map((ar, i) => {
              // Inter-rack “stub”: quadratic Bezier from port anchor
              // `(ar.px, startY)` toward a synthetic endpoint outside the
              // chassis (`endX`), with an arrowhead indicating direction out of
              // the rack.
              const isBottom = !ar.isTopHalf;
              // Even port index → stub exits left; odd → exits right (spreads
              // stubs across both sides of the faceplate).
              const goLeft = ar.portIdx % 2 === 0;
              const endX = goLeft
                ? (boxLeft - arrowM)
                : (boxLeft + portsRowW + 4 + arrowM);
              // Fan stubs vertically by port index so parallel cables do not
              // overlap; `arcSpread` scales this separation.
              const ySpread = (ar.portIdx - 3) * 2.5 * arcSpread;
              const startY = ar.py;
              const endY = startY + ySpread + (isBottom ? 4 : 0);
              const arcDir = isBottom ? 1 : -1;
              // Control point: `cpX` pulls halfway-ish toward `endX` for a
              // gentle S-like bend; `cpY` is biased toward the top or bottom
              // half row (`isBottom`) with per-port elevation via `ar.portIdx`.
              const cpX = goLeft
                ? (ar.px - Math.abs(ar.px - endX) * 0.3)
                : (ar.px + Math.abs(endX - ar.px) * 0.3);
              const cpY =
                (isBottom ? Math.max(startY, endY) : Math.min(startY, endY))
                + arcDir * (3 + ar.portIdx * 0.8) * arcSpread;
              const marker = goLeft ? 'url(#arr-left)' : 'url(#arr-right)';
              const d = `M ${ar.px} ${startY} Q ${cpX} ${cpY}, ${endX} ${endY}`;
              const hi =
                hoveredCable
                && hoveredCable.type === 'inter'
                && hoveredCable.idx === i;
              return (
                <g key={`inter-${i}`}>
                  <path
                    d={d}
                    fill="none"
                    stroke="transparent"
                    strokeWidth={4}
                    className="cursor-pointer"
                    onMouseEnter={e =>
                      setHoveredCable({
                        type: 'inter',
                        idx: i,
                        srcNid: ar.srcNid,
                        target: ar.target,
                        portIdx: ar.portIdx,
                        remotePort: ar.remotePort,
                        mx: e.clientX,
                        my: e.clientY,
                      })
                    }
                    onMouseMove={e =>
                      setHoveredCable(c =>
                        c ? { ...c, mx: e.clientX, my: e.clientY } : c,
                      )
                    }
                    onMouseLeave={() => setHoveredCable(null)}
                  />
                  <path
                    d={d}
                    fill="none"
                    stroke={C.edgeInter}
                    strokeWidth={hi ? 1.2 : (isBw ? 0.7 : 0.4)}
                    opacity={hi ? 0.95 : (isBw ? 0.85 : 0.35)}
                    markerEnd={marker}
                    pointerEvents="none"
                  />
                </g>
              );
            })}

            {/*
              When hovering a cable path, outline the involved port
              rectangle(s) in amber/pink (theme) — reuses the same row/col math
              as the port `<rect>`s for consistent alignment.
            */}
            {hoveredCable && (() => {
              const hiColor = tm('#f59e0b', '#ea580c', '#f9a8d4', '#000000');
              const portRect = (nid, flatIdx) => {
                const swIdx = rack.switches.findIndex(s => s.nodeId === nid);
                if (swIdx === -1) return null;
                const dIdx = focusedSwIdx !== null ? 0 : swIdx;
                const sy = 14 + dIdx * (swH + swGap);
                const row = Math.floor(flatIdx / ppr);
                const col = flatIdx % ppr;
                return {
                  x: boxLeft + 2 + col * (portW + portGap),
                  y: sy + 2 + row * (portH + 2)
                };
              };
              const ports = [];
              if (hoveredCable.type === 'intra') {
                const p1 = portRect(hoveredCable.srcNid, hoveredCable.srcPort);
                const p2 = portRect(hoveredCable.dstNid, hoveredCable.dstPort);
                if (p1) ports.push(p1);
                if (p2) ports.push(p2);
              } else {
                // Inter-rack stub highlights only the local (source) port;
                // remote rack is not drawn in this SVG.
                const p1 = portRect(hoveredCable.srcNid, hoveredCable.portIdx);
                if (p1) ports.push(p1);
              }
              return (
                <g pointerEvents="none">
                  {ports.map((p, i) => (
                    <rect key={i} x={p.x - 1} y={p.y - 1}
                      width={portW + 2} height={portH + 2} rx={1}
                      fill="none" stroke={hiColor} strokeWidth={0.6} opacity={0.85}/>
                  ))}
                </g>
              );
            })()}
          </svg>
        </div>

        {/*
          Right: expandable per-switch panel — `switchDetails` rows are built
          in the useMemo above (projective coords, neighbor table, intra vs
          inter classification).
        */}
        <div
          className="min-w-0"
          style={{
            flex: '1 1 0%',
            borderLeft: `1px solid ${tm(
              'rgba(100,116,139,0.2)',
              'rgba(203,213,225,0.3)',
              'rgba(100,116,139,0.15)',
            )}`,
            paddingLeft: 8,
          }}>
          {/* Collapse entire panel via `detailsOpen` to maximize SVG space on small viewports. */}
          <div className="flex items-center gap-2 mb-1.5 cursor-pointer" onClick={() => setDetailsOpen(!detailsOpen)}>
            <span className="text-xs font-bold" style={{color:tm('#cbd5e1','#1e293b','#c4b5fd')}}>
              {detailsOpen ? '\u25BC' : '\u25B6'} Switch Details
            </span>
          </div>
          {detailsOpen && (
        <div className="flex flex-col gap-2">
          {switchDetails.map((sd, sdIdx) => {
            // Match SVG filtering: when one switch is focused, only that
            // switch’s summary + table render.
            if (focusedSwIdx !== null && sdIdx !== focusedSwIdx) return null;
            // In “All switches” mode, each card starts collapsed except the one
            // whose `nid` matches `expandedSw`; in focus mode, the single
            // visible card is always expanded.
            const isExp = focusedSwIdx !== null || expandedSw === sd.nid;
            return (
              <div
                key={sd.nid}
                className="rounded-lg overflow-hidden"
                style={{
                  border: `1px solid ${tm(
                    'rgba(100,116,139,0.3)',
                    'rgba(203,213,225,0.4)',
                    'rgba(100,116,139,0.2)',
                  )}`,
                }}>
                <div
                  className="flex items-center gap-2 px-3 py-1.5 cursor-pointer"
                  style={{
                    background: tm('#0f172a', '#f1f5f9', '#060608', undefined, '#0D2240'),
                  }}
                  onClick={() => setExpandedSw(isExp ? null : sd.nid)}>
                  <span
                    className="w-2 h-2 rounded-full"
                    style={{ background: sd.color }}
                  />
                  <span
                    className="text-xs font-bold font-mono"
                    style={{ color: sd.color }}>
                    N{sd.nid}
                  </span>
                  {/*
                    Projective 3-vector for this switch; `selfDot` is the
                    quadratic form value on that vector (0 on the quadric).
                  */}
                  <span
                    className="text-xs font-mono"
                    style={{ color: tm('#94a3b8', '#64748b', '#94a3b8') }}>
                    [{sd.vec.join(',')}]
                  </span>
                  <span
                    className="text-xs"
                    style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
                    {sd.type}
                    {sd.isCenterNode ? ' center' : ''} | C{sd.cluster} | deg{' '}
                    {sd.degree} | dot(v,v)={sd.selfDot}
                  </span>
                  <span
                    className="ml-auto text-xs"
                    style={{ color: tm('#475569', '#94a3b8', '#334155') }}>
                    {isExp ? '[-]' : '[+]'}
                  </span>
                </div>
                {isExp && (
                  <div className="overflow-auto" style={{maxHeight: 250}}>
                    <table className="w-full text-xs" style={{borderCollapse:'collapse'}}>
                      <thead>
                        <tr style={{
                          background:tm('#1e293b','#e2e8f0','#0a0a0e'),
                          color:tm('#94a3b8','#475569','#64748b'),
                          position:'sticky', top:0
                        }}>
                          <th className="px-2 py-1 text-left font-semibold">Neighbor</th>
                          <th className="px-2 py-1 text-left font-semibold">Type</th>
                          <th className="px-2 py-1 text-left font-semibold">Vec</th>
                          <th className="px-2 py-1 text-left font-semibold">dot</th>
                          <th className="px-2 py-1 text-left font-semibold">cross(s,d)</th>
                          <th className="px-2 py-1 text-left font-semibold">norm cross</th>
                          <th className="px-2 py-1 text-left font-semibold">Link</th>
                          <th className="px-2 py-1 text-left font-semibold">Cluster</th>
                        </tr>
                      </thead>
                      <tbody>
                        {sd.neighbors.map(nb => (
                          <tr
                            key={nb.nid}
                            style={{
                              color: tm('#e2e8f0', '#1e293b', '#e2e8f0'),
                              borderBottom: `1px solid ${tm(
                                'rgba(51,65,85,0.3)',
                                'rgba(203,213,225,0.3)',
                                'rgba(51,65,85,0.2)',
                              )}`,
                            }}>
                            {/* Asterisk marks the cluster center node when present. */}
                            <td
                              className="px-2 py-1 font-mono"
                              style={{ color: nb.color }}>
                              N{nb.nid}
                              {nb.isCenter ? '*' : ''}
                            </td>
                            <td className="px-2 py-1">{nb.type}</td>
                            <td
                              className="px-2 py-1 font-mono"
                              style={{ fontSize: 9 }}>
                              [{nb.vec.join(',')}]
                            </td>
                            {/*
                              Edge dot should vanish mod q on graph edges — green
                              0 vs red nonzero for quick sanity check.
                            */}
                            <td
                              className="px-2 py-1 font-mono"
                              style={{
                                color:
                                  nb.dot === 0
                                    ? (isBw ? '#000000' : '#10b981')
