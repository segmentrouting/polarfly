                                          {'\u2192'}
                                        </span>
                                      )}
                                      <span style={{
                                        color: nid === selectedSrc
                                          ? '#f59e0b'
                                          : nid === selectedDst
                                            ? '#f97316'
                                            : pathColor,
                                      }}>
                                        N{nid}

                                      <span style={{
                                        color: tm(
                                          '#64748b',
                                          '#94a3b8',
                                          '#475569',

                                        fontSize: 8,
                                      }}>
                                        ({typeName(nid)})
                                      </span>
                                    </Fragment>
                                  ))}
                                  {/* `xc` badge when the path uses an inter-cluster hop (abbreviated in-table). */}
                                  {a.crossesCluster && (
                                    <span style={{
                                      color: tm(
                                        '#64748b',
                                        '#94a3b8',
                                        '#475569',
                                      ),
                                      fontSize: 8,
                                      marginLeft: 2,
                                    }}>
                                      xc
                                    </span>
                                  )}
                                </td>
                                <td className="px-1.5 py-1 text-right font-mono" style={{color: costColor}}>{cost}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </Fragment>
                )}
                </Fragment>)}

                {routingView === 'srv6' && (<Fragment>
                  {/* ── SRv6 mode picker: unicast (point-to-point), group (anycast /

                              background: srv6UnicastEnc === e.id

                  {/* Group-only selector: 0..15 maps into 0xC000..0xC00F. Matches

                  {srv6Mode === 'group' && (
                    <Fragment>

                      <input type="number" min={0} max={15}

                      <div className="text-xs mt-1"
                        style={{ color: tm('#64748b','#94a3b8','#475569') }}>

                  {/* SRH container visualization, hops table, and mode-specific

                  {srhDesc && (
                    <Fragment>
                      {sideLabel('SRv6 Header (128-bit DA)')}
                      <SRHContainer

                      {(srhDesc.type !== 'tree2') && (
                        <Fragment>
                          {sideLabel(srhDesc.type === 'group' ? 'Resolution' : 'Hops')}
                          <HopsTableSRv6

                            highlight={srv6Highlight}
                            pinned={srv6Pinned}

                      {srhDesc.type === 'tree2' && (
                        <Fragment>
                          {sideLabel(`TREE2 Fan-out (root N${srhDesc.root})`)}

                      {/* Valiant / ECMP fan enumeration: all q common neighbors

                        <Fragment>
                          {sideLabel(`ECMP Fan (${srhEcmpFan.length} common neighbors)`)}
                          <ECMPFanTable

                            dst={selectedDst}
                            fan={srhEcmpFan}
                            graph={graph}
                            highlight={srv6Highlight}
                            pinned={srv6Pinned}
                            setHighlight={setSrv6Highlight}
                            setPinned={setSrv6Pinned}
                            tm={tm}
                          />
                        </Fragment>
                      )}

                      {/* TREE2 cost comparison card: replicated unicast (root
                          sends N-1 unicasts) vs TREE2 flood (root sends |L1|
                          packets, each L1 peer sends degree-1 packets). Both
                          totals are "packets placed on the wire" — the
                          fabric-level work measure from the tutorial. */}
                      {srhDesc.type === 'tree2' && (() => {
                        const replicated = graph.N - 1;
                        const tree2Total = srhDesc.totalSent;
                        const savings = replicated > 0
                          ? Math.max(0, 1 - tree2Total / replicated) * 100
                          : 0;
                        return (
                          <Fragment>
                            {sideLabel('Cost vs Replicated Unicast')}
                            <div className="rounded-lg px-2 py-1.5 text-xs space-y-1" style={{
                              background: tm('rgba(30,41,59,0.5)','#f8fafc','rgba(10,10,14,0.6)',undefined,'rgba(13,34,64,0.6)'),
                              color: tm('#cbd5e1','#475569','#cbd5e1'),

                              <div className="flex justify-between">
                                <span>Replicated unicast (N−1)</span>

                              </div>
                              <div className="flex justify-between">
                                <span>TREE2 (send + dedup drop)</span>

                                <span className="font-mono"
                                  style={{color: isBw ? '#000000' : (savings > 0 ? '#10b981' : '#f59e0b')}}>

                              </div>
                            </div>
                          </Fragment>

                    border: `1px solid ${tm('rgba(51,65,85,0.3)','rgba(203,213,225,0.4)','rgba(51,65,85,0.2)')}`,
                  }}>
                    <table className="w-full" style={{borderCollapse:'collapse'}}>
                      <thead>
                        <tr style={{
                          borderBottom: `1px solid ${tm('rgba(51,65,85,0.4)','rgba(203,213,225,0.5)','rgba(51,65,85,0.3)')}`,

                          <th className="px-1.5 py-1 text-left"
                            style={{color:tm('#64748b','#94a3b8','#475569')}}>
                            Collective
                          </th>
                          <th className="px-1.5 py-1 text-left"
                            style={{color:tm('#64748b','#94a3b8','#475569')}}>
                            Primitive
                          </th>
                          <th className="px-1.5 py-1 text-right"
                            style={{color:tm('#64748b','#94a3b8','#475569')}}>
                            Hops
                          </th>
                        </tr>
                      </thead>
                      <tbody>
                        {[
                          { name: 'Broadcast',   prim: 'TREE2',          mode: 'tree2',   hops: '≤ 2' },
                          { name: 'Reduce',      prim: 'TREE2 (reverse)', mode: 'tree2',   hops: '≤ 2' },
                          { name: 'All-Reduce',  prim: 'TREE2 + TREE2',  mode: 'tree2',   hops: '≤ 4' },

                          { name: 'Scatter',     prim: 'N × Unicast',    mode: 'unicast', hops: '≤ 2' },
                          { name: 'Gather',      prim: 'N × Unicast',    mode: 'unicast', hops: '≤ 2' },

                            className="cursor-pointer transition-colors"

                              borderBottom: `1px solid ${tm('rgba(51,65,85,0.2)','rgba(203,213,225,0.3)','rgba(51,65,85,0.15)')}`,

                      </tbody>
                    </table>

                  {!srhDesc && (
                    <div className="text-xs mt-2 rounded px-2 py-1.5" style={{
                      color: tm('#94a3b8','#64748b','#64748b'),
                      background: tm('rgba(15,23,42,0.4)','#f1f5f9','rgba(5,5,8,0.6)'),
                      border: `1px dashed ${tm('rgba(148,163,184,0.3)','rgba(100,116,139,0.4)','rgba(100,116,139,0.2)')}`,

                      {srv6Mode === 'unicast'

                        : srv6Mode === 'group'
                          ? 'Pick a source to encapsulate this group flow.'
                          : 'Pick a root (source) to build the TREE2.'}
                    </div>
                  )}
                </Fragment>)}

            {tab === 'astr' && (

                {sideLabel('ASTR Statistics')}
                <div className="grid grid-cols-2 gap-1 text-xs" style={{
                  color: tm('#cbd5e1','#475569','#c4b5fd'),
                }}>
                  <div className="flex justify-between rounded px-1.5 py-1" style={{
                    background: tm('rgba(15,23,42,0.4)','#f1f5f9','rgba(10,10,14,0.5)'),
                  }}>
                    <span style={{color:tm('#64748b','#94a3b8','#475569')}}>q</span>
                    <span className="font-mono">{graph.q}</span>
                  </div>
                  <div className="flex justify-between rounded px-1.5 py-1" style={{
                    background: tm('rgba(15,23,42,0.4)','#f1f5f9','rgba(10,10,14,0.5)'),
                  }}>
                    <span style={{color:tm('#64748b','#94a3b8','#475569')}}>N</span>
                    <span className="font-mono">{graph.N}</span>
                  </div>
                  <div className="flex justify-between rounded px-1.5 py-1" style={{
                    background: tm('rgba(15,23,42,0.4)','#f1f5f9','rgba(10,10,14,0.5)'),

                    <span style={{color:tm('#64748b','#94a3b8','#475569')}}
                      title={astrTreeMethod === 'low-depth'
                        ? 'Construction 1 target: q trees (one per cluster centre)'

                      k (target)
                    </span>
                    <span className="font-mono">{astrData.targetK}</span>
                  </div>
                  <div className="flex justify-between rounded px-1.5 py-1" style={{
                    background: tm('rgba(15,23,42,0.4)','#f1f5f9','rgba(10,10,14,0.5)'),
                  }}>
                    <span style={{color:tm('#64748b','#94a3b8','#475569')}}>packed</span>
                    <span className="font-mono" style={{

                </div>

                {/* Tree-construction method picker.  Triggers a full
                    re-pack (astrData memo depends on astrTreeMethod)
                    and clears overrides/pipeline state so the new trees
                    render from scratch.

                    The SPAA'23 paper (Lakhotia et al.) describes TWO
                    distinct constructions with opposite trade-offs:

                      Construction 1 (Algorithm 3):
                        q trees · depth ≤ 3 · congestion 2
                        ↳ method 'low-depth' — default.
                        Trees are NOT edge-disjoint; each edge carries
                        up to 2 trees.  Minimises All-Reduce latency.

                      Construction 2 (Singer Hamiltonian paths):
                        ⌊(q+1)/2⌋ trees · depth (N-1)/2 · edge-disjoint
                        ↳ method 'hamiltonian'.
                        Each tree is a Hamiltonian path; edges fully
                        disjoint across trees.  Maximises link
                        utilisation.  Greedy DFS approximation
                        (may time out and return fewer paths at
                        larger q).

                    Additional heuristics (not paper constructions):
                      • Matroid    — Roskind-Tarjan max-k edge-disjoint
                                     forests, rooted at 1-centre.
                                     Depth ⌈diam/2⌉ (~2-4 for ER_q).
                      • BFS scan   — Residual BFS from quadric/V1/V2
                                     candidate roots.  Edge-disjoint.
                      • BFS rand   — Residual BFS with random root
                                     permutation (demo randomness). */}
                {sideLabel('Tree Construction')}
                <div className="grid grid-cols-3 gap-1 mb-1">
                  {[
                    { id: 'low-depth',   label: 'Low-depth',  hint: 'SPAA\'23 Construction 1: q trees · depth ≤ 3 · congestion 2 · rooted at cluster centres (default)' },
                    { id: 'hamiltonian', label: 'Hamiltonian', hint: 'SPAA\'23 Construction 2: ⌊(q+1)/2⌋ edge-disjoint Hamiltonian paths · depth (N-1)/2 · greedy DFS approximation' },
                    { id: 'matroid',     label: 'Matroid',    hint: 'Roskind-Tarjan · max k edge-disjoint · rooted at 1-centre (depth ⌈diam/2⌉, 2-4 for ER_q)' },
                    { id: 'bfs-scan',    label: 'BFS scan',   hint: 'Residual BFS from quadric→V1→V2 roots, edge-disjoint · no depth cap' },
                    { id: 'bfs-random',  label: 'BFS rand',   hint: 'Residual BFS with random root order (demonstrates root-arbitrariness)' },
                  ].map(m => (
                    <button key={m.id}
                      onClick={() => setAstrTreeMethod(m.id)}
                      title={m.hint}
                      className="flex-1 px-1.5 py-1 text-xs rounded cursor-pointer font-semibold"
                      style={{
                        background: astrTreeMethod === m.id
                          ? tm('#14b8a6','#14b8a6','#8b5cf6')
                          : tm('#1e293b','#f8fafc','#0a0a0e'),
                        color: astrTreeMethod === m.id
                          ? '#fff'
                          : tm('#94a3b8','#64748b','#64748b'),
                        fontSize: 10,
                        border: astrTreeMethod === m.id
                          ? 'none'
                          : `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,
                      }}>
                      {m.label}
                    </button>
                  ))}
                </div>
                {astrTreeMethod === 'bfs-random' && (
                  <button
                    onClick={() => {
                      // Touching the method state forces the packer to
                      // re-run — cheapest way to reshuffle the random
                      // permutation without adding another seed.
                      setAstrTreeMethod('low-depth');
                      setTimeout(() => setAstrTreeMethod('bfs-random'), 0);
                    }}
                    className="w-full px-2 py-1 mb-1 rounded text-xs"
                    style={{
                      background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                      color: tm('#cbd5e1','#475569','#94a3b8'),
                      border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,
                      fontSize: 10,

                    ↻ reshuffle random trees
                  </button>

                    astrVisible list. Solo toggles the list to a

                  <button
                    onClick={() => setAstrVisible(astrData.trees.map(t => t.id))}
                    className="flex-1 px-2 py-1 text-xs rounded cursor-pointer font-semibold"
                    style={{
                      background: tm('#14b8a6','#14b8a6','#8b5cf6'),
                      color: '#fff',
                    }}>
                    Show all
                  </button>
                  <button
                    onClick={() => setAstrVisible([])}

                      background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                      color: tm('#cbd5e1','#475569','#94a3b8'),
                      border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,
                    }}>

                  </button>
                  <button
                    onClick={() => setAstrVisible([astrSelectedTreeId])}

                    style={{
                      background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                      color: tm('#cbd5e1','#475569','#94a3b8'),
                      border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,

                {/* Tree list: one row per packed tree. Each row has
                      (1) the color swatch / visibility checkbox,

                    Hover the row to solo-highlight in the canvas (with
                    click-to-pin via `astrSoloPinned`). The underlying data

                {sideLabel(`Spanning Trees (${astrData.achievedK})`)}
                {/* Root actions — sidebar mirror of the floating legend's
                    buttons.  "randomize" assigns a fresh, distinct random
                    vertex as the root of every tree (BFS-rerooting from
                    the existing edge-disjoint forest adjacency, so the
                    packing is untouched — only the parent/depth labels
                    change).  "reset all" clears the overrides map to fall
                    back on the default root heuristic.  Root choice is
                    orthogonal to the edge-disjoint count bound (Nash–
                    Williams = ⌊(q+1)/2⌋), so randomizing never gains or
                    loses a tree; it only changes how the collective load
                    is spread. */}
                <div className="flex gap-1.5 mb-1.5">
                  <button
                    onClick={() => {
                      const n = graph.N;
                      const k = astrEffective.trees.length;
                      if (n <= 0 || k <= 0) return;
                      const pool = Array.from({ length: n }, (_, i) => i);
                      for (let i = pool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
                      }
                      const next = {};
                      const take = Math.min(k, pool.length);
                      for (let i = 0; i < take; i++) {
                        next[astrEffective.trees[i].id] = pool[i];
                      }
                      setAstrRootOverrides(next);
                    }}
                    title="Pick a fresh random root for every tree. The edge-disjoint packing is unchanged; only the rooting (parent/depth labels) is recomputed. Number of trees is bounded by ⌊(q+1)/2⌋ regardless of root choice."
                    className="flex-1 px-2 py-1 rounded text-xs font-semibold"
                    style={{
                      color: tm('#fde68a','#92400e','#fbbf24'),
                      border: `1px solid ${tm('rgba(251,191,36,0.45)','rgba(217,119,6,0.45)','rgba(251,191,36,0.35)')}`,
                      background: tm('rgba(251,191,36,0.08)','rgba(251,191,36,0.08)','rgba(251,191,36,0.05)'),
                    }}>
                    🎲 randomize roots
                  </button>
                  {Object.keys(astrRootOverrides).length > 0 && (
                    <button
                      onClick={() => setAstrRootOverrides({})}
                      title="Reset all tree roots to their defaults"
                      className="px-2 py-1 rounded text-xs"
                      style={{
                        color: tm('#cbd5e1','#334155','#c4b5fd'),
                        border: `1px solid ${tm('rgba(148,163,184,0.35)','rgba(100,116,139,0.45)','rgba(100,116,139,0.3)')}`,
                        background: 'transparent',

                      reset all

                </div>
                <div className="rounded-lg overflow-y-auto" style={{
                  maxHeight: 260,
                  background: tm('rgba(15,23,42,0.6)','rgba(248,250,252,0.8)','rgba(5,5,8,0.7)'),
                  border: `1px solid ${tm('rgba(51,65,85,0.3)','rgba(203,213,225,0.4)','rgba(51,65,85,0.2)')}`,
                }}>
                  {astrEffective.trees.map(tree => {
                    const visible = astrVisible.includes(tree.id);
                    const selected = astrSelectedTreeId === tree.id;
                    const solo = (astrSoloPinned ?? astrSolo) === tree.id;
                    const maxDepth = Math.max(...tree.depth.filter(d => d >= 0));
                    const overridden = astrRootOverrides[tree.id] !== undefined;
                    return (
                      <div key={tree.id}
                        onMouseEnter={() => setAstrSolo(tree.id)}
                        onMouseLeave={() => setAstrSolo(null)}
                        onClick={() => {
                          setAstrSelectedTreeId(tree.id);
                          setAstrSoloPinned(prev => prev === tree.id ? null : tree.id);
                        }}
                        className="flex items-center gap-1.5 px-2 py-1.5 text-xs cursor-pointer transition-colors"
                        style={{
                          background: solo
                            ? `${tree.color}22`
                            : selected
                              ? tm('rgba(30,41,59,0.5)','#e2e8f0','rgba(10,10,14,0.6)')
                              : 'transparent',
                          borderBottom: `1px solid ${tm('rgba(51,65,85,0.2)','rgba(203,213,225,0.3)','rgba(51,65,85,0.15)')}`,
                          borderLeft: solo ? `3px solid ${tree.color}` : '3px solid transparent',
                        }}>
                        <input
                          type="checkbox"
                          checked={visible}
                          onChange={(e) => {
                            e.stopPropagation();
                            setAstrVisible(prev => visible
                              ? prev.filter(id => id !== tree.id)
                              : [...prev, tree.id]);
                          }}
                          onClick={e => e.stopPropagation()}
                          className="w-3 h-3 cursor-pointer"
                          style={{ accentColor: tree.color }}
                        />
                        <div
                          className="rounded-sm flex-shrink-0"
                          style={{
                            width: 10, height: 10,
                            background: tree.color,
                            opacity: visible ? 1 : 0.25,
                            border: `1px solid ${tree.color}`,
                          }}
                        />
                        <div className="flex-1 min-w-0">
                          <div className="font-mono font-semibold flex items-center gap-1" style={{ color: tree.color }}>
                            T{tree.id} <span style={{
                              color: tm('#94a3b8','#64748b','#64748b'),
                              fontWeight: 400,
                            }}>root=N{tree.root}</span>
                            {overridden && (
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setAstrRootOverrides((prev) => {
                                    const next = { ...prev };
                                    delete next[tree.id];
                                    return next;
                                  });
                                }}
                                title="Reset to default root"
                                style={{
                                  fontSize: 9, padding: '0 4px',
                                  borderRadius: 3,
                                  color: tm('#94a3b8','#64748b','#64748b'),
                                  border: `1px solid ${tm('rgba(148,163,184,0.3)','rgba(100,116,139,0.4)','rgba(100,116,139,0.25)')}`,

                            color: tm('#64748b','#94a3b8','#475569'),

                            {tree.edges.length} edges · depth {maxDepth}
                            {(() => {
                              const lv = tree.stages
                                .map((s, i) => i > 0 ? `L${i}:${s.length}` : null)
                                .filter(Boolean);
                              if (lv.length <= 4) return lv.length ? ` · ${lv.join(' · ')}` : '';
                              // Collapse to first three levels plus an ellipsis summary so the
                              // sidebar row stays legible for deeper trees (q >= 11).
                              return ` · ${lv.slice(0, 3).join(' · ')} · …${lv.length - 3} more`;
                            })()}
                          </div>
                        </div>
                        {selected && (
                          <div className="text-xs font-bold" style={{ color: tree.color }}>●</div>
                        )}
                      </div>
                    );
                  })}
                  {astrData.trees.length === 0 && (
                    <div className="px-2 py-3 text-xs italic" style={{
                      color: tm('#94a3b8','#64748b','#64748b'),
                    }}>
                      {astrTreeMethod === 'low-depth'
                        ? 'Low-depth scan could not span under congestion ≤ 2 — try Matroid or Hamiltonian.'
                        : astrTreeMethod === 'hamiltonian'
                          ? 'Greedy DFS did not find a Hamiltonian path within the time budget — try Low-depth or Matroid.'
                          : astrTreeMethod === 'matroid'
                            ? 'Matroid packing produced no spanning trees — try a larger q.'
                            : 'BFS scan exhausted the residual graph — try Low-depth / Matroid or larger q.'}
                    </div>
                  )}
                </div>

                {/* ───────────────────────────────────────────────────
                    Pipelined all-reduce animation controls.  Drives the
                    `astrPipelineEdgeState` prop on PetalView: chunks
                    and time step map to per-edge reduce/broadcast
                    highlighting.  Play advances via requestAnimationFrame;
                    the slider lets the user scrub manually.

                    Phase math at time t (per tree T, edge e at depth d_e,
                    tree max-depth D_T):
                      REDUCE   chunk c_r = t − (D_T − d_e)  ∈ [0, p)
                      BROADCAST chunk c_b = t − (D_T + d_e)  ∈ [0, p)
                    Total steps per tree: p + 2·D_T − 1; we take
                    maxT = p + 2·max_T D_T − 1 so all trees finish by
                    the time the slider reaches the right.

                    Why this renders an "all-reduce": every edge-disjoint
                    tree operates in parallel (the animation runs all k
                    at once), chunks pipeline within each tree, and the
                    reduce-then-broadcast cycle delivers the same fully-
                    reduced payload to every node.  k = ⌊(q+1)/2⌋ chunks
                    are in flight on disjoint edges each time step once
                    the pipeline fills.
                    ─────────────────────────────────────────────────── */}
                {sideLabel('All-Reduce Pipeline')}
                {(() => {
                  const maxT = pipelineData.maxT;
                  const D = pipelineData.maxDepth;
                  const k = astrEffective.trees.length;
                  return (
                    <div className="rounded-lg p-2 space-y-1.5" style={{
                      background: tm('rgba(30,41,59,0.5)','#f8fafc','rgba(10,10,14,0.6)',undefined,'rgba(13,34,64,0.6)'),
                      border: `1px solid ${tm('rgba(51,65,85,0.4)','rgba(203,213,225,0.5)','rgba(51,65,85,0.3)')}`,
                      color: tm('#cbd5e1','#475569','#cbd5e1'),

                      {/* Transport/control: play, step ±1, reset */}
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => {
                            if (pipelineT >= maxT) setPipelineT(0);
                            setPipelinePlaying((p) => !p);
                          }}
                          className="px-2 py-1 rounded text-xs font-semibold cursor-pointer"
                          style={{
                            background: pipelinePlaying
                              ? tm('#f43f5e','#e11d48','#f43f5e')
                              : tm('#10b981','#059669','#8b5cf6'),
                            color: '#fff',
                            minWidth: 52,
                          }}
                          title={pipelinePlaying ? 'Pause animation' : 'Play animation'}>
                          {pipelinePlaying ? '❚❚ pause' : '▶ play'}
                        </button>
                        <button
                          onClick={() => { setPipelinePlaying(false); setPipelineT(0); }}
                          className="px-2 py-1 rounded text-xs cursor-pointer"
                          style={{
                            background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                            color: tm('#cbd5e1','#475569','#94a3b8'),
                            border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,

                          title="Reset time to t=0">
                          ⏮ reset
                        </button>
                        <button
                          onClick={() => {
                            setPipelinePlaying(false);
                            setPipelineT((t) => Math.max(0, Math.floor(t) - 1));

                          className="px-1.5 py-1 rounded text-xs cursor-pointer"
                          style={{
                            background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                            color: tm('#cbd5e1','#475569','#94a3b8'),
                            border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,
                          }}
                          title="Step backward one time unit">
                          ◀
                        </button>
                        <button
                          onClick={() => {
                            setPipelinePlaying(false);
                            setPipelineT((t) => Math.min(maxT, Math.floor(t) + 1));
                          }}
                          className="px-1.5 py-1 rounded text-xs cursor-pointer"
                          style={{
                            background: tm('#1e293b','#f1f5f9','#0a0a0e'),
                            color: tm('#cbd5e1','#475569','#94a3b8'),
                            border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,

                          title="Step forward one time unit">
                          ▶
                        </button>
                      </div>
                      {/* Time scrubber — integer slider over [0, maxT].

                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-mono" style={{
                          color: tm('#64748b','#94a3b8','#475569'),
                          minWidth: 62,
                        }}>
                          t = {Math.floor(pipelineT)} / {maxT}
                        </span>
                        <input
                          type="range" min={0} max={maxT} step={1}
                          value={Math.min(Math.floor(pipelineT), maxT)}
                          onChange={(ev) => {

                            setPipelineT(Number(ev.target.value));

                          className="flex-1"
                          style={uiInputStyle}/>
                      </div>
                      {/* Chunks-per-tree slider (p) — controls how deep

                          better bandwidth amortisation (Patarasuk-Yuan). */}
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-mono" style={{
                          color: tm('#64748b','#94a3b8','#475569'),
                          minWidth: 62,
                        }}>
                          p = {pipelineP}
                        </span>
                        <input
                          type="range" min={1} max={16} step={1}
                          value={pipelineP}
                          onChange={(ev) => setPipelineP(Number(ev.target.value))}
                          className="flex-1"
                          style={uiInputStyle}/>
                      </div>
                      {/* Playback speed (steps per second, coarse). */}
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-mono" style={{
                          color: tm('#64748b','#94a3b8','#475569'),
                          minWidth: 62,
                        }}>
                          × {pipelineSpeed.toFixed(1)}
                        </span>
                        <input
                          type="range" min={0.25} max={4} step={0.25}
                          value={pipelineSpeed}
                          onChange={(ev) => setPipelineSpeed(Number(ev.target.value))}
                          className="flex-1"
                          style={uiInputStyle}/>
                      </div>
                      {/* HUD: current phase summary per tree plus a
                          pipeline-capacity readout. */}
                      <div className="text-xs space-y-0.5" style={{
                        color: tm('#94a3b8','#64748b','#475569'),
                        fontSize: 10,
                      }}>
                        <div>
                          {k} tree{k === 1 ? '' : 's'} · max depth {D} · {pipelineP} chunk{pipelineP===1?'':'s'}/tree ·
                          {' '}{pipelineP * k} chunks total
                        </div>
                        {astrEffective.trees.slice(0, 6).map((tr, ti) => (
                          <div key={tr.id} className="flex items-center gap-1.5">
                            <span style={{
                              display: 'inline-block', width: 8, height: 8,
                              borderRadius: 2, background: tr.color, flexShrink: 0,
                            }}/>
                            <span className="font-mono" style={{minWidth: 30}}>T{tr.id}</span>
                            <span>{pipelineData.activeByTree[ti] || 'idle'}</span>

                        {astrEffective.trees.length > 6 && (

                      {/* Primer: tiny walk-through for q = 7 style sizing.
                          References fully resolved at render time so the

                      <div className="text-xs leading-snug pt-1" style={{

                      </div>

                {/* ASTR-SRv6 profile picker. Corresponds to the three
                    deployment profiles of tutorial §8d.3–§8d.5. Controls
                    the DA format used in the header preview below. */}

                <div className="flex gap-1">
                  {[
                    { id: 'A',  label: 'A · Algebraic',      hint: 'no FIB' },

                    <button key={p.id}
                      onClick={() => setAstrProfile(p.id)}

                      className="flex-1 px-1.5 py-1 text-xs rounded cursor-pointer font-semibold"

                {/* Header preview for the currently-selected tree. Shows

                {astrEffective.trees[astrSelectedTreeId] && (() => {
                  const tree = astrEffective.trees[astrSelectedTreeId];
                  const hdr = astrDA(tree, astrProfile, 0, 0, 1);
                  const labels = [

                          color: tm('#64748b','#94a3b8','#475569'),

                          {astrProfile === 'A' && 'Switch computes next hop from OpA/OpB via add-mod-N on its Singer label. No per-tree FIB.'}
                          {astrProfile === 'B' && 'Root replicates via HW multicast, stamping each copy with a distinct CUD. Transit: table lookup (rg, CUD, Epoch) → port.'}
                          {astrProfile === 'C1' && 'NIC/DPU emits k packets, one per tree. Switch does FIB[TreeID, node, Stage] → port. Runs on any SRv6 silicon.'}

                        </div>
                      </div>
                    </Fragment>
                  );
                })()}

                {/* All-Reduce cost comparison (tutorial §8c.7). Computes
                    Patarasuk–Yuan pipelined costs for three algorithms at
                    the current (q, N, k): ring, single-tree, multi-tree.
                    Ballpark values: α = 1µs, β⁻¹ = 50 GB/s, M = 256 MB
                    — matches the worked example. */}
                {sideLabel('All-Reduce Cost (M = 256 MB)')}
                {(() => {
                  const N = graph.N;
                  const k = Math.max(1, astrData.achievedK);
                  const alpha = 1e-6;                   // 1 µs
                  const beta  = 1 / (50 * 1024 * 1024 * 1024); // 50 GB/s → s/byte
                  const M     = 256 * 1024 * 1024;      // 256 MB
                  const ring  = 2 * (N - 1) * alpha + 2 * M * beta;
                  const one   = 2 * alpha + 2 * Math.sqrt(2 * M * alpha * beta) + 2 * M * beta;
                  const multi = 2 * alpha + 2 * Math.sqrt(2 * M * alpha * beta / k) + 2 * M * beta / k;
                  const fmt = (s) => s >= 1e-3 ? `${(s * 1e3).toFixed(2)} ms` : `${(s * 1e6).toFixed(1)} µs`;
                  const speedup = ring / multi;
                  return (
                    <div className="rounded-lg px-2 py-1.5 text-xs space-y-1" style={{
                      background: tm('rgba(30,41,59,0.5)','#f8fafc','rgba(10,10,14,0.6)',undefined,'rgba(13,34,64,0.6)'),
                      color: tm('#cbd5e1','#475569','#cbd5e1'),
                      border: `1px solid ${tm('rgba(51,65,85,0.4)','rgba(203,213,225,0.5)','rgba(51,65,85,0.3)')}`,
                    }}>
                      <div className="flex justify-between">
                        <span>Ring All-Reduce</span>
                        <span className="font-mono" style={{color:tm('#94a3b8','#64748b','#475569')}}>
                          {fmt(ring)}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Single-tree BFS</span>
                        <span className="font-mono" style={{color:tm('#94a3b8','#64748b','#475569')}}>
                          {fmt(one)}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Multi-tree (k = {k})</span>
                        <span className="font-mono font-semibold" style={{color:'#10b981'}}>
                          {fmt(multi)}
                        </span>
                      </div>
                      <div className="flex justify-between font-semibold pt-1" style={{
                        borderTop: `1px solid ${tm('rgba(51,65,85,0.3)','rgba(203,213,225,0.4)','rgba(51,65,85,0.2)')}`,
                      }}>
                        <span>vs. ring</span>
                        <span className="font-mono" style={{color:'#10b981'}}>
                          {speedup.toFixed(1)}×
                        </span>
                      </div>
                    </div>
                  );
                })()}

                {/* Spatial / visual tuning reuses the Petal sliders so
                    the ASTR canvas (PetalView-based) stays readable. */}
                {sideLabel('Spatial Tuning')}
                <div className="flex flex-col gap-0.5">

                  {sld('Petal V-str', petalStretchV, setPetalStretchV, 0.1, 3, 0.05)}
                  {sld('Petal R-str', petalStretchR, setPetalStretchR, 0.1, 3, 0.05)}
                  {sld('Quadric R', quadricRScale, setQuadricRScale, 0.1, 2, 0.05)}

                  {sld('Zoom', petalZoom, setPetalZoom, 0.3, 5, 0.1)}

                  {sld('Tree opacity', petalLineOpacity, setPetalLineOpacity, 0.05, 1, 0.05)}
                  {sld('Gamma', petalGamma, setPetalGamma, 0.3, 3, 0.05)}
                </div>
              </Fragment>
            )}

            {/* ── RACK VIEW tab: physical-ish packaging — rack counts, staged expansion buttons, radix & bundling
                (how many parallel cables realize each logical adjacency), overview/detail camera, optional
                incremental “growth” scrubber over rack indices. ── */}
            {tab === 'rack' && (
              <Fragment>
                {/* Live rack inventory: baseline racks from `rackModel` plus any staged `expansionState.newRacks`
                    queued before commit — mirrors what `RackView` will lay out in the canvas. */}
                {sideLabel('Rack Controls')}
                <div className="text-sm mb-1" style={{color:tm('#cbd5e1','#475569','#c4b5fd')}}>

                      + (expansionState?.newRacks?.length || 0)}
                  </span>
                </div>
                {/* One-click expansion hooks: grow the physical plan by a quadric-aligned rack (orange) or a
                    non-quadric rack (cyan). Exact graph rewiring semantics live in `handleExpand`. */}
                <div className="flex flex-col gap-1">
                  <button onClick={() => handleExpand('quadric')}
                    className="w-full px-2 py-1 text-sm rounded font-semibold transition-colors cursor-pointer"
                    style={{background:bwTint('#f97316', '#000000'),color:'#fff'}}>+ Add Quadric Rack</button>
                  <button onClick={() => handleExpand('nonquadric')}
                    className="w-full px-2 py-1 text-sm rounded font-semibold transition-colors cursor-pointer"

                {/* Staging summary: only appears while pending racks exist; `rewiring` hints whether the expansion

                {expansionState.newRacks.length > 0 && (
                  <div className="text-sm mt-1" style={{color:bwTint('#f97316', '#000000')}}>
                    +{expansionState.newRacks.length} rack(s) | Rewire: {expansionState.rewiring ? 'Yes' : 'None'}
                  </div>
                )}
                {/* Switch radix presets (ports per switch / photonic degree budget): larger radix raises the
                    ceiling on valid `q` via `maxQForRadix`. Selecting a new radix resets bundle size to 1× and,
                    if current `q` is too big, snaps `q` down to the largest admissible field order. */}
                {sideLabel('Switch Radix')}
                <div className="flex gap-1">
                  {[32, 64, 128].map(r => (
                    <button key={r} onClick={() => {
                      setSwitchRadix(r);
                      setBundleSize(1);
                      const mq = maxQForRadix(r);
                      // If current field order exceeds what this radix can
                      // support, snap down to largest valid `q`.
                      if (q > mq) {
                        const best = VALID_Q.filter(v => v <= mq).pop() || 7;
                        setQ(best);
                      }
                    }}
                      className={
                        'flex-1 px-2 py-0.5 text-xs rounded transition-colors '
                        + 'cursor-pointer font-mono font-semibold'

                      style={{
                        background: switchRadix === r
                          ? tm('#14b8a6', '#14b8a6', '#8b5cf6', '#000000')
                          : tm('#1e293b', '#f8fafc', '#0a0a0e'),

                          ? '#fff'
                          : tm('#94a3b8', '#64748b', '#64748b'),
                      }}>{r}</button>

                </div>
                {/* Bundle size: replicates each logical graph adjacency across `bundleSize` parallel cables so the
                    rack wiring view reflects fat links / lane bundling. Cap derives from radix and graph degree
                    (`q+1`): you cannot assign more physical lanes per neighbor than `floor(radix / degree)`.
                    Derived `networkPorts` vs `attachPorts` explains host vs fabric allocation; warning when network
                    ports exceed half the radix flags oversubscription (inter/intra lanes may share switch rows). */}
                {sideLabel('Cable Bundles')}
                {(() => {
                  const halfR = Math.floor(switchRadix / 2);
                  const degree = graph ? graph.q + 1 : 1;
                  const maxBundle = Math.max(1, Math.floor(switchRadix / Math.max(1, degree)));
                  const networkPorts = graph ? degree * bundleSize : 0;
                  const attachPorts = switchRadix - networkPorts;
                  const oversubscribed = networkPorts > halfR;
                  return (
                    <Fragment>
                      <div className="flex items-center gap-2">
                        <input
                          type="range"
                          min={1}
                          max={Math.max(1, maxBundle)}
                          value={Math.min(bundleSize, maxBundle)}
                          onChange={e => setBundleSize(+e.target.value)}
                          className="flex-1"
                          style={uiInputStyle}
                        />
                        <span
                          className="text-xs font-mono w-8 text-right"

                          {bundleSize}x

                      </div>
                      <div className="text-xs" style={{color:tm('#64748b','#94a3b8','#475569')}}>
                        {bundleSize === 1
                          ? 'No bundling — 1 cable per adjacency'
                          : `${bundleSize} cables per adjacency`}
                        {graph && (
                          <span className="font-mono ml-1">
                            ({networkPorts} network / {Math.max(0, attachPorts)}{' '}
                            attach)
                          </span>
                        )}
                      </div>
                      {oversubscribed && (
                        <div className="text-xs font-semibold" style={{color:bwTint('#f59e0b', '#000000')}}>
                          Network ports exceed half-radix — inter/intra share rows
                        </div>
                      )}
                    </Fragment>
                  );
                })()}
                {/* Toggles `rackViewMode` (`overview` | `detail`), which the `<RackView>` in `<main>` reads to
                    switch between `RackOverview` and `RackDetailView` without unmounting the whole rack tab. */}
                {sideLabel('View Mode')}

                      onChange={e => setRackExpStep(+e.target.value)}
                      className="w-full"
                      style={uiInputStyle}

            {/* ── RADIAL GROWTH tab: animated “how big is the deployment” story

            {tab === 'radial' && (

                {sideLabel('Racks Installed')}

                  onChange={e => setRadialRackStep(+e.target.value)}

                <div className="font-mono text-center text-xs" style={{color:tm('#cbd5e1','#475569','#cbd5e1')}}>
                  {Math.min(radialRackStep, radialTotalRacks)} / {radialTotalRacks} racks
                </div>

                {sideLabel('Switches per Rack')}
                <input type="range" min={4} max={64} step={4} value={radialSwitchesPerRack}
                  onChange={e => { setRadialSwitchesPerRack(+e.target.value); setRadialRackStep(1); }}
                  className="w-full" style={uiInputStyle}/>
                <div
                  className="font-mono text-center text-xs"
                  style={{color:tm('#cbd5e1','#475569','#cbd5e1')}}>
                  {radialSwitchesPerRack}
                </div>

                {sideLabel('Quick Jump')}
                <div className="flex gap-1 flex-wrap">
                  <button onClick={() => setRadialRackStep(1)}
                    className="px-2 py-0.5 text-xs rounded transition-colors" style={{
                      background: tm('#1e293b','#f1f5f9','#0f0f14',undefined,'#0D2240'), color: tm('#94a3b8','#64748b','#94a3b8')
                    }}>1</button>
                  <button onClick={() => setRadialRackStep(Math.ceil(radialTotalRacks / 4))}

                    }}>25%</button>

                {/* ── Display (radial tab): per-vertex-class visibility for the

                {sideLabel('Spatial Tuning')}
                <div className="flex flex-col gap-0.5">
                  {sld('Quadric Y', quadricY, setQuadricY, -0.5, 0.5, 0.02)}

            {/* ── EXPANSION tab: discrete replication story — pick quadric vs non-quadric growth laws, scrub how

              visibleIdx = preferred;
            } else {
              visibleIdx = Math.max(0, Math.min(
                astrTreeBrowseIdx, visibleTrees.length - 1));
            }
            treeToShow = visibleTrees[visibleIdx];
          }
          const nLeft = (inAllMode && visibleTrees.length > 1)
            ? () => {
                const cur = visibleTrees.findIndex(t => t.id === treeToShow.id);
                const next = (cur - 1 + visibleTrees.length) % visibleTrees.length;
                setAstrTreeBrowseIdx(next);
                setAstrSelectedTreeId(visibleTrees[next].id);
              }
            : null;
          const nRight = (inAllMode && visibleTrees.length > 1)
            ? () => {
                const cur = visibleTrees.findIndex(t => t.id === treeToShow.id);
                const next = (cur + 1) % visibleTrees.length;
                setAstrTreeBrowseIdx(next);
                setAstrSelectedTreeId(visibleTrees[next].id);
              }
            : null;
          const title = treeToShow
            ? (soloId != null
                ? 'solo \u00B7 click or hover a chip to change'
                : visibleTrees.length === 1
                  ? 'only visible tree'
                  : `${visibleTrees.findIndex(t => t.id === treeToShow.id) + 1} of ${visibleTrees.length} visible \u2014 use \u25C0/\u25B6`)
            : 'no tree selected';
          const countLbl = treeToShow && visibleTrees.length > 0
            ? (soloId != null
                ? 'solo'
                : `${visibleTrees.findIndex(t => t.id === treeToShow.id) + 1}/${visibleTrees.length}`)
            : '';
          /* Drag-to-resize handler: grabs the current pointer position and
             panel width at mousedown, then listens on the document for
             mousemove (to size) and mouseup (to release). Because the
             handle sits on the aside's LEFT edge, a pointer moving left
             (smaller clientX) GROWS the width — the delta sign is
             therefore `startX - ev.clientX`. We clamp to [240..720] to
             guarantee the tidy-tree diagram remains legible and that the
             canvas never ends up below ~30 % of the viewport. */
          const startResize = (e) => {
            e.preventDefault();
            const startX = e.clientX;
            const startW = astrTreePanelWidth;
            const onMove = (ev) => {
              const dx = startX - ev.clientX;
              const newW = Math.max(240, Math.min(720, startW + dx));
              setAstrTreePanelWidth(newW);
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              document.body.style.cursor = '';
              document.body.style.userSelect = '';
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
          };
          return (
            <Fragment>
              {/* Drag handle: a 4-px vertical strip that sits between
                  <main> and the aside. Cursor changes to col-resize on
                  hover; the hit area extends slightly with padding via
                  the inner child so touch users can still grab it. */}
              <div
                onMouseDown={startResize}
                title="Drag to resize the tree panel"
                style={{
                  width: 4,
                  flexShrink: 0,
                  cursor: 'col-resize',
                  background: tm(
                    'rgba(71,85,105,0.35)',
                    'rgba(203,213,225,0.70)',
                    'rgba(71,85,105,0.25)',
                    'rgba(0,0,0,0.35)'
                  ),
                  transition: 'background 120ms',
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.background = uiAccent(theme, palette);
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.background = tm(
                    'rgba(71,85,105,0.35)',
                    'rgba(203,213,225,0.70)',
                    'rgba(71,85,105,0.25)',
                    'rgba(0,0,0,0.35)'
                  );
                }}
              />
              <aside
                className="flex-shrink-0 overflow-hidden border-l"
                style={{
                  width: astrTreePanelWidth,
                  background: tm('#070d18','#ffffff','#040406','#ffffff','#0a1e38'),
                  borderColor: tm(
                    '#1e293b','#e2e8f0','rgba(100,116,139,0.2)','#000000','#1e3a5f'),
                  display: 'flex',
                  flexDirection: 'column',
                }}>
                <ASTRTreePanel
                  tree={treeToShow}
                  graph={graph}
                  theme={theme}
                  palette={palette}
                  xStretch={astrTreeXStretch}
                  yStretch={astrTreeYStretch}
                  setXStretch={setAstrTreeXStretch}
                  setYStretch={setAstrTreeYStretch}
                  zoom={astrTreeZoom}
                  setZoom={setAstrTreeZoom}
                  orientation={astrTreeOrientation}
                  setOrientation={setAstrTreeOrientation}
                  navLeft={nLeft}
                  navRight={nRight}
                  headerTitle={title}
                  treeCountLabel={countLbl}
                  onClose={() => setAstrTreePanelOpen(false)}/>
              </aside>
            </Fragment>
          );
        })()}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   SELF-TEST HARNESS (opt-in via ?selftest=1).
   Verifies F_q arithmetic, vertex count, regularity, and 2-hop routing
   across every q in VALID_Q. Logs to console; does not block the UI.
   ───────────────────────────────────────────── */
function runSelfTests() {
  const results = [];
  const fail = (msg) => { results.push({ ok: false, msg }); console.error('[selftest] FAIL', msg); };
  const pass = (msg) => { results.push({ ok: true,  msg }); };

  for (const q of VALID_Q) {
    const F = makeField(q);

    // Field axioms on a handful of elements.
    for (let a = 0; a < q; a++) {
      if (F.add(a, F.neg(a)) !== 0) fail(`q=${q}: a + (-a) ≠ 0 at a=${a}`);
      if (a !== 0 && F.mul(a, F.inv(a)) !== 1) fail(`q=${q}: a·a⁻¹ ≠ 1 at a=${a}`);
    }

    // Build the graph and check invariants.
    const g = buildERGraph(q);
    const N = q * q + q + 1;
    if (g.N !== N)               fail(`q=${q}: |V|=${g.N}, expected ${N}`);
    if (g.W.length !== q + 1)    fail(`q=${q}: |W|=${g.W.length}, expected ${q+1}`);
    // Degree rule for the polarity graph (no self-loops): non-quadric vertices
    // have degree q+1; quadric (self-orthogonal) vertices have degree q
    // because they are in their own polar line.
    for (let i = 0; i < g.N; i++) {
      const expected = g.isQuadric[i] ? q : q + 1;
      if (g.adj[i].length !== expected) {
        fail(`q=${q}: vertex ${i} has degree ${g.adj[i].length}, expected ${expected}`);
        break;
      }
    }

    // 2-hop routing sanity: pick a few non-adjacent pairs and verify the
    // cross-product relay is actually adjacent to both endpoints.
    const samples = Math.min(20, g.N);
    for (let s = 0; s < samples; s++) {
      for (let d = s + 1; d < samples; d++) {
        if (g.adj[s].includes(d)) continue;
        const path = findMinimalPath(g, s, d);
        if (!path || path.length !== 3) {
          fail(`q=${q}: findMinimalPath(${s},${d}) returned ${JSON.stringify(path)}`);
          break;
        }
        const [a, m, b] = path;
        if (!g.adj[a].includes(m) || !g.adj[m].includes(b)) {
          fail(`q=${q}: relay ${m} not adjacent to both ${a} and ${b}`);
          break;
        }
      }
    }

    pass(`q=${q} (${F.p}^${F.k}): N=${g.N}, deg=${q+1}, |W|=${g.W.length}`);
  }

  const failures = results.filter(r => !r.ok);
  if (failures.length === 0) {
    console.log(`%c[selftest] ${results.length}/${results.length} passed`,
                'color:#10b981;font-weight:bold');
  } else {
    console.error(`[selftest] ${failures.length} failures of ${results.length} tests`);
  }
  return results;
}

// Run self-tests on demand: append ?selftest=1 to the URL. Also exposed on
// window for ad-hoc console invocation (window.runSelfTests()).
if (typeof window !== 'undefined') {
  window.runSelfTests = runSelfTests;
  if (/[?&]selftest=1\b/.test(window.location.search)) {
    // Defer until after mount so logs appear in chronological order below UI init.
    setTimeout(runSelfTests, 50);
  }
}

// Mount the single-page React tree: the `#root` div lives in the static HTML
// above this script; `createRoot` is the React 18 concurrent root API.
// Rendering `<App/>` bootstraps all tab state, graph construction, and the
// split sidebar/main layout—including the conditional `<main>` region
// documented above.
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
