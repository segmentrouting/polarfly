  // sort for presentation, and derive ECMP minima / path-kind counts.
  // This powers the "All Paths" routing mode table and graph overlay. Returns
  // null when the mode is off or endpoints are invalid.
  const allPathsData = useMemo(() => {
    if (routingMode !== 'allpaths' || selectedSrc === null || selectedDst === null || selectedSrc === selectedDst) {
      return null;
    }
    const candidatePaths = findAlternativePaths(graph, selectedSrc, selectedDst);
    // No simple alternate routes in the enumerator’s output — nothing to tabulate or color on the graph.
    if (candidatePaths.length === 0) return null;

    // For each candidate path, compute:
    //   - hops: number of edges (1 = direct, 2 = one intermediate in this app's path set)
    //   - relay: middle vertex on 2-hop paths (null if direct)
    //   - relayType: whether the relay sits in W (quadric) or V1/V2 for legend coloring
    //   - ecmpCost / unequalCost: totals from `pathCost` (equal per-hop vs cluster-aware unequal weights)
    //   - crossesCluster: true if any hop straddles different `nodeCluster` ids (inter-cluster segment)
    const analyzed = candidatePaths.map((p, i) => {
      const hops = p.length - 1;
      const relay = hops === 2 ? p[1] : null;
      const relayType = relay !== null ? (graph.isQuadric[relay] ? 'W' : graph.vType[relay] === 1 ? 'V1' : 'V2') : null;
      const ecmpCost = pathCost(p, nodeCluster, false);
      const unequalCost = pathCost(p, nodeCluster, true);
      // Single-hop: compare endpoints only. Multi-hop: any consecutive pair
      // with differing `nodeCluster` counts as crossing a cluster boundary
      // (inter-cluster hop).
      const crossesCluster = hops === 1 ? nodeCluster[p[0]] !== nodeCluster[p[1]]
        : p.slice(0, -1).some((n, j) => nodeCluster[n] !== nodeCluster[p[j + 1]]);
      return { idx: i, path: p, hops, relay, relayType, ecmpCost, unequalCost, crossesCluster };
    });
    // Primary sort: cheaper under unequal-cost metric first (often aligns
    // with “shorter” inter-cluster detours), then fewer hops — ties keep
    // stable relative order from enumeration.
    analyzed.sort((a, b) => a.unequalCost - b.unequalCost || a.hops - b.hops);

    // --- Cost column used for heat / min–max shading in the All Paths table ---
    // `showUnequalCost` swaps whether the table’s numeric column and “best” highlighting use
    // per-hop ECMP weights (`ecmpCost`) vs cluster-aware unequal weights (`unequalCost`).
    // `minCost` / `maxCost` bound the gradient for the active column only
    // (so the bar fills meaningfully for the chosen model).
    const displayCost = (a) => (showUnequalCost ? a.unequalCost : a.ecmpCost);
    const minCost = Math.min(...analyzed.map(displayCost));
    const maxCost = Math.max(...analyzed.map(displayCost));
    // ECMP-specific minimum on `ecmpCost` only — used to count how many
    // paths tie at the equal-cost optimum (ECMP width) independent of the
    // unequal-cost toggle.
    const ecmpMin = Math.min(...analyzed.map((a) => a.ecmpCost));
    // How many enumerated paths share that ECMP optimum — large values
    // imply wide ECMP fan-out under equal per-hop cost.
    const ecmpCount = analyzed.filter((a) => a.ecmpCost === ecmpMin).length;
    const directCount = analyzed.filter((a) => a.hops === 1).length;
    const twoHopCount = analyzed.filter((a) => a.hops === 2).length;

    // `paths`: raw vertex lists for overlays; `analyzed`: full row metadata
    // (costs, relay, cluster crossing) for the table and legends.
    return {
      paths: analyzed.map((a) => a.path),
      analyzed,
      minCost,
      maxCost,
      ecmpCount,
      directCount,
      twoHopCount,
      total: analyzed.length,
    };
  }, [routingMode, selectedSrc, selectedDst, graph, nodeCluster, showUnequalCost]);

  // ── SRv6 SRH DERIVATION ──────────────────────────────────────────────
  // Build a single SRH descriptor for whatever the Routing tab is currently
  // asking about, based on srv6Mode. Returns null when the current selection
  // is invalid (e.g. unicast with no dst, TREE2 with no root). Consumers:
  //   - SRHContainer  (draws the 128-bit box with active slot highlight)
  //   - HopsTableSRv6 (hop-by-hop row rendering via simulateHops)
  //   - Tree2Table    (level1/level2 drill-down when srhDesc.type === 'tree2')
  //   - PetalView     (edge/node highlighting for the active SRv6 route)
  const srhDesc = useMemo(() => {
    if (routingView !== 'srv6') return null;
    if (srv6Mode === 'unicast') {
      if (selectedSrc === null || selectedDst === null) return null;
      return encodeUnicastSRH(selectedSrc, selectedDst, graph, srv6UnicastEnc);
    }
    if (srv6Mode === 'group') {
      if (selectedSrc === null) return null;
      return encodeGroupSRH(selectedSrc, srv6GroupSel);
    }
    if (srv6Mode === 'tree2') {
      if (selectedSrc === null) return null;
      return encodeTree2SRH(selectedSrc, graph);
    }
    return null;
  }, [routingView, srv6Mode, srv6UnicastEnc, srv6GroupSel, selectedSrc, selectedDst, graph]);

  // Hop-by-hop simulation of the current SRv6 flow. Stable memo so table
  // rows keep identity across unrelated renders (e.g. hovering the topology
  // should not force a re-render of the entire Hops table).
  const srhHops = useMemo(
    () => (srhDesc ? simulateHops(srhDesc, graph) : []),
    [srhDesc, graph],
  );

  // Valiant / ECMP fan enumeration. Only meaningful for unicast mode when
  // src and dst are non-adjacent (and thus have q common neighbors in ER_q).
  const srhEcmpFan = useMemo(() => {
    if (routingView !== 'srv6' || srv6Mode !== 'unicast') return [];
    if (selectedSrc === null || selectedDst === null) return [];
    if (selectedSrc === selectedDst) return [];
    return enumerateECMPFan(selectedSrc, selectedDst, graph);
  }, [routingView, srv6Mode, selectedSrc, selectedDst, graph]);

  // Reset pins / expanded rows whenever the SRv6 input changes — stale row
  // indices against a different SRH confuse the overlay painter.
  useEffect(() => {
    setSrv6Highlight(null);
    setSrv6Pinned(null);
    setSrv6Tree2Expanded(new Set());
  }, [routingView, srv6Mode, selectedSrc, selectedDst, srv6UnicastEnc, srv6GroupSel]);

  // Click-to-select for Petal View (and any canvas that calls this): implements a two-tap src/dst workflow.
  // - No src yet, or both src and dst already set → this click becomes the new source and clears dst (restart pair).
  // - Src set but dst empty → this click sets dst (pair complete).
  const handleSelectNode = useCallback((nodeId) => {
    if (selectedSrc === null || (selectedSrc !== null && selectedDst !== null)) {
      setSelectedSrc(nodeId);
      setSelectedDst(null);
    } else {
      setSelectedDst(nodeId);
    }
  }, [selectedSrc, selectedDst]);

  // Changing endpoints or leaving “all paths” invalidates row pin/hover state so the Routing table does not
  // point at a stale path index or preview a path that no longer exists.
  useEffect(() => { setPinnedPathIdx(null); setHoveredPathIdx(null); }, [selectedSrc, selectedDst, routingMode]);

  // --- Petal display toggles (lifted to App so PetalView stays dumb and the sidebar owns all visibility flags) ---
  // `showInterCluster`: edges whose endpoints belong to different topological clusters (cross-cluster hops).
  // `showIntraCluster`: edges entirely inside one cluster (fan / local connectivity).
  // `showQuadricEdges`: edges incident on the quadric subgraph (W); turn off to see only fin structure.
  // `autoRotate`: slow idle rotation of the 3D scene for demos (no routing impact).
  // `gyrate`: tumble on all three rotational axes simultaneously (X
  //   pitch, Y yaw, Z roll) using incommensurate sine oscillators.
  //   Wins over `autoRotate` when both are on. Good for
  //   "which angle shows this structure best?" exploration and for
  //   short demo-reel captures where the camera should never look
  //   the same twice.
  const [showInterCluster, setShowInterCluster] = useState(true);
  const [showIntraCluster, setShowIntraCluster] = useState(true);
  const [showQuadricEdges, setShowQuadricEdges] = useState(true);
  const [autoRotate, setAutoRotate] = useState(false);
  const [gyrate, setGyrate] = useState(false);
  // Cluster identifier labels (C0, C1, …) in the 3D petal scene.
  const [showClusterLabels, setShowClusterLabels] = useState(true);
  // Per-vertex-class VISIBILITY toggles (Display section). Hiding a class
  // drops its glyph (and its label) from PetalView entirely except for
  // nodes currently part of the highlighted route. Defaults to "show all"
  // so casual users see the full topology, but lets deep-dive screenshots
  // focus on, e.g., only the quadric skeleton.
  const [showQuadricNodes, setShowQuadricNodes] = useState(true);
  const [showCenterNodes, setShowCenterNodes]   = useState(true);
  const [showV1Nodes, setShowV1Nodes]           = useState(true);
  const [showV2Nodes, setShowV2Nodes]           = useState(true);
  // Node label toggles: independently show/hide labels for each vertex
  // class. When all three are off, no node labels render. Each maps to
  // the isQuadric / vType classification used by PetalView coloring.
  const [showQuadricLabels, setShowQuadricLabels] = useState(false);
  const [showV1Labels, setShowV1Labels] = useState(false);
  const [showV2Labels, setShowV2Labels] = useState(false);
  // When non-null, restrict node labels to only the given cluster
  // index. null = show labels across all clusters (subject to the
  // per-type toggles above).
  const [labelClusterFilter, setLabelClusterFilter] = useState(null);
  // Petal 3D layout mode: stacked layers, radial fan, or flat projection —
  // drives camera and vertex placement in PetalView.
  const [petalLayout, setPetalLayout] = useState('stacked');
  // Inter-cluster link filter: up to two cluster ids [a] or [a,b] meaning
  // “only show inter-cluster edges involving these cluster(s)” (UI builds
  // C0…Cn pills). Empty array = no filter (all inter-cluster edges allowed by
  // other toggles).
  const [filterClusters, setFilterClusters] = useState([]);

  // Quadric ring vertical offset in normalized scene units: negative/positive lifts the W ring below/above default
  // to separate it from fins when debugging overlap (slider typically ~[-0.5, 0.5] in the sidebar).
  const [quadricY, setQuadricY] = useState(-0.5);
  // Petal fin stretch: `petalStretchV` scales vertical separation of fin vertices; `petalStretchR` scales radial
  // “depth” of fins from the hub — both are pure layout multipliers (no graph change).
  const [petalStretchV, setPetalStretchV] = useState(1.5);
  const [petalStretchR, setPetalStretchR] = useState(1.1);
  // Per-layer cylinder radii: quadric (W) ring, central C vertices, and
  // fin vertices — each a multiplier on the base layout.
  const [quadricRScale, setQuadricRScale] = useState(0.5);
  const [centerRScale, setCenterRScale] = useState(0.8);
  const [finRScale, setFinRScale] = useState(0.5);
  // V1/V2 spread: symmetrical scale factor on the radial (stacked/radial layouts)
  // and angular (flat layout) separation between V1 and V2 endpoints of every
  // fin pair. 0 collapses them onto one radius; 1 reproduces the legacy
  // PolarFly layout; >1 flares each triangle wider without touching `petalStretchR`.
  const [v1v2Spread, setV1v2Spread] = useState(1);

  // --- Visual tuning sliders (PetalView only) ---
  // Multipliers and opacities for camera distance, mesh size, line thickness, and arrow glyphs.
  // Ranges are set where each control is rendered (`sld(..., min, max, step)`): e.g. zoom ~0.3–5, opacities ~0.05–1
  // so links/nodes can fade for screenshots without disappearing entirely. None of these recompute `graph`.
  const [petalZoom, setPetalZoom] = useState(1.1);
  const [petalNodeSize, setPetalNodeSize] = useState(0.4);
  const [petalLineWidth, setPetalLineWidth] = useState(0.1);
  const [petalNodeOpacity, setPetalNodeOpacity] = useState(1);
  const [petalLineOpacity, setPetalLineOpacity] = useState(1);
  const [petalArrowWidth, setPetalArrowWidth] = useState(1);
  const [petalArrowOpacity, setPetalArrowOpacity] = useState(1);
  const [petalArrowHeadSize, setPetalArrowHeadSize] = useState(1);
  // Extra line-width scale for inter-cluster edges only — emphasizes (or thins) cross-cluster hops vs intra-cluster.
  const [petalInterClusterWidth, setPetalInterClusterWidth] = useState(1);

  // --- Contrast / screenshot controls ---
  // `petalGamma`: perceptual intensity dial applied to every edge and node
  //   opacity in `PetalView` as `op' = op^(1/gamma)`. gamma > 1 pushes semi-
  //   transparent strokes toward full ink (crisper screenshots); gamma < 1
  //   fades them. Default 1.0 is a no-op. Range 0.3–3.0.
  // `petalAutoEdgeComp`: when true (default), `PetalView.renderEdge` applies
  //   the built-in `widthCompensation = 1/sqrt(lineWidth)` that auto-dims
  //   thick edges to keep perceived ink density flat. Disable it when the
  //   user wants thick lines to stay at full opacity (the "blurry at high
  //   line width" effect the auto-compensation was designed to avoid is
  //   actually *caused* by the lowered opacity when readers want crisp ink).
  const [petalGamma, setPetalGamma] = useState(1);
  const [petalAutoEdgeComp, setPetalAutoEdgeComp] = useState(true);

  // --- Save/load tuning presets (localStorage-backed) ---
  // Persists a named snapshot of every key in `tuningKeys` under `localStorage['pf-tuning-presets']` as JSON
  // `{ [presetName]: { petalLayout, quadricY, ... } }`. Used for one-click recall of a whole Petal sidebar setup.
  const tuningKeys = [
    'petalLayout',
    'quadricY',
    'petalStretchV',
    'petalStretchR',
    'quadricRScale',
    'centerRScale',
    'finRScale',
    'v1v2Spread',
    'petalZoom',
    'petalNodeSize',
    'petalLineWidth',
    'petalNodeOpacity',
    'petalLineOpacity',
    'petalArrowWidth',
    'petalArrowOpacity',
    'petalArrowHeadSize',
    'petalInterClusterWidth',
    'petalGamma',
    'petalAutoEdgeComp',
  ];
  const tuningGetters = {
    petalLayout,
    quadricY,
    petalStretchV,
    petalStretchR,
    quadricRScale,
    centerRScale,
    finRScale,
    v1v2Spread,
    petalZoom,
    petalNodeSize,
    petalLineWidth,
    petalNodeOpacity,
    petalLineOpacity,
    petalArrowWidth,
    petalArrowOpacity,
    petalArrowHeadSize,
    petalInterClusterWidth,
    petalGamma,
    petalAutoEdgeComp,
  };
  const tuningSetters = {
    petalLayout: setPetalLayout,
    quadricY: setQuadricY,
    petalStretchV: setPetalStretchV,
    petalStretchR: setPetalStretchR,
    quadricRScale: setQuadricRScale,
    centerRScale: setCenterRScale,
    finRScale: setFinRScale,
    v1v2Spread: setV1v2Spread,
    petalZoom: setPetalZoom,
    petalNodeSize: setPetalNodeSize,
    petalLineWidth: setPetalLineWidth,
    petalNodeOpacity: setPetalNodeOpacity,
    petalLineOpacity: setPetalLineOpacity,
    petalArrowWidth: setPetalArrowWidth,
    petalArrowOpacity: setPetalArrowOpacity,
    petalArrowHeadSize: setPetalArrowHeadSize,
    petalInterClusterWidth: setPetalInterClusterWidth,
    petalGamma: setPetalGamma,
    petalAutoEdgeComp: setPetalAutoEdgeComp,
  };
  const saveTuning = useCallback((name) => {
    const presets = JSON.parse(localStorage.getItem('pf-tuning-presets') || '{}');
    presets[name] = {};
    tuningKeys.forEach(k => { presets[name][k] = tuningGetters[k]; });
    localStorage.setItem('pf-tuning-presets', JSON.stringify(presets));
  }, [tuningGetters]);
  // Applies stored numbers/strings to React state; unknown keys are skipped. Missing preset is a no-op.
  const loadTuning = useCallback((name) => {
    const presets = JSON.parse(localStorage.getItem('pf-tuning-presets') || '{}');
    const p = presets[name]; if (!p) return;
    tuningKeys.forEach(k => { if (p[k] !== undefined && tuningSetters[k]) tuningSetters[k](p[k]); });
  }, []);
  const deleteTuning = useCallback((name) => {
    const presets = JSON.parse(localStorage.getItem('pf-tuning-presets') || '{}');
    delete presets[name];
    localStorage.setItem('pf-tuning-presets', JSON.stringify(presets));
  }, []);
  // Initial chip list for the preset row; updated via `refreshPresets` after
  // save/delete so new names appear without reload.
  const [savedPresets, setSavedPresets] = useState(() =>
    Object.keys(JSON.parse(localStorage.getItem('pf-tuning-presets') || '{}')),
  );
  const refreshPresets = useCallback(
    () =>
      setSavedPresets(
        Object.keys(
          JSON.parse(localStorage.getItem('pf-tuning-presets') || '{}'),
        ),
      ),
    [],
  );

  // ═══ On-disk persistence for tuning state ═══
  //
  // Two-tier model so "adjust sliders → Save → restart server" keeps them:
  //
  //  1. `localStorage['pf-current-tuning']`
  //     Per-browser memory of the live slider values; written on every
  //     slider change, read once on mount. Survives page reloads and
  //     server restarts as long as the same browser origin stays.
  //
  //  2. `./polarfly-presets.json` fetched from the serving directory
  //     Survives cross-browser / cross-machine moves. On mount we try
  //     to GET it; if present, it overrides localStorage. On Save or
  //     explicit Download we offer the user a fresh JSON file they can
  //     drop back into the serving directory (dev workflow: one-time
  //     copy into the repo and commit). File shape:
  //         { "presets": { name: {...} }, "current": {...} }
  //
  // Both mechanisms share the `tuningKeys` list so the same set of
  // fields is saved / restored everywhere.
  const PRESETS_FILE_URL = './polarfly-presets.json';
  const CURRENT_KEY = 'pf-current-tuning';

  // Apply a partial tuning object to React state (unknown keys skipped).
  const applyTuningObject = useCallback((obj) => {
    if (!obj) return;
    tuningKeys.forEach(k => {
      if (obj[k] !== undefined && tuningSetters[k]) tuningSetters[k](obj[k]);
    });
  }, []); // setters are stable; tuningKeys is a module-local constant.

  // Mount-time restore: first localStorage (synchronous, no flash on
  // same-origin reloads), then fetch the on-disk file (async, overrides).
  useEffect(() => {
    // Guard against double-apply in React 18 StrictMode dev.
    let cancelled = false;
    try {
      const raw = localStorage.getItem(CURRENT_KEY);
      if (raw) applyTuningObject(JSON.parse(raw));
    } catch { /* corrupted storage: fall through to defaults */ }

    (async () => {
      try {
        const res = await fetch(PRESETS_FILE_URL, { cache: 'no-store' });
        if (!res.ok || cancelled) return;
        const data = await res.json();
        if (cancelled) return;
        if (data && data.presets && typeof data.presets === 'object') {
          localStorage.setItem('pf-tuning-presets', JSON.stringify(data.presets));
          setSavedPresets(Object.keys(data.presets));
        }
        if (data && data.current) applyTuningObject(data.current);
      } catch { /* file absent or unreachable: no-op */ }
    })();

    return () => { cancelled = true; };
    // Run exactly once on mount.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Single JSON-stringified snapshot of the live tuning state. Dep list is
  // the full tuning-field set so we only recompute on real changes.
  const currentTuningJSON = useMemo(() => JSON.stringify({
    petalLayout, quadricY, petalStretchV, petalStretchR,
    quadricRScale, centerRScale, finRScale, v1v2Spread,
    petalZoom, petalNodeSize, petalLineWidth,
    petalNodeOpacity, petalLineOpacity,
    petalArrowWidth, petalArrowOpacity, petalArrowHeadSize,
    petalInterClusterWidth, petalGamma, petalAutoEdgeComp,
  }), [
    petalLayout, quadricY, petalStretchV, petalStretchR,
    quadricRScale, centerRScale, finRScale, v1v2Spread,
    petalZoom, petalNodeSize, petalLineWidth,
    petalNodeOpacity, petalLineOpacity,
    petalArrowWidth, petalArrowOpacity, petalArrowHeadSize,
    petalInterClusterWidth, petalGamma, petalAutoEdgeComp,
  ]);

  // Auto-save live slider state to localStorage on every change.
  useEffect(() => {
    try { localStorage.setItem(CURRENT_KEY, currentTuningJSON); } catch {}
  }, [currentTuningJSON]);

  // Download all presets + live tuning as polarfly-presets.json. Writing
  // this file into the directory that serves polarfly.html is what makes
  // the settings "stick" across server restarts (the startup fetch above
  // will pick them back up on next reload).
  const downloadPresetsFile = useCallback(() => {
    const presets = JSON.parse(localStorage.getItem('pf-tuning-presets') || '{}');
    const current = JSON.parse(currentTuningJSON);
    const blob = new Blob(
      [JSON.stringify({ presets, current }, null, 2) + '\n'],
      { type: 'application/json' }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'polarfly-presets.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, [currentTuningJSON]);

  // Import a previously downloaded polarfly-presets.json. Overwrites any
  // existing presets with the same name; unknown keys are ignored.
  const importPresetsFile = useCallback((file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data && data.presets && typeof data.presets === 'object') {
          localStorage.setItem('pf-tuning-presets', JSON.stringify(data.presets));
          setSavedPresets(Object.keys(data.presets));
        }
        if (data && data.current) applyTuningObject(data.current);
      } catch (e) {
        // eslint-disable-next-line no-console
        console.error('Invalid polarfly-presets.json:', e);
        // eslint-disable-next-line no-alert
        alert('Could not parse polarfly-presets.json. See console for details.');
      }
    };
    reader.readAsText(file);
  }, [applyTuningObject]);

  // --- Rack view state ---
  // Which rack is focused in the diagram (null = none / global behavior depends on child view).
  const [selectedRack, setSelectedRack] = useState(null);
  // `overview` = all racks; `detail` = zoomed wiring for one rack (paired with `selectedRack` in the Rack tab UI).
  const [rackViewMode, setRackViewMode] = useState('overview');
  // Rack-expansion drill-down: null shows every rack; a number limits the
  // staged “expansion” step index for the rack strip.
  const [rackExpStep, setRackExpStep] = useState(null); // null = show all racks
  // Logical links per bundle (cable grouping) between adjacent rack elements in the rack wiring diagram.
  const [bundleSize, setBundleSize] = useState(1);
  // `portsPerSwitch` in `buildRackModel`: each leaf switch radix; with
  // bundle size constrains how many hosts/links fit per tier.
  const [switchRadix, setSwitchRadix] = useState(64);

  // Derived rack list + port wiring for Rack View: 16 switches per rack
  // (fixed in this build), `switchRadix` ports each, `bundleSize` for bundled
  // uplinks. Recomputed when q-driven `graph`/`clusterData` or rack params
  // change.
  const rackModel = useMemo(
    () => buildRackModel(graph, clusterData, 16, switchRadix, bundleSize),
    [graph, clusterData, switchRadix, bundleSize],
  );

  // Expansion sandbox: append a hypothetical rack of `type` (quadric vs
  // non-quadric replication) for the Expansion tab UI.
  // Ids are synthetic (`base rack count + already-added hypothetical`) so each new rack gets a distinct key.
  const handleExpand = useCallback((type) => {
    setExpansionState(prev => ({
      newRacks: [...prev.newRacks, { id: rackModel.racks.length + prev.newRacks.length, type }],
      rewiring: false
    }));
  }, [rackModel]);

  // --- Expansion tab state (hypothetical replication, not the core ER_q graph) ---
  // `expMethod`: which replication recipe the Expansion canvas uses.
  // `expSteps`: how many steps of the animation/scenario to show.
  const [expMethod, setExpMethod] = useState('nonquadric');
  const [expSteps, setExpSteps] = useState(1);
  // Quadric replication is capped at 10 steps in UI; non-quadric can walk up to current field order `q`.
  const expMaxSteps = expMethod === 'quadric' ? 10 : q;

  // --- Radial growth view state (aggregate growth metrics, separate from
  // Rack View’s `rackModel`) ---
  // `radialSwitchesPerRack`: divisor when estimating how many racks each
  // cluster needs (nodes per rack assumption).
  // `radialRackStep`: which growth step the radial view highlights.
  // `radialTotalRacks` sums per-cluster rack counts at that assumption.
  const [radialSwitchesPerRack, setRadialSwitchesPerRack] = useState(16);
  const [radialRackStep, setRadialRackStep] = useState(1);
  const radialTotalRacks = useMemo(() => {
    return clusterData.clusters.reduce((sum, cl) => sum + Math.ceil(cl.nodes.length / radialSwitchesPerRack), 0);
  }, [clusterData, radialSwitchesPerRack]);

  // --- Tab definitions and reusable UI helpers ---
  // `tab` state (elsewhere) picks one `id`; the sidebar + main canvas switch on the same id.
  const tabs = [
    { id: 'petal', label: 'Petal View', icon: '\u2726' },       // 3D cluster topology + path overlays
    { id: 'routing', label: 'Routing', icon: '\u21E2' },       // algorithms, All Paths table, ECMP tools
    { id: 'astr', label: 'ASTR', icon: '\u273F' },            // k edge-disjoint spanning trees + All-Reduce
    { id: 'rack', label: 'Rack View', icon: '\u25A5' },        // physical rack / port diagram from `rackModel`
    { id: 'radial', label: 'Radial Growth', icon: '\u25CE' }, // incremental growth stats by rack step
    { id: 'expansion', label: 'Expansion', icon: '\u2295' },  // hypothetical rack replication sandbox
  ];

  // Shared class for native `<select>` and `<input>` controls in the sidebar — theme-aware background/border/text.
  // bw uses a stark white field with a black border so inputs match the print-grade page chrome.
  const selCls = `w-full border rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-fuchsia-400 ${
    tm('bg-gray-800 border-gray-600 text-gray-100',
       'bg-white border-gray-300 text-gray-800',
       'bg-neutral-900 border-neutral-700 text-neutral-200',
       'bg-white border-gray-900 text-gray-900')}`;

  // Header theme switcher: ids match `theme` state (`light` | `dark` |
  // `midnight` | `bw`); glyphs are sun / crescent / new-moon / yin-yang.
  // The bw entry selects a high-contrast print/screenshot theme where every
  // graph element resolves to a greyscale value via getPalette('bw'); the
  // yin-yang glyph (U+262F) reads as "balance of black and white" and is
  // widely supported across macOS / Windows / web fonts.
  const themeButtons = [
    { id: 'light', glyph: '\u2600\uFE0F' },
    { id: 'dark', glyph: '\uD83C\uDF19' },
    { id: 'midnight', glyph: '\uD83C\uDF11' },
    { id: 'cisco', glyph: <svg width="12" height="10" viewBox="0 0 38 20" fill="none" style={{verticalAlign:'middle'}}>
        <rect x="0" y="6" width="3" height="8" rx="1.5" fill="currentColor"/>
        <rect x="7" y="3" width="3" height="14" rx="1.5" fill="currentColor"/>
        <rect x="14" y="0" width="3" height="20" rx="1.5" fill="currentColor"/>
        <rect x="21" y="3" width="3" height="14" rx="1.5" fill="currentColor"/>
        <rect x="28" y="6" width="3" height="8" rx="1.5" fill="currentColor"/>
        <rect x="35" y="6" width="3" height="8" rx="1.5" fill="currentColor"/>
      </svg> },
    { id: 'bw', glyph: '\u262F' },
  ];

  // Small uppercase section heading in the left sidebar (Field Order, Display, etc.).
  const sideLabel = (text) => (
    <div className="text-sm font-semibold uppercase tracking-wider mt-3 mb-1.5" style={{
      color: tm('#64748b','#94a3b8','#475569','#000000')
    }}>{text}</div>
  );

  // Themed checkbox row: `label` text, controlled `checked`, and `onChange(boolean)` from Petal/Rack sidebars.
  // bw forces a solid-black accent so checkboxes stay legible on the white print skin.
  const cbx = (label, checked, onChange) => (
    <label
      className="flex items-center gap-1.5 cursor-pointer text-sm"
      style={{color:tm('#cbd5e1','#475569','#cbd5e1','#111111')}}>
      {/* accentColor picks up the palette-driven uiTint (or pure black
          in bw). This replaces the former `accent-teal-500` / `accent-
          violet-400` / `accent-black` Tailwind conditional: one inline
          style now tracks the live palette state. */}
      <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)}
        className="w-3.5 h-3.5"
        style={{accentColor: uiTint}}/>{label}
    </label>
  );

  // Compact slider row: fixed label width, flex `<input type="range">`, monospace value column.
  // Default range 0.1–3 / step 0.05 is a generic multiplier band; callers override min/max/step per control
  // (e.g. Quadric Y uses negative min, Zoom uses larger max).
  const sld = (label, value, onChange, min = 0.1, max = 3, step = 0.05) => (
    <div className="flex items-center gap-1" style={{height:20}}>
      {/* Reusable horizontal slider row used throughout Petal / Routing /
          Radial sidebars: fixed-width label, one `<input type="range">`, and a
          monospace value column so scale factors stay comparable. Passed
          values are dimensionless multipliers (or normalized offsets for
          Quadric Y) fed into `PetalView` / `RadialExpansionView`; they adjust
          layout and drawing only, not the combinatorial ER_q graph. */}
      <span className="shrink-0 text-xs" style={{width:82,color:tm('#94a3b8','#64748b','#94a3b8','#111111')}}>{label}</span>
      {/* --thumb is consumed by the slider-thumb CSS at the top of the
          file; accentColor retints the filled-track portion on browsers
          that render a progress fill (Chromium 121+ / Safari 17+). Both
          pull from the palette's accent, so swapping the palette chip
          instantly recolors every slider in the sidebar. */}
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(parseFloat(e.target.value))}
        className="flex-1 min-w-0" style={uiInputStyle}/>
      <span
        className="font-mono text-xs shrink-0"
        style={{
          width: 28,
          textAlign: 'right',
          color: tm('#64748b', '#94a3b8', '#64748b', '#000000'),
        }}>
        {value.toFixed(1)}
      </span>
    </div>
  );

  // Root layout: full-viewport column — header (40px) + body flex row (sidebar + main) defined below the header.
  // tm() calls pass a 4th arg for the 'bw' print theme (pure white page, near-black text) so chrome stays
  // legible when users pick the high-contrast screenshot skin.
  return (
    <div className="h-screen flex flex-col" style={{
      background: tm('#080e1a','#ffffff','#020204','#ffffff','#07182C'),
      color: tm('#e2e8f0','#1e293b','#cbd5e1','#000000','#e2e8f0')
    }}>
      {/* Top bar (40px): product/logo anchor, primary `tab` switcher that swaps both sidebar and main canvas, and
          the global `theme` quartet (light / dark / midnight / bw) implemented as compact glyph buttons — all global
          UI chrome, unrelated to ER_q parameters which live in the sidebar. */}
      <header className="flex items-center gap-4 px-4 border-b flex-shrink-0" style={{
        height: 40,
        background: tm('#0a1020','#ffffff','#060608','#ffffff','#0D2240'),
        borderColor: tm('#1e293b','#e2e8f0','rgba(100,116,139,0.25)','#000000','#1e3a5f')
      }}>
        <div className="flex items-center gap-2">
          <CiscoLogo theme={theme}/>
          <h1 className="text-sm font-bold tracking-tight" style={{
            color: tm('#cbd5e1','#1e293b','#c4b5fd','#000000','#049FD9')
          }}>PolarFly Explorer</h1>
        </div>

        {/* Primary navigation: maps `tabs` entries to `tab` state — Petals,
            Routing, Rack, Radial, Expansion — controlling which `Fragment`
            block renders in the sidebar and which major visualization mounts
            in `<main>`. */}
        <div className="flex gap-0.5 ml-4">
          {tabs.map(tb => {
            const active = tab === tb.id;
            return (
              <button key={tb.id} onClick={() => setTab(tb.id)}
                className={`flex items-center gap-1 px-3 text-sm rounded-t transition-colors cursor-pointer ${
                  active
                    ? `font-semibold border-b-2 ${
                      isCisco ? 'border-cyan-400' : isMidnight ? 'border-violet-400' : 'border-teal-400'
                    }`
                    : 'border-b-2 border-transparent'
                }`}
                style={{
                  paddingTop: 8, paddingBottom: 8,
                  background: active
                    ? tm(
                      'rgba(30,41,59,0.5)',
                      'rgba(248,250,252,0.8)',
                      'rgba(20,20,30,0.5)',
                      undefined,
                      'rgba(13,34,64,0.5)',
                    )
                    : 'transparent',
                  color: active
                    ? tm('#e2e8f0', '#0f172a', '#c4b5fd', undefined, '#e2e8f0')
                    : tm('#94a3b8', '#64748b', '#64748b', undefined, '#8da4bf'),
                }}>
                <span>{tb.icon}</span>{tb.label}
              </button>
            );
          })}
        </div>

        {/* Header right cluster: palette picker + theme picker. The palette
            picker selects the semantic color scheme used for graph elements
            (quadric / V1 / V2 / edges / path highlights) and is orthogonal
            to the theme (which controls the shell/chrome tokens via tm()).
            bw theme always renders greyscale regardless of palette. */}
        <div className="ml-auto flex items-center gap-2">
          {/* Palette picker: native select styled to match header chrome. */}
          <label className="flex items-center gap-1.5 text-xs"
            title="Color palette for graph elements (bw theme overrides to greyscale)"
            style={{
              color: tm('#94a3b8','#64748b','#94a3b8','#444444'),
              fontWeight: 500,
            }}>
            <span aria-hidden="true">{'\u{1F3A8}'}</span>
            <select
              value={palette}
              onChange={e => setPalette(e.target.value)}
              disabled={theme === 'bw'}
              className="text-xs rounded px-1.5 py-0.5 cursor-pointer focus:outline-none focus:ring-1 focus:ring-fuchsia-400"
              style={{
                background: tm('#0f172a','#f1f5f9','#040406','#ffffff','#0D2240'),
                color: tm('#e2e8f0','#0f172a','#e2e8f0','#000000','#e2e8f0'),
                border: `1px solid ${tm('#334155','#e2e8f0','#1e1e2a','#000000','#1e3a5f')}`,
                opacity: theme === 'bw' ? 0.4 : 1,
              }}
            >
              {PALETTE_OPTIONS.map(o => (
                <option key={o.id} value={o.id} title={o.hint}>{o.label}</option>
              ))}
            </select>
          </label>

          {/* Theme tokens: drives `tm(...)` color tuples across the app
              (backgrounds, borders, muted text); midnight swaps several
              accents to violet for contrast with the dark-blue palette,
              and bw flattens the chrome to pure black-on-white so
              screenshots render crisply. */}
          <div className="flex items-center gap-0.5 rounded px-0.5 py-0.5" style={{
            background: tm('#0f172a','#f1f5f9','#040406','#f5f5f5','#0a1e38')
          }}>
          {themeButtons.map(tb => {
            // Active pill: violet on midnight, solid black on bw, indigo otherwise. Inactive glyphs
            // track the sidebar muted-label color per theme so the quartet reads consistently.
            const activeBg = theme === tb.id
              ? (theme === 'bw' ? '#000000' : isCisco ? '#049FD9' : isMidnight ? '#6d28d9' : '#4f46e5')
              : 'transparent';
            const activeFg = theme === tb.id
              ? '#ffffff'
              : tm('#94a3b8','#64748b','#64748b','#444444');
            return (
              <button key={tb.id} onClick={() => setTheme(tb.id)}
                className="px-2 py-0.5 rounded text-xs transition-colors cursor-pointer"
                style={{
                  fontWeight: theme === tb.id ? 600 : 400,
                  background: activeBg,
                  color: activeFg,
                }}>{tb.glyph}</button>
            );
          })}
          </div>
        </div>
      </header>

      {/* ── Body: fixed-width left sidebar (global graph parameters +
          tab-specific controls) + main canvas ── */}
      <div className="flex flex-1 overflow-hidden">

        {/* Left sidebar: always shows field order `q` and live graph stats;
            below that, the active primary tab injects its panel (`petal` |
            `routing` | `rack` | `radial` | `expansion`). */}
        <aside className="w-72 flex-shrink-0 overflow-y-auto no-scrollbar border-r" style={{
          background: tm('#070d18','#ffffff','#040406','#ffffff','#0a1e38'),
          borderColor: tm('#1e293b','#e2e8f0','rgba(100,116,139,0.2)','#000000','#1e3a5f')
        }}>
          <div className="p-3">
            {/* Field order `q`: picks the finite projective-plane parameter for the embedded ER_q / PolarFly graph.
                Larger `q` means more vertices (N = q^2+q+1), higher degree (k = q+1), and a heavier GPU/CPU build.
                Options are filtered by `maxQForRadix(switchRadix)` so the chosen topology stays realizable given the
                rack/switch radix model used elsewhere in the app. Changing `q` invalidates src/dst selection and
                resets expansion staging so stale indices cannot point outside the new vertex set. */}
            {sideLabel('Field Order')}
            {(() => {
              const qMax = maxQForRadix(switchRadix);
              const filteredQ = VALID_Q.filter(v => v <= qMax);
              return (
                <select value={q} onChange={e => {
                  setQ(+e.target.value);
                  setSelectedSrc(null); setSelectedDst(null);
                  // Drop staged rack adds and rewind expansion animation — new `q` implies a fresh vertex id space.
                  setExpansionState({newRacks:[],rewiring:false});
                  setExpSteps(1);
                }}
                  className={selCls}>
                  {filteredQ.map(v => {
                    const pk = isPrimePower(v);
                    // Proper prime-power labels get "p^k" annotation; primes stay plain (k=1 omitted).
                    const qTag = (pk && pk.k > 1) ? `${v} (${pk.p}^${pk.k})` : `${v}`;
                    return <option key={v} value={v}>{qTag} · deg={v+1}, N={v*v+v+1}</option>;
                  })}
                </select>
              );
            })()}

            {/* Read-only summary: cluster counts, diameters, etc., derived from
                the current `graph` + `clusterData`. */}
            {sideLabel('Graph Statistics')}
            <StatsPanel graph={graph} clusterData={clusterData} dk={dk} theme={theme}/>

            {/* ── PETAL VIEW tab: edge filters, inter-cluster focus, 3D petal
                layout modes, spatial/visual tuning, preset I/O, src/dst +
                routing shortcut for in-view path picking, and a color legend
                matching canvas glyphs. ── */}
            {tab === 'petal' && (
              <Fragment>
                {/* Layer visibility + motion: toggles which edge families are drawn (inter-cluster links between
                    super-clusters, intra-cluster links inside a cluster, and the distinguished quadric subgraph)
                    and whether the 3D petal scene slowly orbits for presentation. These map directly to `PetalView`
                    props — they never remove vertices, only reduce visual clutter. */}
                {sideLabel('Display')}
                <div className="flex flex-col gap-1">
                  {cbx('Inter-cluster edges', showInterCluster, setShowInterCluster)}
                  {cbx('Intra-cluster edges', showIntraCluster, setShowIntraCluster)}
                  {cbx('Quadric edges', showQuadricEdges, setShowQuadricEdges)}
                  {cbx('Quadric nodes (W)', showQuadricNodes, setShowQuadricNodes)}
                  {cbx('Cluster centers (C)', showCenterNodes, setShowCenterNodes)}
                  {cbx('V1 fins', showV1Nodes, setShowV1Nodes)}
                  {cbx('V2 fins', showV2Nodes, setShowV2Nodes)}
                  {cbx('Auto-rotate', autoRotate, setAutoRotate)}
                  {cbx('Gyrate (X/Y/Z)', gyrate, setGyrate)}
                </div>
                {/* Inter-cluster spotlight: optionally restrict the
                    *inter-cluster* edge subset to those incident on one chosen
                    cluster (“C# ↔ all”) or between two specific clusters (“C# ↔
                    C#”). Quadric is C0; fin clusters use distinct hues in the
                    chip buttons. At most two clusters are remembered — picking
                    a third replaces the older selection so the UI stays a
                    lightweight pairwise filter. */}
                {sideLabel('Filter Inter-Cluster')}
                <div className="text-[10px] mb-1" style={{color:tm('#64748b','#94a3b8','#475569')}}>
                  {filterClusters.length === 0
                    ? 'Showing all'
                    : filterClusters.length === 1
                      ? `C${filterClusters[0]} \u2194 all`
                      : `C${filterClusters[0]} \u2194 C${filterClusters[1]}`}
                </div>
                <div className="flex flex-wrap gap-1">
                  <button onClick={() => setFilterClusters([])}
                    className="px-1.5 py-0.5 text-xs rounded transition-colors"
                    style={{
                      background: filterClusters.length === 0
                        ? activePillBg
                        : tm('#1e293b', '#f1f5f9', '#0f0f14'),
                      color: filterClusters.length === 0
                        ? activePillText
                        : tm('#94a3b8', '#64748b', '#94a3b8'),
                      border: `1px solid ${
                        filterClusters.length === 0
                          ? activePillBorder
                          : 'transparent'
                      }`,
                    }}>All</button>
                  {clusterData.clusters.map(cl => {
                    const c = cl.id;
                    const isActive = filterClusters.includes(c);
                    // In bw mode every cluster pill flattens to the same greyscale
                    // active-state style so the row reads as "selected / not"
                    // without HSL rainbow chips. Elsewhere we keep the
                    // distinct-per-cluster HSL tint.
                    const clColor = isBw
                      ? '#000000'
                      : (c === 0 ? COLORS.quadric : `hsl(${(c * 47 + 200) % 360}, 65%, 55%)`);
                    return (
                      <button key={c} onClick={() => setFilterClusters(prev => {
                        if (prev.includes(c)) return prev.filter(x => x !== c);
                        if (prev.length >= 2) return [prev[1], c];
                        return [...prev, c];
                      })}
                        className="px-1.5 py-0.5 text-xs rounded transition-colors"
                        style={{
                          background: isActive ? (isBw ? activePillBg : clColor + '33') : tm('#1e293b','#f1f5f9','#0f0f14',undefined,'#0D2240'),
                          color: isActive ? clColor : tm('#94a3b8','#64748b','#94a3b8'),
                          border: `1px solid ${isActive ? (isBw ? activePillBorder : clColor + '66') : 'transparent'}`
                        }}>C{c}</button>
                    );
                  })}
                </div>

                {/* Node labels: per-class toggles for W (quadric),
                    V1, V2 vertex labels, plus an optional single-
                    cluster filter so dense topologies stay readable.
                    Labels render over the 3D node circles in
                    PetalView showing "id (W/V1/V2)". */}
                {sideLabel('Node Labels')}
                <div className="flex flex-col gap-1">
                  {cbx('Cluster labels (C#)', showClusterLabels, setShowClusterLabels)}
                  {cbx('Quadric (W)', showQuadricLabels, setShowQuadricLabels)}
                  {cbx('V1', showV1Labels, setShowV1Labels)}
                  {cbx('V2', showV2Labels, setShowV2Labels)}
                </div>
                {(showQuadricLabels || showV1Labels || showV2Labels) && (
                  <>
                    <div className="text-[10px] mt-1.5 mb-1" style={{
                      color: tm('#64748b', '#94a3b8', '#475569')
                    }}>
                      {labelClusterFilter === null
                        ? 'Showing all clusters'
                        : `Cluster C${labelClusterFilter} only`}
                    </div>
                    <div className="flex flex-wrap gap-1">
                      <button onClick={() => setLabelClusterFilter(null)}
                        className="px-1.5 py-0.5 text-xs rounded transition-colors"
                        style={{
                          background: labelClusterFilter === null
                            ? activePillBg
                            : tm('#1e293b', '#f1f5f9', '#0f0f14'),
                          color: labelClusterFilter === null
                            ? activePillText
                            : tm('#94a3b8', '#64748b', '#94a3b8'),
                          border: `1px solid ${
                            labelClusterFilter === null
                              ? activePillBorder : 'transparent'
                          }`
                        }}>All</button>
                      {clusterData.clusters.map(cl => {
                        const c = cl.id;
                        const active = labelClusterFilter === c;
                        const clColor = isBw
                          ? '#000000'
                          : (c === 0
                            ? COLORS.quadric
                            : `hsl(${(c * 47 + 200) % 360}, 65%, 55%)`);
                        return (
                          <button key={c} onClick={() =>
                            setLabelClusterFilter(prev =>
                              prev === c ? null : c
                            )}
                            className="px-1.5 py-0.5 text-xs rounded transition-colors"
                            style={{
                              background: active
                                ? (isBw ? activePillBg : clColor + '33')
                                : tm('#1e293b', '#f1f5f9', '#0f0f14'),
                              color: active
                                ? clColor
                                : tm('#94a3b8', '#64748b', '#94a3b8'),
                              border: `1px solid ${
                                active ? (isBw ? activePillBorder : clColor + '66') : 'transparent'
                              }`
                            }}>C{c}</button>
                        );
                      })}
                    </div>
                  </>
                )}

                {/* Petal arrangement: `stacked` layers clusters along the cylinder height; `radial` fans petals
                    around the axis; `flat` reduces depth cues for screenshots. All modes share the same graph —
                    only the projection / spacing recipe changes. */}
                {sideLabel('Layout')}
                <div className="flex gap-1">
                  {['stacked', 'radial', 'flat'].map(m => (
                    <button key={m} onClick={() => setPetalLayout(m)}
                      className="text-sm px-2 py-1 rounded transition-colors capitalize"
                      style={{
                        background: petalLayout === m
                          ? activePillBg
                          : tm('#1e293b', '#f1f5f9', '#0f0f14'),
                        color: petalLayout === m
                          ? activePillText
                          : tm('#94a3b8', '#64748b', '#94a3b8'),
                        border: `1px solid ${
                          petalLayout === m
                            ? activePillBorder
                            : tm('#334155', '#e2e8f0', '#1e1e2a')
                        }`,
                      }}>{m}</button>
                  ))}
                </div>
                {/* Spatial tuning: geometric placement on the petal cylinder / fins — not the abstract graph.
                    `Quadric Y` slides the quadric ring along the vertical axis of the cylindrical layout (small
                    normalized range ±0.5). `Petal V-str` / `Petal R-str` stretch petals vertically vs radially.
                    `Quadric R` / `Center R` / `Fin R` rescale the three concentric “hub vs fin” radii so dense
                    graphs can separate overlapping chords without recomputing positions. */}
                {sideLabel('Spatial Tuning')}
                <div className="flex flex-col gap-0.5">
                  {sld('Quadric Y', quadricY, setQuadricY, -0.5, 0.5, 0.02)}
                  {sld('Petal V-str', petalStretchV, setPetalStretchV, 0.1, 3, 0.05)}
                  {sld('Petal R-str', petalStretchR, setPetalStretchR, 0.1, 3, 0.05)}
                  {sld('Quadric R', quadricRScale, setQuadricRScale, 0.1, 2, 0.05)}
                  {sld('Center R', centerRScale, setCenterRScale, 0.1, 2, 0.05)}
                  {sld('Fin R', finRScale, setFinRScale, 0.1, 2, 0.05)}
                  {/* V1/V2 spread: scales the symmetric radial (stacked/radial) and
                      angular (flat) separation between the two endpoints of every
                      fin pair around their midpoint. 0 collapses V1 and V2 onto
                      one radius; 1 = legacy default; >1 flares each triangle
                      wider without touching overall fin depth (`petalStretchR`). */}
                  {sld('V1/V2 spread', v1v2Spread, setV1v2Spread, 0, 3, 0.05)}
                </div>
                {/* Visual tuning: rendering-only scales passed into WebGL/Canvas styling — zoom (camera distance
                    proxy), glyph sizes, stroke widths/opacities, directed-edge arrow thickness/opacity/head size,
                    and a thicker stroke for inter-cluster edges so long hops remain visible when intra-cluster
                    clutter is high. Ranges are wide enough for presentation (zoom up to 5×) but clamped in `sld`. */}
                {sideLabel('Visual Tuning')}
                <div className="flex flex-col gap-0.5">
                  {sld('Zoom', petalZoom, setPetalZoom, 0.3, 5, 0.1)}
                  {sld('Node size', petalNodeSize, setPetalNodeSize, 0.2, 3)}
                  {sld('Node opacity', petalNodeOpacity, setPetalNodeOpacity, 0.05, 1, 0.05)}
                  {sld('Line width', petalLineWidth, setPetalLineWidth, 0.1, 4)}
                  {sld('Line opacity', petalLineOpacity, setPetalLineOpacity, 0.05, 1, 0.05)}
                  {/* Contrast / screenshot dial: gamma boost bends all edge and
                      node opacities toward 1 (crisper ink) when >1, toward 0
                      when <1. The following checkbox disables the built-in
                      "auto-dim thick lines" compensation, so bumping Line
                      width renders as fully opaque ink instead of washed out. */}
                  {sld('Gamma', petalGamma, setPetalGamma, 0.3, 3, 0.05)}
                  {cbx('Auto-dim thick lines', petalAutoEdgeComp, setPetalAutoEdgeComp)}
                  {sld('Arrow width', petalArrowWidth, setPetalArrowWidth, 0.2, 3)}
                  {sld('Arrow opacity', petalArrowOpacity, setPetalArrowOpacity, 0.05, 1, 0.05)}
                  {sld('Arrow head', petalArrowHeadSize, setPetalArrowHeadSize, 0.2, 3)}
                  {sld('InterCluster W', petalInterClusterWidth, setPetalInterClusterWidth, 0.2, 5, 0.1)}
                </div>
                {/* Preset bundle: serializes the petal layout + all spatial/visual sliders to `localStorage` under
                    user-provided names. `Reset` reapplies baked-in defaults for every key in `tuningSetters` so
                    exploratory tweaks can be undone without reloading; saved chips load by name, `×` deletes. */}
                {sideLabel('Presets')}
                <div className="flex flex-col gap-1">
                  <div className="flex gap-1">
                    <button onClick={() => {
                      const name = prompt('Preset name:');
                      if (name) { saveTuning(name); refreshPresets(); }
                    }} className="flex-1 px-2 py-0.5 text-xs rounded transition-colors" style={{
                      background: tm('#1e293b','#f1f5f9','#0f0f14',undefined,'#0D2240'), color: tm('#94a3b8','#64748b','#94a3b8')
                    }}>Save</button>
                    <button onClick={() => {
                      tuningKeys.forEach(k => {
                        // Apply the canonical default object field-by-field so
                        // each setter runs with correct type.
                        const defaults = {
                          petalLayout: 'stacked',
                          quadricY: -0.5,
                          petalStretchV: 1.5,
                          petalStretchR: 1.1,
                          quadricRScale: 0.5,
                          centerRScale: 0.8,
                          finRScale: 0.5,
                          v1v2Spread: 1,
                          petalZoom: 1.1,
                          petalNodeSize: 0.4,
                          petalLineWidth: 0.1,
                          petalNodeOpacity: 1,
                          petalLineOpacity: 1,
                          petalArrowWidth: 1,
                          petalArrowOpacity: 1,
                          petalArrowHeadSize: 1,
                          petalInterClusterWidth: 1,
                          petalGamma: 1,
                          petalAutoEdgeComp: true,
                        };
                        if (tuningSetters[k]) tuningSetters[k](defaults[k]);
                      });
                    }} className="flex-1 px-2 py-0.5 text-xs rounded transition-colors" style={{
                      background: tm('#1e293b','#f1f5f9','#0f0f14',undefined,'#0D2240'), color: tm('#94a3b8','#64748b','#94a3b8')
                    }}>Reset</button>
                  </div>
                  {/* File-based persistence: write the current presets + live
                      tuning to disk (polarfly-presets.json) so values survive
                      server restarts when the file sits next to polarfly.html,
                      or import a previously saved file. The hidden <input
                      type="file"> is driven by ref-free DOM lookup to keep
                      Tailwind styling on the visible trigger button. */}
                  <div className="flex gap-1">
                    <button
                      onClick={downloadPresetsFile}
                      title="Download polarfly-presets.json (place next to polarfly.html to auto-load on next start)"
                      className="flex-1 px-2 py-0.5 text-xs rounded transition-colors"
                      style={{
                        background: tm('#1e293b','#f1f5f9','#0f0f14',undefined,'#0D2240'),
                        color: tm('#94a3b8','#64748b','#94a3b8')
                      }}
                    >Download</button>
                    <button
                      onClick={() => {
                        const el = document.getElementById('pf-presets-import');
                        if (el) el.click();
                      }}
                      title="Import polarfly-presets.json"
                      className="flex-1 px-2 py-0.5 text-xs rounded transition-colors"
                      style={{
                        background: tm('#1e293b','#f1f5f9','#0f0f14',undefined,'#0D2240'),
                        color: tm('#94a3b8','#64748b','#94a3b8')
                      }}
                    >Import</button>
                    <input
                      id="pf-presets-import"
                      type="file"
                      accept="application/json,.json"
                      style={{ display: 'none' }}
                      onChange={(e) => {
                        const f = e.target.files && e.target.files[0];
                        if (f) importPresetsFile(f);
                        // Reset so re-selecting the same file still fires change.
                        e.target.value = '';
                      }}
                    />
                  </div>
                  {/* Saved preset chips render only when `savedPresets` is non-empty to avoid empty chrome. */}
                  {savedPresets.length > 0 && (
                    <div className="flex flex-wrap gap-1">
                      {savedPresets.map(name => (
                        <div key={name} className="flex items-center gap-0.5">
                          <button onClick={() => loadTuning(name)} className="px-1.5 py-0.5 text-xs rounded" style={{
                            background: activePillBgSoft,
                            color: activePillText,
                            border: `1px solid ${isBw ? 'rgba(0,0,0,0.3)' : 'rgba(20,184,166,0.3)'}`,
                          }}>{name}</button>
                          <button
                            onClick={() => {
                              deleteTuning(name);
                              refreshPresets();
                            }}
                            className="text-xs px-0.5 rounded"
                            style={{
                              color: tm('#64748b', '#94a3b8', '#475569'),
                            }}>
                            {'\u00D7'}
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {/* Quick readout + compact routing control while still on Petal: shows click-selected src/dst
                    vertex IDs (orange theme) and a small routing-mode dropdown mirroring the Routing tab so users
                    can assign algorithms without switching tabs; `Clear` wipes both endpoints. */}
                {sideLabel('Selection')}
                <div className="flex items-center gap-2 text-sm">
                  <span style={{color:tm('#94a3b8','#64748b','#94a3b8')}}>Src:</span>
                  <span className="font-mono px-1.5 py-0.5 rounded" style={{
                    background: selectedSrc !== null ? (isBw ? 'rgba(0,0,0,0.10)' : 'rgba(245,158,11,0.15)') : tm('#1e293b','#f8fafc','#0a0a0e'),
                    color: selectedSrc !== null ? bwTint('#f59e0b', '#000000') : tm('#64748b','#94a3b8','#64748b')
                  }}>{selectedSrc !== null ? selectedSrc : '\u2014'}</span>
                  <span style={{color:tm('#94a3b8','#64748b','#94a3b8')}}>Dst:</span>
                  <span className="font-mono px-1.5 py-0.5 rounded" style={{
                    background: selectedDst !== null ? (isBw ? 'rgba(0,0,0,0.14)' : 'rgba(249,115,22,0.15)') : tm('#1e293b','#f8fafc','#0a0a0e'),
                    color: selectedDst !== null ? bwTint('#f97316', '#000000') : tm('#64748b','#94a3b8','#64748b')
                  }}>{selectedDst !== null ? selectedDst : '\u2014'}</span>
                </div>
                <div className="flex gap-1 mt-1">
                  <select value={routingMode} onChange={e => setRoutingMode(e.target.value)} className={selCls}>
                    <option value="minimal">Minimal</option>
                    <option value="valiant">Compact Valiant</option>
                    <option value="ugal">UGAL-PF</option>
                  </select>
                  <button onClick={() => { setSelectedSrc(null); setSelectedDst(null); }}
                    className="text-sm px-2 py-1 rounded transition-colors flex-shrink-0" style={{
                      background: tm('#1e293b','#f8fafc','#0a0a0e'), color: tm('#cbd5e1','#475569','#94a3b8')
                    }}>Clear</button>
                </div>
                {/* Legend: matches node colors (quadric W, center C, fin V1/V2)
                    and swatches the three directed edge “type tuples” used in
                    the petal view shader/line styling so the canvas is
                    self-describing. In the bw theme, every swatch pulls from
                    the greyscale palette and the triangle tuples flatten to
                    three values of gray so legend and canvas stay consistent. */}
                {sideLabel('Legend')}
                {(() => {
                  const LP = getPalette(theme, palette);
                  const triLLBg = isBw ? 'rgba(0,0,0,0.12)' : 'rgba(34,197,94,0.25)';
                  const triLR2Bg = isBw ? 'rgba(0,0,0,0.22)' : 'rgba(59,130,246,0.25)';
                  const triLR12Bg = isBw ? 'rgba(0,0,0,0.17)' : 'rgba(168,85,247,0.25)';
                  return (
                <div className="flex flex-col gap-0.5 text-sm" style={{color:tm('#cbd5e1','#475569','#cbd5e1')}}>
                  <div className="flex items-center gap-1.5">
                    <span
                      className="w-3 h-3 rounded-full inline-block"
                      style={{background:LP.quadric}}/>
                    {' '}Quadric (W)
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span
                      className="w-3 h-3 rounded-full inline-block"
                      style={{background:LP.v1Center}}/>
                    {' '}Center (C)
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span
                      className="w-3 h-3 rounded-full inline-block"
                      style={{background:LP.v1}}/>
                    {' '}V1 fin vertex
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span
                      className="w-3 h-3 rounded-full inline-block"
                      style={{background:LP.v2}}/>
                    {' '}V2 fin vertex
                  </div>
                  <div className="flex items-center gap-1.5 mt-1">
                    <span
                      className="w-3 h-3 inline-block rounded-sm"
                      style={{background:triLLBg}}/>
                    {' '}(C, V1, V1)
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span
                      className="w-3 h-3 inline-block rounded-sm"
                      style={{background:triLR2Bg}}/>
                    {' '}(C, V2, V2)
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span
                      className="w-3 h-3 inline-block rounded-sm"
                      style={{background:triLR12Bg}}/>
                    {' '}(C, V1, V2)
                  </div>
                </div>
                  );
                })()}
              </Fragment>
            )}

            {/* ── ROUTING tab: explicit src/dst numeric entry, routing-mode radios (including All Paths), optional
                randomized rerolls for Valiant/UGAL, aggregate path statistics, unequal-cost coloring toggle, and
                a scrollable path table with hover/pin — plus the same spatial/visual sliders as Petal because the
                same `PetalView` canvas renders highlighted routes. ── */}
            {tab === 'routing' && (
              <Fragment>
                {/* Endpoints: direct numeric fields bound to `selectedSrc` / `selectedDst` (vertex indices 0…N-1).
                    Changing source clears destination to avoid accidentally analyzing impossible pairs left over
                    from a previous graph size. */}
                {sideLabel('Source / Destination')}
                <div className="space-y-2">
                  <div>
                    <label className="text-sm" style={{color:tm('#94a3b8','#64748b','#94a3b8')}}>Source Node</label>
                    <input type="number" min={0} max={graph.N-1} value={selectedSrc ?? 0}
                      onChange={e => { setSelectedSrc(+e.target.value); setSelectedDst(null); }}
                      className={selCls}/>
                  </div>
                  {/* Destination endpoint for routing: same 0…N-1 index range as the source field above. Changing
                      only `selectedDst` preserves `selectedSrc`, unlike the source field which clears the
                      destination when the graph context may have changed — keeping asymmetric edits predictable
                      when the user adjusts one end of the (src,dst) pair for path enumeration. */}
                  <div>
                    <label
                      className="text-sm"
                      style={{color:tm('#94a3b8','#64748b','#94a3b8')}}>
                      Destination Node
                    </label>
                    <input type="number" min={0} max={graph.N-1} value={selectedDst ?? 0}
                      onChange={e => setSelectedDst(+e.target.value)}
                      className={selCls}/>
                  </div>
                </div>

                {/* ── View toggle: abstract path analysis vs SRv6 / uSID wire view.
                    The two views share src/dst selection but diverge completely
                    below: 'abstract' exposes routing-algorithm radios + All Paths
                    analytics; 'srv6' exposes SRH container rendering, hop tables,
                    and TREE2 drill-down. Kept as a pill pair to stay compact and
                    read as a modal switch rather than a settings option. ── */}
                {sideLabel('View')}
                <div className="flex gap-1">
                  {[
                    { id: 'abstract', label: 'Abstract' },
                    { id: 'srv6',     label: 'SRv6 / uSID' },
                  ].map(v => (
                    <button
                      key={v.id}
                      onClick={() => setRoutingView(v.id)}
                      className="flex-1 px-2 py-1 text-sm rounded transition-colors cursor-pointer font-semibold"
                      style={{
                        background: routingView === v.id
                          ? tm('#14b8a6', '#14b8a6', '#8b5cf6', '#000000')
                          : tm('#1e293b', '#f8fafc', '#0a0a0e'),
                        color: routingView === v.id
                          ? '#fff'
                          : tm('#94a3b8', '#64748b', '#64748b'),
                      }}>
                      {v.label}
                    </button>
                  ))}
                </div>

                {routingView === 'abstract' && (<Fragment>
                {/* Algorithm picker: `minimal` = shortest-path baseline; `valiant` / `ugal` = load-balanced or
                    adaptive schemes that may randomize among valid intermediates — hence the conditional `Re-roll`
                    button (increments `rerollCtr`, which downstream logic uses to reshuffle without changing mode).
                    `allpaths` enumerates the candidate set for comparison and unlocks the analytics/table UI. */}
                {sideLabel('Routing Algorithm')}
                <div className="flex flex-col gap-1.5">
                  {[
                    // In bw mode every algorithm label is rendered in a muted
                    // grayscale so the active-radio text reads as ink rather
                    // than as a saturated brand color (the radio itself still
                    // conveys which option is selected).
                    {id: 'minimal', label: 'Minimal (Shortest)', color: bwTint('#10b981', '#000000')},
                    {id: 'valiant', label: 'Compact Valiant LB', color: bwTint('#d946ef', '#333333')},
                    {id: 'ugal', label: 'UGAL-PF (Adaptive)', color: bwTint('#8b5cf6', '#222222')},
                    {id: 'allpaths', label: 'All Paths', color: bwTint('#f59e0b', '#111111')},
                  ].map((m) => {
                    const showRerollBtn = (m.id === 'valiant' || m.id === 'ugal') && routingMode === m.id;
                    return (
                      <div key={m.id} className="flex items-center gap-1.5">
                        <label className="flex items-center gap-1.5 text-sm cursor-pointer flex-1"
                          style={{color: routingMode === m.id ? m.color : tm('#cbd5e1','#475569','#94a3b8')}}>
                          <input
                            type="radio"
                            name="routing"
                            value={m.id}
                            checked={routingMode === m.id}
                            onChange={() => setRoutingMode(m.id)}
                            className="w-3 h-3"
                            style={{accentColor: uiTint}}
                          />
                          {m.label}
                        </label>
                        {showRerollBtn && (
                          <button
                            type="button"
                            onClick={() => setRerollCtr((c) => c + 1)}
                            className="text-xs px-1.5 py-0.5 rounded cursor-pointer"
                            style={{ background: isBw ? 'rgba(0,0,0,0.10)' : 'rgba(139,92,246,0.15)', color: m.color }}>
                            Re-roll
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
                {/* Resets both endpoints to an “unset” logical state in parent state (`null`), which downstream
                    numeric inputs coerce back to `0` for display — clearing highlights and path tables that depend
                    on a concrete (src,dst) pair. */}
                <button onClick={() => { setSelectedSrc(null); setSelectedDst(null); }}
                  className="w-full mt-2 text-sm px-2 py-1 rounded transition-colors" style={{
                    background: tm('#1e293b','#f8fafc','#0a0a0e'), color: tm('#cbd5e1','#475569','#94a3b8')
                  }}>Clear Selection</button>

                {allPathsData && (
                  <Fragment>
                    {/* Path analysis: only rendered when `allPathsData` exists (All Paths mode produced a full
                        enumeration). Shows totals, hop-class counts, ECMP share, and min/max cost — feeding the
                        table’s color scale and the unequal-cost toggle below. */}
                    {sideLabel('Path Analysis')}
                    <div className="rounded-lg px-2 py-1.5 text-xs space-y-1" style={{
                      background: tm('rgba(30,41,59,0.5)','#f8fafc','rgba(10,10,14,0.6)',undefined,'rgba(13,34,64,0.6)'),
                      color: tm('#cbd5e1','#475569','#cbd5e1')
                    }}>
                      <div className="flex justify-between">
                        <span>Total paths</span>
                        <span className="font-mono font-semibold" style={{color:bwTint('#f59e0b', '#000000')}}>{allPathsData.total}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Direct (1-hop)</span>
                        <span className="font-mono">{allPathsData.directCount}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Two-hop</span>
                        <span className="font-mono">{allPathsData.twoHopCount}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>ECMP (equal cost)</span>
                        <span className="font-mono" style={{color:bwTint('#10b981', '#000000')}}>{allPathsData.ecmpCount}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Min cost</span>
                        <span className="font-mono">{allPathsData.minCost}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Max cost</span>
                        <span className="font-mono">{allPathsData.maxCost}</span>
                      </div>
                    </div>

                    {/* When checked, table cost column uses `unequalCost` weights instead of the ECMP-equal cost —
                        useful when distinguishing tie-broken vs truly equal-length routes. */}
                    <label className="flex items-center gap-1.5 text-sm mt-1 cursor-pointer"
                      style={{color: tm('#cbd5e1','#475569','#94a3b8')}}>
                      <input
                        type="checkbox"
                        checked={showUnequalCost}
                        onChange={e =>
                          setShowUnequalCost(e.target.checked)
                        }
                        className="w-3 h-3"
                        style={{accentColor: uiTint}}
                      />
                      Unequal cost coloring
                    </label>

                    {/* Enumerated path list: each row is one admissible route (`analyzed` entry). Hover drives
                        `hoveredPathIdx` for transient highlight on the canvas; click toggles `pinnedPathIdx` so
                        one path stays emphasized. Columns: ordinal, hop count, full vertex sequence with W/V1/V2
                        tags, and numeric cost (green min / red max when unequal range exists). */}
                    {sideLabel(
                      `Paths (${
                        pinnedPathIdx !== null
                          ? 'pinned #' + (pinnedPathIdx + 1)
                          : 'hover to preview'
                      })`,
                    )}
                    <div className="overflow-y-auto rounded-lg" style={{
                      maxHeight: 240,
                      background: tm(
                        'rgba(15,23,42,0.6)',
                        'rgba(248,250,252,0.8)',
                        'rgba(5,5,8,0.7)',
                      ),
                      border: `1px solid ${tm(
                        'rgba(51,65,85,0.3)',
                        'rgba(203,213,225,0.4)',
                        'rgba(51,65,85,0.2)',

                      <table className="w-full text-xs" style={{borderCollapse:'collapse'}}>
                        <thead>
                          <tr style={{
                            borderBottom: `1px solid ${tm(
                              'rgba(51,65,85,0.4)',

                              'rgba(51,65,85,0.3)',

                            <th
                              className="px-1.5 py-1 text-left"
                              style={{color:tm('#64748b','#94a3b8','#475569')}}>

                            <th
                              className="px-1.5 py-1 text-left"
                              style={{color:tm('#64748b','#94a3b8','#475569')}}>
                              Hops
                            </th>
                            <th
                              className="px-1.5 py-1 text-left"
                              style={{color:tm('#64748b','#94a3b8','#475569')}}>
                              Path

                            <th
                              className="px-1.5 py-1 text-right"
                              style={{color:tm('#64748b','#94a3b8','#475569')}}>
                              Cost
                            </th>
                          </tr>
                        </thead>
                        <tbody>
                          {/* Row iteration: `ri` doubles as React list key and as the index passed to
                              `hoveredPathIdx` / `pinnedPathIdx`, which `PetalView` uses to pick which enumerated
                              path to stroke when Routing tab paints overlays. */}
                          {allPathsData.analyzed.map((a, ri) => {
                            const cost = showUnequalCost ? a.unequalCost : a.ecmpCost;
                            const isMinCost = cost === allPathsData.minCost;
                            // Highlight max only when the cost range is
                            // non-degenerate (avoids red+green on flat sets).
                            const isMaxCost =
                              cost === allPathsData.maxCost
                              && allPathsData.minCost !== allPathsData.maxCost;
                            const costColor = isBw
                              ? (isMinCost ? '#000000' : isMaxCost ? '#555555' : '#333333')
                              : (isMinCost ? '#10b981' : isMaxCost ? '#ef4444' : '#f59e0b');
                            const isPinned = pinnedPathIdx === ri;
                            const isHov = hoveredPathIdx === ri;
                            const pathColor = getPathPalette(theme)[ri % getPathPalette(theme).length];
                            const typeName = (nid) => graph.isQuadric[nid] ? 'W' : graph.vType[nid] === 1 ? 'V1' : 'V2';
                            return (
                              <tr key={ri}
                                className="cursor-pointer transition-colors"
                                style={{
                                  background: isPinned
                                    ? (isBw ? 'rgba(0,0,0,0.14)' : 'rgba(245,158,11,0.15)')
                                    : isHov
                                      ? (isBw ? 'rgba(0,0,0,0.07)' : 'rgba(245,158,11,0.08)')
                                      : 'transparent',
                                  borderBottom: `1px solid ${tm(
                                    'rgba(51,65,85,0.2)',
                                    'rgba(203,213,225,0.3)',
                                    'rgba(51,65,85,0.15)',
                                  )}`,
                                }}
                                onMouseEnter={() => setHoveredPathIdx(ri)}
                                onMouseLeave={() => setHoveredPathIdx(null)}
                                // Pin is exclusive: clicking the active row clears the pin so the view returns to
                                // hover-only preview.
                                onClick={() =>
                                  setPinnedPathIdx(prev => prev === ri ? null : ri)
                                }>
                                <td className="px-1.5 py-1 font-mono" style={{color: pathColor}}>{ri + 1}</td>
                                <td className="px-1.5 py-1">{a.hops}</td>

                                    <Fragment key={ni}>

                                        <span style={{
                                          color: tm('#475569', '#94a3b8', '#334155'),
