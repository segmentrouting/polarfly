  // sortedNodes) so overlapping
  // blades from different clusters stack sensibly when the camera rotates.

  const clusterTrianglePolys = useMemo(() => {
    const polys = [];
    const nonQ = clusters.filter(c => c.type === 'nonquadric');
    nonQ.forEach(cl => {
      const tris = trianglesPerCluster[cl.id] || [];
      const pc = projected[cl.center];
      if (!pc) return;
      tris.forEach((pair, ti) => {
        if (pair.length < 2) return;
        const pa = projected[pair[0]], pb = projected[pair[1]];
        if (!pa || !pb) return;
        const avgZ = (pc.z + pa.z + pb.z) / 3;
        const aIsV1 = vType[pair[0]] === 1, bIsV1 = vType[pair[1]] === 1;
        // Triangle tint groups each fan blade visually. The base colour is
        // palette-driven (`C.finTint`) so switching the global palette
        // recolours every petal fin consistently — classic ships a warm
        // gold, Cisco ships Cisco Orange, Ocean ships teal, etc. The
        // alpha varies by pair type so V1–V1 / V2–V2 / mixed triangles
        // stay distinguishable by value even under the same hue. In the
        // 'bw' theme we keep greyscale tints since the palette is
        // overridden to pure greys.
        const finBase = C.finTint || '#f8b42c';
        let triColor;
        if (isBw) {
          triColor = (aIsV1 && bIsV1) ? 'rgba(0,0,0,0.04)'
                   : (!aIsV1 && !bIsV1) ? 'rgba(0,0,0,0.08)'
                   : 'rgba(0,0,0,0.06)';
        } else if (aIsV1 && bIsV1) triColor = hexToRgba(finBase, 0.16);
        else if (!aIsV1 && !bIsV1) triColor = hexToRgba(finBase, 0.10);
        else triColor = hexToRgba(finBase, 0.13);
        polys.push({
          key: `tri-${cl.id}-${ti}`,
          points: `${pc.x},${pc.y} ${pa.x},${pa.y} ${pb.x},${pb.y}`,
          fill: triColor,
          z: avgZ,
          clusterId: cl.id,
          center: cl.center,
          pair
        });
      });
    });
    polys.sort((a, b) => a.z - b.z);
    return polys;
  }, [clusters, trianglesPerCluster, projected, vType, isBw, C.finTint]);

  /**
   * Reference circles projected onto the screen: each entry is a horizontal
   * ring in 3D (fixed y, radius r)
   * sampled into a closed SVG path. They visually separate the quadric layer,
   * V1 hub ring, and (in radial/flat)
   * the fin layer—purely decorative guides, not interactive geometry.
   */
  const layerGuides = useMemo(() => {
    const quadricBaseY = -cylHeight / 2 + quadricYOffset * cylHeight;
    const centerY = -cylHeight / 6;
    const qR = cylRadius * quadricRScale;
    const cR = cylRadius * centerRScale;
    const fBase = cylRadius * finRScale;
    const finR = fBase + fBase * 0.45 * 0.6 * petalStretchR;
    const layers = [
      { y: quadricBaseY, r: qR, color: C.quadric },
      { y: centerY, r: cR, color: C.v1Center },
    ];
    if (layout === 'radial' || layout === 'flat') {
      layers.push({ y: centerY + cylHeight * 0.25 * petalStretchV, r: finR, color: C.v2 || '#60a5fa' });
    }
    const px = CX + panX, py = CY + panY;
    return layers.map(l => {
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const theta = (2 * Math.PI * i) / 64;
        const p = project3D(
          l.r * Math.cos(theta), l.y, l.r * Math.sin(theta),
          rotY, tiltX, px, py, nodeScale
        );
        pts.push(`${p.x},${p.y}`);
      }
      return { ...l, path: `M ${pts.join(' L ')}` };
    });
  }, [
    rotY, tiltX, cylRadius, cylHeight, CX, CY, panX, panY, nodeScale, layout, quadricYOffset,
    petalStretchV, petalStretchR, quadricRScale, centerRScale, finRScale
  ]);

  /**
   * Per-cluster text anchors ("C1", "C2", …) placed
   * just outside the center ring. The label radius
   * tracks centerRScale so labels move with the
   * Center R slider. Z is kept for front/back culling.
   */
  const clusterLabels = useMemo(() => {
    const nonQ = clusters.filter(c => c.type === 'nonquadric');
    // Track the center ring radius so labels move with
    // the Center R slider, offset slightly outward.
    const cR = cylRadius * centerRScale;
    return nonQ.map((cl, ci) => {
      const theta = (2 * Math.PI * ci) / nonQ.length;
      const labelR = cR + 25;
      const p = project3D(
        labelR * Math.cos(theta),
        -cylHeight / 6 - 15,
        labelR * Math.sin(theta),
        rotY, tiltX, CX + panX, CY + panY, nodeScale
      );
      return {
        id: cl.id,
        x: p.x,
        y: p.y,
        z: p.z,
        label: `C${cl.id}`
      };
    });
  }, [
    clusters, rotY, tiltX, cylRadius, cylHeight,
    CX, CY, panX, panY, nodeScale, centerRScale
  ]);

  // --- JSX return ---

  return (
    <div className="relative w-full h-full overflow-hidden select-none">
      {/*
        Hover tooltip (HTML overlay, not SVG): follows the projected screen
        position of hoveredNode.
        Shows identity (id), GF(q) coordinate vector, vertex class (W quadric vs
        V1 vs V2 from isQuadric/vType),
        degree in the abstract graph, and cluster id. pointer-events-none so it
        never steals hover from circles.
      */}
      {hoveredNode !== null && projected[hoveredNode] && (
        <div className="absolute z-20 rounded-xl shadow-2xl pointer-events-none" style={{
          left: projected[hoveredNode].x + 15, top: projected[hoveredNode].y - 10,
          padding: '8px 12px', maxWidth: 320,
          background: tm('rgba(15,23,42,0.95)','rgba(255,255,255,0.95)','rgba(10,10,14,0.96)'),
          backdropFilter: 'blur(12px)',
          border: `1px solid ${tm('rgba(100,116,139,0.4)','rgba(203,213,225,0.6)','rgba(100,116,139,0.25)')}`,
          color: tm('#e2e8f0','#1e293b','#e2e8f0')
        }}>
          <div style={{fontSize:13,fontWeight:700}}>Node {hoveredNode}</div>
          <div className="mt-1 font-mono" style={{fontSize:10,color:tm('#94a3b8','#64748b','#94a3b8')}}>
            <div>Vector: [{vertices[hoveredNode].join(', ')}]</div>
            <div>Type: {isQuadric[hoveredNode] ? 'Quadric (W)' : vType[hoveredNode] === 1 ? 'V1' : 'V2'}</div>
            <div>Degree: {adj[hoveredNode].length}</div>
            <div>Cluster: {nodeCluster[hoveredNode]}</div>
          </div>
          {/* ── SRv6 sub-section: only shown when an SRH is active and the
              hovered node plays a role in it (path vertex, TREE2 peer/leaf,
              ECMP pivot). Gives the reader hop index, active uSID, and a
              tiny SRH container preview at that node's processing step. ── */}
          {srhDesc && (() => {
            // Role lookup for the hovered node.
            let role = null;
            let hopIdx = -1;
            let usid = null;
            let incoming = null;
            let outgoing = null;
            if (srhDesc.path && srhDesc.path.includes(hoveredNode)) {
              hopIdx = srhDesc.path.indexOf(hoveredNode);
              const isLast = hopIdx === srhDesc.path.length - 1;
              role = hopIdx === 0 ? 'Ingress / encap'
                : isLast ? 'Egress / deliver'
                : 'Transit (uSID pop + shift)';
              incoming = srhDesc.slots.slice(hopIdx);
              while (incoming.length < 6) incoming.push(SRV6_EOC);
              usid = incoming[0];
              outgoing = isLast ? null : [...incoming.slice(1), SRV6_EOC];
            } else if (srhDesc.type === 'tree2') {
              if (hoveredNode === srhDesc.root) {
                role = 'TREE2 root';
                usid = SRV6_BEHAVIOR.TREE2;
                incoming = srhDesc.slots;
              } else if (srhDesc.level1.includes(hoveredNode)) {
                role = 'TREE2 level-1 peer';
                usid = SRV6_BEHAVIOR.TREE2;
                incoming = srhDesc.slots;
              } else {
                const leaf = srhDesc.level2.find(x => x.node === hoveredNode);
                if (leaf) {
                  role = `TREE2 leaf (×${leaf.copies}, drop ${leaf.copies - 1})`;
                  usid = SRV6_BEHAVIOR.DELIVER;
                  incoming = srhDesc.slots;
                }
              }
            }
            // Show even when node has no direct SRv6 role so the reader sees
            // the fabric-wide SRH; otherwise role/hop fields are omitted.
            const color = role ? (isBw ? '#000000' : '#10b981') : tm('#64748b','#94a3b8','#475569','#555555');
            return (
              <div className="mt-2 pt-1.5 border-t" style={{
                borderColor: tm('rgba(100,116,139,0.35)', 'rgba(203,213,225,0.55)', 'rgba(100,116,139,0.25)'),
              }}>
                <div className="font-semibold" style={{fontSize:10, color}}>
                  SRv6 {role || '— (not on path)'}
                </div>
                {hopIdx >= 0 && (
                  <div className="font-mono" style={{fontSize:10,color:tm('#94a3b8','#64748b','#94a3b8')}}>
                    Hop #{hopIdx}
                  </div>
                )}
                {usid !== null && (
                  <div className="font-mono" style={{fontSize:10,color:tm('#e2e8f0','#1e293b','#e2e8f0')}}>
                    active uSID: <span style={{color:'#d946ef'}}>{usidLabel(usid)}</span>
                    {' '}
                    <span style={{color:tm('#64748b','#94a3b8','#475569')}}>
                      (0x{formatUSID(usid)})
                    </span>
                  </div>
                )}
                {incoming && (
                  <div className="font-mono" style={{
                    fontSize:9, color:tm('#94a3b8','#64748b','#94a3b8'),
                    wordBreak:'break-all', marginTop:2,
                  }}>
                    in : {formatContainer(incoming.filter(s => s !== SRV6_EOC))}
                  </div>
                )}
                {outgoing && (
                  <div className="font-mono" style={{
                    fontSize:9, color:tm('#94a3b8','#64748b','#94a3b8'),
                    wordBreak:'break-all',
                  }}>
                    out: {formatContainer(outgoing.filter(s => s !== SRV6_EOC))}
                  </div>
                )}
              </div>
            );
          })()}

          {/* ── ASTR sub-section: list every tree the hovered node
              participates in (and in what role/stage). Only shown when
              the parent passes astrRoles and the node has at least one
              role. ── */}
          {astrRoles && astrRoles[hoveredNode] && astrRoles[hoveredNode].length > 0 && (
            <div className="mt-2 pt-1.5" style={{
              borderTop: `1px solid ${tm('rgba(71,85,105,0.4)','rgba(203,213,225,0.5)','rgba(71,85,105,0.3)')}`,
            }}>
              <div style={{ fontSize: 10, color: tm('#94a3b8','#64748b','#64748b'), letterSpacing: 0.4 }}>
                ASTR TREES ({astrRoles[hoveredNode].length})
              </div>
              <div className="flex flex-wrap gap-1 mt-1">
                {astrRoles[hoveredNode].map(r => {
                  // `astrVisibleSet` arrives from the parent as either a
                  // Set (`.has`) or an Array (`.includes`) depending on the
                  // call-site. Normalise here so we never accidentally call
                  // `.has()` on an array and crash the render — that was
                  // blanking the ASTR tab on any click that happened while
                  // the cursor was still hovering a node.
                  let visible;
                  if (!astrVisibleSet) {
                    visible = true;
                  } else if (typeof astrVisibleSet.has === 'function') {
                    visible = astrVisibleSet.has(r.treeId);
                  } else if (Array.isArray(astrVisibleSet)) {
                    visible = astrVisibleSet.includes(r.treeId);
                  } else {
                    visible = true;
                  }
                  return (
                    <div key={r.treeId}
                      className="px-1.5 py-0.5 rounded font-mono"
                      style={{
                        fontSize: 9,
                        background: `${r.color}22`,
                        color: r.color,
                        border: `1px solid ${r.color}55`,
                        opacity: visible ? 1 : 0.4,
                      }}>
                      T{r.treeId} · {r.role}{r.role !== 'root' ? ` L${r.stage}` : ''}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      {/*
        SVG event surface: same handlers as documented above (wheel zoom, drag
        orbit, double-click reset zoom,
        touch pinch). onMouseLeave=handleMouseUp releases drag when the pointer
        leaves the svg so the camera
        does not stay stuck rotating.
      */}
      <svg ref={svgRef} className="w-full h-full" viewBox={`0 0 ${VW} ${VH}`}
        style={{
          touchAction: 'none',
          // Screen-plane Z-axis rotation. Implemented as a CSS
          // transform (rather than baked into project3D) because
          // roll doesn't interact with perspective depth sorting —
          // rotating the final 2D canvas is cheap, correct, and
          // preserves the painter's-algorithm order computed above.
          // `willChange: transform` gives the browser a hint so the
          // gyrate loop stays GPU-accelerated and jitter-free.
          transform: `rotate(${rollZ}rad)`,
          transformOrigin: '50% 50%',
          willChange: rollZ !== 0 ? 'transform' : 'auto',
        }}
        onMouseDown={handleMouseDown} onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}
        onWheel={handleWheel} onDoubleClick={handleDoubleClick}
        onTouchStart={handleTouchStart} onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}>
        {/*
          Solid backdrop behind the entire projected graph so transparent areas
          read as void rather than page chrome. The 4th arg picks the 'bw'
          (print/screenshot) theme fill: plain white, so strokes and node
          fills rendered in greyscale remain maximally legible.
        */}
        <rect width={VW} height={VH} fill={tm('#080e1a','#ffffff','#020204','#ffffff','#07182C')}/>

        {/*
          SVG defs: arrowhead markers reused by path overlays. Default
          `arrowhead` uses path-highlight color; PATH_PALETTE entries get one
          marker each so multi-path lines can end in distinct colors.
        */}
        <defs>
          <marker id="arrowhead" markerWidth={4 * arrowHeadSize} markerHeight={3 * arrowHeadSize}
            refX={3.5 * arrowHeadSize} refY={1.5 * arrowHeadSize} orient="auto">
            <polygon points={`0 0, ${4*arrowHeadSize} ${1.5*arrowHeadSize}, 0 ${3*arrowHeadSize}`}
              fill={C.pathHighlight} opacity={arrowOpacity}/>
          </marker>
          {PATH_PALETTE.map((c, i) => (
            <marker
              key={`ah-${i}`}
              id={`arrowhead-${i}`}
              markerWidth={4 * arrowHeadSize}
              markerHeight={3 * arrowHeadSize}
              refX={3.5 * arrowHeadSize} refY={1.5 * arrowHeadSize} orient="auto">
              <polygon points={`0 0, ${4*arrowHeadSize} ${1.5*arrowHeadSize}, 0 ${3*arrowHeadSize}`}
                fill={c} opacity={arrowOpacity}/>
            </marker>
          ))}
        </defs>

        {/*
          Layer guide ellipses — faint dashed paths hinting at cluster layers in
          3D space (decorative, low opacity).
        */}
        {layerGuides.map((lg, i) => (
          <path key={`lg-${i}`} d={lg.path} fill="none"
            stroke={lg.color} strokeWidth={0.5} opacity={0.15} strokeDasharray="4,4"/>
        ))}

        {/*
          DRAW ORDER (painter’s algorithm for SVG document order — later
          siblings paint on top):
          1) Semi-transparent triangle fills — large areas belong at the back so
          they do not obscure lines/nodes.
          2) Inter-cluster edges (dimmer, often longer) — beneath intra edges so
          local triangle structure reads clearly.
          3) Intra-cluster edges — thickest baseline graph ink.
          (Cluster labels, path overlays, and depth-sorted nodes follow below in
          this file.)
          Nodes are intentionally last so picking and visual emphasis are
          correct; triangles have no per-pixel depth test.
        */}
        {/* Filled triangle fan-blades (drawn first, behind everything) */}
        {showIntraCluster && clusterTrianglePolys.map(tri => {
          if (visibleNodes && (!visibleNodes.has(tri.center) || !tri.pair.every(n => visibleNodes.has(n)))) return null;
          // Triangles live inside a single cluster — their membership is
          // fully determined by `tri.clusterId` (fallback: center's cluster).
          const triCid = (tri.clusterId !== undefined)
            ? tri.clusterId
            : (nodeCluster[tri.center] ?? -1);
          const triMatched = nodeMatchesFilter(triCid);
          // When the triangle is outside the spotlight, fade it heavily so
          // the selected cluster(s) read as bright against a ghosted scene.
          const triOpacity = hasClusterFilter ? (triMatched ? 1 : DIM_FACTOR) : 1;
          return (
            <polygon key={tri.key} points={tri.points} fill={tri.fill}
              stroke={tm('rgba(255,255,255,0.06)','rgba(0,0,0,0.06)','rgba(255,255,255,0.04)')}
              strokeWidth={0.5}
              opacity={triOpacity}/>
          );
        })}

        {/* Inter-cluster edges (light, behind intra-cluster) */}
        {showInterCluster && interClusterEdges.map(([a, b, ca, cb], i) => {
          // Optional quadric-cluster suppression: when quadric edges are
          // hidden,
          // drop any edge touching cluster index 0 (quadric “special” cluster
          // in this model).
          if (!showQuadricEdges && (ca === 0 || cb === 0)) return null;
          if (visibleNodes && (!visibleNodes.has(a) || !visibleNodes.has(b))) return null;
          const ek = `${Math.min(a,b)}-${Math.max(a,b)}`;
          // isHL dims non-route edges when a path is active (renderEdge uses
          // highlighted flag for stroke width/opacity).
          const isHL = highlightEdgeSet.has(ek);
          const color = ca === 0 || cb === 0 ? C.edgeQuadric : C.edgeInter;
          // Cluster-spotlight: matched edges draw at full interClusterWidth
          // opacity; non-matched stay but are heavily dimmed rather than
          // dropped so the topology shape is preserved.
          const matched = edgeMatchesFilter(ca, cb);
          const baseOp = filterBoost(dimOpacity, matched);
          return renderEdge(a, b, `ie-${i}`, color, 1.2 * interClusterWidth, baseOp, isHL);
        })}

        {/* Intra-cluster edges — thick and prominent to show triangles */}
        {showIntraCluster && intraClusterEdges.map(([a, b, c], i) => {
          if (visibleNodes && (!visibleNodes.has(a) || !visibleNodes.has(b))) return null;
          const ek = `${Math.min(a,b)}-${Math.max(a,b)}`;
          const isHL = highlightEdgeSet.has(ek);
          // Edges from center are black/white; edges between pair nodes colored
          // by type
          // (center spokes read as neutral hub lines; fin–fin edges use
          // C.edgeIntra for triangle readability). In the 'bw' theme the
          // center-spoke "hub lines" are forced to a solid dark gray instead
          // of the tinted rgba() so strokes stay crisp in screenshots.
          const isFromCenter = clusters.some(cl => cl.center === a || cl.center === b);
          const baseColor = isFromCenter
            ? tm('rgba(255,255,255,0.55)', 'rgba(0,0,0,0.55)', 'rgba(255,255,255,0.45)', '#1a1a1a')
            : C.edgeIntra;
          const baseWidth = isFromCenter ? 1.2 : 1.5;
          // When any route highlight is active, dim non-route intra edges
          // sharply so the highlighted path dominates; matched edges stay
          // bright.
          let baseOp = hasAnyHighlight ? (isHL ? 0.9 : 0.12) : 0.55;
          // Cluster-spotlight multiplier: intra edges belong to one cluster
          // (c); they stay bright iff that cluster is selected. Route highlight
          // overrides still win (isHL).
          if (hasClusterFilter && !nodeMatchesFilter(c) && !isHL) {
            baseOp *= DIM_FACTOR;
          }
          return renderEdge(a, b, `ae-${i}`, baseColor, baseWidth, baseOp, isHL);
        })}

        {/* Cluster labels (C0, C1…) — gated by showClusterLabels
            toggle; hide labels that project too far forward
            (arbitrary z cutoff) so text does not dominate when
            a label swings toward the camera. */}
        {showClusterLabels && clusterLabels.filter(cl => cl.z < 200).map(cl => (
          <text key={`cl-${cl.id}`} x={cl.x} y={cl.y} textAnchor="middle"
            fill={tm('#94a3b8', '#64748b', '#475569')} fontSize="9" fontWeight="600" opacity={0.6}>
            {cl.label}
          </text>
        ))}

        {/*
          Multi-path overlay: one colored polyline per entry in `visiblePaths`.
          Edge stroke width and opacity
          scale with how many of those paths share that undirected edge
          (`multiEdgeMap` → shared / edgeCountMax),
          so congested links appear thicker and brighter. Arrow markers use
          per-path palette colors.
          When exactly one path is pinned/hovered, color tracks `activePathIdx`
          so it matches the table selection.
        */}
        {/* Path highlight overlay — multi-path or single path */}
        {visiblePaths && visiblePaths.length > 0 && visiblePaths.map((path, pi) => {
          // Single pinned path: tie segment color to the table’s active row
          // (`activePathIdx`); multi-path: one palette color per path index.
          // In bw mode we swap to a greyscale palette so per-path distinctions
          // rely on value/ordering rather than hue.
          const palette = getPathPalette(theme);
          const color = visiblePaths.length === 1 && activePathIdx !== null
            ? palette[activePathIdx % palette.length]
            : palette[pi % palette.length];
          // Largest number of routes sharing any one undirected edge — used to
          // normalize thickness/opacity scaling.
          const edgeCountMax = multiEdgeMap ? Math.max(1, ...Array.from(multiEdgeMap.values()).map(a => a.length)) : 1;
          return path.slice(0, -1).map((nid, i) => {
            const next = path[i + 1];
            const pa = projected[nid], pb = projected[next];
            if (!pa || !pb) return null;
            const ek = `${Math.min(nid, next)}-${Math.max(nid, next)}`;
            const shared = multiEdgeMap ? (multiEdgeMap.get(ek)?.length || 1) : 1;
            const thicknessMul = 1 + (shared - 1) * 0.4 / Math.max(1, edgeCountMax - 1);
            const sw = 3 * arrowWidth * thicknessMul;
            const op = Math.min(1, (0.5 + 0.4 * (shared / edgeCountMax))) * arrowOpacity;
            return (
              <line key={`mp-${pi}-${i}`} x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
                stroke={color} strokeWidth={sw} opacity={op}
                shapeRendering="geometricPrecision"
                markerEnd={`url(#arrowhead-${pi % PATH_PALETTE.length})`}/>
            );
          });
        })}
        {/*
          Single-path overlay (no `allPaths`): thick uniform highlight using
          COLORS.pathHighlight and the default
          arrowhead marker—no per-edge congestion shading because there is only
          one route.
        */}
        {highlightPath && !visiblePaths && highlightPath.length > 1 && highlightPath.slice(0, -1).map((nid, i) => {
          const next = highlightPath[i + 1];
          const pa = projected[nid], pb = projected[next];
          if (!pa || !pb) return null;
          return (
            <line key={`hp-${i}`} x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
              stroke={C.pathHighlight} strokeWidth={3.5 * arrowWidth} opacity={applyGamma(0.9 * arrowOpacity)}
              shapeRendering="geometricPrecision"
              markerEnd="url(#arrowhead)"/>
          );
        })}

        {/* ════════════════════════════════════════════════════════════════════
            SRV6 OVERLAY LAYER
            Drawn above the abstract path overlays but below the node layer so
            SRv6-specific chrome (TREE2 fan-out, ECMP common-neighbor halo,
            dedup badges) reads as "on top of" the routing visualization.

            Only active when the parent passes `srhDesc` (Routing tab, SRv6 view).
            ═══════════════════════════════════════════════════════════════════ */}
        {srhDesc && (() => {
          const SRV6_UNI_COLOR   = isBw ? '#000000' : '#10b981';  // emerald — wire unicast path
          const SRV6_L1_COLOR    = isBw ? '#222222' : '#d946ef';  // fuchsia — TREE2 root → peers
          const SRV6_L2_COLOR    = isBw ? '#555555' : '#8b5cf6';  // violet  — TREE2 peers → leaves
          const SRV6_ECMP_COLOR  = isBw ? '#333333' : '#f59e0b';  // amber   — ECMP fan / pivot
          const segments = [];
          const nodeBadges = [];
          // ── Unicast (1/2/3-hop) ─────────────────────────────────────────
          if (srhDesc.path && srhDesc.path.length > 1) {
            const path = srhDesc.path;
            for (let i = 0; i < path.length - 1; i++) {
              const a = projected[path[i]];
              const b = projected[path[i + 1]];
              if (!a || !b) continue;
              const isHovHop =
                srv6Highlight?.kind === 'hop'
                && (srv6Highlight.hopIndex === i + 1 || srv6Highlight.hopIndex === i);
              segments.push({
                key: `srv6-u-${i}`,
                x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                stroke: SRV6_UNI_COLOR,
                strokeWidth: (isHovHop ? 5 : 3.5) * arrowWidth,
                opacity: (isHovHop ? 1 : 0.85) * arrowOpacity,
                dash: null,
              });
            }
          }
          // ── ECMP fan highlight ──────────────────────────────────────────
          if (srv6Highlight?.kind === 'ecmp' && typeof srv6Highlight.pivot === 'number'
              && typeof selectedSrc === 'number' && typeof selectedDst === 'number') {
            const a = projected[selectedSrc];
            const m = projected[srv6Highlight.pivot];
            const b = projected[selectedDst];
            if (a && m) {
              segments.push({
                key: 'srv6-ecmp-1',
                x1: a.x, y1: a.y, x2: m.x, y2: m.y,
                stroke: SRV6_ECMP_COLOR,
                strokeWidth: 4 * arrowWidth, opacity: 0.95 * arrowOpacity,
                dash: null,
              });
            }
            if (m && b) {
              segments.push({
                key: 'srv6-ecmp-2',
                x1: m.x, y1: m.y, x2: b.x, y2: b.y,
                stroke: SRV6_ECMP_COLOR,
                strokeWidth: 4 * arrowWidth, opacity: 0.95 * arrowOpacity,
                dash: null,
              });
            }
            nodeBadges.push({ id: srv6Highlight.pivot, color: SRV6_ECMP_COLOR, kind: 'pivot' });
          }
          // ── TREE2 fan-out overlay ───────────────────────────────────────
          if (srhDesc.type === 'tree2') {
            const root = projected[srhDesc.root];
            // If a specific level-1 peer is highlighted, fade others; same for
            // a level-2 leaf (show only its parents + its edge).
            const focused = srv6Highlight;
            const focusedPeer = focused?.kind === 'tree2' && focused.level === 1 ? focused.node : null;
            const focusedLeaf = focused?.kind === 'tree2' && focused.level === 2 ? focused.node : null;
            // Level-1 edges (root → peer) solid fuchsia.
            for (const peer of srhDesc.level1) {
              const p = projected[peer];
              if (!root || !p) continue;
              const dim = (focusedPeer && focusedPeer !== peer)
                || (focusedLeaf
                  && !srhDesc.level2.find(x => x.node === focusedLeaf)?.parents.includes(peer));
              segments.push({
                key: `srv6-t1-${peer}`,
                x1: root.x, y1: root.y, x2: p.x, y2: p.y,
                stroke: SRV6_L1_COLOR,
                strokeWidth: (focusedPeer === peer ? 4 : 2.5) * arrowWidth,
                opacity: (dim ? 0.2 : 0.9) * arrowOpacity,
                dash: null,
              });
            }
            // Level-2 edges (peer → leaf) dashed violet.
            for (const leaf of srhDesc.level2) {
              const lp = projected[leaf.node];
              if (!lp) continue;
              for (const parent of leaf.parents) {
                const p = projected[parent];
                if (!p) continue;
                // Only draw the "first hop" parent (lowest index) to avoid
                // piling multiple dashed lines on dedup nodes; dedup count
                // is surfaced via the badge instead.
                if (parent !== leaf.parents[0]) continue;
                const dim = (focusedPeer && focusedPeer !== parent)
                  || (focusedLeaf && focusedLeaf !== leaf.node);
                segments.push({
                  key: `srv6-t2-${parent}-${leaf.node}`,
                  x1: p.x, y1: p.y, x2: lp.x, y2: lp.y,
                  stroke: SRV6_L2_COLOR,
                  strokeWidth: (focusedLeaf === leaf.node ? 3.5 : 2) * arrowWidth,
                  opacity: (dim ? 0.15 : 0.7) * arrowOpacity,
                  dash: '4,3',
                });
              }
            }
            // Root + peer + leaf node badges.
            nodeBadges.push({ id: srhDesc.root, color: SRV6_L1_COLOR, kind: 'root' });
            for (const peer of srhDesc.level1) {
              nodeBadges.push({
                id: peer, color: SRV6_L1_COLOR, kind: 'peer',
                dim: focusedLeaf
                  && !srhDesc.level2.find(x => x.node === focusedLeaf)?.parents.includes(peer),
              });
            }
            for (const leaf of srhDesc.level2) {
              nodeBadges.push({
                id: leaf.node, color: SRV6_L2_COLOR, kind: 'leaf',
                copies: leaf.copies,
                dim: (focusedPeer && !leaf.parents.includes(focusedPeer))
                  || (focusedLeaf && focusedLeaf !== leaf.node),
              });
            }
          }
          return (
            <Fragment>
              {segments.map(s => (
                <line key={s.key} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2}
                  stroke={s.stroke} strokeWidth={s.strokeWidth}
                  opacity={s.opacity}
                  strokeDasharray={s.dash || undefined}
                  strokeLinecap="round"
                  shapeRendering="geometricPrecision"/>
              ))}
              {nodeBadges.map((b, i) => {
                const p = projected[b.id];
                if (!p) return null;
                const r = Math.max(3, 5 * p.scale) + (b.kind === 'root' ? 3 : 2);
                return (
                  <Fragment key={`srv6-badge-${i}`}>
                    <circle cx={p.x} cy={p.y} r={r}
                      fill="none" stroke={b.color}
                      strokeWidth={b.kind === 'root' ? 2.5 : 1.75}
                      opacity={(b.dim ? 0.3 : 0.9)}
                      strokeDasharray={b.kind === 'leaf' ? '3,2' : undefined}/>
                    {/* Dedup multiplicity badge on TREE2 leaves that receive >1 copy */}
                    {b.kind === 'leaf' && b.copies > 1 && !b.dim && (
                      <text
                        x={p.x + r + 2}
                        y={p.y - r - 2}
                        fontSize={9}
                        fontWeight="700"
                        fill={SRV6_ECMP_COLOR}
                        stroke={tm('#0b1220','#f8fafc','#0a0a0e')}
                        strokeWidth={0.5}
                        paintOrder="stroke">
                        ×{b.copies}
                      </text>
                    )}
                  </Fragment>
                );
              })}
            </Fragment>
          );
        })()}

        {/* ═══════════════════════════════════════════════════════════════════
            ASTR multi-tree overlay — only active when the parent passes
            `astrTrees`. Renders the edges of every tree whose id is in
            `astrVisibleSet`, colored by the per-tree palette. When
            `astrSolo` is non-null, every other tree is dimmed so the
            user can focus on one tree at a time.

            Stroke encoding (all edges solid):
              All tree edges draw solid because every edge in a matroid-
              packed spanning tree is a *real* tree edge — there are no
              "tacked-on tails" to flag. We do taper stroke width gently
              with depth so the root-adjacent edges (which carry the
              full reduction subtree) still read as more prominent than
              the thin twigs out at the leaves:
                depth 1 (root → children):       thickest
                depth 2 (children → grandkids):  medium
                depth ≥ 3 (deeper fringe):       thinnest, still solid

              (Previously depth ≥ 3 edges were dashed. That convention
              made sense when the packer produced only shallow greedy
              trees, but the current Roskind–Tarjan matroid packer
              builds full-diameter trees where most edges live past
              depth 2, so dashing them ended up visually implying "fake
              / pseudo edges". Solid is correct.)

            Roots of visible trees get an outlined ring in tree color so
            they are easy to pick out in a dense canvas.
            ═══════════════════════════════════════════════════════════════════ */}
        {astrTrees && astrVisibleSet && (() => {
          const segments = [];
          const chunkMarkers = [];
          const rootBadges = [];
          const soloActive = astrSolo !== null;
          const visible = new Set(astrVisibleSet);
          // Pipeline animation state is passed in as a parallel array
          // aligned to `astrTrees` (by id/index order): edge state lookups
          // are just O(1) per edge. When absent (animation not running)
          // we fall back to the static "taper by depth, solid" encoding.
          const pipeActive = astrPipelineEdgeState != null;
          for (let ti = 0; ti < astrTrees.length; ti++) {
            const tree = astrTrees[ti];
            if (!visible.has(tree.id)) continue;
            const dim = soloActive && astrSolo !== tree.id;
            const treeStates = pipeActive ? astrPipelineEdgeState[ti] : null;
            for (let ei = 0; ei < tree.edges.length; ei++) {
              const e = tree.edges[ei];
              const a = projected[e.u];
              const b = projected[e.v];
              if (!a || !b) continue;
              // Gentle taper: depth-1 = 3.25, depth-2 = 2.25, depth ≥ 3 = 1.75.
              // No dashing — every tree edge is a real spanning-tree edge.
              const base = e.stage === 1 ? 3.25 : e.stage === 2 ? 2.25 : 1.75;
              const st = treeStates ? treeStates[ei] : null;
              const isActive = st != null && st.phase !== 'idle';
              // Active edges pop: thicker stroke, full opacity, bright
              // color. Idle edges on pipeline-active trees dim toward
              // background so only the current "wavefront" reads.
              const strokeWidth = (isActive ? 1.9 : 1.0) * base * arrowWidth * lineWidth;
              const baseOp = dim ? 0.10 : (pipeActive ? (isActive ? 1.0 : 0.14) : 0.85);
              segments.push({
                key: `astr-${tree.id}-${e.u}-${e.v}`,
                x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                stroke: tree.color,
                strokeWidth,
                opacity: baseOp * arrowOpacity * lineOpacity,
              });
              // Chunk marker: small filled dot that slides from leaf→root
              // during REDUCE and root→leaf during BROADCAST. Fractional
              // position within the current hop would need a sub-step
              // timer; we render mid-edge for now (the fade in/out across
              // adjacent edges is what reads as motion).
              if (isActive) {
                // For REDUCE (u=parent, v=child): data flows v → u, so the
                //   marker sits closer to `u` (the parent, upstream).
                // For BROADCAST: data flows u → v, marker closer to `v`.
                const towardU = st.phase === 'reduce';
                const frac = towardU ? 0.36 : 0.64;
                const mx = a.x + (b.x - a.x) * frac;
                const my = a.y + (b.y - a.y) * frac;
                const rScale = (a.scale + b.scale) * 0.5;
                chunkMarkers.push({
                  key: `astr-chunk-${tree.id}-${e.u}-${e.v}`,
                  cx: mx, cy: my,
                  r: Math.max(2.5, 4 * rScale),
                  fill: tree.color,
                  label: `c${st.chunk}`,
                  phase: st.phase,
                  dim,
                });
              }
            }
            const rp = projected[tree.root];
            if (rp) rootBadges.push({ node: tree.root, color: tree.color, dim, p: rp });
          }
          return (
            <Fragment>
              {segments.map(s => (
                <line key={s.key}
                  x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2}
                  stroke={s.stroke} strokeWidth={s.strokeWidth}
                  opacity={s.opacity}
                  strokeLinecap="round"
                  shapeRendering="geometricPrecision"/>
              ))}
              {chunkMarkers.map(m => (
                <g key={m.key} opacity={m.dim ? 0.3 : 1}>
                  {/* Tiny triangle glyph so reduce (pointing to root) and
                      broadcast (pointing outward) visually differ even
                      before the user reads the color or text. */}
                  <circle cx={m.cx} cy={m.cy} r={m.r}
                    fill={m.fill} stroke="#fff" strokeWidth={1.2}
                    opacity={0.95}/>
                </g>
              ))}
              {rootBadges.map((b, i) => {
                const r = Math.max(4, 6 * b.p.scale) + 3;
                return (
                  <circle key={`astr-root-${i}`}
                    cx={b.p.x} cy={b.p.y} r={r}
                    fill="none" stroke={b.color}
                    strokeWidth={2.2}
                    opacity={b.dim ? 0.25 : 0.95}/>
                );
              })}
            </Fragment>
          );
        })()}

        {/*
          Nodes drawn last (highest z in document order). `sortedNodes` is
          back-to-front by projected z so the
          occlusion order matches 3D depth. Fill: quadric → COLORS.quadric; else
          V1 vs V2 from vType, with cluster
          hub nodes using COLORS.v1Center to stand out from fin V1s. Selection
          overrides: src gets path highlight
          color, dst orange, path members get colored ring; hover enlarges
          slightly. stopPropagation on click so the background drag handler does
          not treat the click as starting a pan.
        */}
        {/* Nodes: depth-sorted (painter's algorithm) */}
        {sortedNodes.map(nodeId => {
          const p = projected[nodeId];
          if (!p) return null;
          if (visibleNodes && !visibleNodes.has(nodeId)) return null;
          const isSrc = nodeId === selectedSrc;
          const isDst = nodeId === selectedDst;
          const isOnPath = highlightNodeSet.has(nodeId);
          const isHov = nodeId === hoveredNode;
          // Cluster hub detection: center nodes get a distinct fill when typed
          // as V1 so they read as “spokes” anchors.
          const isCenter = clusters.some(c => c.center === nodeId);

          // Per-vertex-class visibility: the Display section has independent
          // toggles for Quadrics / Centers / V1 / V2. Skip rendering (and
          // picking) any node whose class is currently hidden, except nodes
          // actively involved in a selected path — the highlighted route must
          // always remain visible so the table and canvas stay in sync.
          const isQ = isQuadric[nodeId];
          const vt = vType[nodeId];
          const keepForPath = isSrc || isDst || isOnPath;
          if (!keepForPath) {
            if (isQ && !showQuadricNodes) return null;
            if (!isQ && isCenter && !showCenterNodes) return null;
            if (!isQ && !isCenter && vt === 1 && !showV1Nodes) return null;
            if (!isQ && vt === 2 && !showV2Nodes) return null;
          }

          let fill = isQ ? C.quadric
            : vt === 1 ? (isCenter ? C.v1Center : C.v1)
            : C.v2;
          let r = baseNodeR * p.scale;
          let strokeW = 0, stroke = 'none';

          // In the B&W theme, source/destination/hover rings use black
          // instead of white so the emphasis stays visible on a white page.
          const accentStroke = isBw ? '#000' : '#fff';
          const dstFill      = isBw ? '#000000' : '#f97316';
          if (isSrc) { stroke = accentStroke; strokeW = 2.5; r = (baseNodeR + 4) * p.scale; fill = C.pathHighlight; }
          else if (isDst) { stroke = accentStroke; strokeW = 2.5; r = (baseNodeR + 4) * p.scale; fill = dstFill; }
          else if (isOnPath) { stroke = C.pathHighlight; strokeW = 2; r = (baseNodeR + 2) * p.scale; }
          else if (isHov) { r = (baseNodeR + 3) * p.scale; stroke = accentStroke; strokeW = 1.5; }

          // Depth cue: projected `scale` modulates opacity; unrelated nodes
          // fade when a path highlight is active. Pipe the result through
          // `applyGamma` so the screenshot-gamma dial consistently intensifies
          // nodes alongside edges.
          let nodeOp = applyGamma(
            (hasAnyHighlight && !isOnPath && !isSrc && !isDst
              ? 0.25
              : (0.5 + 0.5 * p.scale)) * nodeOpacity
          );
          // Cluster-spotlight: dim nodes outside the selected cluster(s) so
          // the highlighted cluster reads as bright; matching nodes keep full
          // opacity. Path-highlight endpoints (isSrc/isDst/isOnPath) override.
          if (hasClusterFilter && !isSrc && !isDst && !isOnPath
              && !nodeMatchesFilter(nodeCluster[nodeId])) {
            nodeOp *= DIM_FACTOR;
          }

          return (
            <circle key={`n-${nodeId}`} className="node-circle cursor-pointer"
              cx={p.x} cy={p.y} r={Math.max(2, r)}
              fill={fill} stroke={stroke} strokeWidth={strokeW}
              opacity={nodeOp}
              onMouseEnter={() => setHoveredNode(nodeId)}
              onMouseLeave={() => setHoveredNode(null)}
              onClick={(e) => { e.stopPropagation(); onSelectNode(nodeId); }}/>
          );
        })}

        {/* Node labels — rendered on top of circles when any
            per-type toggle is on. Labels show the node ID and
            vertex class (W/V1/V2). Filtered by type toggles,
            the dedicated label cluster pill bar, AND the main
            inter-cluster filter (filterClusters) so selecting
            a cluster in the view also narrows labels. */}
        {(showQuadricLabels || showV1Labels || showV2Labels) &&
          sortedNodes.map(nodeId => {
            const p = projected[nodeId];
            if (!p) return null;
            if (visibleNodes && !visibleNodes.has(nodeId))
              return null;
            const isQ = isQuadric[nodeId];
            const vt = vType[nodeId];
            // Labels should only appear for classes whose nodes are also
            // currently drawn — otherwise the user sees a floating text with
            // no glyph underneath.
            const isCenter = clusters.some(c => c.center === nodeId);
            if (isQ && !showQuadricNodes) return null;
            if (!isQ && isCenter && !showCenterNodes) return null;
            if (!isQ && !isCenter && vt === 1 && !showV1Nodes) return null;
            if (!isQ && vt === 2 && !showV2Nodes) return null;
            if (isQ && !showQuadricLabels) return null;
            if (!isQ && vt === 1 && !showV1Labels) return null;
            if (!isQ && vt === 2 && !showV2Labels) return null;
            if (labelClusterFilter !== null
              && nodeCluster[nodeId] !== labelClusterFilter)
              return null;
            if (filterClusters.length > 0
              && !filterClusters.includes(nodeCluster[nodeId]))
              return null;
            const tag = isQ ? 'W' : `V${vt}`;
            return (
              <text
                key={`nlbl-${nodeId}`}
                x={p.x}
                y={p.y - Math.max(2, baseNodeR * p.scale) - 3}
                textAnchor="middle"
                fontSize={Math.max(7, 9 * p.scale)}
                fontWeight="400"
                fill={tm('#94a3b8', '#64748b', '#94a3b8')}
                opacity={0.4 + 0.4 * p.scale}
                pointerEvents="none">
                {nodeId} ({tag})
              </text>
            );
          })
        }
      </svg>

      {/*
        Bottom-center navigation toolbar. Overlay lives OUTSIDE the <svg>
        so the button clicks never feed into the SVG's orbit/drag handlers.
        Four arrow buttons nudge the projection center by PAN_STEP, the
        center button re-anchors the current bounding box at CX/CY (no
        zoom change), the fit button picks a zoom that maximizes the
        projected bbox within the viewport with a small margin, and the
        reset button returns to zoom=1 / pan=(0,0) identical to the
        existing double-click behavior.
      */}
      {/*
        `tm(dark, light, midnight, bw)` — each slot must send the toolbar in
        the same direction as the rest of that theme's chrome. Earlier the
        midnight slot was passed a white rgba, which is why the panel showed
        up as a light gray block in dark/midnight themes. All four slots are
        now spelled out: dark/midnight use slate-blue/near-black glass with
        light text; light/bw use near-white glass with slate/black text.
      */}
      <div
        className="absolute bottom-3 right-3 z-20 flex items-center gap-1 rounded-lg px-2 py-1 text-xs shadow-lg"
        style={{
          background: tm(
            'rgba(15,23,42,0.95)',   // dark
            'rgba(255,255,255,0.95)',// light
            'rgba(10,10,14,0.96)',   // midnight
            'rgba(255,255,255,0.97)',// bw
            'rgba(7,24,44,0.96)'     // cisco
          ),
          border: `1px solid ${tm(
            'rgba(100,116,139,0.4)', // dark
            'rgba(203,213,225,0.6)', // light
            'rgba(100,116,139,0.25)',// midnight
            'rgba(0,0,0,0.25)'       // bw
          )}`,
          backdropFilter: 'blur(12px)',
          color: tm('#e2e8f0', '#1e293b', '#e2e8f0', '#1a1a1a')
        }}
      >
        {[
          { label: '←', title: 'Pan left',  fn: () => panBy(-PAN_STEP, 0) },
          { label: '↑', title: 'Pan up',    fn: () => panBy(0, -PAN_STEP) },
          { label: '↓', title: 'Pan down',  fn: () => panBy(0,  PAN_STEP) },
          { label: '→', title: 'Pan right', fn: () => panBy( PAN_STEP, 0) },
          { label: '◎', title: 'Recentre view',  fn: centerView, sep: true },
          { label: '⛶', title: 'Fit to window',  fn: fitView },
          { label: '⟳', title: 'Reset zoom + pan', fn: resetView },
        ].map((b, i) => (
          <React.Fragment key={`tb-${i}`}>
            {b.sep && (
              <div
                className="mx-1"
                style={{
                  width: 1,
                  height: 18,
                  background: tm(
                    'rgba(100,116,139,0.45)',
                    'rgba(148,163,184,0.5)',
                    'rgba(100,116,139,0.35)',
                    'rgba(0,0,0,0.3)'
                  )
                }}
              />
            )}
            <button
              type="button"
              onClick={b.fn}
              title={b.title}
              aria-label={b.title}
              className="rounded transition hover:opacity-80"
              style={{
                background: tm(
                  'rgba(30,41,59,0.7)',    // dark
                  'rgba(241,245,249,0.85)',// light
                  'rgba(20,20,28,0.8)',    // midnight
                  'rgba(235,235,235,0.95)',// bw
                  'rgba(13,34,64,0.85)'    // cisco
                ),
                color: tm('#e2e8f0', '#1e293b', '#e2e8f0', '#1a1a1a'),
                border: `1px solid ${tm(
                  'rgba(100,116,139,0.35)',
                  'rgba(203,213,225,0.7)',
                  'rgba(100,116,139,0.25)',
                  'rgba(0,0,0,0.2)'
                )}`,
                minWidth: 28,
                height: 24,
                fontSize: 13,
                lineHeight: 1,
                padding: '0 6px',
                fontWeight: 600
              }}
            >
              {b.label}
            </button>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/**
 * RackOverview: top-level "data center floor plan" showing all racks as
 * miniature
 * rectangles with inter-rack cable arcs drawn as SVG Bezier curves.
 *
 * VISUALIZATION:
 *   - Each rack is a small rectangle containing colored switch slots.
 *   - Intra-rack links are drawn as quadratic Bezier arcs on the RIGHT side
 *     of each rack (short curves that stay within the rack footprint).
 *   - Inter-rack links are drawn as cubic Bezier curves that arc ABOVE the
 *     racks, connecting switches in different racks.
 *   - Link colors follow the COLORS palette: cyan=inter, violet=intra,
 *     red=quadric. The "Link Type" filter bar at the top lets users
 *     selectively show/hide each category.
 *
 * INTERACTION:
 *   - Click a rack to select it (yellow border highlight).
 *   - Double-click to enter RackDetailView (zoomed-in port-level view).
 *   - Hover over a link to see a tooltip with endpoint coordinates and
 *     link classification.
 *
 * PORT SAMPLING: In overview mode, each switch faceplate shows only 16 ports
 *   (sampled every Nth from the full radix) to keep the SVG lightweight.
 *   Full port detail is visible in the RackDetailView.
 *
 * NOTE: Inter-rack cubic Bezier paths, click handlers, the floating filter bar,
 *   rack/port SVG loop,
 *   tooltip, and connection table are defined later in this same function
 *   (after intra-rack geometry).
 *
 * @param {Array} racks - Rack definitions with node membership and switches.
 * @param {function} setSelectedRack - Selects a rack when opening detail view.
 * @param {function} setViewMode - Switches to detail mode when a rack is
 *     chosen.
 */
function RackOverview({ racks, rackModel, graph, clusterData, dk, selectedRack,
  setSelectedRack, expansionState, setViewMode, rackExpStep, bundleSize, theme,
  palette = 'classic'
}) {

  // --- Theme and state ---
  // 5-arg tm() so each theme gets its own chrome token;
  // fallback order: bw -> light, midnight -> dark, cisco -> dark.
  const tm = (d, l, m, bw, cisco) => t2(theme || (dk ? 'dark' : 'light'), d, l, m, bw, cisco);
  // Palette-driven edge/port colors: BW swaps to greyscale via getPalette.
  const C = getPalette(theme || (dk ? 'dark' : 'light'), palette);
  const isBw = theme === 'bw';
  // Neutral stroke for rack chrome / attachment lines that should stay subtle
  // in any theme; bw uses a darker gray so attach ports remain legible on white.
  const attachColor = tm('#6b7280', '#9ca3af', '#4b5563', '#555555');
  /**
   * Which rack rectangle is under the pointer (for hover outlines / emphasis).
   */
  const [hoveredRack, setHoveredRack] = useState(null);
  /**
   * Which switch slot (by identity tracked in handlers) is hovered inside a
   * rack.
   */
  const [hoveredSwitch, setHoveredSwitch] = useState(null);
  /** Active logical link for tooltip + highlight in the link layer. */
  const [hoveredLink, setHoveredLink] = useState(null);
  // Scope filter for which logical links participate in the overview SVG:
  // - 'all': show every link in `allLinks` (subject to linkTypeFilter below).
  // - 'none': show no links (empty canvas for links; racks still render).
  // - 'rack': only links touching the chosen rack index (`filterRack`) —
  // either endpoint in that rack.
  // - 'switch': only links incident on the chosen switch graph node id
  // (`filterSwitch`).
  const [linkFilter, setLinkFilter] = useState('none');   // 'all' | 'none' | 'rack' | 'switch'
  /**
   * When linkFilter is 'rack' or 'switch', these pick which rack index or node
   * id restricts `filteredLinks`.
   */
  const [filterRack, setFilterRack] = useState(null);
  const [filterSwitch, setFilterSwitch] = useState(null);
  /**
   * UI toggle for an expanded adjacency/port table elsewhere in the view (not
   * the SVG itself).
   */
  const [showFullTable, setShowFullTable] = useState(false);
  // Secondary filter applied AFTER scope: narrows the scoped set by
  // topology/color category without changing click selection state.
  // 'all' = no extra predicate; 'intra' / 'inter' match `linkType` on link
  // objects; 'quadric' / 'nonquadric' test `graph.isQuadric` on endpoints.
  // 'all' | 'intra' | 'inter' | 'quadric' | 'nonquadric'
  const [linkTypeFilter, setLinkTypeFilter] = useState('all');
  const { interClusterEdges, intraClusterEdges } = clusterData;
  const { adj } = graph;

  const [ovZoom, setOvZoom] = useState(1);
  const [ovPan, setOvPan] = useState({ x: 0, y: 0 });
  const [ovDragging, setOvDragging] = useState(false);
  const [ovDragStart, setOvDragStart] = useState({ x: 0, y: 0 });
  const ovSvgRef = useRef(null);

  // --- Layout geometry ---
  /**
   * Respects progressive disclosure: only the first `rackExpStep` racks get
   * coordinates and links when stepping expansion.
   */
  const visibleRacks = useMemo(() => {
    if (rackExpStep === null || rackExpStep === undefined) return racks;
    return racks.slice(0, Math.min(rackExpStep, racks.length));
  }, [racks, rackExpStep]);

  // --- Layout geometry ---
  // Racks are arranged in a grid (up to 8 columns). Each rack is a fixed-size
  // rectangle. The SVG viewport auto-sizes to fit all racks plus expansion
  // slots. `totalRows` reserves space for `expansionState.newRacks`
  // placeholders so the canvas does not reflow when slots appear.
  const rackWidth = 130;
  const rackHeight = 210;
  const rackGap = 24;
  const cols = Math.min(8, visibleRacks.length || 1);
  const totalRows = Math.ceil((visibleRacks.length + (expansionState?.newRacks?.length || 0)) / cols);
  const svgW = cols * (rackWidth + rackGap) + rackGap;
  const svgH = totalRows * (rackHeight + rackGap) + rackGap + 40;

  // Convert rack index to pixel (x,y) for the top-left corner of the rack
  // rectangle.
  const rackOrigin = (idx) => ({
    x: rackGap + (idx % cols) * (rackWidth + rackGap),
    y: rackGap + Math.floor(idx / cols) * (rackHeight + rackGap)
  });

  // --- Node-to-physical lookup tables ---
  /**
   * Map abstract graph node id → rack index in `racks` / `visibleRacks` (for
   * splitting inter- vs intra-rack edges).
   */
  const nodeToRack = useMemo(() => {
    const map = {};
    racks.forEach((r, ri) => r.nodeIds?.forEach(n => { map[n] = ri; }));
    return map;
  }, [racks]);

  /**
   * Map switch graph node id → { rack, slot } so link drawing can find pixel
   * anchors for each faceplate.
   */
  const nodeToSwSlot = useMemo(() => {
    const map = {};
    racks.forEach((rack, ri) => {
      rack.switches.forEach((sw, si) => { map[sw.nodeId] = { rack: ri, slot: si }; });
    });
    return map;
  }, [racks]);

  // Vertical height of one switch row inside a rack rectangle; used when
  // placing port samples and Bezier endpoints.
  const swSlotH = (rack) => (rackHeight - 38) / Math.max(1, rack.switches.length);
  /**
   * Parallel cables between the same two endpoints: draw `bSize` bundled curves
   * with slight offsets.
   */
  const bSize = bundleSize || 1;

  // --- Link data (inter-rack, intra-rack, filtered) ---
  // Build canonical link records from cluster edge lists, then apply UI
  // filters. Inter-rack: endpoints live in different racks.
  const interRackLinks = useMemo(() => {
    const maxIdx = visibleRacks.length;
    const links = [];
    interClusterEdges.forEach(([a, b]) => {
      const rA = nodeToRack[a], rB = nodeToRack[b];
      // Require both endpoints mapped to racks; skip same-rack pairs (those
      // belong in intra-rack construction).
      if (rA === undefined || rB === undefined || rA === rB) return;
      // Progressive disclosure: ignore edges whose racks are not yet in
      // `visibleRacks`.
      if (rA >= maxIdx || rB >= maxIdx) return;
      // Fan out `bSize` parallel logical links so geometry can stagger curves
      // (bundleIdx) for readability.
      for (let bi = 0; bi < bSize; bi++) {
        links.push({ src: a, dst: b, rackA: rA, rackB: rB, bundleIdx: bi, linkType: 'inter' });
      }
    });
    return links;
  }, [interClusterEdges, nodeToRack, visibleRacks, bSize]);

  // Intra-rack: both endpoints map to the same rack index. Deduplicate
  // undirected pairs because `intraClusterEdges` may list each edge once.
  const intraRackLinks = useMemo(() => {
    const maxIdx = visibleRacks.length;
    const links = [];
    const seen = new Set();
    intraClusterEdges.forEach(([a, b]) => {
      const rA = nodeToRack[a], rB = nodeToRack[b];
      if (rA === undefined || rA !== rB) return;
      if (rA >= maxIdx) return;
      const key = Math.min(a,b) + '-' + Math.max(a,b);
      if (seen.has(key)) return;
      seen.add(key);
      for (let bi = 0; bi < bSize; bi++) {
        links.push({ src: a, dst: b, rackA: rA, rackB: rA, bundleIdx: bi, linkType: 'intra' });
      }
    });
    return links;
  }, [intraClusterEdges, nodeToRack, visibleRacks, bSize]);

  const allLinks = useMemo(() => [...interRackLinks, ...intraRackLinks], [interRackLinks, intraRackLinks]);

  // Two-stage filter pipeline:
  // (1) `linkFilter` + `filterRack` | `filterSwitch` — spatial / endpoint
  //     scope (what subset of `allLinks` is eligible).
  // (2) `linkTypeFilter` — further restricts by `linkType` flag or quadric
  //     membership on graph nodes.
  // Order matters: type filter always applies to the scoped `base` array,
  // never to the full graph independently.
  const filteredLinks = useMemo(() => {
    let base;
    if (linkFilter === 'all') base = allLinks;
    else if (linkFilter === 'rack' && filterRack !== null) {
      base = allLinks.filter(l => l.rackA === filterRack || l.rackB === filterRack);
    } else if (linkFilter === 'switch' && filterSwitch !== null) {
      base = allLinks.filter(l => l.src === filterSwitch || l.dst === filterSwitch);
    } else {
      base = [];
    }
    if (linkTypeFilter === 'all') return base;
    if (linkTypeFilter === 'intra') return base.filter(l => l.linkType === 'intra');
    if (linkTypeFilter === 'inter') return base.filter(l => l.linkType === 'inter');
    if (linkTypeFilter === 'quadric') return base.filter(l => graph.isQuadric[l.src] || graph.isQuadric[l.dst]);
    if (linkTypeFilter === 'nonquadric') return base.filter(l => !graph.isQuadric[l.src] && !graph.isQuadric[l.dst]);
    return base;
  }, [linkFilter, filterRack, filterSwitch, allLinks, linkTypeFilter, graph]);

  const { vertices, q } = graph;

  // ═══ LINK SVG PATH GEOMETRY ═══
  // Converts each logical link into an SVG path command string (d attribute).
  // Two distinct drawing strategies based on link type:
  //
  //   INTRA-RACK: Quadratic Bezier (M ... Q ...) arc that bows out to the
  //     RIGHT side of the rack. The bow depth scales with the slot distance
  //     between the two connected switches. Bundle index offsets the arc
  //     slightly so parallel cables don't perfectly overlap.
  //
  //   INTER-RACK: Cubic Bezier (M ... C ...) curve that arcs UPWARD between
  //     two racks. Control points are placed above each switch slot, with
  //     vertical offset based on distance so crossing cables have different
  //     heights (reducing visual clutter).
  //
  // For each link, we also compute the algebraic context (dot product, cross
  // product, normal cross) for display in the tooltip.
  const linkPaths = useMemo(() => {
    // Port-grid sampling constants must match the rack-overview faceplate
    // renderer (search for `ovSamples` in the JSX below). With 32 logical
    // columns per row and up to 16 visible columns, every other physical
    // column is rendered.
    const ovSamples = 16;
    const ovStride = Math.max(1, Math.ceil(32 / ovSamples));

    // Locate the rendered (row, sampleIdx) of the bundleIdx-th port on `sw`
    // whose (type, target) matches the requested adjacency. This uses the
    // data model's snake-pattern `physRow`/`physCol` (see rack-model loop),
    // which is what the faceplate renderer also keys off of, so the result
    // lines up exactly with the on-screen port rectangle.
    const findPortPos = (sw, type, targetId, bundleIdx) => {
      let matchCount = 0;
      const numRows = sw.numRows || 2;
      for (const p of sw.allPorts) {
        if (p.connected && p.type === type && p.target === targetId) {
          if (matchCount === bundleIdx) {
            const renderRow = p.physRow ?? 0;
            const renderCol = p.physCol ?? 0;
            const sampleIdx = Math.min(
              ovSamples - 1,
              Math.floor(renderCol / ovStride)
            );
            return { renderRow, sampleIdx, numRows };
          }
          matchCount++;
        }
      }
      // Fallback: anchor at the top-left port of the grid.
      return { renderRow: 0, sampleIdx: 0, numRows };
    };

    // Convert (rack, slot, renderRow, sampleIdx) → pixel center of the port
    // rectangle on the rack-overview faceplate. Mirrors the JSX renderer's
    // `px = rx + 6 + pi*(pw+0.5)` and `py = sy + 2 + ri*rowH`, plus the
    // port rect's intrinsic height (`min(2, rowH-1)`), so the cable lands
    // dead-centre on the rendered port well rather than at the chassis edge.
    const portPixel = (rack, slot, renderRow, sampleIdx) => {
      const slotH = swSlotH(rack);
      const sh = Math.max(7, slotH - 2);
      const numRows = rack.switches[0]?.numRows || 2;
      const rowH = Math.max(2, (sh - 6) / numRows);
      const portH = Math.min(2, rowH - 1);
      const pw = Math.max(1, (rackWidth - 16) / ovSamples - 0.5);
      const xOff = 6 + sampleIdx * (pw + 0.5) + pw / 2;
      const yOff = 24 + slot * slotH + 2 + renderRow * rowH + portH / 2;
      return { xOff, yOff, pw };
    };

    return filteredLinks.map((link, li) => {
      const infoA = nodeToSwSlot[link.src];
      const infoB = nodeToSwSlot[link.dst];
      if (!infoA || !infoB) return null;

      // Algebraic context for tooltip display:
      // dot = adjacency test result (should be 0 for connected vertices)
      // cross = cross product (relay node for 2-hop routing)
      // normCross = canonical form of relay node
      const vecS = vertices[link.src];
      const vecD = vertices[link.dst];
      const dot = dotProduct(vecS, vecD, graph.F);
      const cross = crossProduct(vecS, vecD, graph.F);
      const normCross = leftNormalize(cross, graph.F);
      const srcType = graph.isQuadric[link.src] ? 'W' : graph.vType[link.src] === 1 ? 'V1' : 'V2';
      const dstType = graph.isQuadric[link.dst] ? 'W' : graph.vType[link.dst] === 1 ? 'V1' : 'V2';
      const bi = link.bundleIdx || 0;

      // INTRA-RACK: quadratic Bezier arc on the right side of the rack.
      // The arc's control point is placed to the right of the rack, offset
      // proportionally to the vertical distance between the two switches.
      if (link.linkType === 'intra') {
        const ro = rackOrigin(infoA.rack);
        const rack = racks[infoA.rack];
        const swA = rack.switches[infoA.slot];
        const swB = rack.switches[infoB.slot];

        // Snap each endpoint onto the actual port well rendered for this
        // adjacency on each switch's faceplate.
        const pA = findPortPos(swA, 'intra', link.dst, bi);
        const pB = findPortPos(swB, 'intra', link.src, bi);
        const aPix = portPixel(rack, infoA.slot, pA.renderRow, pA.sampleIdx);
        const bPix = portPixel(rack, infoB.slot, pB.renderRow, pB.sampleIdx);
        const pxA = ro.x + aPix.xOff;
        const pyA = ro.y + aPix.yOff;
        const pxB = ro.x + bPix.xOff;
        const pyB = ro.y + bPix.yOff;

        // Quadratic Bezier control point X: bow outward past the rack’s right
        // edge. Larger vertical slot separation (`dist`) pushes the control
        // point farther right so the arc clears the rack interior; `bi`
        // nudges bundled curves apart horizontally.
        const dist = Math.abs(infoA.slot - infoB.slot);
        const bowX = ro.x + rackWidth - 2 + 3 + dist * 3 + (bi * 1.5);
        // Quadratic Bezier: control point (bowX, average Y of endpoints)
        // yields a symmetric bulge to the right between the two ports.
        const d = `M ${pxA} ${pyA} Q ${bowX} ${(pyA+pyB)/2}, ${pxB} ${pyB}`;
        // Record everything the SVG path renderer, tooltip, CSV export, and
        // connection table need: geometry (`d`, endpoints), visual color,
        // logical endpoints, sampled port columns (`srcPort`/`dstPort` are
        // overview column indices), and algebra.
        return {
          key: `alink-${li}`,
          d,
          color: C.edgeIntra,
          src: link.src, dst: link.dst,
          rackA: link.rackA, rackB: link.rackB,
          srcPort: pA.sampleIdx, dstPort: pB.sampleIdx,
          srcSlot: infoA.slot, dstSlot: infoB.slot,
          bundleIdx: bi, linkType: 'intra',
          ep1x: pxA, ep1y: pyA, ep2x: pxB, ep2y: pyB,
          vecS, vecD, dot, cross, normCross,
          srcType, dstType
        };
      }

      // INTER-RACK: cubic Bezier curve arcing upward between two racks.
      // Both control points share the same Y (midY), creating a symmetric
      // arch. The arch height varies by link index (li % 5) to spread
      // overlapping cables vertically, reducing visual clutter.
      const rOA = rackOrigin(infoA.rack);
      const rOB = rackOrigin(infoB.rack);
      const rackA = racks[infoA.rack];
      const rackB = racks[infoB.rack];
      const swAi = rackA.switches[infoA.slot];
      const swBi = rackB.switches[infoB.slot];

      // Snap each endpoint onto the rendered port well that the data model
      // assigned to this inter-rack adjacency. `findPortPos` walks the
      // switch's allPorts and matches on (type='inter', target). bi
      // disambiguates parallel cables in the same logical bundle.
      const pAi = findPortPos(swAi, 'inter', link.dst, bi);
      const pBi = findPortPos(swBi, 'inter', link.src, bi);
      const aPixI = portPixel(rackA, infoA.slot, pAi.renderRow, pAi.sampleIdx);
      const bPixI = portPixel(rackB, infoB.slot, pBi.renderRow, pBi.sampleIdx);
      const pxA = rOA.x + aPixI.xOff;
      const pyA = rOA.y + aPixI.yOff;
      const pxB = rOB.x + bPixI.xOff;
      const pyB = rOB.y + bPixI.yOff;

      const isQuadricLink =
        rackA?.clusterType === 'quadric'
        || rackB?.clusterType === 'quadric';
      const color = isQuadricLink ? C.edgeQuadric : C.edgeInter;

      // Bundle cables spread vertically: each lane in the bundle gets a small
      // Y offset so parallel cables are visible individually.
      const bundleSpread = bSize > 1 ? (bi - (bSize - 1) / 2) * 3 : 0;
      const midY = Math.min(pyA, pyB) - 20 - (li % 5) * 6 + bundleSpread;

      // Inter-rack path descriptor: cubic curve (`d`), per-endpoint port
      // column indices (`portIdx*`), and same tooltip/CSV fields as intra.
      return {
        key: `ilink-${li}`,
        d: `M ${pxA} ${pyA} C ${pxA} ${midY}, ${pxB} ${midY}, ${pxB} ${pyB}`,
        color,
        src: link.src, dst: link.dst,
        rackA: link.rackA, rackB: link.rackB,
        srcPort: pAi.sampleIdx, dstPort: pBi.sampleIdx,
        srcSlot: infoA.slot, dstSlot: infoB.slot,
        bundleIdx: bi, linkType: 'inter',
        ep1x: pxA, ep1y: pyA, ep2x: pxB, ep2y: pyB,
        vecS, vecD, dot, cross, normCross,
        srcType, dstType
      };
    }).filter(Boolean);
  }, [filteredLinks, nodeToSwSlot, racks, rackWidth, rackHeight, vertices, q, bSize]);

  // --- Click / double-click handlers ---
  // Single-click a rack outline to toggle "focus this rack" link filtering:
  // only edges touching that rack stay emphasized (paired with dimming logic
  // on rack groups). Clicking the same rack again clears back to an
  // unfocused state via `linkFilter === 'none'`.
  const handleRackClick = (rack, idx) => {
    if (linkFilter === 'rack' && filterRack === idx) {
      setLinkFilter('none');
      setFilterRack(null);
    } else {
      setLinkFilter('rack');
      setFilterRack(idx);
      setFilterSwitch(null);
    }
  };

  // Double-click drills into the per-rack detail view (`RackDetailView`) for
  // the given rack id; `stopPropagation` avoids treating the dbl-click as
  // background noise for parent handlers.
  const handleRackDblClick = (e, rack) => {
    e.stopPropagation();
    setSelectedRack(rack.id);
    setViewMode('detail');
  };

  // Single-click a switch row (inside a rack) to toggle "focus this switch
  // node" filtering; mutually exclusive with rack focus.
  const handleSwitchClick = (e, nodeId) => {
    e.stopPropagation();
    if (linkFilter === 'switch' && filterSwitch === nodeId) {
      setLinkFilter('none');
      setFilterSwitch(null);
    } else {
      setLinkFilter('switch');
      setFilterSwitch(nodeId);
      setFilterRack(null);
    }
  };

  // --- Status label (shown in filter bar) ---
  // Human-readable summary of the active edge subset: counts inter- vs
  // intra-rack links after all filters, and names the focus target.
  const filterLabel = (() => {
    const interCount = filteredLinks.filter(l => l.linkType === 'inter').length;
    const intraCount = filteredLinks.filter(l => l.linkType === 'intra').length;
    if (linkFilter === 'all') {
      return `All (${interCount} inter + ${intraCount} intra)`;
    }
    if (linkFilter === 'rack' && filterRack !== null) {
      return `Rack ${filterRack} (${interCount} inter + ${intraCount} intra)`;
    }
    if (linkFilter === 'switch' && filterSwitch !== null) {
      return `N${filterSwitch} (${interCount} inter + ${intraCount} intra)`;
    }
    return 'Click rack or switch';
  })();

  const ovVBW = svgW / ovZoom;
  const ovVBH = svgH / ovZoom;
  const ovViewBox = `${ovPan.x} ${ovPan.y} ${ovVBW} ${ovVBH}`;

  const handleOvWheel = (e) => {
    e.preventDefault();
    const svg = ovSvgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * ovVBW + ovPan.x;
    const my = ((e.clientY - rect.top) / rect.height) * ovVBH + ovPan.y;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const z2 = Math.max(0.3, Math.min(8, ovZoom * factor));
    const newW = svgW / z2, newH = svgH / z2;
    const nx = mx - (mx - ovPan.x) * (newW / ovVBW);
    const ny = my - (my - ovPan.y) * (newH / ovVBH);
    setOvZoom(z2);
    setOvPan({ x: nx, y: ny });
  };

  const handleOvMouseDown = (e) => {
    if (e.button === 1 || e.button === 0) {
      e.preventDefault();
      setOvDragging(true);
      setOvDragStart({ x: e.clientX, y: e.clientY });
    }
  };
  const handleOvMouseMove = (e) => {
    if (!ovDragging) return;
    const svg = ovSvgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const dx = (e.clientX - ovDragStart.x) / rect.width * ovVBW;
    const dy = (e.clientY - ovDragStart.y) / rect.height * ovVBH;
    setOvPan(p => ({ x: p.x - dx, y: p.y - dy }));
    setOvDragStart({ x: e.clientX, y: e.clientY });
  };
  const handleOvMouseUp = () => setOvDragging(false);

  // --- Render: filter bar + SVG canvas ---
  return (
    <div className="relative">
      {/*
        Floating control strip: (1) "Links:" toggles whether overview drawing
        uses rack/switch focus or shows everything; (2) after the pipe, a
        separate axis filters *which kinds of edges* are eligible (intra vs
        inter, quadric vs not). There is no separate "Type:" text label in the
        UI — the second group of buttons is the link-type / edge-kind filter.
      */}
      <div
        className="absolute top-2 left-2 z-10 rounded-xl px-2.5 py-1.5 flex items-center gap-2 flex-wrap"
        style={{
          fontSize: 13,
          background: tm(
            'rgba(15,23,42,0.95)',
            'rgba(255,255,255,0.95)',
            'rgba(10,10,14,0.96)'
          ),
          backdropFilter: 'blur(12px)',
          color: tm('#cbd5e1', '#475569', '#c4b5fd'),
          border: `1px solid ${tm(
            'rgba(100,116,139,0.4)',
            'rgba(203,213,225,0.6)',
            'rgba(100,116,139,0.25)'
          )}`,
        }}>
        {/*
          Scope label: the next two buttons control visibility/focus for links
          (show all, or clear focus so nothing is highlighted).
        */}
        <span className="font-semibold">Links:</span>
        {/*
          Show every link with no rack/switch dimming (`linkFilter === 'all'`).
        */}
        <button
          onClick={() => {
            setLinkFilter('all');
            setFilterRack(null);
            setFilterSwitch(null);
          }}
          className="px-1.5 py-0.5 rounded cursor-pointer"
          style={{
            background: linkFilter === 'all'
              ? (isBw ? 'rgba(0,0,0,0.14)' : 'rgba(20,184,166,0.25)')
              : 'transparent',
            color: linkFilter === 'all'
              ? (isBw ? '#000000' : '#14b8a6')
              : tm('#94a3b8', '#64748b', '#94a3b8'),
          }}>All</button>
        {/*
          Clear rack/switch selection so the canvas is neutral (no dimming),
          without changing link-type filter buttons.
        */}
        <button
          onClick={() => {
            setLinkFilter('none');
            setFilterRack(null);
            setFilterSwitch(null);
          }}
          className="px-1.5 py-0.5 rounded cursor-pointer"
          style={{
            background: linkFilter === 'none'
              ? (isBw ? 'rgba(0,0,0,0.14)' : 'rgba(20,184,166,0.25)')
              : 'transparent',
            color: linkFilter === 'none'
              ? (isBw ? '#000000' : '#14b8a6')
              : tm('#94a3b8', '#64748b', '#94a3b8'),
          }}>None</button>
        {/*
          Visual separator between "which links to emphasize" (All/None) and
          "which edge categories pass the type filter".
        */}
        <span style={{
          color: tm('#334155', '#cbd5e1', '#1e293b'),
          margin: '0 2px',
        }}>|</span>
        {/*
          Link-type filter (`linkTypeFilter`): narrows `filteredLinks` before
          paths are built.
          - All types: no extra restriction.
          - Intra-rack / Inter-rack: only edges whose `linkType` matches.
          - Quadric / Non-Quadric: uses cluster/edge coloring rules (quadric
            racks or quadric-colored inter links).
        */}
        {[
          // In bw the filter pills use greyscale swatches (via C.*) and a near-black
          // "selected" background so active state reads on a white print chrome.
          { id: 'all', label: 'All types', c: isBw ? '#000000' : '#14b8a6', bg: isBw ? 'rgba(0,0,0,0.12)' : 'rgba(20,184,166,0.2)' },
          { id: 'intra', label: 'Intra-rack', c: C.edgeIntra, bg: isBw ? 'rgba(0,0,0,0.10)' : 'rgba(139,92,246,0.2)' },
          { id: 'inter', label: 'Inter-rack', c: C.portConnected, bg: isBw ? 'rgba(0,0,0,0.10)' : 'rgba(16,185,129,0.2)' },
          { id: 'quadric', label: 'Quadric', c: C.edgeQuadric, bg: isBw ? 'rgba(0,0,0,0.14)' : 'rgba(239,68,68,0.2)' },
          { id: 'nonquadric', label: 'Non-Quadric', c: C.edgeInter, bg: isBw ? 'rgba(0,0,0,0.08)' : 'rgba(6,182,212,0.2)' },
        ].map(f => (
          <button
            key={f.id}
            onClick={() => setLinkTypeFilter(f.id)}
            className="px-1.5 py-0.5 rounded cursor-pointer"
            style={{
              background: linkTypeFilter === f.id ? f.bg : 'transparent',
              color: linkTypeFilter === f.id
                ? f.c
                : tm('#64748b', '#94a3b8', '#475569'),
            }}>{f.label}</button>
        ))}
        {/*
          Dynamic sentence from `filterLabel`: inter/intra counts and whether
          a rack or node is focused.
        */}
        <span style={{ color: tm('#64748b', '#94a3b8', '#475569') }}>
          {filterLabel}
        </span>
        {/*
          Hint that double-clicking a rack body opens the detailed port-level
          rack view.
        */}
        <span style={{ color: tm('#475569', '#94a3b8', '#334155') }}>
          dbl-click -&gt; detail
        </span>
        <span style={{ color: tm('#475569', '#94a3b8', '#334155'), marginLeft: 8, display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 10 }}>
          Zoom
          <input type="range" min="0.3" max="8" step="0.1" value={ovZoom}
            onChange={e => {
              const z2 = parseFloat(e.target.value);
              const cx = ovPan.x + svgW / ovZoom / 2;
              const cy = ovPan.y + svgH / ovZoom / 2;
              const nw = svgW / z2, nh = svgH / z2;
              setOvZoom(z2);
              setOvPan({ x: cx - nw / 2, y: cy - nh / 2 });
            }}
            style={{ width: 60, accentColor: tm('#14b8a6','#0d9488','#8b5cf6') }}/>
          <span style={{ minWidth: 28 }}>{ovZoom.toFixed(1)}x</span>
          <button onClick={() => { setOvZoom(1); setOvPan({ x: 0, y: 0 }); }}
            style={{ fontSize: 9, padding: '1px 4px', borderRadius: 3,
              background: tm('#1e293b','#f1f5f9','#0a0a0e'),
              color: tm('#94a3b8','#64748b','#94a3b8'),
              border: `1px solid ${tm('rgba(71,85,105,0.5)','rgba(203,213,225,0.6)','rgba(71,85,105,0.3)')}`,
              cursor: 'pointer' }}>
            Reset
          </button>
        </span>
      </div>

      <div style={{
        marginTop: '44px',
        minHeight: 400,
        height: 600,
        resize: 'vertical',
        overflow: 'hidden',
        border: `1px solid ${tm('rgba(71,85,105,0.3)','rgba(203,213,225,0.4)','rgba(71,85,105,0.2)')}`,
        borderRadius: 6,
        position: 'relative',
      }}>
      <svg ref={ovSvgRef} style={{width: '100%', height: '100%', cursor: ovDragging ? 'grabbing' : 'default'}}
        viewBox={ovViewBox}
        onWheel={handleOvWheel}
        onMouseDown={handleOvMouseDown}
        onMouseMove={handleOvMouseMove}
        onMouseUp={handleOvMouseUp}
        onMouseLeave={handleOvMouseUp}>
        <rect width="100%" height="100%" fill={tm('#080e1a','#ffffff','#020204','#ffffff','#07182C')}/>
        {/*
          Compact legend (top-right): swatch color meanings for port dots
          inside each switch strip.
          - Inter-rack ports: emerald — a port carrying a link to another rack.
          - Intra-rack ports: purple — a port used for a link that stays inside
            the same rack.
          - Attach: theme `attachColor` — external/attachment-facing ports
            (not inter/intra data links).
        */}
        <g transform={`translate(${svgW - 180}, 6)`} opacity={isBw ? 1 : 0.8}>
          <rect x={0} y={0} width={6} height={4} rx={1} fill={C.portConnected}/>
          <text x={9} y={4} fontSize="7" fill={tm('#94a3b8','#475569','#94a3b8','#000000')}>Inter-rack ports</text>
